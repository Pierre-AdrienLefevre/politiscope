name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Le nom du job sert de check requis par la protection de main : ne pas le renommer.
  verification:
    name: Données et app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de uv (cache intégré)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Vérification du lockfile à jour
        run: uv lock --check

      - name: Installation des dépendances (lock exact)
        run: uv sync --frozen

      - name: Intégrité des données (sources, notes, bornes, champs)
        run: uv run --no-sync python valider.py

      - name: Exécution de l'app sur toutes les pages
        run: uv run --no-sync python scripts/verifier_app.py

  securite:
    name: Audit de sécurité
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de uv (cache intégré)
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Audit des vulnérabilités (CVE)
        # uv audit est encore expérimental : --preview-features requis
        run: uv audit --preview-features audit-command
