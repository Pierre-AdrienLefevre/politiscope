name: Release

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release datée
    # Uniquement si la PR a été mergée, pas simplement fermée
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0  # tout l'historique et les tags, pour analyser les commits

      - name: Version datée
        # Version = date du merge, heure de Montréal (AAAA.MM.JJ).
        # Plusieurs releases le même jour : suffixe .2, .3…
        id: version
        run: |
          DATE=$(TZ=America/Toronto date +%Y-%m-%d)
          BASE=$(TZ=America/Toronto date +%Y.%m.%d)
          NEW_VERSION="$BASE"
          N=1
          while git rev-parse -q --verify "refs/tags/${NEW_VERSION}" >/dev/null; do
            N=$((N + 1))
            NEW_VERSION="${BASE}.${N}"
          done
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "${LAST_TAG:-aucune} → $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "last_version=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Installation de uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Générer les notes de version
        # Données de la PR passées par l'environnement, jamais interpolées dans le script :
        # un titre de PR contenant $(...) ne doit pas pouvoir s'exécuter.
        env:
          LAST_TAG: ${{ steps.version.outputs.last_version }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          DATE: ${{ steps.version.outputs.date }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          uv sync --frozen
          {
            echo "Publiée le **${DATE}**, à la suite de la PR #${PR_NUMBER} : ${PR_TITLE}"
            echo
            echo "### État des données"
            uv run --no-sync python scripts/resume_donnees.py
            echo
          } > release_notes.md

          if [ -z "$LAST_TAG" ]; then RANGE=HEAD; else RANGE="${LAST_TAG}..HEAD"; fi
          COMMITS=$(git log "$RANGE" --no-merges --pretty=format:"%h %s")

          section() {
            LIGNES=$(echo "$COMMITS" | grep -E "$2" || true)
            if [ -n "$LIGNES" ]; then
              echo "### $1" >> release_notes.md
              echo "$LIGNES" | sed 's/^/- /' >> release_notes.md
              echo >> release_notes.md
            fi
          }
          section "Nouveautés" "^[a-f0-9]+ feat(\(.+\))?:"
          section "Corrections" "^[a-f0-9]+ fix(\(.+\))?:"
          section "Autres changements" "^[a-f0-9]+ (docs|refactor|chore|ci|style|perf|test)(\(.+\))?:"

          if [ -n "$LAST_TAG" ]; then
            echo "---" >> release_notes.md
            echo "Comparaison : \`${LAST_TAG}...${NEW_VERSION}\`" >> release_notes.md
          fi
          cat release_notes.md

      - name: Créer le tag et la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          # Instantané daté des données et du barème, joint à la release
          cp data/entities.yaml "entities-${NEW_VERSION}.yaml"
          cp data/grille.md "grille-${NEW_VERSION}.md"
          gh release create "$NEW_VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "${NEW_VERSION}" \
            --notes-file release_notes.md \
            "entities-${NEW_VERSION}.yaml" "grille-${NEW_VERSION}.md"

      - name: Commenter la PR avec la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          gh pr comment "$PR_NUMBER" --body "Release **${NEW_VERSION}** publiée : https://github.com/${GITHUB_REPOSITORY}/releases/tag/${NEW_VERSION}"
