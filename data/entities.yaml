  - name: Coalition avenir Québec
    sigle: CAQ
    label_pos: bottom left
    chef: Christine Fréchette
    country: Québec
    color: "#00A8E0"
    as_of: "2026-09-17"
    souverainete: nationaliste
    ecologie: productiviste
    estimation_initiale: {economie: 2, societe: 4}
    autorite: null
    resume: >
      Au gouvernement. Christine Fréchette, ancienne ministre de l'Économie,
      est cheffe depuis le 12 avril 2026 après le départ de François Legault.
      Centre économique, nationalisme québécois : laïcité, protection du
      français, baisse des seuils d'immigration. Cadre financier présenté le
      30 août 2026, le premier de la campagne.
    indicateurs:
      E1:
        absent: true
        just: >
          Absence établie sur le document primaire, non déduite : le cadre
          financier du 30 août 2026 ne contient AUCUNE MESURE FISCALE. Les
          9 852 M$ d'« améliorations » viennent des transferts fédéraux, du
          rendement des sociétés d'État et d'ajustements à la provision pour
          éventualités. Le parti au pouvoir est ainsi le seul des cinq partis
          québécois sans position notable sur la fiscalité.
        src: [caq_cadre_2026]
      E2:
        valeur: 0
        just: >
          Cadre financier peu lisible sur le périmètre de l'État. Les
          9 852 M$ d'« améliorations » viennent des transferts fédéraux
          (4 357 M$), d'un rendement accru des sociétés d'État (+2 %, 495 M$) et
          d'ajustements à la provision pour éventualités (5 000 M$) — pas d'une
          réduction de l'État. Croissance des dépenses de portefeuilles de
          2,4 %/an. Retour à l'équilibre en 2029-2030.
        src: [caq_cadre_2026]
        contest: >
          Score peu significatif : sur 9 249 M$ d'engagements, 8 011 M$ (87 %)
          sont des « engagements à venir » non annoncés. Le document ne permet
          pas de situer la CAQ sur cet indicateur, et aucune mesure fiscale n'y
          figure — d'où E1 laissé vide.
      E3a:
        valeur: -1
        just: >
          Soins à domicile : 1 000 M$ sur cinq ans. « Mieux loger nos aînés » :
          241 M$. Renouvellement des ententes fédérales en santé mentale, soins
          à domicile et soins de longue durée (2,4 G$), maintien de la
          croissance du Transfert canadien en santé à 5 % à compter de
          2028-2029.
        src: [caq_cadre_2026]
      E3b:
        absent: true
        just: >
          L'assurance-emploi relève EXCLUSIVEMENT de la compétence fédérale au
          Canada : un parti provincial n'a aucune prise sur ce volet et n'en
          traite pas. Absence structurelle, établie par le partage des
          compétences et non par un défaut de recherche.
      E6:
        valeur: 0
        just: >
          Maintient le Fonds d'électrification et de changements climatiques
          (FECC), cœur de l'arsenal climatique québécois, ainsi que la
          participation du Québec au marché du carbone. Ni durcissement ni
          allègement du cadre réglementaire.
        src: [lapresse_promesses_environnement, ledevoir_enjeux_environnement]
        contest: >
          Note de statu quo, faiblement sourcée : elle repose sur le maintien du
          cadre existant par le parti au pouvoir plutôt que sur un engagement
          explicite. À reconfirmer sur la plateforme environnementale.
      E4:
        valeur: 0.5
        just: >
          Exclusion du calcul de l'impôt de 35 000 $ de revenu d'emploi pour les
          travailleurs de 65 ans et plus dans les professions en pénurie
          (enseignants, éducatrices en CPE, infirmières, préposés aux
          bénéficiaires), le travailleur retenant le plus avantageux entre cette
          mesure et le crédit d'impôt pour prolongation de carrière. Incitatif
          pouvant atteindre 6 650 $/an, coût de 80 M$/an. L'objectif annoncé est
          de les inciter à demeurer en emploi au-delà de 65 ans : version
          purement incitative de l'allongement de la vie active. Au
          gouvernement, la CAQ n'a modifié ni l'âge d'admissibilité au RRQ, ni
          la durée de cotisation, ni le mode de financement.
        src: [radiocanada_caq_aines, noovo_caq_aines]
        contest: >
          Note la plus fragile du lot. La bonification du crédit de soutien aux
          aînés relève sans ambiguïté de la fiscalité (E1) et n'est pas comptée
          ici. L'exemption de 35 000 $ est différente parce qu'elle est
          conditionnelle au maintien en emploi et vise le calendrier de retrait
          du marché du travail. Un codeur qui la reclasserait en E1 ou E5
          devrait mettre la CAQ en `absent` sur E4 : lecture parfaitement
          défendable.
      E5:
        valeur: -0.5
        just: >
          Statu quo mesuré sur une mesure prise, non sur une absence de
          position : le gouvernement a porté le salaire minimum à 16,60 $/h le
          1er mai 2026 (contre 16,10 $), soit +3,11 %, en indexant sur la
          croissance prévue des salaires horaires moyens plutôt que sur
          l'inflation (2,3 % prévue). Indexation annuelle de routine,
          légèrement au-dessus de l'inflation.
        src: [radiocanada_salaire_minimum_2026, lapresse_salaire_minimum_2026]
        contest: >
          -0,5 : l'indexation dépasse l'inflation, ce qui penche légèrement du
          côté du travail, mais les organisations syndicales et les groupes de
          lutte à la pauvreté jugent la hausse insuffisante et réclament 20 $/h.
      S1:
        valeur: 0.5
        just: >
          Maintien du seuil d'immigration permanente à 45 000 par année jusqu'en
          2029.
        src: [lapresse_promesses_immigration]
        contest: >
          +0,5 : le maintien est en soi un statu quo, mais il reconduit un
          niveau que la CAQ avait elle-même abaissé. L'immigration temporaire
          n'est pas encore sourcée et pourrait durcir la note.
      S2:
        valeur: -1.5
        just: >
          Pas d'engagement de plateforme, mais un bilan de mesures prises. Le
          18 novembre 2024, lancement du premier Plan d'action gouvernemental
          sur l'accès à l'avortement (2024-2027) : 7,5 M$, 28 mesures, dont
          l'élargissement de l'accès à la pilule abortive par télésanté (17 %
          des avortements au Québec contre 32 % en Ontario et 72 % en France),
          un nouveau point de service à Québec d'ici 2027 et un financement
          accru de SOS Grossesse et de la FQPN. Le gouvernement avait aussi
          inscrit la protection dans l'article 29 du projet de loi 1 (« L'État
          protège la liberté des femmes de recourir à l'interruption volontaire
          de grossesse »), retiré le 20 février 2026 faute d'appui d'un seul
          groupe féministe, médical ou juridique.
        src: [leprogres_plan_avortement, radiocanada_article29_retrait, radiocanada_frechette_article29, csq_projet_loi1]
        contest: >
          -1,5 et non -2 : programme financé et tentative d'inscription
          constitutionnelle, mais l'inscription a été abandonnée et aucun
          engagement de campagne 2026 ne reprend le dossier. BIAIS DE SORTANT à
          garder en tête : la CAQ se classe au-dessus du PLQ surtout parce
          qu'elle a pu agir, l'indicateur valorisant les mesures prises. Une
          affirmation non vérifiée circule par ailleurs — Fréchette aurait
          promis de « ramener » l'article après les élections ; aucune source
          accessible ne la corrobore et elle n'est pas comptabilisée.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis représentés à l'Assemblée
          nationale, du rapport renouvelé sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblée a adopté la refonte de la Loi
          concernant les soins de fin de vie, légalisant les demandes anticipées
          d'aide médicale à mourir. Le Québec est au premier rang mondial pour
          le recours à l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position législative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Québec : il ne sépare pas les partis
          québécois entre eux, mais il situe le Québec par rapport aux autres
          territoires — ce qui est précisément son rôle sur une carte commune.
      S3:
        valeur: 0.5
        just: >
          Bilan gouvernemental bicéphale. Extension : plan d'action de lutte
          contre l'homophobie et la transphobie 2023-2028 doté de 23,7 M$
          (contre environ 10 M$ pour 2017-2022), dont 11 M$ aux organismes
          communautaires ; appui des députés caquistes à la motion du
          6 février 2025. Restriction, par des actes exécutoires : appel du
          jugement Garin qui déclarait contraire à la Charte la limitation de la
          filiation à deux parents (« au Québec, c'est deux parents légaux [...]
          et ça doit demeurer ainsi ») ; directive de mai 2024 interdisant les
          nouvelles toilettes et vestiaires mixtes dans les écoles publiques ;
          règle de septembre 2025 interdisant les appellations inclusives dans
          les communications gouvernementales, la santé et l'éducation. Le
          rapport du Comité de sages sur l'identité de genre (mai 2025, 215
          pages, aucune recommandation) n'a eu aucune suite.
        src: [radiocanada_pluriparentalite, radiocanada_toilettes_mixtes, lactualite_ecriture_inclusive, quebec_plan_homophobie, radiocanada_comite_sages, lequotidien_motion_homophobie]
        contest: >
          Arbitrage 0 contre +0,5. Un 0 est défendable : la CAQ a plus que
          doublé le financement communautaire et voté la motion de 2025. J'ai
          retenu +0,5 parce que les gestes de restriction sont exécutoires et
          répétés, tandis que le volet extension reconduit un plan de 2023 sans
          suite. Aucune mesure ne restreint l'accès aux soins de transition, ce
          qui exclut une note plus élevée. La plateforme 2026 et le cadre
          financier sont entièrement muets sur l'enjeu, et aucune déclaration de
          Christine Fréchette sur le sujet n'a été trouvée depuis avril 2026 :
          la note repose sur les actes du gouvernement, pas sur la parole de la
          cheffe.
      S5:
        valeur: 1
        just: >
          Verrouille la Loi 21 jusqu'en 2031. La laïcité renforcée est entrée en
          vigueur en 2026.
        src: [lapresse_laicite_engagements, jisr_laicite_renforcee]
        contest: >
          RÉÉCHELONNÉ après notation de la France. La loi 21 interdit les signes
          religieux aux AGENTS de l'État en position d'autorité ; elle ne
          restreint ni les élèves, ni les usagers, ni quiconque dans la rue. Or
          LR interdirait le voile à l'université — donc à des usagères ADULTES
          d'un service public — et inscrirait la « tradition judéo-chrétienne »
          dans le bloc constitutionnel, ce que la loi 21 refuse au nom de la
          neutralité ; le RN l'interdirait à toute femme dans tout l'espace
          public sous peine d'amende ; Reconquête y ajoute la remigration. Le
          haut de l'échelle est donc rouvert pour la France.
      S6:
        valeur: 0.5
        just: >
          Investissements sans position sur le financement du privé ni sur les
          contenus : 200 M$ pour des gymnases, 150 M$ pour les cours d'école,
          900 M$ sur quatre ans de soutien aux dépenses scolaires des familles
          (crédit couvrant jusqu'à 75 % du service de garde scolaire, jusqu'à
          1 309 $ par enfant ; supplément pour fournitures porté de 127 $ à
          250 $), 1 000 $ en REEE par nouveau-né (218,8 M$ sur quatre ans).
        src: [radiocanada_caq_education, noovo_caq_reee, lapresse_promesses_education]
        contest: >
          +0,5 : les mesures elles-mêmes sont neutres, mais Christine Fréchette
          estime qu'il n'y a « pas vraiment » d'école à trois vitesses au
          Québec, ce qui revient à défendre le statu quo, privé subventionné
          inclus.
      S7:
        valeur: 0.5
        just: >
          Promet de « combattre le crime » en ajoutant 300 policiers à la Sûreté
          du Québec et 50 procureurs, avec un volet cybercriminalité.
        src: [radiocanada_caq_police, lesaffaires_caq_police]
        contest: >
          RAMENÉ DE +1 À +0,5 après notation de la France. Un simple renfort
          d'effectifs ne peut pas valoir la même note qu'une réforme du droit
          pénal : Renaissance, notée +1, a fait adopter une loi durcissant la
          justice des mineurs et propose une loi d'urgence de construction de
          prisons ; LR, notée +2, propose la suppression du juge d'application
          des peines et de tous les aménagements, la majorité pénale à 15 ans et
          des prisons privées.

  - name: Parti libéral du Québec
    sigle: PLQ
    label_pos: bottom center
    chef: Charles Milliard
    country: Québec
    color: "#ED1B2E"
    as_of: "2026-09-17"
    souverainete: federaliste
    ecologie: reformiste
    estimation_initiale: {economie: 3, societe: -2}
    autorite: null
    resume: >
      Charles Milliard, ancien président de la Fédération des chambres de
      commerce du Québec, est chef depuis le 13 février 2026, seul candidat en
      lice après la démission de Pablo Rodriguez. Fédéraliste. Son cadre
      financier du 13 septembre 2026 est moins libéral que son image : il annule
      des baisses de taxes de la CAQ et reprend des crédits d'impôt aux
      entreprises, tout en faisant croître le budget de la santé.
    indicateurs:
      E1:
        valeur: 0
        just: >
          N'est pas un parti de baisse d'impôts. Annule les mesures de
          détaxation de la CAQ (taxe de Bienvenue, congé de TVQ à l'épicerie) et
          recentre les crédits d'impôt aux sociétés (CRIC, C3i) pour +600 M$ en
          année 5. Seul allègement notable : TVQ sur les constructions neuves
          (−125 M$/an).
        src: [plq_cadre_2026]
      E2:
        valeur: 1
        just: >
          Engagements de 11,9 G$ financés par une « réforme de l'État »
          (gouvernance, efficacité, numérique) et la décroissance de
          l'interventionnisme économique. Aucun programme de privatisation.
          Retour à l'équilibre visé en 2029-2030.
        src: [plq_cadre_2026, lesaffaires_cadres_2026]
      E3a:
        valeur: -1
        just: >
          Réinvestissement en santé et soins à domicile (jusqu'à -350 M$/an),
          croissance des dépenses de près de 5 %/an pour le portefeuille santé
          et 3 % pour l'éducation, parité salariale en Outaouais, plateforme de
          télésanté.
        src: [plq_cadre_2026]
      E3b:
        absent: true
        just: >
          L'assurance-emploi relève EXCLUSIVEMENT de la compétence fédérale au
          Canada : un parti provincial n'a aucune prise sur ce volet et n'en
          traite pas. Absence structurelle, établie par le partage des
          compétences et non par un défaut de recherche.
      E4:
        valeur: -0.5
        just: >
          Seul parti à proposer une mesure portant directement sur les droits à
          rente : s'engage à « protéger la rente de retraite des personnes qui
          réduisent ou interrompent leur participation au marché du travail pour
          prendre soin d'un proche », sur le modèle de l'exclusion existante
          pour les enfants en bas âge. En sens inverse, propose un Régime
          d'accession à l'entrepreneuriat permettant d'utiliser son
          épargne-retraite comme mise de fonds pour démarrer une entreprise —
          logique de capitalisation. Aucune position sur le RRQ, l'âge de départ
          ou le RREGOP ; le cadre financier n'en dit rien.
        src: [plq_communique_proches_aidants, plq_engagements, plq_cadre_2026]
        contest: >
          Les deux mesures pointent en sens opposés et sont de portée étroite.
          -0,5 retenu parce que seule la mesure proches aidants porte réellement
          sur le système de retraite, le RAE étant un dispositif
          d'entrepreneuriat qui emprunte le véhicule de l'épargne. Un codeur
          jugeant les deux équivalentes devrait mettre 0 — et non `absent`,
          puisque des positions existent.
      E5:
        valeur: 0.5
        just: >
          A voté pour le projet de loi 89 (devenu loi 14), qui permet au
          ministre du Travail de mettre fin à une grève et d'imposer
          l'arbitrage, adopté le 29 mai 2025 par 94 voix contre 17. N'a pris
          aucun engagement d'abroger les lois 4 et 14 malgré la demande publique
          de la FTQ. Aucune mesure sur le salaire minimum ni sur le Code du
          travail ; règle de réduction réglementaire « deux pour un » et
          réduction d'environ 12 000 ETC sur cinq ans, mais « par attrition,
          incitatifs au départ volontaire et redéploiement, jamais par coupes
          paramétriques ». S'engage par ailleurs à un « nouveau partenariat avec
          les organisations syndicales » en tant qu'État-employeur.
        src: [assnat_pl89, ledevoir_pl89, plq_engagements, ftq_engagements]
        contest: >
          RÉSERVE IMPORTANTE : la fiche de l'Assemblée nationale donne le total
          (94 pour, 17 contre) mais NE VENTILE PAS le vote par parti. La
          ventilation « 94 CAQ+PLQ / 17 PQ+QS » provient d'une seule source de
          rang 5 inaccessible en lecture directe. Si elle était infirmée, cette
          note tomberait à 0 ou `absent`. Arbitrage +0,5 contre +1 : le vote
          pour une loi autorisant à briser une grève justifierait +1, mais le
          PLQ 2026 n'a aucun programme de flexibilisation.
      E6:
        valeur: 0
        just: >
          Soutient le maintien du FECC et du marché du carbone, contrairement au
          PCQ qui veut les abolir. Propose de mettre fin à la règle du plus bas
          soumissionnaire dans les marchés publics.
        src: [lapresse_promesses_environnement, noovo_premieres_promesses]
      S1:
        valeur: -1
        just: >
          Seuil permanent oscillant entre 45 000 et 70 000 par année. Allonge de
          six mois à deux ans le délai avant que l'État communique uniquement en
          français avec les nouveaux arrivants, et ramène à six semaines
          l'attente pour l'accès à la francisation.
        src: [lapresse_promesses_immigration]
      S2:
        valeur: -1
        just: >
          Aucun engagement programmatique : ni la page « Nos engagements »
          (4 539 mots) ni le cadre financier (4 209 mots) ne contiennent une
          occurrence d'avortement, contraception, procréation assistée ou santé
          des femmes. Mais une position de parti explicite et récente : le PLQ a
          mené le combat parlementaire contre l'article 29 du projet de loi 1
          par sa porte-parole en condition féminine Brigitte B. Garceau, qui
          pose le principe : « L'autonomie reproductive des femmes leur
          appartient exclusivement et nous ne devons jamais la remettre en
          question. »
        src: [radiocanada_article29_retrait, plq_engagements, plq_cadre_2026]
        contest: >
          Arbitrage -1 contre -0,5. Le PLQ ne propose aucune mesure d'accès ni
          financement ; un -0,5, au niveau du PCQ, serait défendable. -1 retenu
          parce que le PLQ est intervenu activement (travail en commission,
          porte-parole désignée, principe formule), là où le PCQ se borne à un
          statu quo et renvoie la question au fédéral. L'écart PLQ/PCQ est le
          plus discutable de la série.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis représentés à l'Assemblée
          nationale, du rapport renouvelé sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblée a adopté la refonte de la Loi
          concernant les soins de fin de vie, légalisant les demandes anticipées
          d'aide médicale à mourir. Le Québec est au premier rang mondial pour
          le recours à l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position législative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Québec : il ne sépare pas les partis
          québécois entre eux, mais il situe le Québec par rapport aux autres
          territoires — ce qui est précisément son rôle sur une carte commune.
      S3:
        valeur: -1
        just: >
          La plateforme « Nos engagements » ne contient aucune mesure LGBT+.
          Note établie sur d'autres bases : les députés libéraux présents ont
          appuyé la motion du 6 février 2025 ; aux crédits 2026-2027, le PLQ a
          mis le gouvernement en difficulté sur l'écart entre les 23,7 M$
          annoncés et 51 253 $ de dépenses documentées, et sur le fait que
          40 fonctionnaires sur 78 000 ont suivi la formation de
          sensibilisation, en demandant qu'elle devienne obligatoire. Charles
          Milliard, premier chef ouvertement homosexuel d'un grand parti
          québécois, dit s'inquiéter d'un « glissement » sur ces enjeux et veut
          rattacher le Bureau de lutte contre l'homophobie et la transphobie au
          ministère de la Justice.
        src: [plq_engagements, lequotidien_motion_homophobie, fugues_milliard, apdq_credits_lgbtq]
        contest: >
          Arbitrage -1 contre -0,5. Le PLQ défend les droits existants et
          réclame plus de moyens, mais ne propose aucune extension nouvelle :
          ni pluriparentalité, ni élargissement de la PMA, ni couverture des
          soins d'affirmation de genre. -0,5 serait justifié en s'en tenant
          strictement au silence de la plateforme.
      S5:
        valeur: -1
        just: >
          S'engage à ne pas renouveler la disposition dérogatoire qui protège la
          Loi 21.
        src: [lapresse_laicite_engagements, pq_communique_laicite]
        contest: >
          RAMENÉ À -1 après notation de la France. Ne pas renouveler une
          disposition dérogatoire est nettement moins « multiculturaliste » que
          de réautoriser un vêtement religieux à l'école, ce que propose LFI —
          seule force du compas à vouloir revenir sur une restriction religieuse
          EN VIGUEUR. Le pôle négatif est donc rouvert vers le bas.
      S6:
        valeur: -1
        just: >
          États généraux sur l'avenir de l'éducation dans les 100 premiers
          jours et embauche de 1 000 ressources spécialisées dans les écoles
          pour épauler les enseignants. Investissement dans le réseau public,
          sans engagement sur le financement du privé.
        src: [radiocanada_etats_generaux, lapresse_promesses_education]

  - name: Parti québécois
    sigle: PQ
    label_pos: top center
    chef: Paul St-Pierre Plamondon
    country: Québec
    color: "#004C9D"
    as_of: "2026-09-17"
    souverainete: independantiste
    ecologie: reformiste
    estimation_initiale: {economie: -2, societe: 4}
    autorite: null
    resume: >
      En tête des sondages (29 % chez Léger, 13-14 septembre 2026). S'est
      engagé en août 2026 à ne tenir aucun référendum tant que Donald Trump
      sera président, soit pas avant le 20 janvier 2029 — un report critiqué
      par les autres chefs. Social-démocrate d'origine, mais
      cadre financier axé sur le retour à l'équilibre en 2028-2029, avec gel du
      salaire des élus et des PDG de sociétés d'État. Positions fermes sur la
      laïcité, le français et l'immigration.
    resume_src: [lapresse_pq_referendum, ledevoir_pq_referendum, lapresse_pq_cadre]
    indicateurs:
      E1:
        valeur: 1
        just: >
          Baisse de l'impôt des PME de 11,5 % à 9,5 % sur quatre ans, présentée
          comme une réduction de près de 20 % : une PME déclarant 1 M$ de revenu
          imposable économiserait 10 000 $. Financée par la fin des
          « subventions dans toutes les directions » aux multinationales
          étrangères et l'abolition du Fonds de développement économique.
        src: [ledevoir_pq_pme, pq_communique_pme, lactualite_pq_pme]
        contest: >
          Baisse d'impôt ciblée sur les PME, financée par le retrait de
          subventions aux multinationales : le sens pro-marché est réel mais
          partiel, d'où +1 et non +2. Aucune baisse d'impôt des particuliers
          n'est annoncée.
      E2:
        valeur: 1
        just: >
          « Lutte à la bureaucratie » : 6,6 G$ de coupes sur cinq ans, dont une
          réduction de 2,5 % de la masse salariale de l'État. Abolition de
          l'agence Santé Québec (340 M$ récupérés sur cinq ans). Retour à
          l'équilibre en 2028-2029, un an plus tôt que ne l'exige la Loi sur
          l'équilibre budgétaire : d'un déficit de 6,5 G$ en 2026-2027 à un
          surplus de 49 M$ en 2028-2029.
        src: [lapresse_pq_cadre, noovo_pq_bureaucratie]
        contest: >
          Coupes dans la bureaucratie et discipline budgétaire tirent vers le
          marché, mais elles financent un réinvestissement en santé et en
          éducation : un parti social-démocrate qui coupe dans l'appareil, pas
          dans les programmes. Un 0 serait défendable.
      E3a:
        valeur: -1
        just: >
          Réinvestissement en santé, en éducation et en soutien aux PME financé
          par les coupes bureaucratiques. L'abolition de l'agence Santé Québec
          est une RECENTRALISATION DE LA GOUVERNANCE PUBLIQUE, non une
          privatisation.
        src: [lapresse_pq_cadre, noovo_pq_bureaucratie]
      E3b:
        absent: true
        just: >
          L'assurance-emploi relève EXCLUSIVEMENT de la compétence fédérale au
          Canada : un parti provincial n'a aucune prise sur ce volet et n'en
          traite pas. Absence structurelle, établie par le partage des
          compétences et non par un défaut de recherche.
      E4:
        absent: true
        just: >
          Aucune position applicable sous le cadre constitutionnel actuel. Le
          seul engagement chiffré du PQ sur les pensions — 8,1 G$ de prestations
          additionnelles aux aînés sur cinq ans, versées à tous les
          bénéficiaires d'une rente du RRQ — figure dans « Les finances d'un
          Québec indépendant » et relève du budget de l'an 1 d'un Québec
          souverain. Le PQ s'étant engagé à ne tenir aucun référendum avant le
          20 janvier 2029, la mesure n'est pas opérante dans le mandat soumis au
          scrutin. Rien sur le RRQ dans le cadre provincial, ni sur le RREGOP,
          ni sur l'âge de départ.
        src: [pq_finances_independant, pq_livre_bleu, areq_rregop]
        contest: >
          Application de la règle sur les engagements post-indépendance (voir
          grille.md). Si le compas notait les mesures conditionnelles à la
          souveraineté, le PQ serait à -1 sur cet indicateur : l'engagement est
          chiffré, substantiel et adossé au RRQ.
      E5:
        valeur: -0.5
        just: >
          A voté contre le projet de loi 89 (devenu loi 14) limitant le droit de
          grève, avec QS, parmi les 17 voix contre le 29 mai 2025. S'engage à
          rémunérer les stages obligatoires de formation en santé et services
          sociaux, en enseignement et en éducation à l'enfance : 12 semaines à
          temps complet au taux du salaire minimum, soit près de 7 000 $ pour
          420 heures, « entre 3 000 $ et 6 000 $ de plus que les bourses
          actuelles » — extension de la rémunération à du travail aujourd'hui
          non rémunéré. Aucun engagement sur le salaire minimum ni sur le Code
          du travail, et aucun engagement formel d'abroger les lois 4 et 14.
        src: [assnat_pl89, ledevoir_pl89, pq_stages_remuneres]
        contest: >
          Même réserve que pour le PLQ : la ventilation partisane du vote de
          2025 repose sur une source de rang 5 inaccessible. Arbitrage -0,5
          contre -1 : le vote contre la loi antigrève tirerait vers -1, mais le
          PQ n'a rien annoncé sur le salaire minimum ni sur le Code du travail
          pendant la campagne, et la rémunération des stages est de portée
          sectorielle étroite.
      E6:
        valeur: -1
        just: >
          Recentre le FECC sur les mesures à contribution environnementale
          démontrée. Relève la cible de réduction des GES à 42,5 % d'ici 2034
          (« cible flexible ») et instaure des budgets carbone quinquennaux pour
          rendre la réduction mesurable. Plan présenté explicitement sans
          « mesures moralisatrices ».
        src: [ledevoir_pq_plan_environnement, lapresse_promesses_environnement]
      S1:
        valeur: 1.5
        just: >
          Engagement à réduire de moitié l'immigration temporaire et à imposer
          un moratoire sur l'immigration économique permanente.
        src: [radiocanada_pq_seuils, lapresse_promesses_immigration]
        contest: >
          RAMENÉ DE +2 À +1,5 après notation de la France. Le PQ opère une coupe
          quantitative réelle, mais le RN supprime le droit du sol, suspend
          TOUTES les régularisations préfectorales, renvoie le dépôt des
          demandes d'asile aux ambassades et vise historiquement une division
          par vingt de l'immigration légale ; Reconquête vise un solde
          migratoire négatif. Sur une échelle non plafonnée ils seraient à +2,5
          et +3. Le +2 leur est donc réservé.
      S2:
        absent: true
        just: >
          Absence établie sur les documents primaires, non déduite. La
          proposition principale « Projet national » (21 993 mots, mai 2026) ne
          contient aucune occurrence d'avortement, IVG, contraception,
          procréation assistée ni planning familial. Sa section sur les droits
          des femmes est longue mais porte sur les violences, l'exploitation
          sexuelle, la laïcité, les espaces non mixtes et la parité. Le Livre
          bleu mentionne l'avortement trois fois, toujours comme exemple
          historique ou constitutionnel.
        src: [pq_projet_national, pq_livre_bleu, cbc_comparatif_2026]
        contest: >
          Il est vraisemblable que le PQ soit pro-choix — c'est le consensus
          québécois — mais une vraisemblance n'est pas une source. Une
          affirmation circulant en ce sens s'est révélée non étayée après
          vérification de l'article cité, qui ne contenait aucune position de
          parti ni citation du chef.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis représentés à l'Assemblée
          nationale, du rapport renouvelé sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblée a adopté la refonte de la Loi
          concernant les soins de fin de vie, légalisant les demandes anticipées
          d'aide médicale à mourir. Le Québec est au premier rang mondial pour
          le recours à l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position législative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Québec : il ne sépare pas les partis
          québécois entre eux, mais il situe le Québec par rapport aux autres
          territoires — ce qui est précisément son rôle sur une carte commune.
      S3:
        valeur: 1
        just: >
          Le 3e Congrès d'orientation (Saint-Hyacinthe, 23-25 janvier 2026,
          environ 600 délégués) a adopté trois positions : distinguer sexe et
          identité de genre dans les données statistiques, les lois et les
          programmes gouvernementaux ; réaffirmer le droit des femmes à des
          espaces non mixtes fondés sur le sexe (toilettes, vestiaires,
          compétitions sportives, maisons d'hébergement, prisons) ; réviser les
          outils d'éducation à la sexualité pour qu'ils soient fondés « sur la
          science et la biologie ». Dans leurs effets, les deux premières
          retirent aux femmes trans un accès existant. Antérieurement :
          abstention des trois députés péquistes sur la motion du 6 février
          2025, et demande en 2023 d'une commission parlementaire sur les
          « idéologies de la gauche radicale » à l'école. À l'inverse, le PQ
          réclame une formation obligatoire et dénonce la couverture
          territoriale déficiente des services LGBTQ+.
        src: [pq_projet_national, lequotidien_motion_homophobie, lautjournal_pq_trans, apdq_credits_lgbtq]
        contest: >
          Arbitrage +1 contre +1,5. Le PQ a inscrit ces positions dans son
          document programmatique et il est en tête des sondages, mais il ne
          propose aucune restriction des soins de transition, aucune
          interdiction d'enseignement ni retrait d'ouvrages, et réclame
          simultanément plus de formation et de services. Formulations exactes
          de la proposition principale : mettre sur pied « une commission
          parlementaire portant sur les contenus des programmes et outils
          d'éducation à la sexualité [...] pour s'assurer qu'ils reposent sur la
          science et la biologie » ; « réaffirmer le droit des filles et des
          femmes aux espaces et activités non mixtes [...] (toilettes,
          vestiaires, compétitions sportives, [...] groupes de lesbiennes,
          [...] prisons pour femmes) ».
      S5:
        valeur: 1
        just: >
          Veut aller plus loin que la Loi 21 actuelle. Fait campagne contre
          l'engagement du PLQ de ne pas reconduire la disposition dérogatoire.
        src: [lapresse_laicite_engagements, pq_communique_laicite]
        contest: >
          RÉÉCHELONNÉ après notation de la France. La loi 21 interdit les signes
          religieux aux AGENTS de l'État en position d'autorité ; elle ne
          restreint ni les élèves, ni les usagers, ni quiconque dans la rue. Or
          LR interdirait le voile à l'université — donc à des usagères ADULTES
          d'un service public — et inscrirait la « tradition judéo-chrétienne »
          dans le bloc constitutionnel, ce que la loi 21 refuse au nom de la
          neutralité ; le RN l'interdirait à toute femme dans tout l'espace
          public sous peine d'amende ; Reconquête y ajoute la remigration. Le
          haut de l'échelle est donc rouvert pour la France.
      S6:
        valeur: -1
        just: >
          États généraux en éducation dans les 100 premiers jours. Rendrait une
          partie du financement des écoles privées conditionnelle à l'accueil
          d'élèves défavorisés ayant des difficultés d'apprentissage, pour
          favoriser la mixité. Dénonce « l'école à trois vitesses ».
        src: [ledevoir_pq_education, noovo_pq_etats_generaux, radiocanada_etats_generaux]

  - name: Québec solidaire
    sigle: QS
    label_pos: bottom right
    chef: Ruba Ghazal
    country: Québec
    color: "#FF5505"
    as_of: "2026-09-17"
    souverainete: independantiste
    ecologie: planificateur
    estimation_initiale: {economie: -7, societe: -7}
    autorite: null
    resume: >
      Gauche écologiste et souverainiste : transition énergétique, renforcement
      des services publics, logement social, impôt sur la fortune. Promesses
      chiffrées à près de 10,5 G$ sur quatre ans, financées en grande partie par
      cet impôt, avec équilibre visé en 2029-2030. À 10 % dans les sondages.
    indicateurs:
      E1:
        valeur: -1.5
        just: >
          Impôt sur la fortune de 1 % au-delà de 25 M$ et de 2 % au-delà de
          100 M$, rapportant 5 G$ et touchant 4 000 ménages. Réforme fiscale
          récupérant 2,4 G$ par la révision des paliers d'imposition des
          particuliers, présentée comme une hausse des impôts des « 10 % les
          plus riches ». Hausse de l'impôt sur les profits des entreprises et du
          taux d'inclusion des gains en capital pour les grandes entreprises.
        src: [radiocanada_qs_cadre, radiocanada_verif_qs, lactualite_qs_105]
        contest: >
          RAMENÉ DE -2 À -1,5 après notation de la France, par application de la
          règle du plus radical observable. Le PCF ne se contente pas de
          rétablir l'ISF : il en triple le rendement, supprime ses niches,
          abolit le prélèvement forfaitaire unique et porte l'impôt sur le
          revenu à 15 tranches. LFI propose un « héritage maximum », plafond
          absolu de transmission sans équivalent dans les trois autres
          territoires. Et la taxe Zucman du PS français — 2 % au-delà de 100 M€
          — égale déjà le taux supérieur de QS alors que le PS n'est que le
          troisième parti français sur cet indicateur. Le -2 est donc libéré
          pour le PCF et LFI.
      E2:
        valeur: -1.5
        just: >
          Promesses de près de 10,5 G$ sur quatre ans en expansion des services
          publics, dont plus de 250 nouveaux CLSC et un portefeuille de
          transition écologique de 4,2 G$ sur quatre ans. Équilibre repoussé à
          2029-2030.
        src: [lactualite_qs_105, radiocanada_qs_cadre]
        contest: >
          −1,5 justifié par la MAGNITUDE BUDGÉTAIRE, non par l'absence de
          nationalisation. La formulation précédente ne discriminait plus une
          fois la France notée : le Parti socialiste français nationalise les
          autoroutes et les réseaux gaz-électricité tout en étant moins
          expansionniste que QS sur la dépense, et se retrouve au même −1,5 pour
          des raisons opposées. Le −2 revient au PCF, qui nomme les
          établissements à nationaliser (BNP-Paribas, Société générale, Axa,
          EDF, Engie, SNCF, La Poste, Sanofi) et chiffre 500 000 créations
          d'emplois publics ventilées poste par poste.
      E3a:
        valeur: -2
        just: >
          Éviction du privé en santé : plus de 250 nouveaux CLSC et limitation
          de l'expansion des cliniques privées spécialisées, au motif de leurs
          effets sur l'organisation des soins et l'équité d'accès.
        src: [lapresse_promesses_sante, lequebecvote_comparer]
      E3b:
        absent: true
        just: >
          L'assurance-emploi relève EXCLUSIVEMENT de la compétence fédérale au
          Canada : un parti provincial n'a aucune prise sur ce volet et n'en
          traite pas. Absence structurelle, établie par le partage des
          compétences et non par un défaut de recherche.
      E4:
        absent: true
        just: >
          Aucun engagement sur les retraites trouvé. Le programme des 100
          premiers jours et les annonces de campagne portent sur le salaire
          minimum, les loyers et le télétravail des fonctionnaires, pas sur le
          RRQ ni sur les régimes de retraite. QS n'a pas répondu publiquement à
          l'appel de l'AREQ sur l'indexation des rentes du RREGOP.
        src: [qs_plateforme_2026, areq_rregop]
        contest: >
          À CONFIRMER : le site plateforme.quebecsolidaire.net n'a pas pu être
          lu (échec de négociation TLS), et QS porte historiquement des
          positions sur la bonification du RRQ. Trois recherches ciblées n'ont
          rien donné, mais une planche « retraite » dans la plateforme intégrale
          ne peut pas être exclue.
      E5:
        valeur: -1.5
        just: >
          Salaire minimum porté à 20 $/h dès mai 2027, contre 16,60 $
          actuellement, avec une enveloppe de soutien aux employeurs de 330 M$
          la première année.
        src: [lapresse_qs_salaire_minimum]
        contest: >
          RAMENÉ DE -2 À -1,5 après notation de la France. La position de QS
          repose sur UNE SEULE mesure. LFI porte le SMIC de 1 443 à 1 700 € net
          (+17,8 %, hausse relative comparable) ET y ajoute les 32 heures, une
          sixième semaine de congés payés, l'indexation des salaires sur
          l'inflation, un quota maximal de contrats précaires et la
          requalification des travailleurs de plateformes. Le PCF ajoute la
          suspension de TOUS les plans sociaux et licenciements en cours. Le PS
          français, noté -1,5, vise 1 690 € net — à dix euros de LFI — avec en
          plus la codétermination à 50 % des droits de vote dans les conseils
          d'administration : QS doit descendre au moins à son niveau pour que
          l'échelle reste ordinale.
      E6:
        valeur: -1.5
        just: >
          Plafonnement des hausses de loyer au niveau de l'inflation — un
          encadrement direct des prix. Épiceries publiques pour soutenir
          l'agriculture locale. Transport collectif présenté comme priorité
          principale. Soutien au FECC et au marché du carbone.
        src: [noovo_premieres_promesses, lapresse_promesses_environnement]
        contest: >
          RAMENÉ DE -2 À -1,5 après notation de la France. LFI propose le
          BLOCAGE PAR DÉCRET des prix de l'alimentation, de l'énergie et des
          carburants à l'échelle d'un marché de 68 millions d'habitants, avec
          renforcement de la DGCCRF pour en contrôler l'application ; le PCF
          nationalise EDF, la SNCF, Engie, La Poste, BNP-Paribas, la Société
          générale et Axa, et vise un mix énergétique 100 % public. Il ne
          s'agit plus d'encadrer un marché mais de le supprimer : aucun
          équivalent québécois.
      S1:
        valeur: -1.5
        just: >
          Seuil d'immigration permanente porté à 70 000 par année (contre
          45 000). Rétablissement intégral du PEQ et régionalisation sous forme
          de PEQ régionaux.
        src: [lapresse_qs_seuils, lapresse_promesses_immigration]
        contest: >
          RAMENÉ DE -2 À -1,5 après notation de la France. QS relève un seuil ;
          LFI y ajoute une régularisation massive, le droit du sol intégral, la
          carte de dix ans comme titre de référence et le droit de vote des
          étrangers aux élections locales — quatre leviers que QS ne propose
          pas. Le -2 revient à LFI.
      S2:
        valeur: -2
        just: >
          Seul parti à prendre un engagement programmatique de garantie ET de
          remboursement. Plateforme 2026, MESURE 4 : « un gouvernement solidaire
          [...] garantira le droit et l'accès à l'avortement sur l'ensemble de
          son territoire » ; MESURE 3 : « rendra la contraception et les
          produits menstruels gratuits et éliminera la taxe rose ». Ruba Ghazal
          a déposé le 7 mai 2025 le projet de loi 994 intégrant les produits
          contraceptifs au panier de services de la RAMQ, après une pétition de
          près de 100 000 signatures.
        src: [qs_plateforme_2026, radiocanada_qs_contraception, cbc_comparatif_2026]
        contest: >
          À ne pas mal lire : QS a porté une pétition demandant le RETRAIT de
          l'article 29 du projet de loi 1, qui protégeait la liberté de recourir
          à l'IVG. Ce n'est pas une opposition au droit mais une position
          partagée par la FQPN, la CSQ, le Conseil du statut de la femme, le
          Barreau, le Collège des médecins et Amnistie internationale :
          inscrire l'avortement dans un texte de loi créerait une prise
          juridique pour les mouvements anti-choix et fragiliserait son statut
          actuel de soin non légiféré.
      S3:
        valeur: -1.5
        just: >
          Seul des cinq partis dont la plateforme 2026 contient un engagement
          écrit (p. 34) : « un gouvernement solidaire protégera les droits et
          assurera la sécurité des communautés LGBTQIA2S+. Il protégera les
          droits des personnes trans en favorisant l'équité entre les genres
          dans les lois québécoises. Il encouragera l'accès aux soins, y compris
          ceux d'affirmation de genre ». Création d'un ministère Femmes et
          Égalité des genres. C'est QS (Manon Masse) qui a déposé la motion du
          6 février 2025 dénonçant la montée de l'intolérance envers les jeunes
          LGBTQ+.
        src: [qs_plateforme_2026, lequotidien_motion_homophobie, apdq_credits_lgbtq]
        contest: >
          -1,5 et non -2 : la plateforme reste au niveau du principe
          (« encouragera », « favorisant »), sans mesure chiffrée, sans
          engagement sur la pluriparentalité pourtant réclamée par la Coalition
          des familles LGBT+, ni sur l'autodétermination du genre. QS est sans
          conteste le pôle pro-extension du spectre québécois, mais son texte
          plafonne sous le maximum observable dans les quatre territoires.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis représentés à l'Assemblée
          nationale, du rapport renouvelé sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblée a adopté la refonte de la Loi
          concernant les soins de fin de vie, légalisant les demandes anticipées
          d'aide médicale à mourir. Le Québec est au premier rang mondial pour
          le recours à l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position législative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Québec : il ne sépare pas les partis
          québécois entre eux, mais il situe le Québec par rapport aux autres
          territoires — ce qui est précisément son rôle sur une carte commune.
      S5:
        valeur: -0.5
        just: >
          Favorable au principe de laïcité des institutions, mais opposé à
          l'interdiction du port de signes religieux pour les employés de l'État
          en position d'autorité prévue par la Loi 21.
        src: [lapresse_laicite_engagements]
        contest: >
          RAMENÉ DE -1 À -0,5 pour la même raison que le PLQ : QS s'oppose à une
          restriction existante sans proposer de la lever, là où LFI propose de
          revenir sur l'interdiction de l'abaya à l'école.
      S6:
        valeur: -1.5
        just: >
          Créerait un Réseau scolaire commun intégrant les écoles privées qui
          acceptent de cesser la sélection par les notes et les frais de
          scolarité, en échange d'un financement à 100 % par l'État. Plan de
          340 M$ en éducation, 2 000 nouveaux professionnels, protection du
          budget des établissements, engagement à réduire de moitié le
          décrochage scolaire.
        src: [lapresse_promesses_education, lesaffaires_qs_decrochage, radiocanada_etats_generaux]
        contest: >
          RAMENÉ DE -2 À -1,5 après notation de la France. Chez QS le privé
          subsiste, converti et intégré. Le PCF porte la fin pure et simple du
          financement public des écoles privées sous contrat ET « l'interdiction
          de toutes les écoles privées hors contrat », pour aboutir à « une
          seule école commune » : c'est une suppression du secteur privé, pas
          son absorption négociée.

  - name: Parti conservateur du Québec
    sigle: PCQ
    label_pos: middle right
    chef: Éric Duhaime
    country: Québec
    color: "#1B3A6B"
    as_of: "2026-09-17"
    souverainete: nationaliste
    ecologie: productiviste
    estimation_initiale: {economie: 7, societe: 4}
    autorite: >
      Opposé aux mesures sanitaires pendant la pandémie ; discours centré sur
      les libertés individuelles.
    resume: >
      À 17 % dans les sondages, très au-dessus de son résultat de 2022.
      Libertarien sur l'économie : plus de privé en santé, révision du
      financement des garderies, exploitation des hydrocarbures, troisième lien
      à Québec. Cadre financier le plus radical de la campagne, présenté le
      9 septembre 2026.
    indicateurs:
      E1:
        valeur: 2
        just: >
          Baisses d'impôts majeures, financées par la réduction des dépenses.
          Le porte-parole aux finances publiques Adrien Pouliot chiffre le coût
          total des promesses à 52,57 G$ sur cinq ans, couvert par 60,3 G$ de
          revenus additionnels.
        src: [ledevoir_pcq_47g, radiocanada_verif_pcq, pcq_cadre_communique]
      E2:
        valeur: 1.5
        just: >
          « Dégraisser » les finances publiques de 47 G$ sur cinq ans, dont
          l'abolition de 20 000 postes dans la fonction publique. Retour à
          l'équilibre en quatre ans.
        src: [ledevoir_pcq_47g, lapresse_pcq_cadre, radiocanada_verif_pcq]
        contest: >
          Duhaime soutient que les services ne seraient pas touchés. Selon la
          Vérificatrice générale du Québec, c'est improbable : ralentir la
          dépense implique de réduire ou de cesser le financement d'activités et
          de programmes, avec des conséquences attendues sur les services,
          particulièrement en 2028-2029.
        contest: >
          RAMENÉ DE +2 À +1,5 après notation des États-Unis. Le Parti républicain
          a EFFECTIVEMENT supprimé environ 256 000 postes dans 22 grandes agences
          fédérales en treize mois — plus de 11 % —, aboli une agence de rang
          gouvernemental (USAID) et amputé de moitié le ministère de l'Éducation.
          Reconquête propose environ 150 000 suppressions sur 5,7 millions
          d'agents publics français, soit 2,6 % : un ordre de grandeur quatre
          fois inférieur. RÉVISION VOLONTAIREMENT RESTREINTE : l'agent
          recommandait de cascader aussi Horizons, LR et Renaissance de +1,5 à
          +1, au motif que l'acte l'emporte sur la proposition. Cet argument n'a
          pas été suivi : il amplifierait le biais du sortant déjà documenté
          dans grille.md.
      E3a:
        valeur: 1.5
        just: >
          Veut mettre fin au MONOPOLE DE LA RAMQ et permettre aux Québécois de
          souscrire une assurance privée « duplicative » pour des services déjà
          couverts par le régime public, relançant le débat sur la pratique
          mixte public-privé. Abolition de Santé Québec et réduction de 25 % de
          la bureaucratie, doublement des IPS, hausse des admissions en médecine
          de 300 à 500 par année.
        src: [apdq_pcq_sante, noovo_pcq_sante_bureaucratie]
        contest: >
          +1,5 et non +2 par la règle du plus radical observable : le PCQ ouvre
          le régime public à la concurrence privée duplicative mais CONSERVE la
          RAMQ, alors que le Parti républicain américain a légiféré une
          réduction nette de couverture chiffrée à dix millions de désassurés.
          Le +2 lui est réservé.
      E3b:
        absent: true
        just: >
          L'assurance-emploi relève EXCLUSIVEMENT de la compétence fédérale au
          Canada : un parti provincial n'a aucune prise sur ce volet et n'en
          traite pas. Absence structurelle, établie par le partage des
          compétences et non par un défaut de recherche.
      E4:
        absent: true
        just: >
          Aucun engagement sur les retraites. Extraction et recherche par
          mots-clés sur la plateforme électorale et le manifeste économique :
          aucune occurrence utile de « RRQ », « régime de rentes », « RREGOP »
          ni « âge de la retraite ». La seule mention de retraite est
          instrumentale — réduction de l'effectif de l'État « par tous les
          départs à la retraite ». La section « Nos aînés » porte sur l'accès
          aux soins et le maintien à domicile, pas sur les pensions.
        src: [pcq_plateforme_2026, pcq_manifeste_economique]
      E5:
        valeur: 1.5
        just: >
          Plateforme thématique dédiée, « Travail et démocratie syndicale »,
          annonçant un projet de loi complet en quatre volets : réserver la
          cotisation obligatoire aux seules dépenses de représentation et de
          négociation, avec droit de retrait individuel permettant de
          « démissionner comme membre (malgré une clause d'atelier fermé) » ;
          scrutin secret obligatoire pour toute accréditation « peu importe le
          pourcentage de cartes signées », assorti d'un vote de maintien
          périodique de l'accréditation ; publication publique des états
          financiers syndicaux ; mécanisme de plainte au Tribunal administratif
          du travail. S'y ajoute un chantier de déréglementation visant -30 % du
          fardeau réglementaire. Duhaime : « C'est fini les votes à main levée
          avec les goons du syndicat en arrière. »
        src: [pcq_plateforme_travail, noovo_pcq_syndicats, pcq_plateforme_2026]
        contest: >
          Arbitrage +1,5 contre +1. Le vote de maintien périodique de
          l'accréditation est une mesure structurelle lourde, au-delà de ce
          qu'a fait la CAQ. Mais le PCQ n'abolit pas la formule Rand — la
          cotisation obligatoire est maintenue pour la négociation —, ne touche
          pas aux normes du travail et n'a aucune position sur le salaire
          minimum. Le +2 correspondrait au right-to-work américain avec
          abolition de la formule Rand et salaire minimum laissé au marché.
      E6:
        valeur: 1.5
        just: >
          Abolition du Fonds d'électrification et de changements climatiques
          (FECC), principal véhicule de financement des politiques climatiques
          québécoises, et retrait du Québec du marché du carbone.
        src: [lapresse_promesses_environnement, radiocanada_verif_pcq, ledevoir_pcq_cadre_services]
        contest: >
          RAMENÉ DE +2 À +1,5 après notation des États-Unis. Aucun parti français
          ni québécois ne propose l'ABOLITION DU FONDEMENT JURIDIQUE de la
          régulation climatique de sa juridiction. La règle américaine du
          18 février 2026 supprime l'endangerment finding de 2009 ET toutes les
          normes d'émission de gaz à effet de serre des véhicules de 2012 à 2027,
          détruisant la base légale de toute régulation climatique au titre du
          Clean Air Act — doublée d'une règle générale d'abrogation à dix pour
          un.
      S1:
        valeur: 1.5
        just: >
          Réduction de 20 000 à 10 000 des admissions au titre du regroupement
          familial et des réfugiés. Refus de seuils fixes, jugés un « piège » :
          planification construite depuis des tables régionales. Critère de pays
          d'origine « démocratique » pesant autant que la maîtrise du français.
          Réduction de 25 % de l'aide sociale aux demandeurs d'asile, priorité
          aux Québécois pour certains logements et places en garderie
          subventionnée.
        src: [lactualite_pcq_democratiques, apdq_pcq_plan, lequotidien_duhaime]
        contest: >
          RAMENÉ DE +2 À +1,5 après notation de la France, pour la même raison
          que le PQ : le RN et Reconquête occupent désormais le +2 avec des
          mesures d'un autre ordre de grandeur (suppression du droit du sol,
          asile en ambassade, solde migratoire négatif).
      S5:
        valeur: 0.5
        just: >
          Soutient la Loi 21, présentée comme un compromis entre le droit des
          citoyens à un service neutre et celui des employés de l'État
          d'afficher leur religion — position plus modérée que CAQ et PQ. Mais
          assume le critère de « compatibilité culturelle » dans la sélection.
        src: [lapresse_laicite_engagements, quebecnouvelles_duhaime_compatibilite]
      S6:
        valeur: 1.5
        just: >
          Veut lever le moratoire sur les nouvelles écoles privées
          subventionnées, en vigueur depuis 2008, et propose un système
          « à 1 000 vitesses » adapté à chaque élève. Duhaime s'oppose à
          l'enseignement de « l'idéologie du genre » à l'école, estimant qu'il
          revient aux parents d'inculquer les valeurs morales (déclarations de
          septembre 2023).
        src: [lapresse_promesses_education, noovo_pcq_1000_vitesses, lesoleil_duhaime_genre]
        contest: >
          +1,5 : deux des trois composantes de la borne +2 sont présentes
          (financement du privé, encadrement des contenus sur le genre). Le +2
          reste réservé à la droite américaine, qui y ajoute bons scolaires et
          retraits d'ouvrages. Les militants du PCQ ne sont par ailleurs pas
          alignés sur leur chef sur ces questions.
      S2:
        valeur: -0.5
        just: >
          Parti pro-choix qui défend l'accès existant sans proposer de le
          renforcer. Le 4 août 2026, Duhaime : « On a toujours été un parti qui
          est pro-choix et cette politique ne changera absolument pas [...] il
          n'y aura pas de débat à l'intérieur de nos rangs sur cet enjeu »,
          renvoyant la question à la compétence fédérale. Le candidat Éric
          Lanthier (Pontiac), militant antiavortement, s'est retiré le
          9 septembre 2026 après des révélations du Journal de Montréal ;
          Duhaime a réaffirmé la ligne pro-choix. Aucun engagement de
          protection n'apparaît toutefois dans les documents programmatiques :
          zéro occurrence d'« avortement » ou de « reproduct- » dans la
          plateforme électorale 2026, la plateforme Santé 2026 et le programme
          adopté au congrès de 2023.
        src: [radiocanada_pcq_prochoix, noovo_pcq_lanthier, pcq_plateforme_2026, pcq_plateforme_sante, pcq_congres_2023]
        contest: >
          Arbitrage -0,5 contre 0 : la position n'est pas une neutralité, le
          chef l'a réaffirmée deux fois en six semaines et fait appliquer par le
          retrait d'un candidat. Un 0 reste défendable si l'on ne retient que
          l'absence d'engagement programmatique. En 2022, Duhaime avait au
          contraire défendu son candidat antiavortement Roy Eappen au nom de la
          « liberté de conscience » : la ligne s'est durcie depuis.
      S3:
        valeur: 1
        just: >
          Seul parti québécois à proposer une restriction législative de l'accès
          aux soins de transition. Mémoire déposé au Comité de sages le 13 mars
          2024 : interdiction des mastectomies chez les mineurs, consentement
          parental obligatoire pour les bloqueurs de puberté avant 16 ans,
          inscription obligatoire des jeunes sous traitement hormonal dans un
          protocole de recherche. Duhaime veut aussi bannir « l'idéologie du
          genre » de l'école, exiger l'autorisation parentale pour tout
          changement de prénom ou de pronom, et s'oppose à l'accès des femmes
          trans aux espaces réservés aux femmes.
        src: [noovo_duhaime_mastectomies, pcq_plateforme_2026, pcq_plateforme_education, alexandredumas_partis_genre]
        contest: >
          Arbitrage +1 contre +1,5. Nuance forte et vérifiée : les vingt
          documents de plateforme 2026 du PCQ ne contiennent aucune occurrence
          de « genre », « trans », « LGBT », « pronom », « mastectomie » ni
          « puberté », et aucune sortie publique sur le sujet n'a été repérée
          entre le 27 août et le 17 septembre 2026 — les propositions les plus
          fermes datent de 2024. Les militants ont par ailleurs rejeté en
          congrès une résolution sur l'éducation à la sexualité, contre la
          position de leur chef. +1,5 retenu car ce sont les seules propositions
          québécoises de restriction d'un accès aux soins. RAMENÉ DE +1,5 À +1
          après notation de la France : la proposition de loi LR adoptée par le
          Sénat le 28 mai 2024 interdit pour les mineurs les bloqueurs de
          puberté, les hormones croisées ET la chirurgie, là où le PCQ interdit
          les mastectomies et exige le consentement parental pour les bloqueurs.
          LR est strictement plus restrictif sur cet item et occupe le +1,5.
      S4:
        absent: true
        just: >
          Aucune position établie. L'extraction du texte intégral de six
          documents programmatiques du parti (plateforme électorale 2026,
          plateforme Santé 2026, plan familles, plateforme itinérance, congrès
          2023, conseil général 2024, soit environ 50 000 mots) ne donne aucune
          occurrence d'« aide médicale à mourir », « fin de vie », « soins
          palliatifs », « euthanasie », « demande anticipée » ni « objection de
          conscience ». Silence d'autant plus net que la plateforme Santé traite
          du vieillissement, des CHSLD et des soins à domicile. Aucune
          déclaration de campagne trouvée non plus. Le PCQ n'a jamais dit qu'il
          maintiendrait le régime actuel : il n'en parle pas.
        src: [pcq_plateforme_sante, pcq_plateforme_2026, pcq_congres_2023, pcq_documents_officiels, vivredignite_soins_palliatifs]
        contest: >
          À ne pas confondre : un candidat du PCQ, David Alarie, a évoqué
          « l'euthanasie des gens favorables aux mesures sanitaires ». Saillie
          polémique sur la pandémie, sans rapport avec l'AMM comme politique de
          santé ; non comptabilisée. L'écart avec le -2 des quatre partis
          parlementaires s'explique par leur cosignature du rapport sur les
          soins de fin de vie et leur vote sur la refonte, auxquels le PCQ ne
          pouvait pas participer faute de siège — aucune inférence à en tirer.
      S7:
        absent: true
        just: >
          Recherche effectuée : Duhaime critique une détérioration de la
          sécurité publique sous la CAQ, mais aucun engagement concret sur la
          police, les peines ou les prisons n'a été trouvé dans la campagne
          2026. Position rhétorique sans mesure notable — laissée hors calcul
          plutôt que note 0, une absence d'engagement n'étant pas un statu quo.
        src: [apdq_pcq_lancement]

  # -------------------------------------------------------------------- France
  # Présidentielle 2027. Macron ne pouvant se représenter, Renaissance est
  # portée par Attal ; le bilan du président sortant reste dans le résumé.
  - name: Renaissance
    sigle: Renaissance
    label_pos: bottom left
    chef: Gabriel Attal
    country: France
    color: "#FFC600"
    as_of: "2026-09-17"
    souverainete: europeen_reformiste
    ecologie: reformiste
    estimation_initiale: {economie: 4, societe: -2}
    autorite: >
      Bilan du président sortant : recours répété au 49.3 et durcissement de la
      loi immigration de 2024 en cours de débat.
    resume: >
      Attal, secrétaire général du parti, est candidat déclaré depuis mai 2026.
      Ligne libérale et pro-européenne dans la continuité du macronisme, avec un
      accent sur l'école, l'autorité et le travail. Bilan du quinquennat :
      politique de l'offre, baisses d'impôts sur les entreprises, réforme des
      retraites, flexibilisation du marché du travail.
    indicateurs:
      E1:
        valeur: 1.5
        just: >
          La convention Renaissance revendique le bilan du quinquennat comme
          acquis du parti : « nous avons rapproché notre environnement fiscal
          des moyennes européennes en baissant l'impôt sur les sociétés et les
          impôts de production, en supprimant l'ISF et en instaurant la flat
          tax ». Pour l'avenir : « nous refuserons toute hausse d'impôt sur les
          entreprises et baisserons encore les impôts de production », via un
          « bouclier fiscal productif » ramenant les impôts de production sous
          3 % de la valeur ajoutée contre 3,7 %.
        src: [renaissance_convention_economique, attal_president, franceinfo_attal_deficit]
        contest: >
          Le bilan du quinquennat est compté comme bilan du parti, Macron ne
          pouvant se représenter. Si l'on ne notait que les engagements 2027
          d'Attal, qui portent sur les économies et non sur de nouvelles baisses
          d'impôts, +1 serait plus juste.
      E2:
        valeur: 1.5
        just: >
          Cap annoncé en juillet 2026 : « zéro déficit en 2037 », reposant sur
          une « année blanche » gelant les prestations sociales, un plan de
          départs volontaires supprimant 100 000 postes de fonctionnaires
          (Éducation, Armées, Justice et Intérieur préservés), et des réformes
          des retraites et de l'assurance chômage pour 120 à 150 Md€
          d'économies. Le site de campagne ajoute qu'« aucune dépense ne doit
          être un tabou » et revendique « une baisse inédite de 10 milliards
          d'euros du budget des ministères » en 2024.
        src: [franceinfo_attal_deficit, attal_president, renaissance_convention_economique]
        contest: >
          Aucun programme de privatisation, ce qui empêche le +2 malgré un
          objectif d'effectifs chiffré unique parmi les partis de gouvernement
          français.
      E3a:
        absent: true
        just: >
          Recherche faite, rien de notable. Renaissance n'a publié AUCUNE
          convention thématique santé — seules « Nouvelle donne économique et
          climatique » et « Régalien » sont en ligne — et la mesure
          gouvernementale la plus significative, le doublement des franchises
          médicales et des participations forfaitaires de 2024, n'a pas pu être
          sourcée (ameli.fr en 403, page vie-publique vide). Le parti ne propose
          par ailleurs aucun développement de l'assurance santé privée.
        src: [renaissance_convention_economique, attal_president]
        contest: >
          Si le doublement des franchises était confirmé sur source primaire,
          cette cellule vaudrait environ +1 et la position économique de
          Renaissance monterait légèrement. C'est la principale lacune du
          dossier français.
      E3b:
        valeur: 1.5
        just: >
          Le site de campagne revendique la réforme de l'assurance chômage
          engagée par Attal, « permettant de créer 100 000 emplois et
          d'économiser plus de 4 milliards d'euros », empêchée par la
          dissolution, et pose que « l'effort devra d'abord porter sur la
          dépense sociale, qui représente plus de la moitié des dépenses
          publiques ». Le programme 2027 ajoute une « année blanche » gelant les
          prestations sociales et une nouvelle réforme de l'assurance chômage.
          Le groupe a voté contre la suppression du texte de mai 2026 (36
          contre) et pour son adoption (87 pour sur 91).
        src: [attal_president, franceinfo_attal_deficit, renaissance_convention_economique, assnat_scrutins_chomage_2026]
      S1:
        valeur: 0.5
        just: >
          Bilan : la loi du 26 janvier 2024 « pour contrôler l'immigration »,
          portée par le gouvernement puis durcie en commission mixte paritaire,
          adoptée le 19 décembre 2023 par 349 voix contre 186 ; le Conseil
          constitutionnel en censure plus d'un tiers des articles. La convention
          « Une République ferme, une France apaisée » du 26 mai 2025 fixe la
          doctrine : passage « d'une immigration majoritairement familiale et
          subie à une immigration principalement économique et pilotée »,
          admission par points avec quotas votés par le Parlement, durcissement
          du regroupement familial (délai conjoint 18 à 24 mois), allongement de
          la rétention. Mais le même texte pose un intangible : « nous refusons
          la suppression du droit du sol ». 30 députés ont voté CONTRE la
          dénonciation des accords franco-algériens.
        src: [renaissance_convention_regalien, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          Cellule tendue : la loi de 2024 tirerait vers +1, le refus de toucher
          au droit du sol et le vote contre la dénonciation des accords de 1968
          vers 0. +0,5 place Renaissance au niveau de la CAQ — maintien d'un
          flux choisi, durcissement des conditions, pas de coupe quantitative.
      S2:
        valeur: -1.5
        just: >
          La constitutionnalisation de la liberté de recourir à l'IVG est un
          PROJET DE LOI DU GOUVERNEMENT, promulgué le 8 mars 2024 : c'est la
          garantie juridique la plus forte des quatre territoires. 164 députés
          sur 170 pour le 30 janvier 2024, 166 au Congrès, une seule abstention
          et aucun vote contre. La gratuité de la contraception pour les moins
          de 26 ans date de janvier 2022 sous la même majorité.
        src: [assnat_congres_ivg, assnat_scrutin_3289, pe_ice_ma_voix]
        contest: >
          Arbitrage assumé. Le critère « accès garanti et inscrit dans la loi »
          est rempli AU MAXIMUM POSSIBLE — inscription dans la Constitution —
          mais la convention de mai 2025 ne propose aucune extension
          supplémentaire. Un correcteur privilégiant l'acte sur le programme
          mettrait -2, et il ne resterait alors aucun écart entre Renaissance,
          le PS, LFI, le PCF et QS.
      S3:
        valeur: -1
        just: >
          Deux extensions effectives portées par la majorité présidentielle : la
          loi bioéthique ouvrant la PMA à toutes, adoptée le 29 juin 2021 avec
          209 voix pour et 6 contre, et la loi du 31 janvier 2022 interdisant
          les thérapies de conversion, adoptée à l'unanimité. Le 28 mai 2024,
          les sénateurs Renaissance ont voté contre la proposition de loi LR sur
          les mineurs en questionnement de genre (18 contre, 0 pour). Aucune
          extension nouvelle n'est proposée dans les documents du parti.
        src: [assnat_scrutin_3855, assnat_scrutin_4346, senat_scrutin_204]
        contest: >
          Un acquis important mais pas d'agenda d'extension : -1, au niveau du
          PLQ, et non -1,5 comme QS qui porte des revendications trans
          actuelles.
      S4:
        valeur: -1
        just: >
          Le texte procède d'un projet de loi du gouvernement présenté en 2024,
          et la loi a été promulguée par Emmanuel Macron le 18 août 2026. Le
          groupe a soutenu le texte à chaque lecture mais avec une liberté de
          vote assumée et une minorité constante d'opposants : 64 pour / 18
          contre / 9 abstentions en lecture définitive le 15 juillet 2026. Le
          groupe allié Les Démocrates est quasiment coupé en deux.
        src: [assnat_scrutin_8280, assnat_scrutin_5729]
        contest: >
          Un quart du groupe vote contre : -1 plutôt que -1,5 traduit un soutien
          majoritaire mais sans ligne de parti.
      E4:
        valeur: 1.5
        just: >
          Bilan du parti : la réforme du 14 avril 2023 portant l'âge de 62 à
          64 ans et la durée d'assurance à 43 ans en 2027 est son œuvre,
          adoptée par 49.3. Programme d'Attal : « pour augmenter le taux
          d'emploi des seniors, l'enjeu ne sera plus l'âge de départ à la
          retraite, mais LA DURÉE DE COTISATION » — abandon d'un nouveau
          relèvement d'âge au profit d'un allongement de la durée. S'y ajoute
          une « année blanche » de gel des prestations, « en épargnant toutefois
          les petites retraites », et des réformes chiffrées à 120-150 Md€
          d'économies pour un objectif de zéro déficit en 2037.
        src: [attal_president, franceinfo_attal_deficit, assnat_scrutin_2257]
        contest: >
          Renaissance a voté la LFSS 2026 qui SUSPEND sa propre réforme (91 pour
          sur 91). Traité comme un compromis de gouvernement et non comme une
          position, le programme présidentiel d'Attal étant postérieur et
          réaffirmant la ligne d'allongement. Si l'on pondérait davantage le
          vote que le programme, +1 serait soutenable.
      E5:
        valeur: 1.5
        just: >
          Refondation du Code du travail en une « constitution du travail »
          réduite à « quelques articles fondamentaux, le reste relevant des
          branches et des entreprises » — décentralisation de la norme sociale
          vers l'entreprise. Suppression du plafond légal d'heures
          supplémentaires, aujourd'hui de 220 heures par an et par salarié à
          défaut d'accord collectif. Réforme de l'assurance chômage créant
          100 000 emplois et plus de 4 Md€ d'économies. Année blanche sur les
          prestations. AUCUNE hausse du SMIC : la hausse du net passe par la
          baisse des charges salariales. Bilan : ordonnances travail de 2017,
          réformes successives de l'assurance chômage, loi plein emploi de 2023
          conditionnant le RSA à 15 h d'activité.
        src: [attal_president, assnat_scrutins_chomage_2026]
        contest: >
          Attal ouvre son chantier par « notre combat : faire monter les
          salaires », mais les trois leviers qu'il énonce excluent explicitement
          l'instrument légal. La note reflète les mesures nommées, non
          l'objectif affiché.
      E6:
        valeur: 0.5
        just: >
          Position partagée. Côté + : le projet de loi de simplification de la
          vie économique est un texte de gouvernement, et le groupe a
          majoritairement voté la loi Duplomb levant les contraintes à
          l'exercice du métier d'agriculteur (64 pour, 14 contre). Côté − : le
          groupe s'est DIVISÉ sur le texte final portant suppression des ZFE (25
          pour, 30 contre, 19 abstentions) et a voté massivement contre la
          proposition de loi énergie-climat amendée par le RN (90 contre sur
          93). La page « Dette écologique » maintient l'ambition climatique :
          tripler le rythme annuel de réduction des émissions d'ici 2030, de
          1,8 % à 5 % par an.
        src: [attal_president, assnat_scrutins_environnement]
        contest: >
          0 serait défendable : le groupe s'est opposé à deux des trois textes
          déréglementateurs majeurs et le programme réaffirme l'objectif
          climatique. +0,5 retenu parce que la loi de simplification est un
          projet de loi DU GOUVERNEMENT qu'il soutient et que la majorité du
          groupe a voté Duplomb.
      S5:
        valeur: 1.5
        just: >
          Trois strates. Bilan : loi du 24 août 2021 « confortant le respect des
          principes de la République » et interdiction de l'abaya et du qamis à
          l'école, décidée par Attal ministre, en vigueur depuis septembre 2023.
          Programme : la convention de mai 2025 propose « d'interdire le port du
          voile pour les enfants dans l'espace public » en sanctionnant les
          parents, de créer un « délit de contrainte au port du voile » et une
          « loi contre l'entrisme islamiste ». Mais le même texte pose : « nous
          refusons la suppression du droit du sol sur le territoire hexagonal.
          C'est un intangible dans notre parti. » Le 6 septembre 2026, Attal se
          déclare « pas favorable » à l'interdiction générale proposée par le
          RN.
        src: [renaissance_convention_regalien, assnat_rapport_2338, bfmtv_attal_voile, cnews_abaya_2026]
        contest: >
          Deux lectures. À la baisse : refus de supprimer le droit du sol, refus
          de l'interdiction générale, défense de la liberté des femmes majeures.
          À la hausse : l'interdiction de l'abaya est EN VIGUEUR et s'applique à
          toutes les élèves, et l'interdiction proposée pour les moins de 15 ans
          porte sur l'ESPACE PUBLIC, ce que la loi 21 québécoise ne fait pas.
          +1,5 retenu comme point d'équilibre.
      S6:
        valeur: 1
        just: >
          Bilan d'Attal ministre de l'Éducation : uniforme expérimenté, groupes
          de niveau au collège, « choc des savoirs ». Le parti défend
          l'exigence, l'autorité et l'évaluation, sans porter de mesure de
          financement accru du privé ni de récit national explicite.
        src: [cnews_ecole_2026, renaissance_convention_regalien]
        contest: >
          Note construite sur le bilan et la doctrine générale : aucune source
          datée n'a été trouvée sur la position de Renaissance à l'égard du
          programme d'éducation à la vie affective et sexuelle, marqueur pourtant
          central de cet indicateur.
      S7:
        valeur: 1
        just: >
          A fait adopter une loi durcissant la justice des mineurs — dont six
          articles ont été censurés par le Conseil constitutionnel le 19 juin
          2025 — et propose une loi d'urgence de construction de prisons. Le
          groupe a voté le projet de loi sur l'ordre public (84 pour) et la loi
          narcotrafic (73 pour), mais s'est DIVISÉ sur la présomption de
          légitime défense (55 pour, 12 contre).
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          Le périmètre exact des articles censurés le 19 juin 2025 n'a pas pu
          être vérifié sur source primaire : Legifrance renvoie 403 et
          vie-publique.fr bloque les requêtes sans JavaScript. La censure est
          attestée par des titres concordants.
  - name: Horizons
    sigle: Horizons
    label_pos: middle right
    chef: Édouard Philippe
    country: France
    color: "#1F9EC4"
    as_of: "2026-09-17"
    souverainete: europeen_reformiste
    ecologie: reformiste
    estimation_initiale: {economie: 5, societe: 1}
    autorite: null
    resume: >
      Candidat déclaré, ancien Premier ministre. Centre-droit : réduction de la
      dépense publique, recul de l'âge de départ à la retraite, fermeté sur la
      sécurité et l'immigration, pro-européen.
    indicateurs:
      E1:
        valeur: 1
        just: >
          Doctrine posée au meeting du 5 juillet 2026 : rétablir les comptes
          « en baissant la dépense plutôt qu'en augmentant les impôts », « je ne
          taxerai pas davantage les entreprises qui payent déjà trop d'impôts »,
          et, visant la taxe Zucman, « aux catégories les plus aisées, on n'a pas
          besoin de réinventer des impôts idiots ». Mesure chiffrée : un « deal
          fiscal » de 50 Md€ de baisse d'impôts de production contre 50 Md€ de
          baisse d'aides publiques.
        src: [horizons_meeting_adidas, horizons_conseil_reims]
        contest: >
          +1,5 serait défendable au vu de la ligne « pas de hausse d'impôts ».
          Le +1 tient à ce que le deal fiscal est budgétairement NEUTRE — ce
          n'est pas une baisse nette — et que Philippe assume deux hausses
          ciblées : suppression de niches et « j'assume de dire aux retraites
          qu'il faudra contribuer davantage ».
      E2:
        valeur: 1.5
        just: >
          Le Manifeste pose comme principe fondateur « un État moins dispendieux
          et recentré sur ses missions essentielles » et range parmi ce que le
          parti combat « l'illusion de l'argent public magique ». Le discours du
          5 juillet 2026 précise : « il faut baisser les dépenses sociales » ;
          « à l'État, à ses agences, aux collectivités [...] qu'ils se serrent la
          ceinture » ; transformer l'État par l'IA « pour avoir moins d'agents
          bloqués derrière un bureau ». Objectif : déficit à 2 % du PIB en 2032,
          contre environ 5 % aujourd'hui.
        src: [horizons_manifeste, horizons_meeting_adidas, franceinfo_attal_deficit]
        contest: >
          Aucun objectif chiffré d'effectifs de la fonction publique ni aucun
          programme de privatisation publié, ce qui interdit d'aller au-delà.
      E3a:
        valeur: -0.5
        just: >
          Seul volet où Philippe ne propose aucun retrait public : « nous
          devrons investir massivement dans notre système de santé, POUR
          GARANTIR SON ACCÈS À TOUS », avec formation de médecins, prévention et
          recours à l'intelligence artificielle. Le pôle Idées a publié une note
          « L'accès aux soins en France », dont seul le titre est public.
        src: [horizons_meeting_adidas, horizons_notes]
        contest: >
          Note fondée sur des déclarations et un titre de publication, le texte
          des notes d'Horizons étant réservé aux adhérents. C'est la cellule la
          moins documentée des partis de gouvernement français.
      E3b:
        valeur: 1.5
        just: >
          « Il faut baisser les dépenses sociales, supprimer les niches
          fiscales, avant de songer à augmenter les impôts de ceux qui
          travaillent » ; « nous nous mentons lorsque nous pensons qu'il serait
          juste de défendre l'actuel modèle social alors qu'il fait peser sur
          des jeunes actifs de moins en moins nombreux le poids de dépenses
          sociales de plus en plus lourdes ». Le pôle Idées a publié une note
          « Vers une société du travail : pour une assurance chômage qui
          favorise l'emploi ». Le groupe a voté contre la suppression du texte
          de mai 2026 (16 contre) et pour son adoption (30 pour sur 34).
        src: [horizons_meeting_adidas, horizons_notes, assnat_scrutins_chomage_2026]
      S1:
        valeur: 1
        just: >
          Horizons vote plus à droite que Renaissance sur le régalien
          migratoire : 32 des 33 députés pour la restriction de l'accès à la
          nationalité à Mayotte, 17 POUR la dénonciation des accords
          franco-algériens de 1968 là où Renaissance vote contre, et contre le
          renouvellement automatique des titres de séjour de longue durée.
          Philippe avait proposé dès 2023 de remettre en cause l'accord de 1968.
          Il refuse en revanche le moratoire général sur l'immigration légale :
          « nous allons continuer à délivrer des titres de séjour pour des
          étudiants étrangers et pour les étrangers qui ont des compétences dont
          nous avons besoin ».
        src: [assnat_scrutin_3260, assnat_scrutin_1308, wikipedia_philippe]
        contest: >
          Aucun document programmatique d'Horizons sur l'immigration n'a été
          trouvé : la note repose sur des scrutins de groupe et des déclarations
          du chef.
      S2:
        valeur: -1
        just: >
          26 députés sur 28 pour la constitutionnalisation le 30 janvier 2024 et
          28 sur 29 au Congrès, aucun vote contre ; deux parlementaires ne sont
          pas venus voter au Congrès. Les eurodéputés Horizons ont voté pour la
          résolution du 17 décembre 2025. Aucune proposition d'extension ni de
          restriction n'a été trouvée dans les publications du parti.
        src: [assnat_congres_ivg, pe_ice_ma_voix]
        contest: >
          Soutien au statu quo constitutionnalisé, sans programme propre : -1
          traduit un alignement sans engagement, comme le PLQ.
      S3:
        valeur: -0.5
        just: >
          Trace la plus mince du tableau français. Les 22 députés votants ont
          approuvé le 6 mars 2024 la proposition de loi portant reconnaissance
          et réparation des préjudices subis par les personnes condamnées pour
          homosexualité entre 1942 et 1982. Philippe était Premier ministre
          quand son gouvernement a déposé et fait adopter en première lecture le
          projet de loi bioéthique ouvrant la PMA à toutes, et déclaré avoir
          « évolué sur cette question » après une tribune contre en 2013.
        src: [assnat_scrutin_3436, assnat_scrutin_2146, wikipedia_philippe]
        contest: >
          Le scrutin du 6 mars 2024 a été consensuel — tous les groupes pour, RN
          compris — donc il discrimine mal. Hésitation avec `absent` ; -0,5
          retenu parce qu'un vote enregistré et une action gouvernementale
          existent. À re-sourcer en priorité si Horizons publie son programme.
      S4:
        valeur: 0
        just: >
          Le seul groupe de l'Assemblée durablement partagé, avec une majorité
          qui bascule CONTRE à partir de la deuxième lecture : 14 pour / 13
          contre / 6 abstentions le 27 mai 2025, puis 14 pour / 18 contre le
          25 février 2026, et 16 pour / 18 contre / 1 abstention en lecture
          définitive le 15 juillet 2026. Aucune consigne de vote ni position de
          parti publiée.
        src: [assnat_scrutin_8280, assnat_scrutin_2107]
        contest: >
          Le 0 n'est pas ici un défaut de source mais une division mesurée et
          stable : 16 contre 18 sur quatre scrutins. C'est une position, pas une
          absence.
      E4:
        valeur: 2
        just: >
          Position la plus à droite des huit, cochant les trois critères du pôle
          +2. Programme : « garantir l'équilibre de notre système de retraites
          [...] TRAVAILLER PLUS tout en prenant en compte la diversité des
          carrières, CRÉER UN PILIER DE CAPITALISATION À 10-15 % DES PENSIONS
          d'ici quinze ans, confier la gestion du régime à l'équilibre aux
          partenaires sociaux. » Discours du 5 juillet 2026 : « j'assume de dire
          aux RETRAITES QU'IL FAUDRA CONTRIBUER DAVANTAGE au financement de
          notre système social. J'assume de dire aux cadres et aux employés [...]
          qu'il faudra TRAVAILLER PLUS LONGTEMPS. » Il y dénonce la suspension
          comme un renoncement.
        src: [philippe_priorites, horizons_meeting_adidas, assnat_scrutin_2257]
        contest: >
          Horizons est le seul des huit à proposer explicitement un pilier de
          capitalisation chiffré, et le seul à demander une contribution accrue
          des retraites eux-mêmes. Le +2 est solidement établi et définit la
          borne pour l'ensemble du compas, l'ancrage québécois étant quasi nul
          sur cet indicateur.
      E5:
        valeur: 1.5
        just: >
          Bilan : les ordonnances travail de septembre 2017 (fusion des
          instances en CSE, plafonnement des indemnités prud'homales, primauté
          de l'accord d'entreprise) et la réforme de l'assurance chômage de 2019
          ont été prises sous son gouvernement. Discours du 5 juillet 2026 :
          « il faut reprendre la politique de l'offre interrompue en 2020 » ;
          « plus de liberté pour les partenaires sociaux [...] pour les laisser
          discuter au sein de l'entreprise des règles et des façons de
          produire » — poursuite de l'inversion de la hiérarchie des normes.
          Hausse du net par transfert de financement, pas par le SMIC.
        src: [horizons_meeting_adidas, philippe_priorites, assnat_scrutins_chomage_2026]
        contest: >
          Le programme d'Édouard Philippe est nettement plus développé sur les
          retraites et la fiscalité que sur le marché du travail proprement
          dit : la note s'appuie largement sur le bilan et sur le discours
          plutôt que sur des mesures programmatiques nommées.
      E6:
        valeur: 1.5
        just: >
          Engagement déréglementateur le plus général et le plus explicite du
          panel : « sceller un MORATOIRE NORMATIF ET FISCAL : pas de nouvelle
          norme et de nouvel impôt sur le quinquennat ». S'y ajoutent la
          privatisation d'agences et d'opérateurs de l'État, « zéro
          surtransposition agricole » et l'inscription du développement agricole
          dans la Charte de l'environnement — soit un contrepoids
          constitutionnel à la protection de l'environnement. Votes : 32 pour la
          loi de simplification portant suppression des ZFE, 26 pour la loi
          Duplomb.
        src: [philippe_priorites, assnat_scrutins_environnement]
        contest: >
          Le vote contre la proposition de loi énergie-climat du RN (34 contre)
          montre qu'Horizons ne suit pas la déréglementation quand elle
          s'accompagne d'un moratoire sur les renouvelables : Philippe
          déréglemente la procédure, pas la trajectoire climatique. C'est ce qui
          le maintient à +1,5.
      S5:
        valeur: 0.5
        just: >
          Le 6 septembre 2026 à Alès, Philippe a jugé la proposition de LFI sur
          l'abaya « une trahison de la laïcité » et défend la loi de 2004 comme
          « une bonne loi, bien appliquée ». Mais en commission le 14 janvier
          2026, Agnès Firmin Le Bodo a rejeté la proposition de loi sur le
          voilement des mineures comme « à la fois inconstitutionnelle et
          inapplicable », rappelant que la laïcité « ne saurait imposer une
          restriction générale à l'expression des convictions religieuses dans
          l'espace public ».
        src: [cnews_abaya_2026, assnat_rapport_2338, assnat_scrutin_1308]
        contest: >
          Position en tension : défense intransigeante du périmètre scolaire,
          refus explicite d'étendre la neutralité à l'espace public. C'est la
          position « laïcité de l'État, pas de l'espace public » — d'où +0,5.
      S6:
        valeur: 0.5
        just: >
          Le 24 août 2026, Philippe a annoncé une hausse de 20 % de la
          rémunération moyenne des enseignants sur cinq ans. Son projet repose
          sur l'AUTONOMIE DES ÉTABLISSEMENTS : possibilité d'adapter méthodes et
          horaires, d'imposer l'uniforme, de fixer les règles de discipline, de
          choisir et évaluer les enseignants, en contrepartie de la publication
          de leurs résultats. Il propose une « amende de responsabilisation
          scolaire, sur le modèle de ce qui existe au Royaume-Uni » pour les
          parents d'enfants harceleurs ou absentéistes.
        src: [cnews_ecole_2026, horizons_manifeste]
        contest: >
          Agenda d'autonomie et de quasi-marché, sans volet financement du privé
          ni récit national : c'est le mécanisme du pôle +, pas son contenu
          identitaire. Base doctrinale mince, les notes du pôle Idées ne
          traitant l'école que par le métier d'enseignant et l'orientation.
      S7:
        valeur: 1.5
        just: >
          Le groupe a voté la présomption de légitime défense pour les forces de
          l'ordre (31 pour), le projet de loi « réponses immédiates aux
          phénomènes troublant l'ordre public » (32 pour) et la loi narcotrafic
          (33 pour) — alignement complet sur les trois textes de durcissement
          pénal de la législature.
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
  - name: Les Républicains
    sigle: LR
    label_pos: middle right
    chef: Bruno Retailleau
    country: France
    color: "#0066CC"
    as_of: "2026-09-17"
    souverainete: europeen_reformiste
    ecologie: productiviste
    estimation_initiale: {economie: 5, societe: 6}
    autorite: null
    resume: >
      Retailleau, ancien ministre de l'Intérieur, a été désigné par les
      adhérents. Réduction de la dépense publique et des impôts, forte baisse de
      l'immigration, fermeté pénale, défense des valeurs traditionnelles.
    indicateurs:
      E1:
        valeur: 1.5
        just: >
          La brochure « Le travail gagnant » (janvier 2026) engage à « redonner
          au moins 30 milliards d'euros aux salariés et aux entreprises », via un
          seuil « zéro cotisation » exonérant les heures au-delà de 1 623 h/an.
          Sur le capital, Retailleau le 26 août 2026 : « je ne serai pas le
          président qui augmentera les droits de succession mais celui qui les
          baissera » ; 150 000 € de donation par parent et par enfant de moins
          de 30 ans sans impôt pendant trois ans ; exonération totale de
          succession pour les entreprises familiales.
        src: [lr_travail_gagnant, lr_retailleau_successions, lr_nos_propositions]
        contest: >
          Un +2 est très défendable : LR coche point par point la définition de
          la borne. Le +1,5 tient à ce que l'effort principal porte sur les
          COTISATIONS SOCIALES et non sur l'impôt, et à ce que Reconquête assume
          une baisse plus large financée par des coupes d'un ordre de grandeur
          supérieur.
      E2:
        valeur: 1.5
        just: >
          Retailleau dénonce « l'État vorace qui dévore plus de la moitié de la
          richesse produite » et pose que l'État « est pauvre parce qu'il dépense
          trop ». Le programme annonce « réduire franchement les prélèvements
          obligatoires », « reprendre la main sur l'État et ses agences »,
          supprimer « les 50 règles qui paralysent le plus nos entreprises » et
          refonder le code du travail sur 50 principes. La brochure chiffre
          13 Md€/an d'économies sur l'assurance chômage et 4 Md€ sur le compte
          social unique et la fraude.
        src: [lr_retailleau_successions, lr_nos_propositions, lr_travail_gagnant]
        contest: >
          LACUNE À COMBLER : aucun objectif chiffré de réduction des effectifs de
          la fonction publique ni de la dépense publique globale n'a été trouvé
          dans les documents publiés par LR, contrairement à Renaissance
          (100 000 postes), alors que LR en avait un en 2022. Le livret
          « Produire plus » de février 2026 n'a pas pu être téléchargé et
          pourrait contenir ce chiffrage. Note à revalider.
      E3a:
        valeur: 0.5
        just: >
          LR juge que l'extension des cotisations « à des politiques de
          solidarité nationale a brouillé leur finalité » et veut sortir du coût
          du travail les dépenses bénéficiant à toute la population « COMME LA
          SANTÉ », c'est-à-dire basculer le financement de l'assurance maladie
          hors cotisations. Aucune assurance santé privée duplicative n'est
          proposée.
        src: [lr_travail_gagnant, lr_retailleau_successions]
        contest: >
          +0,5 et non davantage : c'est un changement d'ARCHITECTURE DE
          FINANCEMENT, non une ouverture au privé. C'est ce qui distingue LR du
          PCQ, qui met fin au monopole de l'assurance maladie publique.
      E3b:
        valeur: 2
        just: >
          Le chapitre le plus abouti du corpus LR. Mise en œuvre des règles de
          juin 2024 jamais appliquées — réduction de la durée maximale
          d'indemnisation, contracyclicité, renforcement des obligations de
          recherche —, complétée par trois leviers : limiter à six mois et
          plafonner l'indemnisation des ruptures conventionnelles, aligner
          l'indemnisation des frontaliers sur des salaires français, plafonner
          et RENDRE DÉGRESSIVE l'allocation des salariés alternant emploi et
          chômage, soit environ 13 Md€ d'économies par an. Compte social unique
          plafonnant le cumul des aides non contributives à 70 % du SMIC net par
          adulte. Retailleau : « l'allocation chômage doit être un filet de
          sécurité, pas un choix de vie ».
        src: [lr_travail_gagnant, lr_retailleau_successions, assnat_scrutins_chomage_2026]
        contest: >
          LR occupe seul la borne +2 sur ce volet : aucune force des quatre
          territoires ne propose un resserrement de l'assurance chômage plus
          poussé. Aux États-Unis l'indemnisation est administrée par les États et
          aucune position fédérale républicaine n'a été établie, ce qui laisse
          la borne libre pour la France.
      S1:
        valeur: 1.5
        just: >
          Le 1er juillet 2026, Retailleau annonce que la SUPPRESSION DU DROIT DU
          SOL et la restriction du regroupement familial seront les mesures
          majeures de sa politique migratoire. Comme ministre de l'Intérieur
          (septembre 2024 - septembre 2025) il a voulu rétablir le délit de
          séjour irrégulier, réformer l'AME, porter la rétention administrative
          de 90 à 210 jours pour les étrangers « dangereux », et a mis fin à la
          circulaire Valls sur les régularisations. Au Sénat, le groupe a voté à
          127 voix pour la version durcie du projet de loi immigration le
          14 novembre 2023. À l'Assemblée, 47 députés sur 48 pour la loi Mayotte
          et 26 pour la dénonciation des accords de 1968.
        src: [wikipedia_retailleau, senat_scrutin_43, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          LR ne propose pas de coupe quantitative globale du type PQ ; sa
          radicalité porte sur l'ACCÈS À LA NATIONALITÉ et le regroupement
          familial. +1,5 laisse la place au RN et à Reconquête.
      S2:
        valeur: 0.5
        just: >
          Groupe le plus divisé du Parlement : 40 pour / 15 contre / 4
          abstentions à l'Assemblée le 30 janvier 2024 ; 72 pour / 41 contre /
          13 abstentions au Sénat le 28 février 2024. VÉRIFIÉ NOMINATIVEMENT :
          Bruno Retailleau figure dans la liste des « Contre » du scrutin
          sénatorial et du Congrès, jugeant la mesure « superfétatoire ». Il
          s'était déjà opposé en 2016 à la proposition de loi sur le délit
          d'entrave numérique à l'IVG. Aucune proposition LR de restriction de
          l'accès à l'IVG n'a été trouvée.
        src: [senat_scrutin_136, assnat_congres_ivg, wikipedia_retailleau]
        contest: >
          Écart parti/chef majeur et documenté : la majorité des parlementaires
          LR a voté pour, leur président et candidat a voté contre. Le parti est
          noté tel qu'il est porté en 2027, en signalant que le groupe penche de
          l'autre côté. C'est la note la plus haute des quatre territoires hors
          États-Unis.
      S3:
        valeur: 1.5
        just: >
          Le 28 mai 2024, le Sénat adopte 180-136 la proposition de loi portée
          par la sénatrice LR Jacqueline Eustache-Brinio sur les mineurs en
          questionnement de genre ; LE GROUPE LR LA VOTE À 131 VOIX POUR ET 0
          CONTRE, unanimité parfaite. Le rapport sénatorial de mars 2024
          préconise pour les mineurs l'interdiction des bloqueurs de puberté,
          des hormones croisées ET de la chirurgie de réassignation ; la
          Défenseure des droits a rendu un avis d'inquiétude le 6 mai 2024. En
          2021, 77 députés LR sur 105 ont voté contre la PMA pour toutes.
        src: [senat_scrutin_204, wikipedia_mineur_transgenre, assnat_scrutin_3855]
        contest: >
          Dépasse le PCQ sur l'item médical : le PCQ interdit les mastectomies
          et exige le consentement parental pour les bloqueurs, LR interdit
          purement et simplement bloqueurs, hormones croisées et chirurgie —
          d'où le passage du PCQ à +1. LR n'a en revanche ni interdiction
          d'enseignement, ni retrait d'ouvrages, ni restriction visant les
          adultes : le +2 reste à la droite américaine. L'opposition au mariage
          pour tous est une position de Retailleau, LR n'ayant plus d'abrogation
          à son programme.
      S4:
        valeur: 1.5
        just: >
          Le groupe vote contre à chaque lecture : 5 pour / 41 contre / 2
          abstentions le 15 juillet 2026. Surtout, le 7 juillet 2026, 126 des
          131 sénateurs LR ont voté la question préalable présentée au nom de la
          commission des affaires sociales, motion adoptée 169-164 qui a fait
          rejeter le texte en nouvelle lecture sans examen. C'est le président
          du Sénat, Gérard Larcher (LR), qui a ensuite déféré la loi au Conseil
          constitutionnel le 16 juillet 2026.
        src: [senat_scrutin_328, assnat_scrutin_8280]
        contest: >
          PIÈGE DE LECTURE : le scrutin sénatorial du 28 janvier 2026 affiche
          82 sénateurs LR « pour », mais il porte sur le texte tel que réécrit
          par la commission, que la gauche a rejeté en bloc. Ne pas le citer
          comme un soutien LR à l'aide à mourir. Pas de +2 : LR n'a pas proposé
          d'abroger la loi promulguée.
      E4:
        valeur: 1.5
        just: >
          Position constante de rétablissement des 64 ans, portée par le
          Sénat : « le Sénat rétablira la réforme des retraites. Nous la votons
          depuis cinq ans. Son abandon, c'est 30 milliards de déficit en 2035 »
          (Gérard Larcher, 27 octobre 2025). Le parti qualifie la suspension de
          « retour du rêve socialiste des années Mitterrand ». Le livret Le
          travail gagnant ne propose aucun nouveau relèvement d'âge mais deux
          dispositifs d'allongement de la vie active : un seuil « zéro
          cotisation senior anticipé » et un cumul emploi-retraite rénové,
          justifiés par le constat que « seuls 36 % des 60-64 ans sont en emploi
          contre 60 % en moyenne » ailleurs.
        src: [lr_larcher_retraites, lr_travail_gagnant, assnat_scrutin_2257]
        contest: >
          Aucune proposition de report au-delà de 64 ans ni de pilier de
          capitalisation pour 2027 n'a été trouvée chez LR, ce qui les distingue
          nettement d'Horizons et interdit de les monter à +2. Le groupe s'est
          majoritairement abstenu sur la LFSS 2026.
      E5:
        valeur: 1.5
        just: >
          Le livret Le travail gagnant est le document le plus quantifié du
          panel. Assurance chômage : mise en œuvre des règles de juin 2024
          jamais appliquées, puis trois leviers supplémentaires — limiter à six
          mois et plafonner l'indemnisation des ruptures conventionnelles,
          aligner l'indemnisation des frontaliers sur des salaires français,
          plafonner et rendre dégressive l'allocation des salariés alternant
          emploi et chômage — pour environ 13 Md€ d'économies par an. Compte
          social unique : « hors situations de dépendance ou de handicap, le
          total des aides ne devrait jamais dépasser 70 % du SMIC net par
          adulte ». Aucune hausse du SMIC.
        src: [lr_travail_gagnant, lr_retailleau_successions, assnat_scrutins_chomage_2026]
        contest: >
          LR n'attaque ni le SMIC comme institution ni le financement syndical :
          il reste sous le +2 défini par le right-to-work américain. Égalité
          avec Renaissance par des leviers différents — LR sur l'indemnisation
          et les aides, Renaissance sur le Code du travail lui-même.
      E6:
        valeur: 1.5
        just: >
          LR est co-auteur de la suppression des ZFE : le 26 mars 2025, la
          commission spéciale de l'Assemblée a adopté deux amendements
          identiques des groupes LR et RN les supprimant, disposition maintenue
          jusqu'à l'adoption définitive du 14 avril 2026 avant censure par le
          Conseil constitutionnel pour cavalier législatif. Votes : 43 pour la
          loi de simplification, 47 sur 48 pour la loi Duplomb. Doctrine : le
          décrochage industriel résulte de « choix politiques ayant privilégié
          la dépense publique et LA NORME au détriment de la production » ;
          Retailleau impute la crise du logement aux freins à la construction,
          « à commencer par le ZAN ».
        src: [lr_nos_propositions, lr_retailleau_successions, assnat_scrutins_environnement]
        contest: >
          LR a un livret Électricité de mai 2026 qui n'a pas été dépouillé et
          pourrait contenir des éléments d'encadrement tarifaire susceptibles de
          faire baisser la note.
      S5:
        valeur: 1.5
        just: >
          Le 6 septembre 2026, Retailleau répond « absolument » à la question de
          savoir s'il interdirait le voile À L'UNIVERSITÉ, se dit favorable à
          l'interdiction lors des sorties scolaires, dans le sport et pour les
          mineures, et confirme vouloir inscrire la « TRADITION JUDÉO-CHRÉTIENNE »
          de la France dans le bloc constitutionnel via une charte de l'ordre
          républicain. Le 8 septembre il annonce la suppression du droit du sol
          par référendum. Il pose le lien immigration-assimilation : « plus vous
          accueillez, moins vous assimilez, moins vous intégrez ». Il rejette en
          revanche l'interdiction générale dans l'espace public comme
          « démagogique » et « inapplicable » (« il faudrait aussi interdire la
          kippa »).
        src: [aa_retailleau_voile, cnews_retailleau_interview, lr_programme_ecole, assnat_scrutin_1308]
        contest: >
          Dépasse tout parti québécois sur deux points : interdire le voile à
          l'université restreint des USAGÈRES ADULTES d'un service public, ce
          que la loi 21 ne fait pas, et inscrire une « tradition
          judéo-chrétienne » dans le bloc constitutionnel installe une culture
          de référence confessionnelle, ce que la loi 21 refuse explicitement au
          nom de la laïcité. C'est ce dépassement qui a imposé de ramener la CAQ
          et le PQ de +2 à +1.
      S6:
        valeur: 1.5
        just: >
          Le livret École de septembre 2026 supprime un PLAFOND NATIONAL bornant
          à 20 % les moyens publics alloués à l'enseignement privé, crée 1 000
          établissements publics disposant d'une « totale liberté dans le
          recrutement des professeurs et des élèves », instaure un examen
          d'entrée en sixième, recentre le primaire sur « l'histoire et la
          géographie de la France » et étend « la neutralité de la loi de 2004
          aux accompagnateurs des sorties scolaires ».
        src: [lr_programme_ecole, cnews_ecole_2026]
        contest: >
          RAMENÉ DE +2 À +1,5 après notation des États-Unis. LR agit sur un
          financement du privé EXISTANT ; le Parti républicain a CRÉÉ le premier
          crédit d'impôt fédéral pour bourses scolaires de l'histoire
          américaine, sans plafond global de dons. LR inscrit une tradition dans
          la Constitution ; les républicains ont rétabli par décret une
          commission d'État du récit national et quatre législatures imposent
          l'affichage du Décalogue dans CHAQUE salle de classe publique, validé
          en appel fédéral. LR n'a enfin aucun équivalent des 6 870 retraits
          d'ouvrages scolaires recensés en 2024-2025.
      S7:
        valeur: 1.5
        just: >
          Programme de démantèlement du régime d'exécution des peines annoncé en
          septembre 2026 : suppression du juge d'application des peines, de la
          loi Taubira et de tous les aménagements de peine, majorité pénale
          abaissée à 15 ans, peines minimales, prisons privées. Le groupe a voté
          l'ensemble des textes de durcissement : présomption de légitime défense
          (48 pour), projet de loi sur l'ordre public (46 pour), loi narcotrafic
          (38 pour).
        src: [cnews_retailleau_interview, assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          RAMENÉ DE +2 À +1,5 après notation des États-Unis. L'hypothèse posée
          à l'époque — que le socle américain serait « du même ordre de
          grandeur » — est INFIRMÉE sur pièces : décret du 20 janvier 2025
          rendant la poursuite capitale OBLIGATOIRE dans deux catégories de cas
          et ordonnant de faire renverser les précédents constitutionnels qui la
          limitent ; Garde nationale déployée à Washington, Los Angeles,
          Portland et Chicago ; éloignements sans audience constatés par la Cour
          suprême. Le programme de Retailleau, si sévère soit-il, reste À
          L'INTÉRIEUR DE LA PROCÉDURE PÉNALE ORDINAIRE : il durcit les peines et
          supprime les aménagements, il ne rétablit pas la peine de mort, ne
          mobilise pas l'armée et ne supprime pas le procès. Écart estimé : un
          point. Réserve : la réforme pénale de Retailleau n'existe à ce jour
          que sous forme de déclarations télévisées, LR n'ayant publié aucun
          livret justice.
  - name: Rassemblement national
    sigle: RN
    label_pos: middle left
    chef: Marine Le Pen
    country: France
    color: "#0D2A5C"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: -1, societe: 6}
    autorite: null
    resume: >
      Le Pen est candidate déclarée depuis juillet 2026 malgré sa condamnation
      en appel dans l'affaire des assistants parlementaires ; pourvoi en
      cassation en cours. Économie protectionniste et sociale : opposition au
      report de l'âge de la retraite, baisse de la TVA sur l'énergie. Priorité
      nationale, référendum sur l'immigration, fermeté pénale. Le
      protectionnisme relève de l'attribut souveraineté, non de l'axe
      économique.
    indicateurs:
      E1:
        valeur: 0.5
        just: >
          Le contre-budget 2026 affiche -45 Md€ de baisses d'impôts contre
          +31 Md€ de recettes nouvelles, soit un solde de -20 Md€. Côté baisses :
          TVA sur les énergies (10,96 Md€), suppression de la TVA sur 100
          produits de première nécessité (3,5), impôts de production (16,2),
          taxe sur les mutuelles (1,02). Mais le RN crée simultanément une
          fiscalité du capital : impôt sur la fortune financière (+4 Md€), taxe
          sur les rachats d'actions (+8,4), sur les transactions financières
          intra-journalières (+3), sur les superdividendes (+1,3).
        src: [rn_contre_budget_2026, rn_programme_2024]
        contest: >
          Note la plus arbitrée. Sur le niveau global le RN est du côté « + » ;
          sur la fiscalité du capital il est du côté « − », étant le seul parti
          de droite français à proposer un impôt sur la fortune. Les deux bornes
          de l'indicateur étant construites sur ces deux dimensions, +0,5 est le
          solde. Les droits de douane n'entrent pas ici, conformément à la
          règle sur le protectionnisme.
      E2:
        valeur: 1
        just: >
          Le contre-budget 2026 affiche -57 Md€ de baisses de dépenses contre
          +7 Md€ de dépenses nouvelles : contribution à l'UE (8,7), agences et
          opérateurs (7,7), tarifs de rachat des énergies intermittentes (7,2),
          DGF des régions et EPCI (5). Le programme de 2024 ajoute la
          privatisation de l'audiovisuel public et la suppression des ARS.
          Contrepoids réels : renationalisation des autoroutes pour baisser les
          péages de 15 %, et 0,496 Md€ pour une golden share dans ATOS, Arcelor
          et Opella. Aucune suppression de postes de fonctionnaires n'est
          annoncée.
        src: [rn_contre_budget_2026, rn_programme_2024, rn_mlafrance_2022]
        contest: >
          Solde d'économies réel mais modeste — environ 3 % de la dépense
          publique française — et absence de tout objectif d'effectifs, corrigé
          à la baisse par une renationalisation et des prises de participation.
      E3a:
        valeur: -1
        just: >
          Suppression de la taxe sur les mutuelles (1,02 Md€ de moindres
          recettes), extension de la protection sociale complémentaire aux
          agents de la fonction publique hospitalière (0,46 Md€), plan d'urgence
          santé de 20 Md€ au programme de 2022. Le RN ne propose AUCUNE
          assurance privée duplicative ni aucune privatisation de l'assurance
          maladie.
        src: [rn_contre_budget_2026, rn_programme_2024, rn_mlafrance_2022]
        contest: >
          Les mesures de resserrement fondées sur la NATIONALITÉ — remplacement
          de l'AME par une aide d'urgence, suppression du visa pour soins,
          contrôle de l'éligibilité à l'ALD — sont portées par S5 et non ici,
          conformément à la règle du compas sur l'accès différencié selon la
          nationalité.
      E3b:
        valeur: 0
        just: >
          Position contradictoire, soldée à zéro. Côté extension : le programme
          de 2024 prévoit l'« annulation de la réforme de l'assurance chômage de
          juillet 2024 » par décret, et le contre-budget 2026 dégèle les
          prestations (+3,61 Md€). Côté resserrement : le groupe a voté CONTRE
          la suppression du projet de loi de mai 2026 (53 contre) puis POUR son
          adoption (115 pour sur 122), texte qui réduit la durée d'indemnisation
          après rupture conventionnelle de 18 à 15 mois.
        src: [rn_programme_2024, rn_contre_budget_2026, assnat_scrutins_chomage_2026]
        contest: >
          Zéro mesure, non zéro par défaut : le programme abroge une réforme
          pendant que les votes en soutiennent une autre. C'est le même
          « double RN » que sur les autres indicateurs économiques.
      S1:
        valeur: 2
        just: >
          Le programme des législatives de juin 2024 prévoit pour les premières
          semaines : SUPPRESSION DU DROIT DU SOL, SUSPENSION DE TOUTES LES
          RÉGULARISATIONS de clandestins par les préfets, retour du délit de
          séjour irrégulier, remplacement de l'AME par une aide d'urgence
          vitale, restriction du regroupement familial ; puis obligation de
          déposer les demandes d'asile dans les ambassades et consulats, libre
          circulation Schengen réservée aux seuls ressortissants européens, et
          priorité nationale constitutionnalisée par référendum. Le RN a voté la
          loi immigration de décembre 2023 (« victoire idéologique », Le Pen),
          puis 122 voix pour la loi Mayotte et 122 pour la dénonciation des
          accords de 1968.
        src: [rn_programme_2024, assnat_scrutin_1308, assnat_scrutin_3260, wikipedia_lepen]
        contest: >
          Le RN DÉPASSE le +2 québécois : sur une échelle non plafonnée il
          serait à environ +2,5. C'est ce dépassement qui a imposé de ramener le
          PQ et le PCQ de +2 à +1,5. La note reste comprimée à +2 par le
          plafond, ce qui écrase la distance réelle avec LR.
      S2:
        valeur: 0.5
        just: >
          Évolution nette et datée. En novembre 2022, le groupe vote le plus
          massivement contre la proposition de loi constitutionnelle. Le
          30 janvier 2024 il se fracture : 46 pour, 12 contre, 14 abstentions ;
          au Congrès du 4 mars 2024, 46 pour, 11 contre, 20 abstentions, et
          MARINE LE PEN FIGURE NOMINATIVEMENT DANS LA LISTE DES « POUR ». Mais
          la ligne de fond reste restrictive : opposition en janvier 2022 à
          l'allongement du délai de 12 à 14 semaines (« dérive purement
          idéologique »). Le 17 décembre 2025, les 28 eurodéputés RN présents se
          sont abstenus en bloc, sans une seule voix pour.
        src: [assnat_congres_ivg, assnat_scrutin_629, pe_ice_ma_voix]
        contest: >
          Ne pas confondre le vote personnel de Le Pen (pour) avec la position
          du parti : l'abstention unanime de la délégation européenne en
          décembre 2025 est le signal de ligne le plus récent et le plus
          homogène. C'est lui qui fonde le +0,5.
      S3:
        valeur: 1
        just: >
          Les députés se sont opposés à l'unanimité, en deuxième lecture en
          2021, au projet de loi bioéthique ouvrant la PMA à toutes. En 2024 le
          groupe a déposé une proposition de loi « visant à protéger les mineurs
          contre certaines pratiques médicales et chirurgicales en matière de
          transition de genre ». Le RN s'est opposé au PACS puis au mariage pour
          tous ; Le Pen promettait en 2017 d'abroger la loi Taubira mais y a
          renoncé pour 2022.
        src: [wikipedia_rn_lgbt, wikipedia_lepen, assnat_scrutin_3436]
        contest: >
          Contrepoids réel : le RN a voté la loi de réparation des condamnations
          pour homosexualité de mars 2024 et pratique depuis dix ans une
          stratégie d'ouverture aux électeurs homosexuels. Sa proposition de loi
          de 2024 sur les mineurs trans n'a jamais été inscrite à l'ordre du
          jour, là où celle de LR a été adoptée par le Sénat : d'où +1 contre
          +1,5 pour LR. Sourcage de rang 5 pour l'essentiel.
      S4:
        valeur: 1.5
        just: >
          Opposition massive et croissante sur quatre lectures : 19 pour / 101
          contre le 27 mai 2025, puis 12 pour / 106 contre en lecture définitive
          le 15 juillet 2026, sur 122 membres — soit 87 % du groupe contre, la
          position la plus homogène de l'Assemblée après celle de l'UDR.
        src: [assnat_scrutin_8280, assnat_scrutin_2107]
        contest: >
          Le durcissement entre mai 2025 (19 pour) et juillet 2026 (12 pour) est
          net. Le +2 est réservé à une position d'abrogation de la loi
          promulguée, que le RN n'a pas formulée à ce jour.
      E4:
        valeur: -1.5
        just: >
          Programme des législatives de juin 2024 : « abroger la réforme des
          retraites de Macron et mettre en place un système de retraites
          progressif ». Le manifeste présidentiel de 2022 le chiffre : départ à
          60 ans avec 40 annuités pour ceux ayant commencé avant 20 ans, âge et
          durée modulés selon l'âge d'entrée pour les autres — donc pas 60 ans
          pour tous, contrairement à LFI et au PCF. Le contre-budget 2026
          inscrit 1,5 Md€ pour le lancement de la réforme et 3,61 Md€ pour
          l'indexation des retraites et le dégel des prestations. Votes : 118
          pour sur 125 la proposition de loi RN d'annulation des réformes d'âge.
        src: [rn_programme_2024, rn_contre_budget_2026, rn_mlafrance_2022, assnat_scrutin_2257]
        contest: >
          Pas de programme présidentiel 2027 : le premier grand meeting est
          annoncé au congrès d'Orléans des 24-25 octobre 2026, à rouvrir après
          cette date. Divergence interne attestée entre la ligne Bardella,
          présentée comme convertie au liberalisme, et la ligne Le Pen. L'entité
          étant portée par Le Pen, c'est sa ligne qui est retenue — laquelle est
          aussi celle des votes du groupe.
      E5:
        valeur: 0.5
        just: >
          AUCUNE hausse légale du SMIC : le RN lui substitue un mécanisme fiscal
          incitatif, exonération de hausse de cotisations patronales pour les
          entreprises augmentant les salaires de 10 % jusqu'à trois fois le
          SMIC, l'augmentation restant facultative pour l'employeur. Surtout, le
          groupe a voté POUR la loi du 11 juin 2026 réduisant la durée
          d'indemnisation du chômage après rupture conventionnelle de 18 à 15
          mois (115 pour sur 122) et CONTRE l'amendement de suppression de ce
          texte. En sens inverse, le programme de 2024 prévoyait l'annulation de
          la réforme de l'assurance chômage de juillet 2024.
        src: [rn_programme_2024, rn_livret_entreprise, assnat_scrutins_chomage_2026]
        contest: >
          Note la plus composite de l'indicateur. Le RN tient un discours de
          protection des travailleurs mais vote avec la droite les restrictions
          d'assurance chômage et refuse toute hausse légale du salaire minimum.
          Un notateur pondérant davantage la rhétorique programmatique que les
          votes pourrait descendre à 0 ; le rang 2 a été privilégié.
      E6:
        valeur: 0.5
        just: >
          Parti extrême dans les deux directions. Côté déréglementation, trois
          votes concordants : 119 pour la loi Duplomb levant les contraintes
          environnementales agricoles, 118 pour la loi de simplification dont
          les amendements RN et LR supprimaient toutes les ZFE, 122 pour la
          proposition de loi de programmation énergie-climat — seul groupe à la
          voter. Programme : fin de « l'hypernormalisation », moratoire sur
          toute nouvelle éolienne et DÉMANTÈLEMENT PROGRESSIF DES EXISTANTES.
          Côté régulation : baisse administrée de 30 % du prix de l'électricité,
          sortie des règles européennes de fixation des prix, réintégration de
          RTE et Enedis dans un EDF unifié, TVA à 5,5 % sur tous les produits
          énergétiques.
        src: [rn_livret_entreprise, rn_mlafrance_2022, rn_contre_budget_2026, assnat_scrutins_environnement]
        contest: >
          NOTE LA PLUS CONTESTABLE DU RAPPORT FRANÇAIS. Le RN est à environ +2
          sur le volet « normes environnementales » et a environ -2 sur le volet
          « encadrement des prix », les deux étant explicitement listés dans la
          définition de E6 : le composite les annule presque. +0,5 et non 0
          parce que le volet déréglementateur est établi par trois scrutins
          publics tandis que le volet interventionniste reste programmatique. Si
          la grille disposait d'un indicateur environnemental séparé — option
          écartée au profit de l'attribut écologie — le RN se séparerait
          franchement de Renaissance, avec qui il se retrouve ici
          artificiellement à égalité.
      S5:
        valeur: 2
        just: >
          Les 30-31 août 2026, le RN a annoncé qu'il sanctionnerait le port du
          voile DANS TOUT L'ESPACE PUBLIC PAR UNE AMENDE. Jean-Philippe Tanguy :
          « nous sanctionnerons le port du voile », les femmes concernées écopant
          d'une amende « au même titre » que les automobilistes sans ceinture.
          Jordan Bardella a proposé un référendum sur la mesure. Le programme de
          2024 porte déjà la suppression du droit du sol et la priorité
          nationale, « si nécessaire par référendum constitutionnel ». Le
          13 septembre 2026 à Hénin-Beaumont, Le Pen a remis la priorité
          nationale au cœur de son programme.
        src: [ladepeche_rn_voile, rn_programme_2024, assnat_rapport_2338, france3_lepen_rentree]
        contest: >
          PLAFOND ATTEINT, CONTENU RÉEL AU-DELÀ — environ +2,5 sur une échelle
          rouverte. Aucune juridiction du compas, québécoise, canadienne ou
          américaine, n'a d'équivalent : il s'agit d'une interdiction
          vestimentaire générale visant une seule confession, sanctionnée
          pénalement. La mesure est contestée jusque dans le bloc de droite
          (Retailleau : « ce n'est pas une proposition, c'est un slogan ») et
          juridiquement fragile. C'est la position affichée qui est notée, non sa
          faisabilité.
      S6:
        valeur: 1.5
        just: >
          Défense d'un récit national et de l'autorité scolaire, uniforme
          obligatoire, retour aux « fondamentaux », opposition aux contenus
          jugés idéologiques. Le programme de 2024 prévoit la suppression du
          financement public des établissements liés à des idéologies étrangères.
        src: [rn_programme_2024, cnews_ecole_2026]
        contest: >
          Note reposant sur le corpus de 2024 : CNEWS constatait au 27 août 2026
          que le programme de Marine Le Pen « n'est encore pas disponible sur son
          site ». Le premier grand meeting est annoncé au congrès d'Orléans des
          24-25 octobre 2026.
      S7:
        valeur: 1.5
        just: >
          Le groupe a voté l'ensemble des textes de durcissement pénal de la
          législature : présomption de légitime défense pour les forces de
          l'ordre (122 pour), projet de loi « réponses immédiates aux phénomènes
          troublant l'ordre public » (114 pour), loi narcotrafic (109 pour).
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          +1,5 et non +2 : le RN vote les durcissements mais n'a pas publié de
          programme pénal 2027, là où LR annonce la suppression du juge
          d'application des peines et des prisons privées.
  - name: Reconquête
    sigle: Reconquête
    label_pos: top left
    chef: Éric Zemmour
    country: France
    color: "#1C1C1C"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: 4, societe: 9}
    autorite: null
    resume: >
      Droite identitaire : arrêt de l'immigration, « remigration », fin du
      regroupement familial, défense de l'identité chrétienne de la France.
      Économie plus libérale que le RN : baisse des impôts et des charges.
    indicateurs:
      E1:
        valeur: 2
        just: >
          Doctrine affichée : « avec 47 % de taux de prélèvements obligatoires
          en 2019, la France détient un triste record du monde », il est urgent
          de « prendre le contre-pied de cette asphyxie fiscale généralisée ».
          Volet 2026 porté par Sarah Knafo : baisse d'un tiers de l'accise sur
          les carburants (-27 c/L d'essence, -24 c/L de gazole, 12 Md€ de
          moindres recettes) et suppression des certificats d'économie
          d'énergie, financées par « un plan massif d'économies, dont j'ai déjà
          dévoilé les 130 premiers milliards ». Aucun impôt sur la fortune,
          aucune taxe nouvelle sur le capital.
        src: [reconquete_priorites_impots, knafo_combien_je_gagne]
        contest: >
          Reconquête n'a PAS de programme présidentiel 2027 publié : la
          plateforme leprogrammepourlafrance.fr est une consultation sans aucune
          mesure publiée, et ericzemmour.fr est resté le site de 2022. La note
          est solide en direction, plus fragile en magnitude que celle de LR.
      E2:
        valeur: 1.5
        just: >
          Plan d'économies le plus élevé du champ français : 130 Md€ annoncés,
          soit environ 7,8 % de la dépense publique. Doctrine de « réduire la
          voilure en matière de dépenses sociales », les contribuables étant
          « contraints de financer par leurs impôts le système social le plus
          dispendieux des pays occidentaux ».
        src: [knafo_combien_je_gagne, reconquete_priorites_impots]
        contest: >
          Comparaison de magnitude avec le PCQ tranchée : les 47 G$ du PCQ sont
          CUMULÉS SUR CINQ ANS, soit environ 5,7 % des dépenses de portefeuilles
          québécoises. Reconquête à 7,8 % est proportionnellement plus agressif,
          le +2 tient donc pour les deux. Reconquête ne propose toutefois aucune
          privatisation nommée, à la différence du RN : le +2 repose entièrement
          sur le volume des coupes.
        contest: >
          RAMENÉ DE +2 À +1,5 après notation des États-Unis. Le Parti républicain
          a EFFECTIVEMENT supprimé environ 256 000 postes dans 22 grandes agences
          fédérales en treize mois — plus de 11 % —, aboli une agence de rang
          gouvernemental (USAID) et amputé de moitié le ministère de l'Éducation.
          Reconquête propose environ 150 000 suppressions sur 5,7 millions
          d'agents publics français, soit 2,6 % : un ordre de grandeur quatre
          fois inférieur. RÉVISION VOLONTAIREMENT RESTREINTE : l'agent
          recommandait de cascader aussi Horizons, LR et Renaissance de +1,5 à
          +1, au motif que l'acte l'emporte sur la proposition. Cet argument n'a
          pas été suivi : il amplifierait le biais du sortant déjà documenté
          dans grille.md.
      E3a:
        absent: true
        just: >
          Aucune position sur le partage public-privé en santé. Le parti n'ayant
          pas de groupe à l'Assemblée nationale, aucun vote de rang 2 n'est
          disponible, et aucun programme présidentiel 2027 n'est publié.
        src: [reconquete_priorites_impots, knafo_combien_je_gagne]
      E3b:
        absent: true
        just: >
          Aucune position sur l'architecture de l'assurance chômage. La seule
          matière trouvée — « préférence nationale en matière d'attribution des
          aides sociales » — est fondée sur la nationalité et relève donc de S5.
        src: [reconquete_priorites_impots, knafo_combien_je_gagne]
      S1:
        valeur: 2
        just: >
          Campagne de 2022 fondée sur l'« immigration zéro » : limitation du
          flux d'étudiants étrangers à « quelques milliers » par an, réduction
          du droit d'asile à « quelques dizaines ou centaines de cas », fin du
          regroupement familial, suppression du droit du sol, expulsion des
          étrangers purgeant une peine sous menace de suppression de l'aide au
          développement. Dès août 2021, Zemmour proposait de « stopper tous les
          flux migratoires, légaux et clandestins, réfugiés politiques,
          regroupement familial, étudiants étrangers ». L'appropriation du
          vocabulaire de la « remigration » implique à terme un solde migratoire
          négatif.
        src: [wikipedia_zemmour]
        contest: >
          Position la plus radicale des quatre territoires : sur une échelle non
          plafonnée, environ +3. C'est la seule force du corpus qui vise un
          solde migratoire NÉGATIF — aucun parti nord-américain ne propose de
          faire partir plus de gens qu'il n'en entre. Sourcage de rang 5
          uniquement : Reconquête n'a publié aucun programme 2027 et le
          programme 2022 archivé n'a pas pu être récupéré.
      S2:
        valeur: 0.5
        just: >
          Reconquête n'a aucun parlementaire national. La seule trace de vote
          imputable au parti est celle de Sarah Knafo, sa seule eurodéputée
          restée dans le parti après les exclusions de juin 2024 : abstention
          sur la résolution relative à l'initiative citoyenne « Ma voix, mon
          choix » le 17 décembre 2025, et vote CONTRE la « Gender Equality
          Strategy 2025 » le 13 novembre 2025, texte comportant un volet santé
          reproductive.
        src: [pe_ice_ma_voix, pe_gender_equality_2025]
        contest: >
          Cellule la plus fragile du tableau français. AUCUN document de
          Reconquête proposant de restreindre l'accès à l'IVG en France n'a été
          trouvé ; aucune position de ce type ne lui est donc prêtée. Piège à
          éviter : les quatre eurodéputés français du groupe ECR qui ont voté
          contre la résolution du 17 décembre 2025 (Maréchal, Bay, Peltier,
          Trochu) NE SONT PLUS Reconquête depuis juin 2024.
      S3:
        valeur: 1.5
        just: >
          Reconquête a créé en décembre 2022 le réseau « Parents vigilants »,
          association de parents d'élèves dont l'activité documentée consiste à
          faire pression sur les enseignants et les personnels de direction
          contre les séances d'éducation à la vie affective et sexuelle et
          contre la lutte contre les discriminations fondées sur l'identité de
          genre. Sarah Knafo a voté contre la « Gender Equality Strategy 2025 »
          et contre la résolution sur les inégalités de genre en santé du
          16 septembre 2026.
        src: [wikipedia_reconquete, pe_gender_equality_2025, pe_sante_genre_2026]
        contest: >
          Seule force française à agir sur le front scolaire, qui est
          précisément le marqueur réservé au +2 américain. Mais l'action passe
          par une association satellite et non par un programme, et aucun
          document Reconquête proposant de restreindre les droits existants des
          adultes n'a été trouvé. Maintenu à +1,5 sans extrapoler ; cellule à
          re-sourcer.
      S4:
        absent: true
        just: >
          Recherche faite, rien trouvé. Reconquête n'a aucun député ni sénateur
          depuis juin 2022 et n'a donc pris part à aucun des quatre scrutins de
          2025-2026 ni aux deux scrutins sénatoriaux. Aucune déclaration de
          parti sur la loi du 18 août 2026, aucun programme 2027, aucun vote de
          sa seule eurodéputée sur un texte relatif à la fin de vie.
        contest: >
          NE PAS IMPUTER à Reconquête les 17 voix « contre » du groupe UDR
          (Union des droites pour la République). Ce groupe est celui d'Éric
          Ciotti, allié du RN, distinct de Reconquête. C'est le piège
          d'attribution le plus probable sur cette ligne.
      E4:
        valeur: -0.5
        just: >
          La seule fiche « Retraites » retrouvée, du programme présidentiel de
          2022, ne contient AUCUNE mesure d'âge ni de durée de cotisation. Elle
          porte exclusivement sur le niveau des pensions : revalorisation
          jusqu'à 600 € par an des retraites inférieures à 1 300 € mensuels par
          exonération de CSG et de CRDS, relèvement de la pension de réversion
          de 54 % à 75 %, rétablissement de la demi-part fiscale pour les veufs
          et veuves. Trois mesures du côté de la hausse des pensions, sans
          contrepartie.
        src: [reconquete_programme_2022_archive]
        contest: >
          NOTE LA PLUS FRAGILE DU RAPPORT FRANÇAIS. Elle repose sur un document
          de mars 2022, ANTÉRIEUR À LA RÉFORME DE 2023, et ne dit rien de la
          dimension aujourd'hui dominante de l'indicateur en France, l'âge.
          `absent` serait défendable ; une note chiffrée a été retenue parce
          qu'une position existe sur le niveau des pensions. À rouvrir dès la
          publication d'un programme 2027.
      E5:
        valeur: 1
        just: >
          Seul des huit partis à proposer une réduction directe de la
          représentation légale des salariés : relever le seuil de 50 à 250
          salariés pour l'obligation de consultation du comité social et
          économique. S'y ajoutent des exonérations ciblées de cotisations
          patronales et une activation de l'assurance chômage par versement
          direct de la moitié des droits en cas de déménagement pour un nouvel
          emploi. Aucune hausse du SMIC.
        src: [reconquete_programme_2022_archive]
        contest: >
          Source de mars 2022, sans mise à jour trouvée. Le relèvement du seuil
          du CSE est structurellement plus offensif contre la représentation
          salariée que tout ce que proposent LR, Renaissance ou Horizons et
          justifierait +1,5 ; maintenu à +1 parce que le reste du paquet est
          mince et daté, et qu'aucune position actuelle sur l'assurance chômage,
          le SMIC ou le temps de travail n'a pu être établie.
      E6:
        valeur: 1
        just: >
          Déréglementation environnementale forte : « mettre fin à tous les
          projets d'éoliennes actuels et futurs, sur terre comme sur mer »,
          suppression de l'objectif de réduction à 50 % de la part du nucléaire,
          arrêt de la fermeture des douze réacteurs prévue pour 2030. Sur les
          prix de l'énergie, Reconquête privilégie la baisse de la fiscalité
          plutôt que le contrôle administré : ramener le diesel de 2,29 € à
          1,90 € le litre.
        src: [reconquete_programme_2022_archive, knafo_combien_je_gagne]
        contest: >
          Deux éléments tirent vers le bas et expliquent que Reconquête reste
          sous LR et Horizons : le remplacement de l'ARENH par « un nouveau
          tarif régulé pour l'électricité nucléaire » et l'opposition à
          l'ouverture à la concurrence des barrages hydroélectriques, deux
          mesures d'encadrement des prix. Réserve de datation : aucune position
          sur les ZFE, le Pacte vert ou la loi de simplification n'a été trouvée
          et le parti n'a aucun vote exploitable au rang 2.
      S5:
        valeur: 2
        just: >
          Doctrine d'assimilation explicite : « comme le disait Charles de
          Gaulle, s'il est possible d'assimiler des individus, IL N'EST PAS
          POSSIBLE D'ASSIMILER DES PEUPLES » ; l'objectif est de « rétablir un
          rapport de force démographique favorable à l'assimilation » et de
          lutter contre « l'islamisation progressive de notre société ». S'y
          ajoute la REMIGRATION, réaffirmée le 13 septembre 2026 : « le renvoi
          effectif des clandestins, des délinquants étrangers, [...] DES CHÔMEURS
          ÉTRANGERS, de tous ceux qui vivent de l'assistanat sans travailler ».
          Le 17 septembre 2026, Zemmour a fixé un seuil nouveau : un étranger,
          MÊME EN SITUATION RÉGULIÈRE, serait expulsé après un an de chômage.
        src: [zemmour_site_identite, cnews_zemmour_rentree, publicsenat_zemmour_candidature]
        contest: >
          PLAFOND ATTEINT, DÉPASSEMENT LE PLUS LARGE DU COMPAS — environ +3 sur
          une échelle rouverte, soit un point entier au-delà du RN. La
          remigration relève pour partie de S1, puisqu'elle porte sur qui reste
          sur le territoire ; mais son ressort est bien S5, puisqu'elle nie le
          principe même d'une coexistence durable avec une population déjà
          installée et en partie régulière. Réserve : les pages doctrinales du
          site datent du cycle 2022 et aucun programme 2027 n'est publié.
      S6:
        valeur: 1.5
        just: >
          Le parti a créé en décembre 2022 le réseau « Parents vigilants », dont
          l'activité documentée consiste à faire pression sur les enseignants et
          les personnels de direction contre les séances d'éducation à la vie
          affective et sexuelle et contre la lutte contre les discriminations
          fondées sur l'identité de genre. La doctrine scolaire du site prône le
          retour aux fondamentaux et à un récit national.
        src: [wikipedia_reconquete, zemmour_site_identite]
        contest: >
          Seule force française à agir sur le front scolaire contre l'éducation
          à la vie affective et sexuelle — marqueur du pôle +2. Mais l'action
          passe par une association satellite et non par un programme écrit.
      S7:
        valeur: 1.5
        just: >
          Fermeté pénale affichée : expulsion des étrangers purgeant une peine,
          construction de places de prison, lutte contre « l'ensauvagement ».
          Aucun vote enregistré n'est disponible, le parti n'ayant aucun
          parlementaire national depuis juin 2022.
        src: [zemmour_site_identite, publicsenat_zemmour_candidature]
        contest: >
          NOTE LA PLUS FRAGILE DE L'AXE SOCIÉTÉ FRANÇAIS : corpus non daté,
          aucun vote enregistré, aucun programme 2027. À rouvrir après la
          déclaration formelle de candidature annoncée pour octobre 2026.
  - name: Place publique – Parti socialiste
    sigle: PS-PP
    label_pos: middle right
    chef: Raphaël Glucksmann
    country: France
    color: "#E4007C"
    as_of: "2026-09-17"
    souverainete: federaliste_europeen
    ecologie: reformiste
    estimation_initiale: {economie: -3, societe: -5}
    autorite: null
    resume: >
      Social-démocratie pro-européenne, soutenue par une partie du PS et des
      écologistes. Taxation des très hauts patrimoines, investissement dans la
      transition écologique, soutien ferme à l'Ukraine. Refuse l'alliance avec
      LFI.
    indicateurs:
      E1:
        valeur: -1.5
        just: >
          Le Projet socialiste, adopté par les militants le 25 juin 2026 à 83 %,
          propose une taxe Zucman de 2 % sur les patrimoines supérieurs à
          100 M€, un impôt sur les grandes successions cumulant les
          transmissions reçues au cours de la vie (abattement unique de
          200 000 €, rendement annoncé de 400 Md€ sur 2025-2040), la suppression
          du prélèvement forfaitaire unique, la fusion IR-CSG-CRDS en un impôt
          plus progressif, un IS progressif et la suppression des exonérations
          sociales entre 2 et 3,5 SMIC (11 Md€/an).
        src: [ps_projet_socialiste]
        contest: >
          Ce qui empêche le -2 : pas de rétablissement d'un ISF en tant que tel,
          création d'une première tranche d'IR inférieure à 10 %, et baisse de
          la CSG sur les revenus du travail financée par sa hausse sur le
          capital. L'objectif affiché est explicitement « sans augmenter les
          impôts des classes moyennes et populaires ».
      E2:
        valeur: -1.5
        just: >
          Nationalisations explicites : « une nationalisation des autoroutes à
          travers la création d'un établissement public national », un pôle
          public de l'énergie avec extension des tarifs réglementés, le
          « caractère public des infrastructures de transport et de distribution
          du gaz et de l'électricité », un plan de prises de participation ou
          « de nationalisations en dernier recours » pour l'industrie, et un
          pôle public de l'IA. La « démarchandisation » est érigée en boussole
          des services essentiels. Mais le PS assume un audit visant à
          « supprimer les programmes à l'impact social faible ».
        src: [ps_projet_socialiste]
      E3a:
        valeur: -2
        just: >
          Crée « une mutuelle publique gérée par la Sécurité sociale » — la
          « Grande Sécu » — fusionnant assurance maladie et complémentaires,
          avec reste à charge zéro pour tous et 3,5 Md€ économisés sur les frais
          de marketing des mutuelles privées. INTERDIT le rachat de tout
          établissement de soins par des fonds d'investissement, des sociétés de
          portage ou des groupes privés à but lucratif. Plafonne les
          dépassements du secteur 2 à 50 % et les interdit en zone dotée. Double
          la part de la prévention, de 4 % à 8 % des dépenses de santé.
        src: [ps_projet_socialiste]
        contest: >
          Sur l'éviction du privé, le PS va aussi loin que Québec solidaire :
          d'où -2 ici, là où l'ancienne note agrégée plafonnait à -1,5 à cause du
          volet chômage. La scission de l'indicateur rend cet écart visible.
      E3b:
        valeur: -1
        just: >
          Gestion de l'assurance chômage confiée EXCLUSIVEMENT aux partenaires
          sociaux par suppression des lettres de cadrage gouvernementales,
          versement automatique de l'allocation, encadrement strict des
          radiations, interdiction de radier pour refus d'un emploi précaire,
          transparence des algorithmes de France Travail.
        src: [ps_projet_socialiste, assnat_scrutins_chomage_2026]
        contest: >
          -1 et non -1,5 : sur la loi chômage de juin 2026, le groupe socialiste
          s'est MAJORITAIREMENT ABSTENU — 37 abstentions, 18 contre, 1 pour —
          au lieu de s'y opposer, fait de rang 2 qui tempère le programme.
      S1:
        valeur: -1.5
        just: >
          Le Projet socialiste propose de « régulariser et intégrer par le
          travail » et de « permettre l'obtention d'un titre de séjour à toute
          personne étrangère disposant d'un contrat de travail depuis au moins
          6 mois », un « droit de plainte sécurisé » pour le travailleur sans
          papiers, un titre « jeune diplômé » d'un an, et de redonner au
          Parlement le pouvoir de décider de la politique migratoire. Il dénonce
          « la logique du chiffre, illustrée par l'explosion des OQTF ».
          61 députés socialistes contre la loi Mayotte, 53 contre la
          dénonciation des accords de 1968.
        src: [ps_projet_socialiste, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          Écart parti/personne assumé : le PS ne parle pas de quotas, Glucksmann
          si. Le PS ne reprend ni le droit du sol intégral ni le droit de vote
          des étrangers du contrat NFP qu'il avait pourtant signé en 2024.
      S2:
        valeur: -2
        just: >
          31 députés sur 31 pour la constitutionnalisation le 30 janvier 2024 et
          64 sénateurs sur 64 le 28 février 2024, unanimité dans les deux
          chambres. Le Projet socialiste va au-delà du statu quo : « garantir un
          accès à l'IVG universel et GRATUIT, partout en France » et soutien à
          l'initiative citoyenne européenne « Ma voix, mon choix ». Glucksmann a
          voté pour la résolution correspondante au Parlement européen le
          17 décembre 2025.
        src: [senat_scrutin_136, ps_projet_socialiste, pe_ice_ma_voix]
      S3:
        valeur: -2
        just: >
          Le Projet socialiste propose de « déjudiciariser la procédure de
          rectification de la mention du genre à l'état civil au profit d'une
          procédure administrative rapide, gratuite et fondée sur
          l'autodétermination, comme en Allemagne », de « sécuriser la
          reconnaissance juridique de toutes les familles LGBTQIA+ quelle que
          soit leur configuration (co-parentalité, multi-parentalité, enfant par
          GPA ou PMA) », et d'assurer « la fin des mutilations intersexes ». Les
          64 sénateurs socialistes ont voté contre la proposition de loi LR sur
          les mineurs en questionnement de genre le 28 mai 2024, sans une
          défection.
        src: [ps_projet_socialiste, senat_scrutin_204, assnat_scrutin_3855]
        contest: >
          À égalité avec LFI ; le PS est même le seul à écrire noir sur blanc la
          reconnaissance de la filiation des enfants nés par GPA.
      S4:
        valeur: -1.5
        just: >
          57 pour / 4 contre / 6 abstentions en lecture définitive le 15 juillet
          2026 ; au Sénat, les 63 socialistes ont voté contre la question
          préalable qui a tué le texte le 7 juillet 2026. Le Projet socialiste
          demandait d'« adopter d'urgence la proposition de loi instaurant un
          droit à la fin de vie libre » et de garantir « la prise en compte
          effective des directives anticipées », tout en conditionnant le
          dispositif à un fort développement des soins palliatifs.
        src: [assnat_scrutin_8280, senat_scrutin_328, ps_projet_socialiste]
        contest: >
          Le PS est le parti français qui s'approche le plus du modèle
          québécois en insistant sur l'effectivité des directives anticipées,
          mais il ne demande pas l'aide à mourir SUR DEMANDE ANTICIPÉE.
      E4:
        valeur: -1
        just: >
          Le Projet socialiste est explicite : « après l'abrogation de la
          réforme Borne, convoquer une conférence sociale pour définir un
          nouveau système de retraite par répartition [...] une durée de
          cotisation fixée à 43 annuités, réductible en fonction de la
          pénibilité [...] l'âge légal de départ, ramené à 62 ans, ne
          disparaîtra pas pour autant ». Le PS conserve donc les 43 annuités
          issues de la réforme de 2023 et ne descend qu'à 62 ans, contre 60 pour
          LFI et le PCF. Financement par élargissement de l'assiette des
          cotisations aux revenus du capital. Rejet explicite de la
          capitalisation.
        src: [ps_projet_socialiste, assnat_scrutin_2257, assnat_scrutin_4758]
        contest: >
          Le maintien des 43 annuités est un élément du côté + de l'échelle, qui
          justifie de ne pas descendre sous -1. Le groupe a voté la LFSS 2026
          portant suspension, que le projet revendique comme « obtenue par les
          socialistes ».
      E5:
        valeur: -1.5
        just: >
          « Rehausser le SMIC à 1 690 € net » (+17,1 %), plafond de 1 à 20 entre
          les plus hautes et les plus basses rémunérations d'un même groupe,
          règle « 1 € de dividende versé = au moins 1 € de participation »,
          ADMINISTRATEURS SALARIÉS PORTÉS À LA MOITIÉ DES MEMBRES ET DES DROITS
          DE VOTE dans les conseils des entreprises de plus de 500 salariés,
          généralisation du chèque syndical, rétablissement des CHSCT. Sur le
          chômage : gestion confiée exclusivement aux partenaires sociaux,
          versement automatique de l'allocation, encadrement strict des
          radiations.
        src: [ps_projet_socialiste, assnat_scrutins_chomage_2026]
        contest: >
          L'objectif de SMIC du PS est à dix euros de celui de LFI : sur ce seul
          critère ils seraient à égalité. Le PS est à -1,5 parce qu'il ne
          propose ni les 32 heures, ni la suspension des licenciements, ni
          l'abrogation des ordonnances Macron. Tempéré aussi par l'abstention
          majoritaire du groupe sur la loi chômage de juin 2026. La
          codétermination à 50 % n'a en revanche aucun équivalent québécois et
          pousserait plutôt vers -2.
      E6:
        valeur: -1.5
        just: >
          Revendique un effort de « démarchandisation [...] par un plus fort
          encadrement des biens et services essentiels ». Mesures : encadrement
          des prix de l'énergie et des loyers, statut de « zone de protection
          commerciale » permettant aux maires d'encadrer les loyers commerciaux,
          prix minimums garantis aux agriculteurs avec encadrement des marges de
          l'agro-industrie, encadrement du yield management ferroviaire,
          plafonnement des dépassements d'honoraires à 50 %. Volet
          environnemental : interdiction du glyphosate, principe de
          non-abaissement des réglementations existantes, défense du ZAN.
        src: [ps_projet_socialiste, assnat_scrutins_environnement]
        contest: >
          Le périmètre sectoriel du PS est PLUS LARGE que celui de QS. Il reste
          à -1,5 parce que sa méthode est l'encadrement négocié et non le
          blocage par décret ni l'appropriation publique, qui définissent ici
          le -2.
      S5:
        valeur: -1
        just: >
          Le 4 septembre 2026, Glucksmann a répondu à la proposition RN d'amende
          pour port du voile : « la laïcité, ce n'est pas la police des
          vêtements », accusant le RN de vouloir « relancer les fièvres
          identitaires ». En commission le 14 janvier 2026, Hervé Saulignac a
          déposé l'amendement de suppression contre la proposition de loi sur le
          voilement des mineures : « ce texte me donne la nausée », « la
          proposition de loi ne vise qu'une seule pratique confessionnelle, à la
          différence de la loi de 1905 ». Il a toutefois affirmé son
          « attachement profond à la laïcité » : le PS défend le cadre existant
          sans proposer de l'étendre ni de le desserrer.
        src: [assnat_rapport_2338, nfp_contrat_legislature, lefigaro_glucksmann_laicite]
        contest: >
          Glucksmann n'est à ce jour que candidat à la primaire socialiste,
          déclaré le 23 août 2026, non tranchée au 18 septembre. La note vaut
          pour la force telle qu'elle vote au Parlement ; si un autre candidat
          l'emporte, la position pourrait bouger de plus ou moins 0,5.
      S6:
        valeur: -1
        just: >
          Le 23 août 2026, en annonçant sa candidature, Glucksmann a annoncé
          « un plan de sauvetage de l'école publique » sur cinq ans : hausse de
          la rémunération des enseignants, baisse du nombre d'élèves par classe
          en primaire, rénovation du bâti scolaire, en s'appuyant sur le constat
          de l'OCDE que la France « a l'école qui reproduit le plus les
          inégalités en Europe ». Tribune du 1er septembre 2026 : « Sauvons
          l'école publique ». Aucune mesure de définancement du privé sous
          contrat n'est portée en propre.
        src: [cnews_ecole_2026, liberation_glucksmann_ecole, nfp_contrat_legislature]
      S7:
        valeur: -0.5
        just: >
          Le groupe a voté contre la présomption de légitime défense (62 contre)
          et contre le projet de loi sur l'ordre public (56 contre). Mais il a
          VOTÉ POUR la loi narcotrafic du 29 avril 2025 (63 pour), seul groupe
          de gauche à le faire — ce qui le distingue nettement de LFI et du PCF.
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          Aucun programme de justice pénale propre à Glucksmann n'a été trouvé :
          sa campagne a communiqué sur l'école, pas sur le pénal. La note est
          adossée aux seuls votes du groupe et au socle NFP.
  - name: Parti communiste français
    sigle: PCF
    label_pos: top left
    chef: Fabien Roussel
    country: France
    color: "#B30000"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: -8, societe: 1}
    autorite: null
    resume: >
      Roussel est candidat déclaré depuis septembre 2026. Économie socialiste :
      nationalisations (énergie, banques), hausse des salaires, retraite à
      60 ans. Pro-nucléaire et productiviste, positions plus classiques que le
      reste de la gauche sur la sécurité et la laïcité — c'est ce que capte
      l'attribut écologie, que les deux axes ne distinguent pas de LFI.
    indicateurs:
      E1:
        valeur: -2
        just: >
          Proposition 127 : rétablit l'impôt sur la fortune, accentue son taux et
          sa progressivité, supprime ses niches et TRIPLE son montant, tout en
          abolissant le prélèvement forfaitaire unique. Proposition 126 : impôt
          sur le revenu porté à 15 tranches. Proposition 128 : doublement du
          nombre de tranches des droits de succession. Proposition 123 : impôt
          progressif sur les actifs immobiliers, matériels ET financiers des
          entreprises. Le niveau global de prélèvement monte massivement :
          27 Md€/an pour 500 000 embauches publiques et 60 Md€ pour le plan de
          services publics.
        src: [pcf_180_propositions]
        contest: >
          La baisse de la TVA et la disparition progressive de la CSG vont
          formellement dans l'autre sens, mais le solde est sans ambiguïté. Le
          PCF définit désormais la borne -2 pour l'ensemble du compas.
      E2:
        valeur: -2
        just: >
          Seul parti des quatre territoires à NOMMER les entreprises à
          nationaliser. Proposition 116 : pôle financier public par la
          nationalisation de BNP-Paribas, Société générale et Axa. Proposition
          25 : réappropriation publique de la SNCF, d'EDF, d'Engie, de La Poste
          et de France Télécom. Proposition 56 : pôle public de l'énergie autour
          d'EDF et Engie « qui seront renationalisées ». Proposition 17 :
          nationalisation de Sanofi. Proposition 29 : 500 000 emplois créés dans
          la fonction publique, ventilés poste par poste (100 000 hôpital,
          100 000 EHPAD, 90 000 enseignants, 90 000 AESH...), pour 27 Md€/an.
        src: [pcf_180_propositions, pcf_base_commune_40e]
      E3a:
        valeur: -2
        just: >
          Proposition 12 : « mettre fin au reste à charge des dépenses de soins,
          d'aller vers une véritable prise en charge à 100 % ». Proposition 13 :
          suppression des franchises médicales et des participations
          forfaitaires, disparition des dépassements d'honoraires, retour à un
          secteur conventionnel unique, tiers payant généralisé, 12 000 places
          en médecine contre 8 000. Proposition 14 : arrêt des privatisations
          hospitalières, fin de la T2A, 100 000 emplois hospitaliers.
          Proposition 17 : pôle public du médicament adossé à la nationalisation
          de Sanofi.
        src: [pcf_180_propositions]
      E3b:
        valeur: -2
        just: >
          Proposition 2 : « la loi El Khomri, les ordonnances Macron et la loi
          Borne sur l'assurance-chômage seront immédiatement abrogées » ; « les
          demandeuses et demandeurs d'emploi retrouveront leurs droits attaqués
          [...] sur le délai d'ouverture des droits comme sur le niveau de
          l'allocation ». Le groupe a voté la suppression de l'article unique du
          texte de mai 2026, puis contre le texte.
        src: [pcf_180_propositions, assnat_scrutins_chomage_2026]
      S1:
        valeur: -1.5
        just: >
          Le PCF est signataire du contrat NFP de juin 2024 (abrogation des lois
          asile-immigration, régularisations, droit du sol intégral) et ses
          députés votent en conséquence : 13 contre la loi Mayotte, 6 contre la
          dénonciation des accords de 1968. Mais Fabien Roussel tient depuis
          avril 2023 un discours en retrait, dénonçant des « frontières
          passoires » et réclamant que la France soit « plus ferme » sur
          l'arrivée de travailleurs migrants, tout en refusant tout lien entre
          immigration et chômage.
        src: [nfp_contrat_legislature, assnat_scrutin_1308, wikipedia_roussel]
        contest: >
          Écart parti/candidat le plus net du panel français. Les votes du
          groupe GDR situent le PCF à -2 ; la ligne publique de son candidat le
          remonte. Arbitré à -1,5 et signale plutôt que tranche.
      S2:
        valeur: -2
        just: >
          20 députés pour à l'Assemblée le 30 janvier 2024, 22 sur 22 au Congrès
          du 4 mars 2024, et 18 sénateurs sur 18 le 28 février 2024 — unanimité
          dans les trois scrutins, sans une voix contre ni une abstention.
          Signataire du contrat NFP garantissant l'égal accès et l'effectivité
          de l'IVG et le choix de la méthode.
        src: [assnat_congres_ivg, senat_scrutin_136, nfp_contrat_legislature]
        contest: >
          Note assise sur des votes et une signature de coalition, faute de
          document programmatique PCF propre sur l'IVG. Le contenu de la
          position n'est pas douteux ; c'est la granularité qui manque pour
          distinguer le PCF de LFI et du PS.
      S3:
        valeur: -1.5
        just: >
          17 des 18 sénateurs ont voté contre la proposition de loi LR sur les
          mineurs en questionnement de genre le 28 mai 2024. 10 députés ont voté
          la PMA pour toutes en 2021. Le programme porté par Roussel prône « la
          fin des mutilations des personnes intersexes » et « un remboursement
          intégral du parcours de transition des personnes transgenres ».
        src: [senat_scrutin_204, wikipedia_roussel, nfp_contrat_legislature]
        contest: >
          Roussel est par ailleurs hostile aux réunions non mixtes : la ligne
          sociétale du candidat est moins homogène que celle de ses
          parlementaires, d'où -1,5 plutôt que -2.
      S4:
        valeur: -1
        just: >
          Le groupe GDR soutient le texte à chaque lecture mais avec une
          minorité de refus et d'abstentions proportionnellement plus forte que
          les autres groupes de gauche : 10 pour / 2 contre / 3 abstentions sur
          17 membres en lecture définitive le 15 juillet 2026. Au Sénat, les 18
          élus communistes ont voté contre la question préalable du 7 juillet
          2026.
        src: [assnat_scrutin_8280, senat_scrutin_328]
        contest: >
          Aucun texte programmatique PCF propre sur la fin de vie n'a été
          trouvé ; la note est déduite des votes. Le groupe GDR est composite
          (PCF et ultramarins), ce qui atténue l'imputabilité.
      E4:
        valeur: -2
        just: >
          Mesure n° 8 des 180 propositions : « une loi rétablira la retraite à
          60 ans, à taux plein » — un abaissement de QUATRE ANS par rapport au
          droit en vigueur (64 ans depuis la réforme du 14 avril 2023). Le
          cahier Sécurité sociale détaille : taux de remplacement net de 75 %,
          calcul sur les dix meilleures années, aucune pension inférieure au
          SMIC, indexation sur les salaires, prise en compte des années d'études
          dès 18 ans. Financement chiffré à +100 Md€/an par la cotisation
          sociale, avec rejet explicite de la capitalisation.
        src: [pcf_180_propositions, assnat_scrutin_2257]
        contest: >
          Avec LFI, le PCF définit la borne -2 du compas sur cet indicateur. Le
          chiffrage à 100 Md€ est revendiqué par le parti, non validé par un
          tiers.
      E5:
        valeur: -2
        just: >
          SMIC à 1 600 € net (+10,9 %) et semaine de 32 heures « sans diminution
          de salaires ». Les 180 propositions comportent les mesures les plus
          interventionnistes du panel français : abrogation immédiate de la loi
          El Khomri, des ordonnances Macron et de la loi Borne sur l'assurance
          chômage (n° 2) ; « tous les plans sociaux et les licenciements en
          cours seront suspendus » (n° 3) ; loi sur la sécurité d'emploi ou de
          formation (n° 6) ; fin des contrats précaires (n° 38).
        src: [pcf_180_propositions, assnat_scrutins_chomage_2026]
        contest: >
          La suspension de TOUS les plans sociaux et licenciements en cours est,
          en droit du travail, la mesure la plus radicale des huit partis — plus
          contraignante que tout ce que porte Québec solidaire. Elle justifie à
          elle seule le -2 malgré un objectif de SMIC inférieur à celui de LFI
          et du PS.
      E6:
        valeur: -2
        just: >
          Le PCF ne se contente pas d'encadrer le marché, il en soustrait des
          secteurs entiers : réappropriation publique de la SNCF, d'EDF,
          d'Engie, de La Poste et de France Télécom (n° 25) ; pôle financier
          public par nationalisation de BNP-Paribas, Société générale et Axa
          (n° 116) ; mix énergétique « 100 % public » (n° 55) ; interdiction des
          saisies, expulsions et coupures d'eau et d'énergie (n° 98) ; plan
          national de baisse des loyers (n° 99). Signataire du blocage des prix
          par décret du contrat NFP.
        src: [pcf_180_propositions, nfp_contrat_legislature, assnat_scrutins_environnement]
        contest: >
          L'indicateur agrège encadrement des prix ET régulation
          environnementale contraignante. Le PCF est maximal sur le premier
          volet mais son attribut écologie « productiviste » — ligne
          pro-nucléaire, réserves sur l'écologie punitive — le rend moins net
          sur le second. Ses votes le placent toutefois systématiquement dans le
          camp de la contrainte environnementale.
      S5:
        valeur: -0.5
        just: >
          Les députés du groupe ont voté contre la restriction du droit du sol à
          Mayotte et contre la résolution sur les Frères musulmans, et ont
          déposé un amendement de suppression contre la proposition de loi sur
          le voilement des mineures. Mais la base commune du 40e congrès
          (juillet 2026) affirme que « la laïcité est un principe non
          négociable, indispensable à l'émancipation des femmes et à
          l'égalité », formulation nettement plus ferme que celle du PS, et le
          contrat NFP refuse tout financement public de nouveaux établissements
          confessionnels.
        src: [pcf_base_commune_40e, assnat_rapport_2338, nfp_contrat_legislature]
        contest: >
          Écart réel entre la ligne « laïque et républicaine » personnelle de
          Roussel et les votes du groupe, qui est composite (PCF et élus
          ultramarins non communistes : l'oratrice du 14 janvier 2026 est
          réunionnaise). AUCUNE déclaration de Roussel datée de 2026 sur le
          voile ou la laïcité n'a été trouvée. Fourchette prudente : -1 à 0.
      S6:
        valeur: -2
        just: >
          Position la plus radicale du compas sur cet axe. Base commune du 40e
          congrès : « nous portons LA FIN DU FINANCEMENT PUBLIC DES ÉCOLES
          PRIVÉES SOUS CONTRAT. Le financement collectif du séparatisme social
          et scolaire n'est pas acceptable : l'argent public doit aller à
          l'école publique. Cela passe aussi par L'INTERDICTION DE TOUTES LES
          ÉCOLES PRIVÉES HORS CONTRAT. L'ambition des communistes vise une seule
          école commune. » S'y ajoutent l'école obligatoire jusqu'à 18 ans et la
          baisse des effectifs par classe.
        src: [pcf_base_commune_40e, nfp_contrat_legislature]
        contest: >
          Plus radical que Québec solidaire, qui occupait le -2 : chez QS le
          privé subsiste, converti et intégré ; le PCF le supprime. C'est ce
          dépassement qui a imposé de ramener QS à -1,5.
      S7:
        valeur: -1
        just: >
          Le groupe a voté contre la présomption de légitime défense pour les
          forces de l'ordre (17 contre) et contre le projet de loi sur l'ordre
          public (15 contre). Sur la loi narcotrafic d'avril 2025, le groupe
          s'est divisé (1 pour, 4 contre), là où LFI votait contre en bloc.
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          La ligne « républicaine » de Roussel sur la sécurité est plus ferme
          que celle de ses parlementaires, sans déclaration datée de 2026 pour
          l'établir. -1 plutôt que -1,5 traduit cette tension.
  - name: La France insoumise
    sigle: LFI
    label_pos: bottom left
    chef: Jean-Luc Mélenchon
    country: France
    color: "#CC2443"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: planificateur
    estimation_initiale: {economie: -8, societe: -6}
    autorite: >
      Critiqué pour la centralisation de son mouvement ; ses soutiens mettent en
      avant la démocratie participative de son programme.
    resume: >
      Gauche radicale : SMIC à 1600 euros net, retraite à 60 ans,
      rétablissement de l'ISF, planification écologique, VIe République.
      Progressiste sur les questions de société.
    indicateurs:
      E1:
        valeur: -2
        just: >
          Le Contrat de législature du Nouveau Front populaire prévoit un impôt
          sur le revenu à 14 tranches, une CSG progressive, le rétablissement
          d'un ISF renforcé à volet climatique, la suppression de la flat tax,
          le rétablissement de l'exit tax, et une réforme de l'héritage avec
          instauration d'un « héritage maximum ». La synthèse de L'Avenir en
          commun édition 2025 confirme comme déjà présents au programme :
          héritage maximum, taxe Zucman ou impôt plancher sur le patrimoine des
          milliardaires, ISF renforcé, revenu maximum.
        src: [nfp_contrat_legislature, lfi_avenir_commun_2025]
        contest: >
          L'« héritage maximum » — plafond absolu de transmission, et non un
          taux — est une mesure sans équivalent dans les trois autres
          territoires. C'est l'un des deux dépassements qui ont imposé de
          ramener Québec solidaire de -2 à -1,5 sur cet indicateur.
      E2:
        valeur: -2
        just: >
          La synthèse 2025 range parmi les mesures déjà présentes au programme :
          « la sortie du marché des secteurs stratégiques, traduite par la
          création de pôles publics impliquant des nationalisations »,
          « socialiser certaines banques de détail », « renationaliser des
          secteurs ciblés », « nationalisations sous contrôle démocratique », et
          des nationalisations d'autoroutes. Le NFP 2024 prévoit un pôle public
          bancaire adossé à la CDC et à la BPI, un pôle public du médicament et
          le rattrapage des postes manquants de fonctionnaires, avec hausse de
          10 % du point d'indice.
        src: [lfi_avenir_commun_2025, nfp_contrat_legislature]
        contest: >
          Marginalement moins radicale que le PCF : le pôle public bancaire du
          NFP s'appuie sur des outils publics existants plutôt que sur la
          nationalisation d'établissements privés nommés, et LFI ne chiffre pas
          de création de postes. L'échelle au demi-point ne permet pas de les
          séparer ; le PCF reste le point de référence de la borne.
      E3a:
        valeur: -2
        just: >
          La synthèse 2025 range « instaurer le 100 % Sécu » parmi les mesures
          déjà présentes au programme, aux côtés de la création d'un pôle public
          du médicament et de l'interdiction des brevets sur les médicaments
          d'urgence sanitaire ; la contribution nouvelle la plus citée est « en
          finir avec la financiarisation de la santé ». Le NFP prévoit un grand
          plan de recrutement du soin et du médico-social et le rattrapage des
          postes manquants à l'hôpital public.
        src: [lfi_avenir_commun_2025, nfp_contrat_legislature]
      E3b:
        valeur: -2
        just: >
          Le contrat NFP prévoit d'« abroger immédiatement [...] les réformes de
          l'assurance-chômage » dès les quinze premiers jours. À l'Assemblée,
          le groupe a déposé et voté la suppression de l'article unique du
          projet de loi de mai 2026 (33 pour) et voté contre le texte (63
          contre).
        src: [nfp_contrat_legislature, lfi_avenir_commun_2025, assnat_scrutins_chomage_2026]
      S1:
        valeur: -2
        just: >
          Le contrat NFP de juin 2024 prévoit d'« abroger les lois asile et
          immigration de Macron », de « régulariser les travailleurs, étudiants,
          parents d'enfants scolarisés », d'instituer « la carte de séjour de
          dix ans comme titre de séjour de référence », de « garantir le droit
          du sol intégral » et de faciliter l'obtention de la nationalité. Le
          programme 2027 du 17 juillet 2026 ajoute « accorder le droit de vote
          des étrangers aux élections locales ». En séance : 65 députés contre
          la restriction de la nationalité à Mayotte (8 avril 2025), 52 contre
          la dénonciation des accords de 1968 (30 octobre 2025).
        src: [nfp_contrat_legislature, lfi_programme_2027, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          LFI occupe désormais le -2, qui appartenait à Québec solidaire. QS
          relève un seuil ; LFI ajoute régularisation massive, droit du sol
          intégral, carte de dix ans et droit de vote des étrangers.
      S2:
        valeur: -2
        just: >
          75 députés sur 75 pour la constitutionnalisation de la liberté de
          recourir à l'IVG à l'Assemblée le 30 janvier 2024, et 75 sur 75 au
          Congrès du 4 mars 2024 — l'un des trois seuls groupes à voter à
          l'unanimité sans une abstention. LFI est à l'origine de la proposition
          de loi constitutionnelle antérieure (24 novembre 2022). Le programme
          2027 demande un « accès universel au droit à l'IVG et à la
          contraception ».
        src: [assnat_congres_ivg, assnat_scrutin_3289, nfp_contrat_legislature, lfi_programme_2027]
      S3:
        valeur: -2
        just: >
          Le contrat NFP prévoit d'« établir la filiation par reconnaissance
          comme principe par défaut », de « rembourser la PMA » et de « la
          rendre accessible aux personnes trans », et d'« autoriser le
          changement d'état civil libre et gratuit devant un officier d'état
          civil » — soit l'autodétermination sans juge. Le programme 2027 crée
          une « adoption sociale ». 16 des 17 députés ont voté la loi
          bioéthique ouvrant la PMA à toutes le 29 juin 2021.
        src: [nfp_contrat_legislature, lfi_programme_2027, assnat_scrutin_3855]
        contest: >
          Dépasse Québec solidaire (-1,5) : autodétermination de l'état civil
          sans juge, PMA ouverte aux personnes trans, multiparentalité. Le -2 de
          S3, que le Québec laissait vacant, est occupé par la France.
      S4:
        valeur: -1.5
        just: >
          Constance sur quatre lectures : 62 pour / 1 contre le 27 mai 2025,
          62/1 le 25 février 2026, 62/2/3 le 30 juin 2026, et 61 pour / 2 contre
          / 3 abstentions en lecture définitive le 15 juillet 2026. Le contrat
          NFP engageait à « instaurer un droit à mourir dans la dignité ».
        src: [assnat_scrutin_8280, assnat_scrutin_2107, nfp_contrat_legislature]
        contest: >
          -1,5 et non -2 : la loi française promulguée le 18 août 2026 EXCLUT
          les demandes anticipées et exige un discernement intact, là où le
          Québec les a légalisées. Aucun parti français ne peut donc atteindre
          le -2 québécois, et LFI ne propose pas d'aller au-delà de la loi.
      E4:
        valeur: -2
        just: >
          « La retraite à 60 ans » figure parmi les cinq mesures-titres du site
          du mouvement, aux côtés du SMIC à 1 700 € net et du blocage des prix.
          Le chantier programmatique 2027 confirme : « instaurer la retraite à
          60 ans, mesure phare de L'Avenir en commun depuis 2017 »,
          revalorisation des pensions au niveau du SMIC revalorisé,
          rétablissement des critères de pénibilité supprimés. Le groupe a voté
          l'abrogation de la réforme de 2023 et contre la LFSS 2026 portant
          simple suspension.
        src: [lfi_site_programme, lfi_programme_2027, nfp_contrat_legislature, assnat_scrutin_2257]
        contest: >
          Le vote contre la LFSS 2026 n'est pas un vote contre la suspension
          mais contre un texte jugé insuffisant : LFI veut l'abrogation.
      E5:
        valeur: -2
        just: >
          SMIC à 1 700 € net, soit +17,8 % par rapport aux 1 443 € net du
          1er janvier 2026. S'y ajoutent les 32 heures hebdomadaires, une
          sixième semaine de congés payés, l'indexation des salaires sur
          l'inflation, un quota maximal de contrats précaires, la titularisation
          des précaires des trois fonctions publiques, la requalification des
          travailleurs de plateformes en salariés et l'obligation de
          transparence salariale. Sur le chômage : « rétablir une
          assurance-chômage protectrice » et supprimer les réformes successives
          du calcul de l'allocation.
        src: [lfi_site_programme, lfi_programme_2027, nfp_contrat_legislature, assnat_scrutins_chomage_2026]
        contest: >
          Dépasse l'ancrage de Québec solidaire, dont la position reposait sur
          la seule hausse du salaire minimum — d'où la révision de QS à -1,5.
      E6:
        valeur: -2
        just: >
          « Bloquer les prix » est l'une des cinq mesures-titres du site. Le
          contrat NFP en donne le contenu opérationnel, en tête des quinze
          premiers jours : « bloquer les prix des biens de première nécessité
          dans l'alimentation, l'énergie et les carburants PAR DÉCRET ».
          S'y ajoutent l'abolition de la taxe de 10 % sur les factures
          d'énergie, le plafonnement des frais bancaires, la gratuité des
          premiers kWh, l'abolition des coupures d'électricité et de gaz, un
          prix plancher rémunérateur aux agriculteurs, la hausse des effectifs
          de la DGCCRF pour contrôler l'application du blocage, et la « Règle
          verte ».
        src: [lfi_site_programme, nfp_contrat_legislature, lfi_programme_2027, assnat_scrutins_environnement]
      S5:
        valeur: -2
        just: >
          Seule force du compas à proposer de REVENIR SUR UNE RESTRICTION
          RELIGIEUSE EN VIGUEUR. Le 6 septembre 2026, Mathilde Panot a jugé
          « absurde » l'interdiction de l'abaya à l'école et assuré que la
          mesure « serait annulée en cas de victoire de Jean-Luc Mélenchon en
          2027 ». En commission le 14 janvier 2026, le groupe a fait adopter
          l'amendement supprimant la proposition de loi sur le voilement des
          mineures, qualifiée d'« inconstitutionnelle, islamophobe et inutile ».
          Votes contre la restriction du droit du sol à Mayotte et contre
          l'inscription des Frères musulmans sur la liste terroriste
          européenne.
        src: [cnews_abaya_2026, assnat_rapport_2338, assnat_scrutin_1308]
        contest: >
          Panot vise explicitement l'abaya, non la loi de 2004. L'accusation
          adverse selon laquelle LFI voudrait abroger la loi de 2004 et
          réintroduire tous les signes religieux à l'école est une imputation
          d'adversaires, non une position sourcée : elle n'entre pas dans la
          note.
      S6:
        valeur: -1.5
        just: >
          Fin août 2026, Mélenchon a accusé Philippe et Attal de vouloir
          « dynamiter l'école publique » et de défendre un « marché de la
          concurrence ». Le programme vise 19 élèves par classe en fin de mandat
          avec 160 000 recrutements d'enseignants, la gratuité de la cantine,
          l'abolition de Parcoursup et de la sélection à l'université, la
          modulation des dotations des établissements « y compris privés » selon
          la mixité sociale, et le refus de financement public de nouveaux
          établissements confessionnels.
        src: [cnews_ecole_2026, nfp_contrat_legislature, cnews_abaya_2026]
        contest: >
          L'Avenir en commun est « en cours de réactualisation » : la note
          repose sur le socle NFP 2024 et sur des déclarations d'août-septembre
          2026. LFI ne va pas, dans ses textes publiés, jusqu'à la fin du
          financement du privé sous contrat portée par le PCF — d'où -1,5.
      S7:
        valeur: -1.5
        just: >
          Opposition systématique aux textes de durcissement pénal : 69 contre
          la présomption de légitime défense pour les forces de l'ordre
          (7 juillet 2026), 71 contre le projet de loi « réponses immédiates aux
          phénomènes troublant l'ordre public » (21 juillet 2026), 60 contre la
          loi narcotrafic (29 avril 2025 — texte que le groupe socialiste a
          voté).
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
