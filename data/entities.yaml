# Compas politique comparé : données
#
# Les entités sont des PARTIS (ou des forces politiques), pas des personnes :
# les sources de rang 1 — plateformes, cadres financiers, votes — sont toujours
# des documents de parti. Le champ `chef` porte la figure qui les incarne.
# `sigle` est l'étiquette courte affichée sur la carte, où les noms complets
# se chevaucheraient ; le nom complet reste dans l'infobulle et la fiche.
#
# Deux axes, de -10 à +10 :
#   economie : -10 État          ->  +10 Marché
#   societe  : -10 Progressiste  ->  +10 Conservateur
#
# Les positions ne sont pas posées à la main : elles sont calculées par
# `scoring.py` à partir des indicateurs notés de -2 à +2 par pas de 0,5 (barème
# complet dans `data/grille.md`). Tant qu'une entité porte moins de
# `min_indicateurs` notes sur un axe, elle reste à son `estimation_initiale`.
#
# Dimensions hors axes, en attributs : `souverainete`, `ecologie`, `autorite`.
# `resume_src` source les faits affirmes dans le resume (dates, sondages).
#
# Version précédente, avec des positions entièrement estimées à la main :
# `data/entities.legacy.yaml`.

meta:
  updated: "17 septembre 2026"
  grille: data/grille.md

axes:
  economie:
    libelle: Économie
    pole_negatif: État
    pole_positif: Marché
    min_indicateurs: 4
    indicateurs:
      E1: {libelle: Fiscalité, poids: 1.0}
      E2: {libelle: Périmètre de l'État, poids: 1.0}
      E3a: {libelle: Santé, poids: 0.5}
      E3b: {libelle: Assurance chômage, poids: 0.5}
      E4: {libelle: Retraites, poids: 1.0}
      E5: {libelle: Marché du travail, poids: 0.8}
      E6: {libelle: Régulation, poids: 0.8}
  societe:
    libelle: Société
    pole_negatif: Progressiste
    pole_positif: Conservateur
    min_indicateurs: 4
    indicateurs:
      S1: {libelle: Niveaux d'immigration, poids: 1.0}
      S2: {libelle: Droits reproductifs, poids: 1.0}
      S3: {libelle: Droits LGBT+, poids: 1.0}
      S4: {libelle: Fin de vie, poids: 1.0}
      S5: {libelle: Modèle d'intégration, poids: 0.6}
      S6: {libelle: Éducation et transmission, poids: 0.6}
      S7: {libelle: Justice pénale, poids: 0.8}

entities:

  # ---------------------------------------------------------------- États-Unis
  - name: Parti républicain
    sigle: Républicains US
    label_pos: top right
    chef: Donald Trump
    country: États-Unis
    color: "#C0392B"
    as_of: "2026-09-17"
    souverainete: unilateraliste
    ecologie: productiviste
    estimation_initiale: {economie: 3, societe: 6}
    autorite: >
      Recours intensif aux décrets, déploiement de la Garde nationale dans
      plusieurs villes, conflits avec les tribunaux et les agences
      indépendantes ; ses partisans y voient l'application de son mandat.
    resume: >
      Économie mixte : prolongation des baisses d'impôts, réduction de la
      fonction publique fédérale et dérégulation, mais droits de douane élevés
      et interventions directes dans l'industrie (prise de participation dans
      Intel). Positions conservatrices sur l'immigration et les questions de
      société. Le protectionnisme est porté par l'attribut souveraineté, non par
      l'axe économique.
    indicateurs:

      S1:
        valeur: 2
        just: >
          La plateforme 2024 promet de « begin largest deportation program in
          American history » et de « end chain migration ». Au gouvernement : le
          plafond de réfugiés pour 2026 a été fixé à 7 500, le plus bas de
          l'histoire des États-Unis, et la détermination présidentielle précise
          que ces places « shall primarily be allocated among Afrikaners from
          South Africa ». Le 25 novembre 2025, réexamen ordonné du statut de
          tous les réfugiés admis sous Biden, soit environ 233 000 personnes.
          Le 27 novembre 2025, annonce d'une « permanent pause » de
          l'immigration « from all Third World Countries ». Résultat mesuré :
          les États-Unis ont enregistré en 2025 un SOLDE MIGRATOIRE NÉGATIF pour
          la première fois depuis cinquante ans.
        src: [gop_plateforme_2024, refugee_cap_2026, brookings_solde_negatif, aljazeera_pause_2025]
        contest: >
          PLAFOND ATTEINT ET DÉBORDÉ — valeur réelle estimée +3 à +3,5, soit
          environ un demi-point au-dessus de Reconquête. Reconquête VISE un
          solde migratoire négatif par la remigration ; le Parti républicain
          l'a OBTENU. Il définit désormais le sommet de cet indicateur pour
          l'ensemble du compas. Publié à +2 par contrainte d'échelle, avec le
          RN (≈ +2,5) et Reconquête (≈ +3) comprimés au même niveau : trois
          positions distinctes affichées identiques.
      S2:
        valeur: 2
        just: >
          Niveau des États, fondement principal : 13 États appliquent une
          interdiction totale de l'avortement et 4 autres une interdiction à
          environ six semaines, toutes adoptées par des législatures à majorité
          républicaine. Niveau fédéral : décret du 24 janvier 2025 réaffirmant
          l'amendement Hyde ; rétablissement élargi de la politique de Mexico ;
          gel de 22 subventions Title X puis réorientation du programme vers la
          « natural family planning » ; moratoire d'un an sur le financement
          Medicaid de Planned Parenthood inscrit dans la loi du 4 juillet 2025 ;
          réexamen par la FDA de la mifépristone lancé en juin 2026, visant la
          télémédecine et l'envoi postal.
        src: [gop_plateforme_2024, guttmacher_2026, eo_14182_hyde, federal_register_mexico_2026, nhelp_obbba_medicaid, thehill_mifepristone]
        contest: >
          BORNE RÉSERVÉE CONFIRMÉE, SANS DÉPASSEMENT. Point décisif du compas :
          le +2 avait été réservé aux États américains post-Dobbs sans jamais
          avoir été mesuré, et il est occupé. La plateforme fédérale de 2024 a
          en revanche DÉLIBÉRÉMENT ABANDONNÉ l'appel à une interdiction
          nationale, renvoie aux États et soutient explicitement l'accès à la
          contraception et à la FIV : prise isolement elle vaudrait +1,5. Ce qui
          porte à +2, c'est l'addition des interdictions d'États et de l'action
          fédérale sur le financement. Aucune remontée de LR, du RN ni de
          Reconquête n'est donc requise. Point de vigilance : le Life at
          Conception Act compte 112 cosignataires républicains, minorité du
          groupe sans appui de la direction — s'il devenait la ligne du parti,
          le +2 serait franchi.
      S3:
        valeur: 2
        just: >
          Plateforme 2024 : « stop taxpayer-funded schools from promoting gender
          transition », coupe des fonds des écoles diffusant la « radical gender
          ideology », « keep men out of women's sports », interdiction du
          financement public des chirurgies. Au gouvernement : décret du
          20 janvier 2025 imposant le « sex at conception » sur tous les
          documents fédéraux ; décret 14187 du 28 janvier 2025 interdisant le
          financement fédéral des transitions des mineurs ; exclusion des
          personnes trans de l'armée effective le 8 mai 2025 ; règle excluant la
          couverture Medicaid des traitements pour les mineurs, applicable au
          12 octobre 2026 ; exclusion des soins de transition DES ADULTES des
          régimes de santé des agents fédéraux. En 2026, l'administration impose
          à des hôpitaux d'ouvrir des CLINIQUES DE DÉTRANSITION. Au niveau des
          États, 835 projets de loi hostiles aux personnes trans en discussion
          dans 43 États.
        src: [gop_plateforme_2024, eo_14187_mineurs, hrw_soins_adultes, aclu_legislatures_2026, nbc_trans_adultes]
        contest: >
          BORNE RÉSERVÉE CONFIRMÉE, AVEC MARGE. La définition posée à l'époque
          — « interdictions d'enseignement sur le genre, retraits d'ouvrages,
          restrictions visant aussi les adultes » — décrit terme à terme la
          politique constatée. Le parti dépasse même cette définition d'environ
          un demi-point avec un élément non anticipé : l'obligation faite à des
          hôpitaux d'ouvrir des cliniques de détransition relève de la RÉVERSION
          CONTRAINTE, non de la seule restriction. Valeur réelle ≈ +2,5. La
          compression étant faible et le sommet solidement tenu, LR, Reconquête
          et le RN restent où ils sont.
      S4:
        valeur: 1.5
        just: >
          Deux représentants ont déposé H.R. 7196, qui abroge le Death with
          Dignity Act du District de Columbia — soit la suppression d'un régime
          d'aide à mourir EN VIGUEUR, cas plus avancé que la simple opposition à
          une loi nouvelle. Aucune des treize juridictions américaines
          autorisant l'aide médicale à mourir ne l'a adoptée sous contrôle
          républicain, et les législatures républicaines bloquent
          systematiquement ces textes. La plateforme 2024 ne mentionne pas le
          sujet.
        src: [hr_7196_dc, compassion_choices_etats]
        contest: >
          Base documentaire plus faible que pour S1, S2 et S3 : ni plank de
          plateforme, ni vote nominal, ni décret — seulement un texte déposé par
          deux élus et un comportement législatif constant au niveau des États.
          `absent` a été écarté parce que l'abrogation d'un régime existant est
          une position formalisée dans un projet de loi. Fourchette défendable :
          +1 à +1,5.
      S5:
        valeur: 2
        just: >
          La plateforme 2024 fixe une identité culturelle de référence et un
          filtre idéologico-religieux à l'entrée : « we will use existing
          Federal Law to keep foreign Christian-hating Communists, Marxists, and
          Socialists out of America », « extreme vetting to ensure that jihadists
          [...] are not admitted », retour du Travel Ban. Sur l'accès différencié
          aux prestations selon la nationalité — règle particulière du compas —
          le dossier est le plus lourd du corpus et il est EN VIGUEUR : décret
          14218 du 19 février 2025 ordonnant d'identifier tout programme fédéral
          bénéficiant à des étrangers en situation irrégulière ; avis de juillet
          2025 excluant les non-« qualified aliens » de Head Start et du Health
          Center Program ; et surtout la loi du 4 juillet 2025, qui supprime
          l'aide alimentaire pour les RÉFUGIÉS, DEMANDEURS D'ASILE RECONNUS ET
          VICTIMES DE TRAITE — donc des personnes en séjour RÉGULIER — et leur
          admissibilité à Medicaid au 1er octobre 2026. Décret 14224 faisant de
          l'anglais la langue officielle et abrogeant l'accès linguistique.
        src: [gop_plateforme_2024, eo_14218_prestations, kff_prestations_immigrants, nilc_obbba, eo_14224_anglais]
        contest: >
          NE DÉPASSE PAS LA BORNE, et pour une raison instructive. Valeur réelle
          ≈ +2,5 : il ÉGALE le RN et reste SOUS Reconquête. Il dépasse le RN sur
          la priorité nationale — mesure votée et appliquée, étendue à des
          étrangers en séjour régulier, là où le RN ne fait que la programmer —
          mais reste sous Reconquête, qui porte la remigration de personnes
          établies. Surtout, IL NE COCHE PAS la sous-dimension « restriction des
          signes religieux » : il va à l'inverse (prière et Bible à l'école,
          task force contre le biais anti-chrétien). Son pôle +2 est
          MAJORITAIRE-CHRÉTIEN, non laïque-assimilationniste — même position sur
          l'axe pour des raisons opposées à celles des partis français.
      S6:
        valeur: 2
        just: >
          Les trois sous-dimensions sont cochées simultanément, deux par des
          actes en vigueur. Financement du privé : la plateforme porte « we
          support universal school choice in every State » et la loi du
          4 juillet 2025 crée le PREMIER CRÉDIT D'IMPÔT FÉDÉRAL POUR BOURSES
          SCOLAIRES DE L'HISTOIRE AMÉRICAINE — 1 700 $ par contribuable, sans
          plafond global de dons, vers l'enseignement privé y compris
          confessionnel. Récit national : décret 14190 du 29 janvier 2025
          rétablissant la Commission 1776 et imposant une présentation
          « unifying » de la fondation des États-Unis. Contenus sur le genre :
          le même décret ordonne de SUPPRIMER LES FINANCEMENTS des écoles
          promouvant la « gender ideology ». Au niveau des États : affichage
          obligatoire du Décalogue dans chaque salle de classe en Louisiane,
          Arkansas, Alabama et Texas, validé par la cinquième cour d'appel
          fédérale ; 6 870 interdictions d'ouvrages scolaires recensées en
          2024-2025 dans 23 États.
        src: [gop_plateforme_2024, eo_14190_ecole, eo_14242_education, edchoice_ecca, texastribune_decalogue, pen_america_ouvrages]
        contest: >
          DÉPASSE LR, qui occupait seul le +2 — d'où sa redescente à +1,5. LR
          agit sur un financement du privé EXISTANT ; les républicains en ont
          CRÉÉ un nouveau, fédéral et sans plafond. Valeur réelle ≈ +2,5 à +3.
          Fédéral contre États : le financement du confessionnel et
          l'encadrement du genre sont FÉDÉRAUX et suffisent à eux seuls à
          atteindre le niveau de LR ; le Décalogue obligatoire et les retraits
          d'ouvrages sont étatiques et constituent le dépassement.
      S7:
        valeur: 2
        just: >
          Peine capitale : décret du 20 janvier 2025 — « the Attorney General
          shall pursue the death penalty for all crimes of a severity demanding
          its use », poursuite OBLIGATOIRE quand la victime est un agent de la
          force publique ou l'auteur en séjour irrégulier, obligation de fournir
          à chaque État les produits d'injection létale, et directive de FAIRE
          RENVERSER LES PRÉCÉDENTS DE LA COUR SUPRÊME qui la limitent. Moratoire
          fédéral levé en février 2025. Déploiement militaire intérieur : Garde
          nationale à Washington, Los Angeles, Portland et Chicago en 2025 ; un
          juge fédéral a jugé l'usage militaire contraire au Posse Comitatus Act
          de 1878. Détention sans procès : invocation de l'Alien Enemies Act le
          15 mars 2025, plus de 200 Vénézuéliens transférés au CECOT
          salvadorien, la Cour suprême constatant qu'un préavis de 24 heures
          « surely does not pass muster ». Demande présidentielle de juger les
          mineurs comme des adultes à Washington « starting at age 14 ».
        src: [eo_peine_capitale, crs_peine_capitale, eo_14333_caution, scotus_garde_nationale, scotus_jgg, cnn_mineurs_dc, gop_plateforme_2024]
        contest: >
          DÉPASSE NETTEMENT LR. Les trois conditions posées comme déclencheurs
          sont vérifiées sur pièces, non par approximation. Le programme de
          Retailleau, si sévère soit-il, reste À L'INTÉRIEUR DE LA PROCÉDURE
          PÉNALE ORDINAIRE. Valeur réelle ≈ +3, contre ≈ +2 pour LR : un point
          d'écart. Nuance à consigner : les déploiements militaires et l'usage
          de l'Alien Enemies Act ont été INVALIDÉS PAR LES TRIBUNAUX ET
          ABANDONNÉS, les troupes retirées le 31 décembre 2025. Ils restent des
          positions portées et exécutées par l'exécutif du parti, donc notables,
          mais ne sont plus en vigueur. À noter aussi que les peines planchers
          invoquées dans le calibrage initial sont largement ÉTATIQUES : aucun
          projet fédéral républicain de peines planchers générales n'a été
          trouvé dans la 119e législature.
      E1:
        valeur: 2
        just: >
          Plateforme 2024 : « large tax cuts for workers, and no tax on tips »,
          « make Trump tax cuts permanent [...] and pursue additional tax cuts ».
          Mise en œuvre intégrale par la loi du 4 juillet 2025 : pérennisation
          des dispositions de 2017, exonération des pourboires et des heures
          supplémentaires, déduction de 6 000 $ pour les 65 ans et plus,
          relèvement du plafond SALT, amortissement accéléré à 100 %. Aucun
          impôt sur la fortune, aucune hausse de la fiscalité du capital ; les
          analyses distributionnelles du CBO montrent un gain concentré en haut
          de distribution.
        src: [gop_plateforme_2024, cbo_obbba, cbo_distributif, irs_obbba]
        contest: >
          ARBITRAGE MAJEUR LIÉ À LA RÈGLE SUR LE PROTECTIONNISME. Les droits de
          douane sont exclus de l'axe économique. Or ils constituent en 2025-2026
          une hausse massive et RÉGRESSIVE du prélèvement obligatoire américain.
          En les excluant, on lit le Parti républicain comme un pur baissier
          d'impôts ; en les incluant, la note descendrait vers +1 à +1,5. C'est
          le seul indicateur du compas où cette exclusion déplace une note d'un
          point entier. Le parti est À l'ancrage, pas au-delà : la doctrine de
          Reconquête est d'une radicalité comparable ; ce qui distingue les
          républicains est d'avoir PROMULGUÉ leur baisse.
      E2:
        valeur: 2
        just: >
          Mesures effectivement prises, non de simples promesses. Le GAO chiffre
          la baisse des effectifs de 22 grandes agences fédérales à près de
          256 000 postes, SOIT PLUS DE 11 %, entre décembre 2024 et janvier
          2026 ; l'OPM estime qu'environ un agent civil sur huit aura disparu.
          L'USAID a été purement et simplement SUPPRIMÉE ; le ministère de
          l'Éducation a perdu près de 50 % de ses effectifs dans une démarche de
          démantèlement. DOGE revendique environ 215 Md$ d'économies.
        src: [gao_effectifs_federaux, gao_doge, opm_effectifs, pbs_doge_bilan]
        contest: >
          CONTRADICTION INTERNE À DOCUMENTER : l'État ne rétrécit pas
          uniformément, il est REDÉPLOYÉ. La loi du 4 juillet 2025 a alloué des
          sommes massives à l'application des lois migratoires et à la défense.
          L'indicateur capte la contraction de l'administration civile, qui est
          incontestable, mais manque la ré-expansion de l'État régalien. Des
          agences ont par ailleurs réembauché après la vague de coupes.
      E3a:
        valeur: 2
        just: >
          La loi du 4 juillet 2025 est chiffrée par le CBO à -1 100 Md$ de
          dépenses fédérales de santé sur 2025-2034, dont -989,7 Md$ sur le seul
          Medicaid, et à +10 MILLIONS DE PERSONNES SANS ASSURANCE en 2034 :
          conditions d'activité de 80 h/mois imposées aux adultes de l'expansion
          Medicaid, redéterminations d'éligibilité semestrielles. Les crédits
          d'impôt renforcés de l'assurance maladie ont expiré le 31 décembre
          2025, le Sénat ayant bloqué leur extension par 51 voix contre 48 ;
          primes de marché en hausse de 114 % en moyenne.
        src: [crs_obbba_sante, kff_obbba_sante, thehill_subventions_aca, gop_plateforme_2024]
        contest: >
          BORNE CONFIRMÉE EN SUBSTANCE, MAL FORMULÉE À L'ORIGINE. Le +2 était
          défini comme « contestation de la couverture universelle elle-même » :
          oui en effet, non en doctrine. La plateforme 2024 NE DEMANDE PAS
          l'abrogation de l'Affordable Care Act — rupture vérifiée avec 2012 et
          2016 — et promet de protéger Medicare sans coupe. La borne devrait
          être un critère d'EFFET : réduction législative nette de la couverture
          publique chiffrée en millions de désassurés.
      E4:
        valeur: -0.5
        just: >
          Plateforme 2024, point 14 des 20, en majuscules d'origine : « FIGHT
          FOR AND PROTECT SOCIAL SECURITY AND MEDICARE WITH NO CUTS, INCLUDING
          NO CHANGES TO THE RETIREMENT AGE ». Aucune mention de capitalisation ni
          d'allongement de la durée de cotisation dans tout le document. Mesure
          prise : la loi du 4 juillet 2025 crée une déduction de 6 000 $ pour les
          65 ans et plus, qui porte de 64 % à 88 % la part de retraites ne payant
          aucun impôt fédéral sur leurs prestations, soit environ 14 millions de
          bénéficiaires supplémentaires — une HAUSSE NETTE DES PENSIONS APRÈS
          IMPÔT.
        src: [gop_plateforme_2024, npr_social_security, thehill_deduction_aines, irs_obbba]
        contest: >
          PLACEMENT LE PLUS CONTRE-INTUITIF DU COMPAS, et il est solide : sur les
          retraites, le Parti républicain se situe À GAUCHE de LR et de
          Renaissance (+1,5) et très loin d'Horizons (+2). Ce n'est pas une
          erreur de mesure : la Social Security est le troisième rail de la
          politique américaine, et la plateforme 2024 a explicitement écrasé le
          courant interne favorable au relèvement de l'âge. Tempéré par le
          caractère TEMPORAIRE de la déduction (jusqu'en 2028) et par la création
          de comptes d'investissement fiscalement avantagés, qui relèvent de la
          capitalisation. C'EST L'INDICATEUR QUI PROUVE QUE E4 MESURE AUTRE CHOSE
          QU'UN PROXY GAUCHE-DROITE.
      E5:
        valeur: 2
        just: >
          Salaire minimum fédéral à 7,25 $/h DEPUIS JUILLET 2009, soit dix-sept
          ans sans révision, et aucun projet républicain de relèvement ; le
          décret du 14 mars 2025 a révoqué le plancher salarial des contractants
          fédéraux, que le ministère du Travail n'applique plus. Surtout, le
          décret 14251 du 27 mars 2025 SUPPRIME LE DROIT DE NÉGOCIATION
          COLLECTIVE POUR PLUS D'UN MILLION D'AGENTS FÉDÉRAUX dans une vingtaine
          d'agences, étendu avant la fête du Travail 2025 à la NASA et au service
          météorologique ; conventions collectives résiliées en août 2025, ordre
          laissé en vigueur par une cour d'appel.
        src: [eo_14251_negociation, npr_negociation_collective, dol_eo14026, congress_right_to_work]
        contest: >
          LA BORNE TIENT MAIS SA TROISIÈME CLAUSE EST MAL CHOISIE. Le
          right-to-work avec abolition de la cotisation obligatoire N'EST PAS UNE
          POSITION DE PARTI : la proposition de loi existe et rassemble environ
          56 % du caucus républicain de la Chambre, mais n'a jamais été mise aux
          voix et n'apparaît nulle part dans la plateforme 2024. Exiger ce
          critère obligerait à remonter LR et le PCQ, ce qui serait une erreur :
          l'ampleur EFFECTIVE du recul américain dépasse de très loin ce que ces
          partis PROPOSENT. La clause devrait être réécrite en « suppression par
          voie exécutive des droits de négociation collective pour plus d'un
          million d'agents publics ».
      E6:
        valeur: 2
        just: >
          Décret 14192 de janvier 2025 : obligation pour chaque agence d'ABROGER
          AU MOINS DIX RÈGLEMENTS POUR CHAQUE RÈGLEMENT NOUVEAU, et exigence que
          le coût incrémental de la réglementation nouvelle soit « significativement
          inférieur à zéro ». Surtout, la règle finale du 18 février 2026 abroge
          l'endangerment finding de 2009 ET toutes les normes fédérales
          d'émission de gaz à effet de serre des véhicules de 2012 à 2027 et
          au-delà — présentée par l'agence environnementale comme « la plus
          importante action de dérégulation de l'histoire des États-Unis », avec
          une économie revendiquée de plus de 1 300 Md$. La suppression de
          l'endangerment finding DETRUIT LE FONDEMENT JURIDIQUE DE TOUTE
          REGULATION CLIMATIQUE au titre du Clean Air Act.
        src: [federal_register_endangerment, epa_eo_14192, npr_endangerment, gop_plateforme_2024]
        contest: >
          LIMITE MÉTHODOLOGIQUE LA PLUS SÉRIEUSE DE L'EXERCICE. Les droits de
          douane sont la plus grande intervention sur les prix de marché de
          l'histoire américaine récente ; les exclure produit une lecture du
          Parti républicain comme pur dérégulateur. Il est en réalité
          SIMULTANÉMENT le dérégulateur le plus radical ET l'interventionniste
          sur les prix le plus radical des dix-huit forces, et l'axe économique
          tel que construit ne peut pas le montrer.
