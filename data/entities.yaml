  - name: Parti libéral du Canada
    sigle: PLC
    label_pos: bottom center
    chef: Mark Carney
    country: Canada
    color: "#D71920"
    as_of: "2026-09-17"
    souverainete: multilateraliste
    ecologie: reformiste
    estimation_initiale: {economie: 2, societe: -2}
    autorite: null
    resume: >
      Au gouvernement. Centrisme pragmatique : abolition de la taxe carbone
      pour les consommateurs, hausse des dépenses de défense, grands projets
      d'infrastructure, diversification commerciale face aux tarifs américains.
      Modérément progressiste sur les questions de société.
    indicateurs:

      S1:
        valeur: 0.5
        just: >
          Le Plan des niveaux d'immigration 2026-2028, premier du gouvernement
          Carney, publié le 4 novembre 2025, stabilise les admissions
          permanentes à environ 380 000 par an — nettement sous les cibles du
          début de la décennie — et poursuit la réduction des résidents
          temporaires (385 000 en 2026, 370 000 ensuite), avec l'objectif de
          ramener la population temporaire sous 5 % de la population totale d'ici
          fin 2027. À enveloppe constante, le plan augmente la part économique
          (environ 64 % du total) et RÉDUIT les volets familial et réfugiés.
          Contrepoids : engagement à porter l'immigration francophone hors
          Québec à 12 % d'ici 2029, et niveaux absolus parmi les plus élevés de
          l'OCDE par habitant.
        src: [ircc_plan_niveaux_2026]
        contest: >
          Aligné sur la CAQ et Renaissance : baisse assumée et réduction du
          regroupement familial, mais sans expulsions accrues ni restriction de
          l'accès à la nationalité.
      S2:
        valeur: -1.5
        just: >
          La plateforme 2025 consacre une section « Protecting Your Sexual and
          Reproductive Health and Rights » : pérennisation du Fonds pour la santé
          sexuelle et reproductive « to ensure that there will always be funding
          for abortion care in Canada », et programme de FIV couvrant jusqu'à
          20 000 $ par cycle. Carney : « I absolutely support a woman's right to
          choose ». Le gouvernement applique la Loi canadienne sur la santé pour
          sanctionner les provinces qui facturent l'avortement en clinique.
        src: [plc_plateforme_2025, cbc_plateforme_repro, arcc_bilans]
        contest: >
          Un cran au-dessus du PLQ parce que le PLC finance activement, un cran
          en dessous du -2 faute de garantie législative : l'avortement au Canada
          repose sur l'ABSENCE DE LOI PÉNALE depuis 1988, et les libéraux n'ont
          jamais légiféré un droit positif. Réserve signalée par les
          organisations de défense : le cabinet Carney de mai 2025 a supprimé les
          postes de ministre des Femmes et de l'Égalité des genres et de ministre
          de la Diversité.
      S3:
        valeur: -1.5
        just: >
          Acquis législatif : interdiction des thérapies de conversion adoptée en
          2021 sous gouvernement libéral, et plan d'action fédéral 2SLGBTQI+
          financé. La plateforme 2025 justifie explicitement le programme de FIV
          à 20 000 $ par l'accès à la parentalité « especially 2SLGBTQI+
          Canadians who face a costly journey to parenthood » — mesure
          d'extension de la parentalité.
        src: [plc_plateforme_2025, bc_humanist_plateformes]
        contest: >
          Un cran au-dessus du PLQ et de Renaissance grâce à l'interdiction
          effective des thérapies de conversion et à l'extension de la
          parentalité. N'atteint pas -2 : pas de norme nationale opposable sur
          l'accès à la transition, la santé étant de compétence provinciale, et
          suppression des ministères de l'Égalité des genres et de la Diversité
          dans le cabinet de mai 2025.
      S4:
        valeur: -1.5
        just: >
          Le PLC est l'auteur des deux lois qui ont créé puis élargi l'aide
          médicale à mourir au Canada : C-14 en 2016 et C-7, adopté en mars 2021
          par 180-149, qui a ouvert le volet 2 aux personnes dont la mort n'est
          PAS raisonnablement prévisible — régime plus large que la loi française
          de 2026, qui exige une phase avancée ou terminale. Le gouvernement a
          renoncé à contester la loi québécoise sur les demandes anticipées et a
          conduit une consultation nationale close en octobre 2025. Mais il n'a
          PAS légiféré les demandes anticipées et a reporté deux fois
          l'admissibilité pour maladie mentale, jusqu'au 17 mars 2027.
        src: [justice_canada_amm, cbc_c7_vote, sante_canada_demandes_anticipees]
        contest: >
          Exactement au niveau de LFI et du PS, mais pour une raison INVERSE : la
          France plafonne à -1,5 faute de demandes anticipées alors que son
          éligibilité est plus étroite ; le PLC plafonne à -1,5 faute de demandes
          anticipées alors que son éligibilité est plus large. Les deux
          limitations se compensent. Seul le Québec autorise les demandes
          anticipées, depuis le 30 octobre 2024 : c'est ce qui lui réserve le -2.
      S5:
        valeur: -1.5
        just: >
          Avec LFI et le NPD, l'une des trois seules forces du compas a AGIR
          pour lever une restriction religieuse en vigueur — et la seule à le
          faire par un acte de gouvernement. Carney a repris en janvier 2025
          l'engagement d'intervenir devant la Cour suprême contre la loi 21
          québécoise ; le gouvernement fédéral est intervenu à l'audience du
          23 au 26 mars 2026, demandant en outre des limites à l'usage répété ou
          préventif de la clause dérogatoire, au motif que « the prolonged
          impossibility of exercising a right or freedom would, in practice, be
          tantamount to denying its very existence ». Ottawa a refusé de retirer
          son mémoire malgré la demande des provinces conservatrices. Le même
          gouvernement a fait adopter la Loi sur la lutte contre la haine
          (C-9, sanctionnée le 18 juin 2026), protégeant l'accès aux lieux de
          culte.
        src: [globe_loi21_cour_supreme, ccla_audience_loi21, cbc_c9_haine]
        contest: >
          RÉSULTAT CONTRE-INTUITIF, signalé comme tel : un parti de gouvernement
          centriste se retrouve plus multiculturaliste que le PLQ et le PS. Il
          ne va pas jusqu'à LFI : il agit par voie contentieuse en demandant un
          encadrement de la clause dérogatoire, non par un engagement
          d'abrogation. Les baisses de seuils d'immigration de Carney relèvent de
          S1 et ne sont pas comptées ici.
      S6:
        valeur: -0.5
        just: >
          L'éducation est une compétence PROVINCIALE EXCLUSIVE au Canada et le
          financement des écoles confessionnelles est verrouillé
          constitutionnellement : le PLC n'a aucune prise sur les deux premières
          sous-dimensions et n'en propose aucune. Les seuls éléments versés au
          dossier sont du côté négatif : programme national d'alimentation
          scolaire (1 G$) et maintien du réseau de garde à 10 $/jour renforcent
          l'offre publique ; C-9 crée une infraction d'intimidation aux abords
          des écoles. Des ministres fédéraux ont publiquement combattu les
          politiques provinciales de consentement parental aux changements de
          prénom et de pronom.
        src: [plc_canada_strong, presse_canadienne_genre_ecole]
        contest: >
          NOTE LA PLUS FRAGILE DU LOT CANADIEN. Les déclarations sur le genre à
          l'école datent de 2023 et de l'ère Trudeau, PAS de Carney, et aucune
          prise de position équivalente du gouvernement actuel n'a été trouvée.
          `absent` a été écarté — il y a des positions et des dépenses réelles —
          mais -0,5 doit se lire « faiblement négatif ET faiblement documenté »,
          non comme un équivalent des -0,5 français.
      S7:
        valeur: 1
        just: >
          Le gouvernement Carney a LÉGIFÉRÉ un durcissement substantiel, à
          contre-courant de sa propre loi de 2022 qui abrogeait de nombreuses
          peines minimales. Le projet C-14, sanctionné le 15 juin 2026 et en
          vigueur le 15 juillet, comporte plus de 80 clauses : extension de
          l'INVERSION DU FARDEAU DE LA PREUVE au cautionnement pour les
          infractions graves et liées au crime organisé, précision que le
          principe de retenue n'emporte pas remise en liberté automatique,
          PEINES CONSECUTIVES OBLIGATOIRES en cas de condamnations multiples,
          interdiction des peines avec sursis pour certaines infractions
          sexuelles. Le gouvernement a imposé la clôture du débat le 12 juin
          2026 : 166 libéraux pour, TOUS LES AUTRES PARTIS CONTRE.
        src: [justice_canada_c14, legisinfo_c14, ourcommons_vote_155, canada_reforme_cautionnement]
        contest: >
          Contrepoids réel : les libéraux ont rejeté la motion conservatrice
          « Jail Not Bail » puis le projet C-242, et refusent le rétablissement
          des peines planchers. +1 — au-dessus de la CAQ, au niveau de
          Renaissance — reflète un durcissement législatif effectif sans bascule
          vers l'automaticité des peines. Réserve d'archive : aucune ventilation
          par parti du vote de troisième lecture sur C-14 n'a pu être retrouvée,
          seule la division sur la clôture est indexée.
      E1:
        valeur: 0.5
        just: >
          Deux mesures de sens opposé, à dominante baissière. Baisse du taux
          marginal de la première tranche de 15 % à 14 %, pleine au 1er janvier
          2026, coûtant 4 214 M$ en 2025-26 et montant à 6 077 M$ en 2028-29. Et
          surtout ANNULATION DE LA HAUSSE DU TAUX D'INCLUSION DES GAINS EN
          CAPITAL — retour de 66,7 % à 50 % —, coûtant 4 456 M$ en 2028-29 :
          une réduction nette de la fiscalité du capital. Suppression de la taxe
          carbone consommateur le 14 mars 2025. Aucune baisse de l'impôt sur les
          sociétés, aucun impôt sur la fortune, taux marginal supérieur
          inchangé.
        src: [plc_plan_fiscal_2025, cbc_budget_2025]
        contest: >
          Arbitrage entre 0 (baisse ciblée sur le bas de barème, geste
          progressif) et +1 (annulation de la hausse sur le capital, coût
          croissant, aucune contrepartie sur le haut). +0,5 place le PLC entre le
          PLQ et le RN, à droite de la CAQ : conséquence directe du renoncement
          sur les gains en capital.
      E2:
        valeur: 1
        just: >
          Budget 2025, adopté de justesse 170-168 : revue exhaustive des
          dépenses produisant 13 Md$ d'économies annuelles d'ici 2028-29 et
          60 Md$ sur cinq ans ; RÉDUCTION DE LA FONCTION PUBLIQUE DE 16 000 ETP
          SUR TROIS ANS, l'effectif passant de 368 000 à 330 000 d'ici 2028-29,
          soit environ 38 000 postes ou -10 %. Croissance des dépenses de
          fonctionnement plafonnée sous 2 %/an. Contrepoids : déficit total de
          78 Md$, dépense en capital de 53,1 Md$, création de la société d'État
          Build Canada Homes.
        src: [cbc_budget_effectifs, plc_plan_fiscal_2025, cbc_budget_adoption]
        contest: >
          RÉSULTAT CONTRE-INTUITIF : sur cet indicateur, le budget libéral
          PROMULGUÉ coupe davantage que la plateforme conservatrice ne le
          PROPOSAIT — 13 Md$/an et 38 000 agents, contre environ 5 Md$/an côté
          PCC. La CBC a elle-même titré « Is Mark Carney's budget a Progressive
          Conservative budget ? ». Le PLC se retrouve à droite de la CAQ, au
          niveau du PLQ et du PQ. Le contrepoids capital interdit d'aller
          au-delà.
      E3a:
        valeur: -1.5
        just: >
          Défense du socle universel de la Loi canadienne sur la santé et
          maintien, contre les coupes budgétaires, des programmes de soins
          dentaires, d'assurance-médicaments et de garderies, explicitement
          épargnés par la revue de dépenses. Budget 2025 : 2 Md$ pour les
          infrastructures critiques de santé, 500 M$ pour les places en médecine
          et en résidence. CONTREPOIDS MAJEUR : l'assurance-médicaments est
          GELÉE — quatre provinces signataires, soit environ 17 % de la
          population, aucune entente depuis l'arrivée de Carney.
        src: [cbc_pharmacare_gel, cbc_pharmacare_expiration, sante_canada_pharmacare, plc_plan_fiscal_2025]
        contest: >
          BIAIS DE SOCLE à garder en tête : le point de départ canadien —
          interdiction de la facturation privée pour les services assurés — est
          structurellement plus public que le français, si bien qu'un parti qui
          se contente de le défendre se situe déjà à gauche des ancrages
          français. L'échelle mesure le système approuvé, pas la distance au
          centre de son propre pays.
      E3b:
        valeur: -1
        just: >
          Assouplissements de l'assurance-emploi liés au choc tarifaire :
          programme de travail partagé, suspension de la restriction de six mois
          sur les indemnités de départ, accès facilité — 3,6 Md$ sur trois ans.
        src: [plc_plan_fiscal_2025]
        contest: >
          -1 et non -1,5 : ces assouplissements sont explicitement TEMPORAIRES
          et justifiés par le choc tarifaire, non une refondation du régime.
      E4:
        valeur: -0.5
        just: >
          Carney a déclaré qu'il n'y aurait aucune coupe dans les pensions ni la
          Sécurité de la vieillesse, explicitement exclues de la revue de
          dépenses. Âge de 65 ans maintenu, majoration de 10 % pour les 75 ans
          et plus maintenue. Plateforme chiffrée : 600 M$ de « protection de
          l'épargne-retraite » par réduction de 25 % du retrait minimum
          obligatoire — mesure de capitalisation — et 1 137 M$ de majoration
          TEMPORAIRE du Supplément de revenu garanti. Aucun allongement de la
          durée de cotisation, aucun report de l'âge.
        src: [plc_plan_fiscal_2025, cbc_carney_retraites]
        contest: >
          -1 défendable si l'on compte la majoration du supplément comme une
          hausse de pension, mais elle est explicitement temporaire et justifiée
          par le choc tarifaire, tandis que la mesure permanente relève de la
          capitalisation.
      E5:
        valeur: -0.5
        just: >
          Cadre en vigueur favorable aux salariés : la loi anti-briseurs de
          grève est en vigueur depuis le 20 juin 2025 — interdiction des
          travailleurs de remplacement dans les entreprises de compétence
          fédérale, sous peine de 100 000 $ d'amende par jour — et le
          gouvernement Carney ne l'a pas remise en cause. Salaire minimum
          fédéral à 18,15 $/h au 1er avril 2026, INDEXÉ AUTOMATIQUEMENT à
          l'indice des prix. Contrepoids : 16 000 suppressions de postes,
          dénoncées par les syndicats du secteur public.
        src: [edsc_briseurs_greve, edsc_salaire_minimum, cbc_syndicats_budget]
        contest: >
          -1 défendable si l'on crédite le gouvernement du maintien de la loi
          anti-briseurs de grève. -0,5 retenu parce que cette loi est un héritage
          de l'entente avec le NPD sous Trudeau, VOTÉE AUSSI PAR LES
          CONSERVATEURS, donc non discriminante entre partis canadiens ; ce que
          le PLC apporte en propre est de la formation d'un côté et 16 000
          suppressions de postes de l'autre.
      E6:
        valeur: 0.5
        just: >
          Repositionnement déréglementateur substantiel et documenté. Suppression
          de la taxe carbone consommateur le 14 mars 2025, premier acte de Carney
          comme premier ministre. Loi C-5 sanctionnée le 26 juin 2025 :
          le Cabinet peut désigner des « projets d'intérêt national » et
          COURT-CIRCUITER L'EXAMEN RÉGLEMENTAIRE FÉDÉRAL. Protocole d'entente
          avec l'Alberta en novembre 2025 : prix carbone industriel ramené à
          130 $/t en 2040 au lieu de 170 $/t en 2030 — affaiblissement et report
          de dix ans. Le budget signale que le plafond d'émissions du secteur
          pétrolier et gazier pourrait être abandonné. Carney sur les politiques
          climatiques de Trudeau : « too much regulation, not enough action ».
        src: [canada_c5, legisinfo_c5, cbc_carney_climat, cbc_entente_alberta, cbc_plafond_petrolier]
        contest: >
          Le PLC PASSE DU CÔTÉ DÉRÉGULATEUR, au niveau du RN et de Renaissance,
          à droite de la CAQ et du PLQ. Déplacement majeur par rapport au Parti
          libéral de 2021-2024, porté par des mesures effectivement prises. Si le
          compas note des partis et non des gouvernements, il faut choisir : la
          plateforme d'avril 2025 promettait de RESSERRER la tarification
          industrielle, l'action de gouvernement l'a AFFAIBLIE. C'est l'action
          qui a été notée.
  - name: Parti conservateur du Canada
    sigle: PCC
    label_pos: bottom left
    chef: Pierre Poilievre
    country: Canada
    color: "#1A4782"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: 6, societe: 4}
    autorite: null
    resume: >
      Opposition officielle. Baisses d'impôts, réduction des dépenses
      fédérales, opposition à la taxe carbone, accélération des projets
      énergétiques. Discours de fermeté sur la criminalité. Populisme
      économique centré sur le coût de la vie et le logement.
    indicateurs:

      S1:
        valeur: 1.5
        just: >
          Le 14 juillet 2025, Poilievre a réclamé des « very hard caps » sur
          l'immigration et déclare : « WE NEED MORE PEOPLE LEAVING THAN COMING »
          pour les deux années suivantes, au motif que « our country is divided
          and we're not able to integrate people at this pace ». La plateforme
          2025 ramène l'immigration permanente à « a sustainable rate similar to
          the levels under the Harper government », soit 240 000 à 285 000 par
          an, et vise à réduire de moitié le nombre de résidents non permanents.
        src: [rci_poilievre_caps, cicnews_comparaison_2025]
        contest: >
          Arbitrage entre +1,5 et +2. « More people leaving than coming » est
          littéralement un objectif de solde migratoire négatif, que seule
          Reconquête formule en France. +1,5 retenu parce que l'objectif est
          explicitement TRANSITOIRE et non structurel comme la remigration,
          qu'il vise le flux global et non le retrait du statut de résidents
          installés, que le niveau permanent cible reste proportionnellement
          supérieur à ce que proposent LR ou le RN, et qu'aucune restriction de
          l'accès à la nationalité n'est annoncée.
      S2:
        valeur: 0
        just: >
          Le 11 avril 2025, en campagne, Poilievre a déclaré : « I can guarantee
          you there will be no laws restricting abortion passed when I'm prime
          minister ». C'est un statu quo EXPLICITE, qui relève donc d'une note
          chiffrée et non d'`absent`. Il a toutefois refusé de dire si ses
          députés disposeraient d'un vote libre sur des projets de loi émanant
          de députés, et il défendait publiquement des positions anti-avortement
          avant sa prise de direction.
        src: [ctv_poilievre_avortement, greenpeace_bilan_pcc]
        contest: >
          Arbitrage entre 0 et +0,5. En faveur de +0,5 : le groupe parlementaire
          comporte une aile anti-avortement substantielle qui vote régulièrement
          les projets de loi restrictifs d'initiative parlementaire, et le parti
          s'oppose au financement public du volet santé reproductive dans l'aide
          internationale. En faveur de 0, retenu : l'engagement du chef est
          explicite, daté et public, et l'échelle note une position, pas un
          pronostic. À trancher par la ventilation d'un vote nominal récent sur
          ourcommons.ca, non vérifiée.
      S3:
        valeur: 1
        just: >
          En septembre 2023, au congrès de Québec, les membres ont adopté à 69 %
          une résolution engageant un futur gouvernement conservateur à interdire
          « life-altering medicinal or surgical interventions » pour les moins de
          18 ans en démarche de transition. En février 2024, Poilievre a rendu sa
          position explicite : opposé aux bloqueurs de puberté pour les moins de
          18 ans, et favorable a l'exclusion des « biological males » des sports,
          vestiaires et toilettes féminins — « female spaces should be
          exclusively for females » —, tout en relevant que ces espaces relèvent
          largement des provinces.
        src: [cbc_congres_pcc_2023, cbc_poilievre_bloqueurs, cbc_poilievre_espaces]
        contest: >
          Arbitrage entre +1 et +1,5. Interdire les bloqueurs de puberté est un
          RETRAIT D'UN ACCÈS EXISTANT, pas une simple opposition à une extension.
          +1 retenu parce que le PCC ne touche ni au mariage entre personnes de
          même sexe, ni aux protections anti-discrimination, ni à l'accès des
          adultes à la transition, et ne porte aucune interdiction
          d'enseignement au niveau fédéral. Réserve de datation : la résolution
          de 2023 n'a jamais été reprise dans la plateforme 2025, le chef n'étant
          pas lié par les résolutions de congrès.
      S4:
        valeur: 0.5
        just: >
          Les conservateurs ont voté CONTRE C-7 en mars 2021. Poilievre s'engage
          à abroger l'élargissement à la maladie mentale déjà inscrit dans la
          loi : « we will revoke it entirely ». Mais il précise que « MAID will
          continue to be available for people who have irremediable health
          conditions, physical health conditions, as it is now ».
        src: [global_poilievre_amm, pcc_communique_amm, cbc_culture_of_death]
        contest: >
          ARBITRAGE TRANSTERRITORIAL DÉLICAT. Lecture absolue : le PCC
          maintiendrait un régime plus permissif que la loi française de 2026, ce
          qui le placerait sous LFI et le PS — résultat absurde. Lecture
          directionnelle : il a voté contre la loi en vigueur et veut abroger un
          élargissement déjà voté, ce qui donnerait +1 à +1,5. +0,5 arbitré :
          « restriction des critères existants » est littéralement satisfait,
          mais l'engagement de maintenir l'aide à mourir pour les affections
          physiques interdit de l'assimiler à l'opposition de principe de LR et
          du RN. Fourchette défendable : 0 à +1. Ce point mériterait une règle
          explicite du compas.
      S5:
        valeur: 0.5
        just: >
          Poilievre a formulé en 2025 le marqueur assimilationniste le plus
          explicite du paysage fédéral canadien : « we want a nation with NO MORE
          HYPHENS, no more group labels » — rejet frontal du vocabulaire
          multiculturaliste canadien. Le chapitre 7 de la plateforme d'avril
          2025 s'intitule « protect our shared Canadian identity for a change » :
          rétablissement des statues de John A. Macdonald, peines alourdies pour
          dégradation de monuments, « stop the war on our history ».
        src: [ncm_poilievre_hyphens, pcc_plan_2025, globe_pcc_loi21]
        contest: >
          +0,5 et non +1 malgré une rhétorique identitaire nette, parce que la
          sous-dimension « restriction des signes religieux » est INVERSÉE :
          Poilievre est opposé à la loi 21 depuis 2022 et son caucus a combattu
          C-9 en déposant vingt amendements visant à RESTAURER la défense
          religieuse. Le PCC se retrouve donc au niveau d'Horizons et du PCQ,
          mais pour des raisons différentes, et en dessous de la CAQ et du PQ qui
          portent une interdiction en vigueur. Lacune assumée : aucune mesure
          fédérale conservatrice d'accès différencié aux prestations selon la
          nationalité n'a été trouvée — c'est un manque, pas un zéro.
      S6:
        valeur: 1
        just: >
          Deux sous-dimensions sur trois cochées, la troisième étant hors de
          portée fédérale. Contenus sur le genre et autorité parentale :
          Poilievre a déclaré que « parents should be the final authority on the
          values and the lessons that are taught to children » et a sommé le
          premier ministre de ne pas s'ingérer dans les politiques provinciales
          de consentement parental. La déclaration de principes de septembre 2023
          interdit les interventions de transition aux mineurs (69 %) et réserve
          les espaces non mixtes (87 %). Récit national : chapitre 7 de la
          plateforme d'avril 2025.
        src: [cbc_congres_pcc_2023, cbc_poilievre_parents, pcc_plan_2025]
        contest: >
          +1 et non +1,5 : la déclaration de principes de 2023 justifierait le
          niveau du PCQ, mais elle NE LIE PAS LE CHEF et n'a pas été reprise dans
          la plateforme de 2025. Aucun engagement fédéral de financement du privé
          ou du confessionnel : Poilievre renvoie systématiquement l'éducation
          aux provinces.
      S7:
        valeur: 1.5
        just: >
          La loi « three strikes and you're out » annoncée en avril 2025 prévoit
          qu'une troisième condamnation pour infraction grave prive de
          cautionnement, de probation et de libération conditionnelle, avec une
          PEINE MINIMALE OBLIGATOIRE DE DIX ANS pouvant aller jusqu'à la
          perpétuité. Poilievre s'est engagé à devenir LE PREMIER PREMIER
          MINISTRE CANADIEN À INVOQUER LA CLAUSE DÉROGATOIRE pour écarter des
          droits garantis par la Charte, afin que les auteurs de meurtres
          multiples meurent en prison. En comité sur C-14, les conservateurs ont
          proposé d'abroger entièrement le principe de retenue et de rétablir les
          peines minimales obligatoires.
        src: [pcc_three_strikes, cbc_poilievre_derogatoire, ourcommons_vote_40, legisinfo_c242]
        contest: >
          Arbitrage contre LR. Le paquet de LR est plus LARGE (suppression du
          juge d'application des peines, majorité pénale à 15 ans, prisons
          privées) ; le PCC n'a aucun équivalent sur ces deux derniers points. Il
          a en revanche un élément que LR n'a pas : le recours annoncé à
          l'OVERRIDE CONSTITUTIONNEL pour soustraire la détermination de la peine
          au contrôle judiciaire. Les deux paquets sont du même ordre de
          grandeur, d'où l'égalité à +1,5.
      E1:
        valeur: 1.5
        just: >
          Baisse du taux de la première tranche de 15 % à 12,75 %, coûtant 14 Md$
          par an à terme, présentée comme « 900 $ par travailleur moyen ».
          Exonération totale de gains en capital pour toute personne ou
          entreprise réinvestissant le produit de cession au Canada. TAXPAYER
          PROTECTION ACT : interdiction d'instaurer une nouvelle taxe ou d'en
          relever une SANS RÉFÉRENDUM PRÉALABLE. Suppression de la taxe de vente
          sur les logements neufs jusqu'à 1,3 M$. Abrogation de la TOTALITÉ de la
          loi sur la tarification carbone.
        src: [cbc_plateforme_pcc, pcc_reinvestment_tax_cut, pcc_carbon_tax]
        contest: >
          DÉPASSEMENT PARTIEL SIGNALÉ. Le Taxpayer Protection Act est un verrou
          constitutionnel de fait qu'aucun parti français ou québécois du palier
          +1,5 ne propose ; c'est un dispositif de type PCQ ou Reconquête.
          Argument inverse retenu pour rester à +1,5 : la baisse ne porte que sur
          la tranche inférieure, le PCC ne propose ni baisse du taux supérieur ni
          baisse de l'impôt sur les sociétés, et la plateforme porte 106 Md$ de
          mesures nouvelles sur quatre ans. Si le compas pondérait les verrous
          institutionnels, +2 serait défendable.
      E2:
        valeur: 1.5
        just: >
          Engagement de réduire le déficit libéral de 70 % en coupant
          « bureaucratie, consultants, aide étrangère et groupes d'intérêt ».
          Coupes chiffrées sur quatre ans : aide étrangère -9,4 Md$,
          DÉFINANCEMENT DE CBC en préservant Radio-Canada et d'autres sociétés
          d'État -4 Md$, rationalisation de la fonction publique -4,3 Md$.
          Doctrine affichée de privatisation partielle : cession de terrains
          fédéraux et de sociétés d'État.
        src: [cbc_plateforme_pcc]
        contest: >
          TENSION À ARBITRER. Le montant net est modeste — environ 20 Md$ de
          coupes contre 106 Md$ de mesures nouvelles sur quatre ans — et
          Poilievre a explicitement protégé les soins dentaires,
          l'assurance-médicaments, les garderies, les transferts en santé et les
          pensions. C'est donc un +1,5 DOCTRINAL plus qu'arithmétique. Si l'on
          notait uniquement l'effet budgétaire net, le PCC descendrait à +1 et
          passerait SOUS le PLC.
      E3a:
        valeur: -0.5
        just: >
          Position existante et explicite, non une absence : Poilievre s'est
          engagé à MAINTENIR les couvertures fédérales existantes en soins
          dentaires, assurance-médicaments et garderies, mais a REFUSÉ DE
          S'ENGAGER SUR LEUR EXTENSION prévue. Aucune proposition de facturation
          privée, de ticket modérateur ou de modification de la Loi canadienne
          sur la santé. La plateforme 2025 est quasi muette sur la santé.
        src: [cbc_poilievre_programmes_sociaux, cbc_plateforme_pcc]
        contest: >
          -1 serait défendable, au niveau de la CAQ et du PLQ, si l'on pondère
          l'absence totale de plancher privatisateur : le PCC est, sur le
          papier, MOINS privatisateur que la CAQ, qui a activement élargi la
          prestation privée au Québec. -0,5 retenu en pondérant le refus
          explicite d'extension.
      E3b:
        absent: true
        just: >
          Recherche faite, rien trouvé : aucun projet de resserrement ni
          d'élargissement de l'assurance-emploi n'a été identifié dans la
          plateforme 2025 ni dans les communiqués du parti.
        src: [cbc_plateforme_pcc]
      E4:
        valeur: 0
        just: >
          Trois éléments opposés qui se compensent. Côté négatif : engagement
          explicite de protéger les pensions « en maintenant l'âge de la retraite
          à 65 ans », et autorisation pour les aînés de gagner jusqu'à 34 000 $
          en franchise d'impôt. Côté positif : REFUS DE S'ENGAGER sur la hausse
          de 10 % de la Sécurité de la vieillesse pour les 65-74 ans, alors que
          le caucus avait voté une motion en ce sens ; et extension de la
          capitalisation — croissance des régimes enregistrés prolongée de deux
          ans et bonification du compte d'épargne libre d'impôt.
        src: [pcc_aines, cbc_poilievre_pensions]
        contest: >
          ZÉRO MESURE, PAS ZÉRO PAR DÉFAUT. Comme pour le Parti républicain, il
          faut souligner que la droite nord-américaine est TRÈS LOIN du cluster
          LR-Renaissance (+1,5) et d'Horizons (+2) : aucune des deux ne propose
          de report de l'âge ni d'allongement de cotisation. C'est le trait
          structurel le plus net de cet indicateur en Amérique du Nord.
      E5:
        valeur: 0
        just: >
          LES CONSERVATEURS ONT VOTÉ POUR la loi interdisant les travailleurs de
          remplacement, et le bureau de Poilievre a indiqué qu'un gouvernement
          conservateur la MAINTIENDRAIT. Aucune proposition de right-to-work,
          aucune proposition de gel ou de suppression du salaire minimum fédéral,
          aucune désindexation. La plateforme 2025 est muette sur le droit du
          travail ; son contenu « travail » est la formation en apprentissage.
        src: [cbc_pcc_vote_briseurs, cbc_pcc_maintien_loi]
        contest: >
          RÉSULTAT TRANSTERRITORIAL IMPORTANT : le Parti conservateur du Canada
          se situe À GAUCHE du PLQ et du RN sur cet indicateur, et à un point et
          demi du cluster LR-PCQ-Horizons-Renaissance. Ce n'est pas une lacune de
          mesure : le PCC courtise activement les syndicats du secteur privé et a
          fait le choix stratégique explicite de ne pas rouvrir le droit du
          travail. Zéro mesure sur vote enregistré, non zéro par défaut.
      E6:
        valeur: 1.5
        just: >
          Abrogation de la loi d'évaluation d'impact, dite « No-New-Pipelines
          Law », soit la SUPPRESSION DU RÉGIME FÉDÉRAL D'ÉVALUATION D'IMPACT.
          Abrogation de l'interdiction de circulation des pétroliers sur la côte
          ouest. Suppression du plafond d'émissions du secteur énergétique.
          Abrogation de la TOTALITÉ de la loi sur la tarification carbone, Y
          COMPRIS LE FILET DE SÉCURITÉ FÉDÉRAL qui oblige les provinces à imposer
          une tarification industrielle. Allègement réglementaire chiffré à
          6,4 Md$ de recettes projetées.
        src: [pcc_carbon_tax, cbc_poilievre_carbone_industriel, pcc_energie, pcc_canada_first]
        contest: >
          +2 EST DÉFENDABLE : abroger intégralement le prix du carbone, y compris
          industriel, et supprimer le régime fédéral d'évaluation d'impact va
          au-delà de ce que LR propose en France, et même le RN ne propose pas la
          suppression pure et simple du marché carbone applicable à son
          industrie. +1,5 retenu parce que le PCC ne propose pas de
          démantèlement réglementaire généralisé hors énergie et environnement et
          conserve les normes de sécurité, de concurrence et de consommation.
          Arbitrage serré, à un demi-pas.
  - name: Nouveau Parti démocratique
    sigle: NPD
    label_pos: bottom center
    chef: Avi Lewis
    country: Canada
    color: "#F37021"
    as_of: "2026-09-17"
    souverainete: multilateraliste
    ecologie: planificateur
    estimation_initiale: {economie: -5, societe: -5}
    autorite: null
    resume: >
      Avi Lewis dirige le parti depuis le 29 mars 2026, élu au premier tour
      avec 56 % des voix face à quatre autres candidats ; il succède à Jagmeet
      Singh. Social-démocrate : assurance médicaments et soins dentaires
      publics, logement abordable, droits des travailleurs, taxation des
      grandes fortunes. Sa ligne sur l'immigration et les droits des personnes
      trans est nettement plus à gauche que celle de son prédécesseur.
    indicateurs:

  # -------------------------------------------------------------------- Québec
  # Scrutin le 5 octobre 2026 : les chefs peuvent changer, les plateformes
  # restent valides comme positions datées.
      S1:
        valeur: -2
        just: >
          Le 31 mars 2026, deux jours après son élection, Avi Lewis déclare :
          « we will reverse Prime Minister Mark Carney's cuts to immigration
          levels ». Il propose « a single-tier immigration system, based on
          permanent residency and STATUS ON ARRIVAL, that gives rights and
          stability » — soit la régularisation généralisée, marqueur le plus fort
          du pôle. Il veut un système qui « reunites families, welcomes refugees
          fleeing wars around the world », mettre fin aux règles liant les
          travailleurs étrangers à un employeur unique et supprimer les limites
          « based on sector, hours, occupation, or category ».
        src: [walrus_lewis_immigration]
        contest: >
          Occupe la même case que LFI, avec un argument d'égalité stricte :
          statut à l'arrivée, reversion des baisses, regroupement familial
          élargi et accueil des réfugiés, soit le paquet complet de l'échelle.
          Rupture nette avec la ligne plus prudente du NPD sous Jagmeet Singh ;
          la note est datée de mars 2026, donc postérieure au changement de
          direction.
      S2:
        valeur: -2
        just: >
          Le NPD s'engage à faire appliquer la Loi canadienne sur la santé pour
          empêcher les provinces d'ériger des barrières à l'avortement, à
          améliorer l'accès en régions rurales et nordiques, et à couvrir la
          contraception et la pilule abortive dans l'assurance-médicaments, soit
          un remboursement public intégral. Il s'engage à ne jamais soutenir ni
          adopter de loi restreignant l'avortement.
        src: [ndp_justice_reproductive]
        contest: >
          RÉSERVE DE DATATION : ces documents sont antérieurs à l'arrivée d'Avi
          Lewis en mars 2026, et aucune déclaration de lui sur l'avortement n'a
          été trouvée. Rien n'indique d'inflexion, la ligne pro-choix du NPD
          étant constante depuis sa fondation, mais la note est à revalider sur
          une source postérieure.
      S3:
        valeur: -2
        just: >
          Interrogé le 19 février 2026, Lewis s'engage à « establish a National
          Standard of Care for transgender and gender-diverse patients », avec
          financement fédéral accru conditionné au respect de cette norme par les
          provinces — extension active de l'accès à la transition. Il qualifie
          les interdictions visant les athlètes trans de « shameful » : « trans
          women belong in women's sports just as much as any other female
          athlete ». Il juge la politique québécoise sur les personnes trans
          incarcérées « deeply concerning ».
        src: [xtra_lewis_2026, ndp_justice_reproductive]
        contest: >
          Position la plus extensive du lot nord-américain, au niveau de LFI et
          du PS. Point notable : Lewis se situe EXPLICITEMENT À GAUCHE DES
          DÉMOCRATES AMÉRICAINS sur la question des sports, celle-là même où ces
          derniers reculent. Réserve : le questionnaire date de la campagne
          interne, un mois avant sa victoire ; il engage le candidat mais n'est
          pas encore un document de plateforme.
      S4:
        valeur: -1
        just: >
          Le NPD soutient l'aide médicale à mourir dans son principe — il a
          appuyé C-14 en 2016 — mais a voté contre la version finale de C-7 en
          mars 2021, pour un motif de procédure. Surtout, ses membres au comité
          mixte spécial ont réclamé, avec les conservateurs, une PAUSE INDÉFINIE
          de l'élargissement à la maladie mentale.
        src: [cbc_c7_vote, cbc_pause_maladie_mentale]
        contest: >
          NOTE LA MOINS SOLIDE DU LOT NORD-AMÉRICAIN : aucune position d'Avi
          Lewis sur l'aide médicale à mourir depuis mars 2026 n'a été trouvée, ni
          sur les demandes anticipées, ni sur l'échéance du 17 mars 2027. La note
          repose entièrement sur des votes antérieurs à son arrivée, et un
          changement de ligne est plausible compte tenu de son positionnement sur
          les autres indicateurs.
      S5:
        valeur: -2
        just: >
          Position la plus ouvertement multiculturaliste des dix-huit forces.
          Jagmeet Singh, sikh portant le turban, déclarait que « the federal
          government should support the 3 million Quebecers who are opposed to
          this bill » et soutenait l'intervention fédérale contre la loi 21. Avi
          Lewis porte un programme d'immigration à PALIER UNIQUE : « permanent
          resident status for all and equal rights from day one », fin des
          restrictions liant les travailleurs à un employeur, et, dans son
          discours de victoire du 29 mars 2026 : « the Safe Third Country
          Agreement with the U.S. is a relic of a safer time. Today, the U.S. is
          a machinery of deportation. It must be cancelled immediately. »
          L'égalité des droits dès le premier jour est le miroir inverse exact de
          la règle de priorité nationale notée ici.
        src: [cultmtl_singh_loi21, ncm_lewis_immigration, walrus_lewis_immigration]
        contest: >
          LA BORNE -2 EST DÉSORMAIS PARTAGÉE entre LFI et le NPD. Aucune
          déclaration d'Avi Lewis lui-même sur la loi 21 n'a été trouvée : la
          note repose sur la ligne établie du parti sous Singh plus le programme
          d'immigration de Lewis. -1,5 serait l'alternative si l'unicité de la
          borne devait être préservée, mais le « statut pour tous, droits égaux
          dès le premier jour » va plus loin que tout ce que porte LFI.
      S6:
        valeur: -1.5
        just: >
          Le NPD défend le réseau public et s'oppose au détournement de fonds
          publics vers le privé, ligne tenue par ses sections provinciales. Ses
          députés ont dénoncé la loi saskatchewanaise de consentement parental et
          le recours à la clause dérogatoire pour la protéger. Avi Lewis a fait
          du refus de la stigmatisation des personnes trans un axe explicite,
          dénonçant une droite qui pratique le « punching down and blaming
          immigrants and trans folks for society's problems ». Le NPD a été le
          principal artisan parlementaire du programme d'alimentation scolaire.
        src: [democracynow_lewis, lewis_ideas, jsgs_bill137]
        contest: >
          BASE PROBANTE DÉCLARATOIRE, non législative : le NPD fédéral n'a aucune
          compétence en éducation, ne compte que cinq à six députés et n'a pas le
          statut de parti reconnu. Aucun engagement fédéral chiffré sur le
          financement du privé n'a été trouvé. -1,5 est une extrapolation depuis
          la ligne du parti et ses sections provinciales ; -1 serait défendable
          si la note devait reposer exclusivement sur des actes fédéraux.
      S7:
        valeur: -1.5
        just: >
          Le NPD s'oppose aux peines minimales obligatoires, qu'il juge
          sur-incarcérantes pour les groupes marginalisés, et a soutenu leur
          abrogation partielle en 2022. Il porte un projet de DÉCRIMINALISATION
          DE LA POSSESSION SIMPLE, d'effacement des casiers, d'accès à bas seuil
          à un approvisionnement sûr et d'extension de la réduction des risques —
          plank dont aucun parti français n'a l'équivalent. Sur le cautionnement,
          il propose des programmes communautaires de supervision plutôt que la
          détention. Il a voté contre la motion « Jail Not Bail » et contre
          C-242.
        src: [ndp_justice_penale, ndp_decriminalisation, ourcommons_vote_155, ourcommons_vote_40]
        contest: >
          CONTRADICTION NON RÉSOLUE DANS LES SOURCES : une source secondaire
          affirme que le NPD soutient C-14, une autre le décrit comme critique du
          texte. Le vote de cloture montre les cinq députés votant contre, mais
          une cloture est une question de procédure, et les conservateurs ont
          voté contre pour des raisons opposées. Le vote de fond sur C-14 en
          troisième lecture n'a pas pu être établi. Le plank de décriminalisation
          pourrait justifier -2, mais le plancher n'a pas été ouvert sur une base
          déclaratoire de cinq députés sans statut de parti reconnu.
      E1:
        valeur: -2
        just: >
          Plateforme 2025 : IMPÔT SUR LA FORTUNE de 1 % entre 10 et 50 M$, 2 %
          entre 50 et 100 M$, 3 % au-delà de 100 M$, rendement chiffré à 94,5 Md$
          sur quatre ans ; surtaxe de 2 % sur les profits des sociétés dépassant
          500 M$ ; impôt minimum de 15 % sur les bénéfices comptables ; maintien
          de la hausse du taux d'inclusion des gains en capital, que le PLC et le
          PCC annulent. Contrepartie progressive par le bas : montant personnel
          de base porté à 19 500 $ et suppression de la taxe de vente sur
          l'épicerie, les couches et les factures de chauffage.
        src: [ndp_plateforme_2025, ndp_couts, cbc_ndp_impot_fortune]
        contest: >
          SATURATION À L'ANCRAGE LFI-PCF, sans le dépasser. Un impôt sur la
          fortune à 3 % au-delà de 100 M$ est d'un ordre comparable à l'ISF
          renforcé de LFI, et la progressivité par le bas ramène légèrement le
          NPD vers le centre par rapport à une pure hausse du niveau global.
      E2:
        valeur: -2
        just: >
          Avi Lewis propose la CRÉATION D'ENTREPRISES PUBLIQUES DANS TROIS
          SECTEURS — alimentation, télécommunications, Internet — et d'une
          société publique de construction pour le logement hors marché. La
          plateforme 2025 prévoyait déjà une stratégie du logement permanente de
          16 Md$, 3 millions de logements d'ici 2030, 20 % de logement hors
          marché par quartier, des prêts hypothécaires publics à taux réduit, et
          un budget d'immobilisations relevé de 10 Md$/an.
        src: [ndp_plateforme_2025, radiocanada_lewis_elu]
        contest: >
          À L'ANCRAGE, PAS AU-DELÀ. LFI nationalise des actifs EXISTANTS — EDF,
          Engie, les autoroutes ; Lewis propose la CRÉATION d'entreprises
          publiques nouvelles. Les deux démarches sont d'ampleur comparable. À
          noter : le NPD de 2026 est nettement plus étatiste que sa plateforme de
          2025 — le plus grand écart chef/plateforme des cinq forces
          nord-américaines.
      E3a:
        valeur: -2
        just: >
          Assurance-médicaments universelle en quatre ans, chiffrée à 29,2 Md$ ;
          extension du régime dentaire ; nouvelle couverture de la
          psychothérapie et du counseling ; médecin de famille garanti pour tous
          d'ici 2030. ÉVICTION EXPLICITE DU PRIVÉ : interdiction faite aux
          sociétés américaines d'acquérir des établissements de santé canadiens
          et renforcement de la Loi canadienne sur la santé contre les cliniques
          « cash-for-care ».
        src: [ndp_plateforme_2025, ndp_couts, cbc_comparatif_2025]
      E3b:
        valeur: -2
        just: >
          Le régime le plus généreux propose par un parti dans les quatre
          territoires : SEUIL UNIVERSEL UNIQUE DE 360 HEURES, durée portée à 50
          SEMAINES, PRESTATION PLANCHER DE 450 $/SEMAINE, relèvement du plafond
          de rémunération assurable, suppression du délai de carence.
        src: [ndp_plateforme_2025, ndp_couts]
        contest: >
          DÉPASSE PROBABLEMENT L'ANCRAGE FRANÇAIS : le volet chômage de LFI et
          du PCF est essentiellement ABROGATOIRE — revenir sur les réformes
          Macron et Borne —, alors que le NPD propose une REFONDATION EXPANSIVE
          avec des paramètres chiffrés. La scission de l'indicateur rend ce
          dépassement visible ; il était masqué par la saturation de l'ancienne
          note agrégée.
      E4:
        valeur: -1.5
        just: >
          Plateforme 2025 : relèvement du Supplément de revenu garanti « jusqu'à
          sortir tous les aînés de la pauvreté » — hausse de pension explicite et
          non plafonnée ; doublement de la Prestation canadienne pour les
          personnes handicapées. Le NPD a mené la bataille contre le passage à
          67 ans et défend l'âge de 65 ans. Aucune proposition de capitalisation
          accrue ni d'allongement de cotisation.
        src: [ndp_plateforme_2025]
        contest: >
          Pas -2 : contrairement à LFI qui propose la retraite à 60 ans, le NPD
          ne propose PAS d'abaisser l'âge sous 65 ans. RÉSERVE : aucune position
          retraites spécifique d'Avi Lewis en 2026 n'a été trouvée ; la note
          repose sur la plateforme de 2025 et la doctrine constante du parti.
      E5:
        valeur: -1.5
        just: >
          Plateforme 2025 : garantie de main-d'œuvre syndiquée sur les projets
          d'infrastructure financés par le fédéral ; crédit d'impôt de 5 000 $
          pour plus de 780 000 infirmières et préposés ; parité salariale et
          RATIOS DE DOTATION SÉCURITAIRES imposés dans la santé ; formation de
          plus de 100 000 travailleurs de la construction. Le NPD est le parti
          qui a arraché la loi anti-briseurs de grève au gouvernement Trudeau.
        src: [ndp_plateforme_2025, cbc_ndp_briseurs_greve]
        contest: >
          -2 DÉFENDABLE MAIS NON DOCUMENTÉ. Le NPD réclamait un salaire minimum
          fédéral de 20 $ dans sa plateforme de 2021 ; la plateforme 2025 NE
          CONTIENT AUCUNE CIBLE CHIFFRÉE de salaire minimum fédéral — vérifié, et
          c'est une absence dans un texte par ailleurs très détaillé, non un
          défaut de recherche. Le critère « hausse forte du salaire minimum » du
          -2 ne peut donc pas être documenté.
      E6:
        valeur: -2
        just: >
          ENCADREMENT DIRECT DES PRIX : plafonds d'urgence sur des produits
          nommés — pâtes, légumes surgelés, préparations pour nourrissons, huile
          de cuisson — et code de conduite des épiceries rendu obligatoire.
          CONTRÔLE DES LOYERS : interdiction des renovictions et demovictions,
          100 000 logements à loyer contrôlé sur terres fédérales d'ici 2035,
          interdiction faite aux fonds d'investissement d'acquérir des logements
          locatifs existants. Régulation environnementale : plafond immédiat sur
          les émissions pétrolières, suppression des subventions aux hydrocarbures
          d'ici fin 2026, électricité carboneutre en 2035. Lewis en 2026 : REFUS
