        src: [ndp_plateforme_2025, radiocanada_lewis_elu]
        contest: >
          Le plafonnement de prix sur produits nommés est l'équivalent exact du
          blocage des prix de LFI. Le MORATOIRE TOTAL sur les nouvelles
          autorisations fossiles va AU-DELÀ de LFI, qui admet certaines
          infrastructures de transition. Saturation avec dépassement probable sur
          la composante énergie. À noter : cette position est déjà contestée à
          l'intérieur du parti, les chefs néo-démocrates de l'Alberta et de la
