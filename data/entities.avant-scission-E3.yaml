      E5:
        valeur: 0.5
        just: >
          AUCUNE hausse legale du SMIC : le RN lui substitue un mecanisme fiscal
          incitatif, exoneration de hausse de cotisations patronales pour les
          entreprises augmentant les salaires de 10 % jusqu'a trois fois le
