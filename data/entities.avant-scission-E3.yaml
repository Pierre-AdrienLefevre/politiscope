        src: [rn_programme_2024, rn_livret_entreprise, assnat_scrutins_chomage_2026]
        contest: >
          Note la plus composite de l'indicateur. Le RN tient un discours de
          protection des travailleurs mais vote avec la droite les restrictions
          d'assurance chomage et refuse toute hausse legale du salaire minimum.
          Un notateur ponderant davantage la rhetorique programmatique que les
          votes pourrait descendre a 0 ; le rang 2 a ete privilegie.
      E6:
        valeur: 0.5
        just: >
          Parti extreme dans les deux directions. Cote dereglementation, trois
          votes concordants : 119 pour la loi Duplomb levant les contraintes
          environnementales agricoles, 118 pour la loi de simplification dont
          les amendements RN et LR supprimaient toutes les ZFE, 122 pour la
          proposition de loi de programmation energie-climat — seul groupe a la
          voter. Programme : fin de « l'hypernormalisation », moratoire sur
          toute nouvelle eolienne et DEMANTELEMENT PROGRESSIF DES EXISTANTES.
          Cote regulation : baisse administree de 30 % du prix de l'electricite,
          sortie des regles europeennes de fixation des prix, reintegration de
          RTE et Enedis dans un EDF unifie, TVA a 5,5 % sur tous les produits
          energetiques.
        src: [rn_livret_entreprise, rn_mlafrance_2022, rn_contre_budget_2026, assnat_scrutins_environnement]
        contest: >
          NOTE LA PLUS CONTESTABLE DU RAPPORT FRANCAIS. Le RN est a environ +2
          sur le volet « normes environnementales » et a environ -2 sur le volet
          « encadrement des prix », les deux etant explicitement listes dans la
          definition de E6 : le composite les annule presque. +0,5 et non 0
          parce que le volet dereglementateur est etabli par trois scrutins
          publics tandis que le volet interventionniste reste programmatique. Si
          la grille disposait d'un indicateur environnemental separe — option
          ecartee au profit de l'attribut ecologie — le RN se separerait
          franchement de Renaissance, avec qui il se retrouve ici
          artificiellement a egalite.
      S5:
        valeur: 2
        just: >
          Les 30-31 aout 2026, le RN a annonce qu'il sanctionnerait le port du
          voile DANS TOUT L'ESPACE PUBLIC PAR UNE AMENDE. Jean-Philippe Tanguy :
          « nous sanctionnerons le port du voile », les femmes concernees ecopant
          d'une amende « au meme titre » que les automobilistes sans ceinture.
          Jordan Bardella a propose un referendum sur la mesure. Le programme de
          2024 porte deja la suppression du droit du sol et la priorite
          nationale, « si necessaire par referendum constitutionnel ». Le
          13 septembre 2026 a Henin-Beaumont, Le Pen a remis la priorite
          nationale au coeur de son programme.
        src: [ladepeche_rn_voile, rn_programme_2024, assnat_rapport_2338, france3_lepen_rentree]
        contest: >
          PLAFOND ATTEINT, CONTENU REEL AU-DELA — environ +2,5 sur une echelle
          rouverte. Aucune juridiction du compas, quebecoise, canadienne ou
          americaine, n'a d'equivalent : il s'agit d'une interdiction
          vestimentaire generale visant une seule confession, sanctionnee
          penalement. La mesure est contestee jusque dans le bloc de droite
          (Retailleau : « ce n'est pas une proposition, c'est un slogan ») et
          juridiquement fragile. C'est la position affichee qui est notee, non sa
          faisabilite.
      S6:
        valeur: 1.5
        just: >
          Defense d'un recit national et de l'autorite scolaire, uniforme
          obligatoire, retour aux « fondamentaux », opposition aux contenus
          juges ideologiques. Le programme de 2024 prevoit la suppression du
          financement public des etablissements lies a des ideologies etrangeres.
        src: [rn_programme_2024, cnews_ecole_2026]
        contest: >
          Note reposant sur le corpus de 2024 : CNEWS constatait au 27 aout 2026
          que le programme de Marine Le Pen « n'est encore pas disponible sur son
          site ». Le premier grand meeting est annonce au congres d'Orleans des
          24-25 octobre 2026.
      S7:
        valeur: 1.5
        just: >
          Le groupe a vote l'ensemble des textes de durcissement penal de la
          legislature : presomption de legitime defense pour les forces de
          l'ordre (122 pour), projet de loi « reponses immediates aux phenomenes
          troublant l'ordre public » (114 pour), loi narcotrafic (109 pour).
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          +1,5 et non +2 : le RN vote les durcissements mais n'a pas publie de
          programme penal 2027, la ou LR annonce la suppression du juge
          d'application des peines et des prisons privees.
  - name: Reconquête
    sigle: Reconquête
    label_pos: top left
    chef: Éric Zemmour
    country: France
    color: "#1C1C1C"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: 4, societe: 9}
    autorite: null
    resume: >
      Droite identitaire : arrêt de l'immigration, « remigration », fin du
      regroupement familial, défense de l'identité chrétienne de la France.
      Économie plus libérale que le RN : baisse des impôts et des charges.
    indicateurs:
      E1:
        valeur: 2
        just: >
          Doctrine affichee : « avec 47 % de taux de prelevements obligatoires
          en 2019, la France detient un triste record du monde », il est urgent
          de « prendre le contre-pied de cette asphyxie fiscale generalisee ».
          Volet 2026 porte par Sarah Knafo : baisse d'un tiers de l'accise sur
          les carburants (-27 c/L d'essence, -24 c/L de gazole, 12 Md€ de
          moindres recettes) et suppression des certificats d'economie
          d'energie, financees par « un plan massif d'economies, dont j'ai deja
          devoile les 130 premiers milliards ». Aucun impot sur la fortune,
          aucune taxe nouvelle sur le capital.
        src: [reconquete_priorites_impots, knafo_combien_je_gagne]
        contest: >
          Reconquete n'a PAS de programme presidentiel 2027 publie : la
          plateforme leprogrammepourlafrance.fr est une consultation sans aucune
          mesure publiee, et ericzemmour.fr est reste le site de 2022. La note
          est solide en direction, plus fragile en magnitude que celle de LR.
      E2:
        valeur: 1.5
        just: >
          Plan d'economies le plus eleve du champ francais : 130 Md€ annonces,
          soit environ 7,8 % de la depense publique. Doctrine de « reduire la
          voilure en matiere de depenses sociales », les contribuables etant
          « contraints de financer par leurs impots le systeme social le plus
          dispendieux des pays occidentaux ».
        src: [knafo_combien_je_gagne, reconquete_priorites_impots]
        contest: >
          Comparaison de magnitude avec le PCQ tranchee : les 47 G$ du PCQ sont
          CUMULES SUR CINQ ANS, soit environ 5,7 % des depenses de portefeuilles
          quebecoises. Reconquete a 7,8 % est proportionnellement plus agressif,
          le +2 tient donc pour les deux. Reconquete ne propose toutefois aucune
          privatisation nommee, a la difference du RN : le +2 repose entierement
          sur le volume des coupes.
        contest: >
          RAMENE DE +2 A +1,5 apres notation des Etats-Unis. Le Parti republicain
          a EFFECTIVEMENT supprime environ 256 000 postes dans 22 grandes agences
          federales en treize mois — plus de 11 % —, aboli une agence de rang
          gouvernemental (USAID) et ampute de moitie le ministere de l'Education.
          Reconquete propose environ 150 000 suppressions sur 5,7 millions
          d'agents publics francais, soit 2,6 % : un ordre de grandeur quatre
          fois inferieur. REVISION VOLONTAIREMENT RESTREINTE : l'agent
          recommandait de cascader aussi Horizons, LR et Renaissance de +1,5 a
          +1, au motif que l'acte l'emporte sur la proposition. Cet argument n'a
          pas ete suivi : il amplifierait le biais du sortant deja documente
          dans grille.md.
      E3:
        absent: true
        just: >
          Aucune position sur l'architecture de l'assurance chomage ni sur le
          partage public-prive en sante. Le parti n'ayant pas de groupe a
          l'Assemblee nationale, aucun vote de rang 2 n'est disponible. La seule
          matiere trouvee — « preference nationale en matiere d'attribution des
          aides sociales » — est fondee sur la nationalite et releve donc de S5,
          non de E3.
        src: [reconquete_priorites_impots, knafo_combien_je_gagne]
        contest: >
          Consequence directe de l'arbitrage sur la preference nationale. Sans
          cette regle, Reconquete serait a +1 sur la base d'une doctrine
          generale de reduction des depenses sociales ; avec elle, il ne reste
          aucune position notable sur cet indicateur.

      S1:
        valeur: 2
        just: >
          Campagne de 2022 fondee sur l'« immigration zero » : limitation du
          flux d'etudiants etrangers a « quelques milliers » par an, reduction
          du droit d'asile a « quelques dizaines ou centaines de cas », fin du
          regroupement familial, suppression du droit du sol, expulsion des
          etrangers purgeant une peine sous menace de suppression de l'aide au
          developpement. Des aout 2021, Zemmour proposait de « stopper tous les
          flux migratoires, legaux et clandestins, refugies politiques,
          regroupement familial, etudiants etrangers ». L'appropriation du
          vocabulaire de la « remigration » implique a terme un solde migratoire
          negatif.
        src: [wikipedia_zemmour]
        contest: >
          Position la plus radicale des quatre territoires : sur une echelle non
          plafonnee, environ +3. C'est la seule force du corpus qui vise un
          solde migratoire NEGATIF — aucun parti nord-americain ne propose de
          faire partir plus de gens qu'il n'en entre. Sourcage de rang 5
          uniquement : Reconquete n'a publie aucun programme 2027 et le
          programme 2022 archive n'a pas pu etre recupere.
      S2:
        valeur: 0.5
        just: >
          Reconquete n'a aucun parlementaire national. La seule trace de vote
          imputable au parti est celle de Sarah Knafo, sa seule eurodeputee
          restee dans le parti apres les exclusions de juin 2024 : abstention
          sur la resolution relative a l'initiative citoyenne « Ma voix, mon
          choix » le 17 decembre 2025, et vote CONTRE la « Gender Equality
          Strategy 2025 » le 13 novembre 2025, texte comportant un volet sante
          reproductive.
        src: [pe_ice_ma_voix, pe_gender_equality_2025]
        contest: >
          Cellule la plus fragile du tableau francais. AUCUN document de
          Reconquete proposant de restreindre l'acces a l'IVG en France n'a ete
          trouve ; aucune position de ce type ne lui est donc pretee. Piege a
          eviter : les quatre eurodeputes francais du groupe ECR qui ont vote
          contre la resolution du 17 decembre 2025 (Marechal, Bay, Peltier,
          Trochu) NE SONT PLUS Reconquete depuis juin 2024.
      S3:
        valeur: 1.5
        just: >
          Reconquete a cree en decembre 2022 le reseau « Parents vigilants »,
          association de parents d'eleves dont l'activite documentee consiste a
          faire pression sur les enseignants et les personnels de direction
          contre les seances d'education a la vie affective et sexuelle et
          contre la lutte contre les discriminations fondees sur l'identite de
          genre. Sarah Knafo a vote contre la « Gender Equality Strategy 2025 »
          et contre la resolution sur les inegalites de genre en sante du
          16 septembre 2026.
        src: [wikipedia_reconquete, pe_gender_equality_2025, pe_sante_genre_2026]
        contest: >
          Seule force francaise a agir sur le front scolaire, qui est
          precisement le marqueur reserve au +2 americain. Mais l'action passe
          par une association satellite et non par un programme, et aucun
          document Reconquete proposant de restreindre les droits existants des
          adultes n'a ete trouve. Maintenu a +1,5 sans extrapoler ; cellule a
          re-sourcer.
      S4:
        absent: true
        just: >
          Recherche faite, rien trouve. Reconquete n'a aucun depute ni senateur
          depuis juin 2022 et n'a donc pris part a aucun des quatre scrutins de
          2025-2026 ni aux deux scrutins senatoriaux. Aucune declaration de
          parti sur la loi du 18 aout 2026, aucun programme 2027, aucun vote de
          sa seule eurodeputee sur un texte relatif a la fin de vie.
        contest: >
          NE PAS IMPUTER a Reconquete les 17 voix « contre » du groupe UDR
          (Union des droites pour la Republique). Ce groupe est celui d'Eric
          Ciotti, allie du RN, distinct de Reconquete. C'est le piege
          d'attribution le plus probable sur cette ligne.
      E4:
        valeur: -0.5
        just: >
          La seule fiche « Retraites » retrouvee, du programme presidentiel de
          2022, ne contient AUCUNE mesure d'age ni de duree de cotisation. Elle
          porte exclusivement sur le niveau des pensions : revalorisation
          jusqu'a 600 € par an des retraites inferieures a 1 300 € mensuels par
          exoneration de CSG et de CRDS, relevement de la pension de reversion
          de 54 % a 75 %, retablissement de la demi-part fiscale pour les veufs
          et veuves. Trois mesures du cote de la hausse des pensions, sans
          contrepartie.
        src: [reconquete_programme_2022_archive]
        contest: >
          NOTE LA PLUS FRAGILE DU RAPPORT FRANCAIS. Elle repose sur un document
          de mars 2022, ANTERIEUR A LA REFORME DE 2023, et ne dit rien de la
          dimension aujourd'hui dominante de l'indicateur en France, l'age.
          `absent` serait defendable ; une note chiffree a ete retenue parce
          qu'une position existe sur le niveau des pensions. A rouvrir des la
          publication d'un programme 2027.
      E5:
        valeur: 1
        just: >
          Seul des huit partis a proposer une reduction directe de la
          representation legale des salaries : relever le seuil de 50 a 250
          salaries pour l'obligation de consultation du comite social et
          economique. S'y ajoutent des exonerations ciblees de cotisations
          patronales et une activation de l'assurance chomage par versement
          direct de la moitie des droits en cas de demenagement pour un nouvel
          emploi. Aucune hausse du SMIC.
        src: [reconquete_programme_2022_archive]
        contest: >
          Source de mars 2022, sans mise a jour trouvee. Le relevement du seuil
          du CSE est structurellement plus offensif contre la representation
          salariee que tout ce que proposent LR, Renaissance ou Horizons et
          justifierait +1,5 ; maintenu a +1 parce que le reste du paquet est
          mince et date, et qu'aucune position actuelle sur l'assurance chomage,
          le SMIC ou le temps de travail n'a pu etre etablie.
      E6:
        valeur: 1
        just: >
          Dereglementation environnementale forte : « mettre fin a tous les
          projets d'eoliennes actuels et futurs, sur terre comme sur mer »,
          suppression de l'objectif de reduction a 50 % de la part du nucleaire,
          arret de la fermeture des douze reacteurs prevue pour 2030. Sur les
          prix de l'energie, Reconquete privilegie la baisse de la fiscalite
          plutot que le controle administre : ramener le diesel de 2,29 € a
          1,90 € le litre.
        src: [reconquete_programme_2022_archive, knafo_combien_je_gagne]
        contest: >
          Deux elements tirent vers le bas et expliquent que Reconquete reste
          sous LR et Horizons : le remplacement de l'ARENH par « un nouveau
          tarif regule pour l'electricite nucleaire » et l'opposition a
          l'ouverture a la concurrence des barrages hydroelectriques, deux
          mesures d'encadrement des prix. Reserve de datation : aucune position
          sur les ZFE, le Pacte vert ou la loi de simplification n'a ete trouvee
          et le parti n'a aucun vote exploitable au rang 2.
      S5:
        valeur: 2
        just: >
          Doctrine d'assimilation explicite : « comme le disait Charles de
          Gaulle, s'il est possible d'assimiler des individus, IL N'EST PAS
          POSSIBLE D'ASSIMILER DES PEUPLES » ; l'objectif est de « retablir un
          rapport de force demographique favorable a l'assimilation » et de
          lutter contre « l'islamisation progressive de notre societe ». S'y
          ajoute la REMIGRATION, reaffirmee le 13 septembre 2026 : « le renvoi
          effectif des clandestins, des delinquants etrangers, [...] DES CHOMEURS
          ETRANGERS, de tous ceux qui vivent de l'assistanat sans travailler ».
          Le 17 septembre 2026, Zemmour a fixe un seuil nouveau : un etranger,
          MEME EN SITUATION REGULIERE, serait expulse apres un an de chomage.
        src: [zemmour_site_identite, cnews_zemmour_rentree, publicsenat_zemmour_candidature]
        contest: >
          PLAFOND ATTEINT, DEPASSEMENT LE PLUS LARGE DU COMPAS — environ +3 sur
          une echelle rouverte, soit un point entier au-dela du RN. La
          remigration releve pour partie de S1, puisqu'elle porte sur qui reste
          sur le territoire ; mais son ressort est bien S5, puisqu'elle nie le
          principe meme d'une coexistence durable avec une population deja
          installee et en partie reguliere. Reserve : les pages doctrinales du
          site datent du cycle 2022 et aucun programme 2027 n'est publie.
      S6:
        valeur: 1.5
        just: >
          Le parti a cree en decembre 2022 le reseau « Parents vigilants », dont
          l'activite documentee consiste a faire pression sur les enseignants et
          les personnels de direction contre les seances d'education a la vie
          affective et sexuelle et contre la lutte contre les discriminations
          fondees sur l'identite de genre. La doctrine scolaire du site prone le
          retour aux fondamentaux et a un recit national.
        src: [wikipedia_reconquete, zemmour_site_identite]
        contest: >
          Seule force francaise a agir sur le front scolaire contre l'education
          a la vie affective et sexuelle — marqueur du pole +2. Mais l'action
          passe par une association satellite et non par un programme ecrit.
      S7:
        valeur: 1.5
        just: >
          Fermete penale affichee : expulsion des etrangers purgeant une peine,
          construction de places de prison, lutte contre « l'ensauvagement ».
          Aucun vote enregistre n'est disponible, le parti n'ayant aucun
          parlementaire national depuis juin 2022.
        src: [zemmour_site_identite, publicsenat_zemmour_candidature]
        contest: >
          NOTE LA PLUS FRAGILE DE L'AXE SOCIETE FRANCAIS : corpus non date,
          aucun vote enregistre, aucun programme 2027. A rouvrir apres la
          declaration formelle de candidature annoncee pour octobre 2026.
  - name: Place publique – Parti socialiste
    sigle: PS-PP
    label_pos: middle right
    chef: Raphaël Glucksmann
    country: France
    color: "#E4007C"
    as_of: "2026-09-17"
    souverainete: federaliste_europeen
    ecologie: reformiste
    estimation_initiale: {economie: -3, societe: -5}
    autorite: null
    resume: >
      Social-démocratie pro-européenne, soutenue par une partie du PS et des
      écologistes. Taxation des très hauts patrimoines, investissement dans la
      transition écologique, soutien ferme à l'Ukraine. Refuse l'alliance avec
      LFI.
    indicateurs:
      E1:
        valeur: -1.5
        just: >
          Le Projet socialiste, adopte par les militants le 25 juin 2026 a 83 %,
          propose une taxe Zucman de 2 % sur les patrimoines superieurs a
          100 M€, un impot sur les grandes successions cumulant les
          transmissions recues au cours de la vie (abattement unique de
          200 000 €, rendement annonce de 400 Md€ sur 2025-2040), la suppression
          du prelevement forfaitaire unique, la fusion IR-CSG-CRDS en un impot
          plus progressif, un IS progressif et la suppression des exonerations
          sociales entre 2 et 3,5 SMIC (11 Md€/an).
        src: [ps_projet_socialiste]
        contest: >
          Ce qui empeche le -2 : pas de retablissement d'un ISF en tant que tel,
          creation d'une premiere tranche d'IR inferieure a 10 %, et baisse de
          la CSG sur les revenus du travail financee par sa hausse sur le
          capital. L'objectif affiche est explicitement « sans augmenter les
          impots des classes moyennes et populaires ».
      E2:
        valeur: -1.5
        just: >
          Nationalisations explicites : « une nationalisation des autoroutes a
          travers la creation d'un etablissement public national », un pole
          public de l'energie avec extension des tarifs reglementes, le
          « caractere public des infrastructures de transport et de distribution
          du gaz et de l'electricite », un plan de prises de participation ou
          « de nationalisations en dernier recours » pour l'industrie, et un
          pole public de l'IA. La « demarchandisation » est erigee en boussole
          des services essentiels. Mais le PS assume un audit visant a
          « supprimer les programmes a l'impact social faible ».
        src: [ps_projet_socialiste]
      E3:
        valeur: -1.5
        just: >
          Cree « une mutuelle publique geree par la Securite sociale » — la
          « Grande Secu » — fusionnant assurance maladie et complementaires,
          avec reste a charge zero et 3,5 Md€ economises sur les frais de
          marketing des mutuelles privees. Interdit le rachat de tout
          etablissement de soins par des fonds d'investissement. Plafonne les
          depassements du secteur 2 a 50 %. Sur le chomage : gestion confiee
          exclusivement aux partenaires sociaux, versement automatique de
          l'allocation, encadrement strict des radiations.
        src: [ps_projet_socialiste, assnat_scrutins_chomage_2026]
        contest: >
          Le -2 serait defendable : sur l'eviction du prive, le PS va aussi loin
          que Quebec solidaire. Le -1,5 tient a ce que la Grande Secu ne couvre
          qu'un « panier de soins essentiels », la ou LFI et le PCF visent le
          100 % de tous les soins prescrits, et a l'abstention majoritaire du
          groupe socialiste sur le texte chomage de juin 2026.

      S1:
        valeur: -1.5
        just: >
          Le Projet socialiste propose de « regulariser et integrer par le
          travail » et de « permettre l'obtention d'un titre de sejour a toute
          personne etrangere disposant d'un contrat de travail depuis au moins
          6 mois », un « droit de plainte securise » pour le travailleur sans
          papiers, un titre « jeune diplome » d'un an, et de redonner au
          Parlement le pouvoir de decider de la politique migratoire. Il denonce
          « la logique du chiffre, illustree par l'explosion des OQTF ».
          61 deputes socialistes contre la loi Mayotte, 53 contre la
          denonciation des accords de 1968.
        src: [ps_projet_socialiste, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          Ecart parti/personne assume : le PS ne parle pas de quotas, Glucksmann
          si. Le PS ne reprend ni le droit du sol integral ni le droit de vote
          des etrangers du contrat NFP qu'il avait pourtant signe en 2024.
      S2:
        valeur: -2
        just: >
          31 deputes sur 31 pour la constitutionnalisation le 30 janvier 2024 et
          64 senateurs sur 64 le 28 fevrier 2024, unanimite dans les deux
          chambres. Le Projet socialiste va au-dela du statu quo : « garantir un
          acces a l'IVG universel et GRATUIT, partout en France » et soutien a
          l'initiative citoyenne europeenne « Ma voix, mon choix ». Glucksmann a
          vote pour la resolution correspondante au Parlement europeen le
          17 decembre 2025.
        src: [senat_scrutin_136, ps_projet_socialiste, pe_ice_ma_voix]
      S3:
        valeur: -2
        just: >
          Le Projet socialiste propose de « dejudiciariser la procedure de
          rectification de la mention du genre a l'etat civil au profit d'une
          procedure administrative rapide, gratuite et fondee sur
          l'autodetermination, comme en Allemagne », de « securiser la
          reconnaissance juridique de toutes les familles LGBTQIA+ quelle que
          soit leur configuration (co-parentalite, multi-parentalite, enfant par
          GPA ou PMA) », et d'assurer « la fin des mutilations intersexes ». Les
          64 senateurs socialistes ont vote contre la proposition de loi LR sur
          les mineurs en questionnement de genre le 28 mai 2024, sans une
          defection.
        src: [ps_projet_socialiste, senat_scrutin_204, assnat_scrutin_3855]
        contest: >
          A egalite avec LFI ; le PS est meme le seul a ecrire noir sur blanc la
          reconnaissance de la filiation des enfants nes par GPA.
      S4:
        valeur: -1.5
        just: >
          57 pour / 4 contre / 6 abstentions en lecture definitive le 15 juillet
          2026 ; au Senat, les 63 socialistes ont vote contre la question
          prealable qui a tue le texte le 7 juillet 2026. Le Projet socialiste
          demandait d'« adopter d'urgence la proposition de loi instaurant un
          droit a la fin de vie libre » et de garantir « la prise en compte
          effective des directives anticipees », tout en conditionnant le
          dispositif a un fort developpement des soins palliatifs.
        src: [assnat_scrutin_8280, senat_scrutin_328, ps_projet_socialiste]
        contest: >
          Le PS est le parti francais qui s'approche le plus du modele
          quebecois en insistant sur l'effectivite des directives anticipees,
          mais il ne demande pas l'aide a mourir SUR DEMANDE ANTICIPEE.
      E4:
        valeur: -1
        just: >
          Le Projet socialiste est explicite : « apres l'abrogation de la
          reforme Borne, convoquer une conference sociale pour definir un
          nouveau systeme de retraite par repartition [...] une duree de
          cotisation fixee a 43 annuites, reductible en fonction de la
          penibilite [...] l'age legal de depart, ramene a 62 ans, ne
          disparaitra pas pour autant ». Le PS conserve donc les 43 annuites
          issues de la reforme de 2023 et ne descend qu'a 62 ans, contre 60 pour
          LFI et le PCF. Financement par elargissement de l'assiette des
          cotisations aux revenus du capital. Rejet explicite de la
          capitalisation.
        src: [ps_projet_socialiste, assnat_scrutin_2257, assnat_scrutin_4758]
        contest: >
          Le maintien des 43 annuites est un element du cote + de l'echelle, qui
          justifie de ne pas descendre sous -1. Le groupe a vote la LFSS 2026
          portant suspension, que le projet revendique comme « obtenue par les
          socialistes ».
      E5:
        valeur: -1.5
        just: >
          « Rehausser le SMIC a 1 690 € net » (+17,1 %), plafond de 1 a 20 entre
          les plus hautes et les plus basses remunerations d'un meme groupe,
          regle « 1 € de dividende verse = au moins 1 € de participation »,
          ADMINISTRATEURS SALARIES PORTES A LA MOITIE DES MEMBRES ET DES DROITS
          DE VOTE dans les conseils des entreprises de plus de 500 salaries,
          generalisation du cheque syndical, retablissement des CHSCT. Sur le
          chomage : gestion confiee exclusivement aux partenaires sociaux,
          versement automatique de l'allocation, encadrement strict des
          radiations.
        src: [ps_projet_socialiste, assnat_scrutins_chomage_2026]
        contest: >
          L'objectif de SMIC du PS est a dix euros de celui de LFI : sur ce seul
          critere ils seraient a egalite. Le PS est a -1,5 parce qu'il ne
          propose ni les 32 heures, ni la suspension des licenciements, ni
          l'abrogation des ordonnances Macron. Tempere aussi par l'abstention
          majoritaire du groupe sur la loi chomage de juin 2026. La
          codetermination a 50 % n'a en revanche aucun equivalent quebecois et
          pousserait plutot vers -2.
      E6:
        valeur: -1.5
        just: >
          Revendique un effort de « demarchandisation [...] par un plus fort
          encadrement des biens et services essentiels ». Mesures : encadrement
          des prix de l'energie et des loyers, statut de « zone de protection
          commerciale » permettant aux maires d'encadrer les loyers commerciaux,
          prix minimums garantis aux agriculteurs avec encadrement des marges de
          l'agro-industrie, encadrement du yield management ferroviaire,
          plafonnement des depassements d'honoraires a 50 %. Volet
          environnemental : interdiction du glyphosate, principe de
          non-abaissement des reglementations existantes, defense du ZAN.
        src: [ps_projet_socialiste, assnat_scrutins_environnement]
        contest: >
          Le perimetre sectoriel du PS est PLUS LARGE que celui de QS. Il reste
          a -1,5 parce que sa methode est l'encadrement negocie et non le
          blocage par decret ni l'appropriation publique, qui definissent ici
          le -2.
      S5:
        valeur: -1
        just: >
          Le 4 septembre 2026, Glucksmann a repondu a la proposition RN d'amende
          pour port du voile : « la laicite, ce n'est pas la police des
          vetements », accusant le RN de vouloir « relancer les fievres
          identitaires ». En commission le 14 janvier 2026, Herve Saulignac a
          depose l'amendement de suppression contre la proposition de loi sur le
          voilement des mineures : « ce texte me donne la nausee », « la
          proposition de loi ne vise qu'une seule pratique confessionnelle, a la
          difference de la loi de 1905 ». Il a toutefois affirme son
          « attachement profond a la laicite » : le PS defend le cadre existant
          sans proposer de l'etendre ni de le desserrer.
        src: [assnat_rapport_2338, nfp_contrat_legislature, lefigaro_glucksmann_laicite]
        contest: >
          Glucksmann n'est a ce jour que candidat a la primaire socialiste,
          declare le 23 aout 2026, non tranchee au 18 septembre. La note vaut
          pour la force telle qu'elle vote au Parlement ; si un autre candidat
          l'emporte, la position pourrait bouger de plus ou moins 0,5.
      S6:
        valeur: -1
        just: >
          Le 23 aout 2026, en annoncant sa candidature, Glucksmann a annonce
          « un plan de sauvetage de l'ecole publique » sur cinq ans : hausse de
          la remuneration des enseignants, baisse du nombre d'eleves par classe
          en primaire, renovation du bati scolaire, en s'appuyant sur le constat
          de l'OCDE que la France « a l'ecole qui reproduit le plus les
          inegalites en Europe ». Tribune du 1er septembre 2026 : « Sauvons
          l'ecole publique ». Aucune mesure de definancement du prive sous
          contrat n'est portee en propre.
        src: [cnews_ecole_2026, liberation_glucksmann_ecole, nfp_contrat_legislature]
      S7:
        valeur: -0.5
        just: >
          Le groupe a vote contre la presomption de legitime defense (62 contre)
          et contre le projet de loi sur l'ordre public (56 contre). Mais il a
          VOTE POUR la loi narcotrafic du 29 avril 2025 (63 pour), seul groupe
          de gauche a le faire — ce qui le distingue nettement de LFI et du PCF.
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          Aucun programme de justice penale propre a Glucksmann n'a ete trouve :
          sa campagne a communique sur l'ecole, pas sur le penal. La note est
          adossee aux seuls votes du groupe et au socle NFP.
  - name: Parti communiste français
    sigle: PCF
    label_pos: top left
    chef: Fabien Roussel
    country: France
    color: "#B30000"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: -8, societe: 1}
    autorite: null
    resume: >
      Roussel est candidat déclaré depuis septembre 2026. Économie socialiste :
      nationalisations (énergie, banques), hausse des salaires, retraite à
      60 ans. Pro-nucléaire et productiviste, positions plus classiques que le
      reste de la gauche sur la sécurité et la laïcité — c'est ce que capte
      l'attribut écologie, que les deux axes ne distinguent pas de LFI.
    indicateurs:
      E1:
        valeur: -2
        just: >
          Proposition 127 : retablit l'impot sur la fortune, accentue son taux et
          sa progressivite, supprime ses niches et TRIPLE son montant, tout en
          abolissant le prelevement forfaitaire unique. Proposition 126 : impot
          sur le revenu porte a 15 tranches. Proposition 128 : doublement du
          nombre de tranches des droits de succession. Proposition 123 : impot
          progressif sur les actifs immobiliers, materiels ET financiers des
          entreprises. Le niveau global de prelevement monte massivement :
          27 Md€/an pour 500 000 embauches publiques et 60 Md€ pour le plan de
          services publics.
        src: [pcf_180_propositions]
        contest: >
          La baisse de la TVA et la disparition progressive de la CSG vont
          formellement dans l'autre sens, mais le solde est sans ambiguite. Le
          PCF definit desormais la borne -2 pour l'ensemble du compas.
      E2:
        valeur: -2
        just: >
          Seul parti des quatre territoires a NOMMER les entreprises a
          nationaliser. Proposition 116 : pole financier public par la
          nationalisation de BNP-Paribas, Societe generale et Axa. Proposition
          25 : reappropriation publique de la SNCF, d'EDF, d'Engie, de La Poste
          et de France Telecom. Proposition 56 : pole public de l'energie autour
          d'EDF et Engie « qui seront renationalisees ». Proposition 17 :
          nationalisation de Sanofi. Proposition 29 : 500 000 emplois crees dans
          la fonction publique, ventiles poste par poste (100 000 hopital,
          100 000 EHPAD, 90 000 enseignants, 90 000 AESH...), pour 27 Md€/an.
        src: [pcf_180_propositions, pcf_base_commune_40e]
      E3:
        valeur: -2
        just: >
          Proposition 12 : prise en charge des soins a 100 %. Proposition 13 :
          suppression des franchises medicales et des participations
          forfaitaires, disparition des depassements d'honoraires, retour a un
          secteur conventionnel unique, tiers payant generalise, 12 000 places
          en medecine contre 8 000. Proposition 14 : arret des privatisations
          hospitalieres, fin de la T2A, 100 000 emplois hospitaliers.
          Proposition 2 : abrogation immediate de la loi El Khomri, des
          ordonnances Macron et de la loi Borne sur l'assurance chomage.
        src: [pcf_180_propositions, assnat_scrutins_chomage_2026]

      S1:
        valeur: -1.5
        just: >
          Le PCF est signataire du contrat NFP de juin 2024 (abrogation des lois
          asile-immigration, regularisations, droit du sol integral) et ses
          deputes votent en consequence : 13 contre la loi Mayotte, 6 contre la
          denonciation des accords de 1968. Mais Fabien Roussel tient depuis
          avril 2023 un discours en retrait, denoncant des « frontieres
          passoires » et reclamant que la France soit « plus ferme » sur
          l'arrivee de travailleurs migrants, tout en refusant tout lien entre
          immigration et chomage.
        src: [nfp_contrat_legislature, assnat_scrutin_1308, wikipedia_roussel]
        contest: >
          Ecart parti/candidat le plus net du panel francais. Les votes du
          groupe GDR situent le PCF a -2 ; la ligne publique de son candidat le
          remonte. Arbitre a -1,5 et signale plutot que tranche.
      S2:
        valeur: -2
        just: >
          20 deputes pour a l'Assemblee le 30 janvier 2024, 22 sur 22 au Congres
          du 4 mars 2024, et 18 senateurs sur 18 le 28 fevrier 2024 — unanimite
          dans les trois scrutins, sans une voix contre ni une abstention.
          Signataire du contrat NFP garantissant l'egal acces et l'effectivite
          de l'IVG et le choix de la methode.
        src: [assnat_congres_ivg, senat_scrutin_136, nfp_contrat_legislature]
        contest: >
          Note assise sur des votes et une signature de coalition, faute de
          document programmatique PCF propre sur l'IVG. Le contenu de la
          position n'est pas douteux ; c'est la granularite qui manque pour
          distinguer le PCF de LFI et du PS.
      S3:
        valeur: -1.5
        just: >
          17 des 18 senateurs ont vote contre la proposition de loi LR sur les
          mineurs en questionnement de genre le 28 mai 2024. 10 deputes ont vote
          la PMA pour toutes en 2021. Le programme porte par Roussel prone « la
          fin des mutilations des personnes intersexes » et « un remboursement
          integral du parcours de transition des personnes transgenres ».
        src: [senat_scrutin_204, wikipedia_roussel, nfp_contrat_legislature]
        contest: >
          Roussel est par ailleurs hostile aux reunions non mixtes : la ligne
          societale du candidat est moins homogene que celle de ses
          parlementaires, d'ou -1,5 plutot que -2.
      S4:
        valeur: -1
        just: >
          Le groupe GDR soutient le texte a chaque lecture mais avec une
          minorite de refus et d'abstentions proportionnellement plus forte que
          les autres groupes de gauche : 10 pour / 2 contre / 3 abstentions sur
          17 membres en lecture definitive le 15 juillet 2026. Au Senat, les 18
          elus communistes ont vote contre la question prealable du 7 juillet
          2026.
        src: [assnat_scrutin_8280, senat_scrutin_328]
        contest: >
          Aucun texte programmatique PCF propre sur la fin de vie n'a ete
          trouve ; la note est deduite des votes. Le groupe GDR est composite
          (PCF et ultramarins), ce qui attenue l'imputabilite.
      E4:
        valeur: -2
        just: >
          Mesure n° 8 des 180 propositions : « une loi retablira la retraite a
          60 ans, a taux plein » — un abaissement de QUATRE ANS par rapport au
          droit en vigueur (64 ans depuis la reforme du 14 avril 2023). Le
          cahier Securite sociale detaille : taux de remplacement net de 75 %,
          calcul sur les dix meilleures annees, aucune pension inferieure au
          SMIC, indexation sur les salaires, prise en compte des annees d'etudes
          des 18 ans. Financement chiffre a +100 Md€/an par la cotisation
          sociale, avec rejet explicite de la capitalisation.
        src: [pcf_180_propositions, assnat_scrutin_2257]
        contest: >
          Avec LFI, le PCF definit la borne -2 du compas sur cet indicateur. Le
          chiffrage a 100 Md€ est revendique par le parti, non valide par un
          tiers.
      E5:
        valeur: -2
        just: >
          SMIC a 1 600 € net (+10,9 %) et semaine de 32 heures « sans diminution
          de salaires ». Les 180 propositions comportent les mesures les plus
          interventionnistes du panel francais : abrogation immediate de la loi
          El Khomri, des ordonnances Macron et de la loi Borne sur l'assurance
          chomage (n° 2) ; « tous les plans sociaux et les licenciements en
          cours seront suspendus » (n° 3) ; loi sur la securite d'emploi ou de
          formation (n° 6) ; fin des contrats precaires (n° 38).
        src: [pcf_180_propositions, assnat_scrutins_chomage_2026]
        contest: >
          La suspension de TOUS les plans sociaux et licenciements en cours est,
          en droit du travail, la mesure la plus radicale des huit partis — plus
          contraignante que tout ce que porte Quebec solidaire. Elle justifie a
          elle seule le -2 malgre un objectif de SMIC inferieur a celui de LFI
          et du PS.
      E6:
        valeur: -2
        just: >
          Le PCF ne se contente pas d'encadrer le marche, il en soustrait des
          secteurs entiers : reappropriation publique de la SNCF, d'EDF,
          d'Engie, de La Poste et de France Telecom (n° 25) ; pole financier
          public par nationalisation de BNP-Paribas, Societe generale et Axa
          (n° 116) ; mix energetique « 100 % public » (n° 55) ; interdiction des
          saisies, expulsions et coupures d'eau et d'energie (n° 98) ; plan
          national de baisse des loyers (n° 99). Signataire du blocage des prix
          par decret du contrat NFP.
        src: [pcf_180_propositions, nfp_contrat_legislature, assnat_scrutins_environnement]
        contest: >
          L'indicateur agrege encadrement des prix ET regulation
          environnementale contraignante. Le PCF est maximal sur le premier
          volet mais son attribut ecologie « productiviste » — ligne
          pro-nucleaire, reserves sur l'ecologie punitive — le rend moins net
          sur le second. Ses votes le placent toutefois systematiquement dans le
          camp de la contrainte environnementale.
      S5:
        valeur: -0.5
        just: >
          Les deputes du groupe ont vote contre la restriction du droit du sol a
          Mayotte et contre la resolution sur les Freres musulmans, et ont
          depose un amendement de suppression contre la proposition de loi sur
          le voilement des mineures. Mais la base commune du 40e congres
          (juillet 2026) affirme que « la laicite est un principe non
          negociable, indispensable a l'emancipation des femmes et a
          l'egalite », formulation nettement plus ferme que celle du PS, et le
          contrat NFP refuse tout financement public de nouveaux etablissements
          confessionnels.
        src: [pcf_base_commune_40e, assnat_rapport_2338, nfp_contrat_legislature]
        contest: >
          Ecart reel entre la ligne « laique et republicaine » personnelle de
          Roussel et les votes du groupe, qui est composite (PCF et elus
          ultramarins non communistes : l'oratrice du 14 janvier 2026 est
          reunionnaise). AUCUNE declaration de Roussel datee de 2026 sur le
          voile ou la laicite n'a ete trouvee. Fourchette prudente : -1 a 0.
      S6:
        valeur: -2
        just: >
          Position la plus radicale du compas sur cet axe. Base commune du 40e
          congres : « nous portons LA FIN DU FINANCEMENT PUBLIC DES ECOLES
          PRIVEES SOUS CONTRAT. Le financement collectif du separatisme social
          et scolaire n'est pas acceptable : l'argent public doit aller a
          l'ecole publique. Cela passe aussi par L'INTERDICTION DE TOUTES LES
          ECOLES PRIVEES HORS CONTRAT. L'ambition des communistes vise une seule
          ecole commune. » S'y ajoutent l'ecole obligatoire jusqu'a 18 ans et la
          baisse des effectifs par classe.
        src: [pcf_base_commune_40e, nfp_contrat_legislature]
        contest: >
          Plus radical que Quebec solidaire, qui occupait le -2 : chez QS le
          prive subsiste, converti et integre ; le PCF le supprime. C'est ce
          depassement qui a impose de ramener QS a -1,5.
      S7:
        valeur: -1
        just: >
          Le groupe a vote contre la presomption de legitime defense pour les
          forces de l'ordre (17 contre) et contre le projet de loi sur l'ordre
          public (15 contre). Sur la loi narcotrafic d'avril 2025, le groupe
          s'est divise (1 pour, 4 contre), la ou LFI votait contre en bloc.
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          La ligne « republicaine » de Roussel sur la securite est plus ferme
          que celle de ses parlementaires, sans declaration datee de 2026 pour
          l'etablir. -1 plutot que -1,5 traduit cette tension.
  - name: La France insoumise
    sigle: LFI
    label_pos: bottom left
    chef: Jean-Luc Mélenchon
    country: France
    color: "#CC2443"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: planificateur
    estimation_initiale: {economie: -8, societe: -6}
    autorite: >
      Critiqué pour la centralisation de son mouvement ; ses soutiens mettent en
      avant la démocratie participative de son programme.
    resume: >
      Gauche radicale : SMIC à 1600 euros net, retraite à 60 ans,
      rétablissement de l'ISF, planification écologique, VIe République.
      Progressiste sur les questions de société.
    indicateurs:
      E1:
        valeur: -2
        just: >
          Le Contrat de legislature du Nouveau Front populaire prevoit un impot
          sur le revenu a 14 tranches, une CSG progressive, le retablissement
          d'un ISF renforce a volet climatique, la suppression de la flat tax,
          le retablissement de l'exit tax, et une reforme de l'heritage avec
          instauration d'un « heritage maximum ». La synthese de L'Avenir en
          commun edition 2025 confirme comme deja presents au programme :
          heritage maximum, taxe Zucman ou impot plancher sur le patrimoine des
          milliardaires, ISF renforce, revenu maximum.
        src: [nfp_contrat_legislature, lfi_avenir_commun_2025]
        contest: >
          L'« heritage maximum » — plafond absolu de transmission, et non un
          taux — est une mesure sans equivalent dans les trois autres
          territoires. C'est l'un des deux depassements qui ont impose de
          ramener Quebec solidaire de -2 a -1,5 sur cet indicateur.
      E2:
        valeur: -2
        just: >
          La synthese 2025 range parmi les mesures deja presentes au programme :
          « la sortie du marche des secteurs strategiques, traduite par la
          creation de poles publics impliquant des nationalisations »,
          « socialiser certaines banques de detail », « renationaliser des
          secteurs cibles », « nationalisations sous controle democratique », et
          des nationalisations d'autoroutes. Le NFP 2024 prevoit un pole public
          bancaire adosse a la CDC et a la BPI, un pole public du medicament et
          le rattrapage des postes manquants de fonctionnaires, avec hausse de
          10 % du point d'indice.
        src: [lfi_avenir_commun_2025, nfp_contrat_legislature]
        contest: >
          Marginalement moins radicale que le PCF : le pole public bancaire du
          NFP s'appuie sur des outils publics existants plutot que sur la
          nationalisation d'etablissements prives nommes, et LFI ne chiffre pas
          de creation de postes. L'echelle au demi-point ne permet pas de les
          separer ; le PCF reste le point de reference de la borne.
      E3:
        valeur: -2
        just: >
          La synthese 2025 range le « 100 % Secu » parmi les mesures deja
          presentes au programme, avec un pole public du medicament et
          l'interdiction des brevets sur les medicaments d'urgence sanitaire ;
          la contribution nouvelle la plus citee est « en finir avec la
          financiarisation de la sante ». Le NFP 2024 prevoit d'abroger les
          reformes de l'assurance chomage des les quinze premiers jours, puis un
          grand plan de recrutement du soin et du medico-social.
        src: [lfi_avenir_commun_2025, nfp_contrat_legislature, assnat_scrutins_chomage_2026]

      S1:
        valeur: -2
        just: >
          Le contrat NFP de juin 2024 prevoit d'« abroger les lois asile et
          immigration de Macron », de « regulariser les travailleurs, etudiants,
          parents d'enfants scolarises », d'instituer « la carte de sejour de
          dix ans comme titre de sejour de reference », de « garantir le droit
          du sol integral » et de faciliter l'obtention de la nationalite. Le
          programme 2027 du 17 juillet 2026 ajoute « accorder le droit de vote
          des etrangers aux elections locales ». En seance : 65 deputes contre
          la restriction de la nationalite a Mayotte (8 avril 2025), 52 contre
          la denonciation des accords de 1968 (30 octobre 2025).
        src: [nfp_contrat_legislature, lfi_programme_2027, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          LFI occupe desormais le -2, qui appartenait a Quebec solidaire. QS
          releve un seuil ; LFI ajoute regularisation massive, droit du sol
          integral, carte de dix ans et droit de vote des etrangers.
      S2:
        valeur: -2
        just: >
          75 deputes sur 75 pour la constitutionnalisation de la liberte de
          recourir a l'IVG a l'Assemblee le 30 janvier 2024, et 75 sur 75 au
          Congres du 4 mars 2024 — l'un des trois seuls groupes a voter a
          l'unanimite sans une abstention. LFI est a l'origine de la proposition
          de loi constitutionnelle anterieure (24 novembre 2022). Le programme
          2027 demande un « acces universel au droit a l'IVG et a la
          contraception ».
        src: [assnat_congres_ivg, assnat_scrutin_3289, nfp_contrat_legislature, lfi_programme_2027]
      S3:
        valeur: -2
        just: >
          Le contrat NFP prevoit d'« etablir la filiation par reconnaissance
          comme principe par defaut », de « rembourser la PMA » et de « la
          rendre accessible aux personnes trans », et d'« autoriser le
          changement d'etat civil libre et gratuit devant un officier d'etat
          civil » — soit l'autodetermination sans juge. Le programme 2027 cree
          une « adoption sociale ». 16 des 17 deputes ont vote la loi
          bioethique ouvrant la PMA a toutes le 29 juin 2021.
        src: [nfp_contrat_legislature, lfi_programme_2027, assnat_scrutin_3855]
        contest: >
          Depasse Quebec solidaire (-1,5) : autodetermination de l'etat civil
          sans juge, PMA ouverte aux personnes trans, multiparentalite. Le -2 de
          S3, que le Quebec laissait vacant, est occupe par la France.
      S4:
        valeur: -1.5
        just: >
          Constance sur quatre lectures : 62 pour / 1 contre le 27 mai 2025,
          62/1 le 25 fevrier 2026, 62/2/3 le 30 juin 2026, et 61 pour / 2 contre
          / 3 abstentions en lecture definitive le 15 juillet 2026. Le contrat
          NFP engageait a « instaurer un droit a mourir dans la dignite ».
        src: [assnat_scrutin_8280, assnat_scrutin_2107, nfp_contrat_legislature]
        contest: >
          -1,5 et non -2 : la loi francaise promulguee le 18 aout 2026 EXCLUT
          les demandes anticipees et exige un discernement intact, la ou le
          Quebec les a legalisees. Aucun parti francais ne peut donc atteindre
          le -2 quebecois, et LFI ne propose pas d'aller au-dela de la loi.
      E4:
        valeur: -2
        just: >
          « La retraite a 60 ans » figure parmi les cinq mesures-titres du site
          du mouvement, aux cotes du SMIC a 1 700 € net et du blocage des prix.
          Le chantier programmatique 2027 confirme : « instaurer la retraite a
          60 ans, mesure phare de L'Avenir en commun depuis 2017 »,
          revalorisation des pensions au niveau du SMIC revalorise,
          retablissement des criteres de penibilite supprimes. Le groupe a vote
          l'abrogation de la reforme de 2023 et contre la LFSS 2026 portant
          simple suspension.
        src: [lfi_site_programme, lfi_programme_2027, nfp_contrat_legislature, assnat_scrutin_2257]
        contest: >
          Le vote contre la LFSS 2026 n'est pas un vote contre la suspension
          mais contre un texte juge insuffisant : LFI veut l'abrogation.
      E5:
        valeur: -2
        just: >
          SMIC a 1 700 € net, soit +17,8 % par rapport aux 1 443 € net du
          1er janvier 2026. S'y ajoutent les 32 heures hebdomadaires, une
          sixieme semaine de conges payes, l'indexation des salaires sur
          l'inflation, un quota maximal de contrats precaires, la titularisation
          des precaires des trois fonctions publiques, la requalification des
          travailleurs de plateformes en salaries et l'obligation de
          transparence salariale. Sur le chomage : « retablir une
          assurance-chomage protectrice » et supprimer les reformes successives
          du calcul de l'allocation.
        src: [lfi_site_programme, lfi_programme_2027, nfp_contrat_legislature, assnat_scrutins_chomage_2026]
        contest: >
          Depasse l'ancrage de Quebec solidaire, dont la position reposait sur
          la seule hausse du salaire minimum — d'ou la revision de QS a -1,5.
      E6:
        valeur: -2
        just: >
          « Bloquer les prix » est l'une des cinq mesures-titres du site. Le
          contrat NFP en donne le contenu operationnel, en tete des quinze
          premiers jours : « bloquer les prix des biens de premiere necessite
          dans l'alimentation, l'energie et les carburants PAR DECRET ».
          S'y ajoutent l'abolition de la taxe de 10 % sur les factures
          d'energie, le plafonnement des frais bancaires, la gratuite des
          premiers kWh, l'abolition des coupures d'electricite et de gaz, un
          prix plancher remunerateur aux agriculteurs, la hausse des effectifs
          de la DGCCRF pour controler l'application du blocage, et la « Regle
          verte ».
        src: [lfi_site_programme, nfp_contrat_legislature, lfi_programme_2027, assnat_scrutins_environnement]
      S5:
        valeur: -2
        just: >
          Seule force du compas a proposer de REVENIR SUR UNE RESTRICTION
          RELIGIEUSE EN VIGUEUR. Le 6 septembre 2026, Mathilde Panot a juge
          « absurde » l'interdiction de l'abaya a l'ecole et assure que la
          mesure « serait annulee en cas de victoire de Jean-Luc Melenchon en
          2027 ». En commission le 14 janvier 2026, le groupe a fait adopter
          l'amendement supprimant la proposition de loi sur le voilement des
          mineures, qualifiee d'« inconstitutionnelle, islamophobe et inutile ».
          Votes contre la restriction du droit du sol a Mayotte et contre
          l'inscription des Freres musulmans sur la liste terroriste
          europeenne.
        src: [cnews_abaya_2026, assnat_rapport_2338, assnat_scrutin_1308]
        contest: >
          Panot vise explicitement l'abaya, non la loi de 2004. L'accusation
          adverse selon laquelle LFI voudrait abroger la loi de 2004 et
          reintroduire tous les signes religieux a l'ecole est une imputation
          d'adversaires, non une position sourcee : elle n'entre pas dans la
          note.
      S6:
        valeur: -1.5
        just: >
          Fin aout 2026, Melenchon a accuse Philippe et Attal de vouloir
          « dynamiter l'ecole publique » et de defendre un « marche de la
          concurrence ». Le programme vise 19 eleves par classe en fin de mandat
          avec 160 000 recrutements d'enseignants, la gratuite de la cantine,
          l'abolition de Parcoursup et de la selection a l'universite, la
          modulation des dotations des etablissements « y compris prives » selon
          la mixite sociale, et le refus de financement public de nouveaux
          etablissements confessionnels.
        src: [cnews_ecole_2026, nfp_contrat_legislature, cnews_abaya_2026]
        contest: >
          L'Avenir en commun est « en cours de reactualisation » : la note
          repose sur le socle NFP 2024 et sur des declarations d'aout-septembre
          2026. LFI ne va pas, dans ses textes publies, jusqu'a la fin du
          financement du prive sous contrat portee par le PCF — d'ou -1,5.
      S7:
        valeur: -1.5
        just: >
          Opposition systematique aux textes de durcissement penal : 69 contre
          la presomption de legitime defense pour les forces de l'ordre
          (7 juillet 2026), 71 contre le projet de loi « reponses immediates aux
          phenomenes troublant l'ordre public » (21 juillet 2026), 60 contre la
          loi narcotrafic (29 avril 2025 — texte que le groupe socialiste a
          vote).
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
