        src: [rn_programme_2024, rn_contre_budget_2026, rn_mlafrance_2022, assnat_scrutin_2257]
        contest: >
          Pas de programme presidentiel 2027 : le premier grand meeting est
          annonce au congres d'Orleans des 24-25 octobre 2026, a rouvrir apres
          cette date. Divergence interne attestee entre la ligne Bardella,
