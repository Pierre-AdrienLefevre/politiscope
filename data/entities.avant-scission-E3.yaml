      S1:
        valeur: -1
        just: >
          La plateforme 2024 intitule son chapitre migratoire « Expanding Legal
          Immigration & Deterring Illegal Immigration » : elargissement des
          voies legales et regularisation des sans-papiers de longue date, mais
          revendication explicite du durcissement frontalier de 2024
          (« securing our border in the face of Republican inaction »). En 2026,
          la New Democrat Coalition defend un « pragmatic balance » associant
          renforcement de la police aux frontieres, expulsions ciblant les
          condamnes, et elargissement des canaux legaux, pendant qu'une aile
          parlementaire relance « Abolish ICE ».
        src: [dem_plateforme_2024, new_dem_coalition, npr_abolish_ice]
        contest: >
          Ecart interne large mais ORDONNE autour d'un centre de gravite
          identifiable, d'ou une note unique defendable. Fourchette interne
          reelle : environ -2 (aile « Abolish ICE ») a -0,5 (New Democrat
          Coalition, elus des circonscriptions frontalieres). Tous partagent
          l'objectif d'elargir les voies legales ; personne ne soutient la
          reduction des niveaux.
      S2:
        valeur: -2
        just: >
          La plateforme 2024 erige la « Reproductive Freedom » en chapitre
          propre et s'engage a « restore the right to choose », c'est-a-dire a
          inscrire Roe dans la loi federale. Le parti a retire le soutien a
          l'amendement Hyde de sa plateforme depuis 2016 et ne l'a pas
          reintroduit, soit une position de remboursement public. Les
          gouverneurs et legislatures democrates ont constitutionnalise ou
          legifere l'acces dans leurs Etats et finance la compensation du
          desengagement federal.
        src: [dem_plateforme_2024, washington_planned_parenthood]
        contest: >
          Ecart interne marginal sur cet indicateur : la note unique est
          pleinement defendable. Les democrates rejoignent LFI, le PCF, le PS et
          QS a -2.
      S3:
        valeur: -1.5
        just: >
          Position institutionnelle d'extension : soutien a l'Equality Act,
          opposition aux interdictions d'Etats. Vote enregistre probant : sur la
          cloture de S.9 (Protection of Women and Girls in Sports Act), AUCUN
          senateur democrate n'a vote pour ; a la Chambre, le 14 janvier 2025,
          H.R. 28 est passe 218-206 avec SEULEMENT DEUX democrates pour. Mais le
          14 septembre 2026, la presse documente un recalibrage : les democrates
          sont partages a parts a peu pres egales sur la participation des
          femmes trans aux sports feminins, Newsom jugeant la competition
          « deeply unfair ».
        src: [govtrack_hr28, senat_cloture_s9, ap_democrates_trans_2026]
        contest: >
          ECART INTERNE LE PLUS FORT DU LOT NORD-AMERICAIN. `absent` a ete
          examine et rejete de justesse. Ce qui sauve la note unique : un vote
          enregistre quasi unanime en 2025, exactement le type de preuve que le
          compas privilegie. Ce qui la fragilise : un recalibrage documente mais
          a ce jour RHETORIQUE et cantonne a la seule question des sports, sans
          traduction legislative. Fourchette interne : environ -2 a 0. Si
          l'indicateur etait scinde entre protections anti-discrimination et
          question sports/genre, une note unique deviendrait indefendable.
      S4:
        valeur: -1
        just: >
          La plateforme 2024 est muette sur la fin de vie, mais toutes les
          legalisations recentes sont le fait de democrates : le Delaware en mai
          2025, l'Illinois en decembre 2025 — treizieme juridiction et premier
          Etat du Midwest —, l'Etat de New York debut 2026. Le modele retenu
          reste cependant le modele Oregon : maladie terminale avec pronostic de
          six mois et auto-administration obligatoire.
        src: [compassion_choices_illinois, death_dignity_illinois]
        contest: >
          NOTE D'ORIGINE ETATIQUE, NON FEDERALE : le parti federal n'a aucune
          position ecrite, ni plateforme, ni vote. `absent` a ete ecarte parce
          que trois signatures de gouverneurs en quatorze mois constituent une
          position prise et datee. Le -1,5 n'est pas atteint parce que le modele
          democrate — pronostic terminal a six mois, auto-administration — est
          PLUS RESTRICTIF que la loi francaise, laquelle fonde le -1,5 de LFI et
          du PS.
      S5:
        valeur: -1
        just: >
          La plateforme 2024 comporte une section « Combating Hate & Protecting
          Freedom Of Religion » et s'oppose a l'interdiction d'entree visant des
          pays musulmans ; aucun elu democrate n'a vote la loi du 4 juillet 2025
          portant les clauses de priorite nationale. Mais l'ecart interne est
          ENREGISTRE ET AGISSANT sur la regle meme du compas : 12 senateurs et
          46 a 48 representants democrates ont vote le Laken Riley Act, qui
          impose la detention obligatoire de non-citoyens simplement INCULPES de
          vol. Et au niveau des Etats, le budget californien de 2025, negocie
          entre le gouverneur Newsom et une legislature democrate, GELE
          l'inscription des adultes sans statut a la couverture sante a taux
          plein a compter de janvier 2026.
        src: [dem_plateforme_2024, rollcall_laken_riley, cipc_medical, calmatters_medical]
        contest: >
          Fourchette defendable : -1,5 (plateforme, opposition unanime a la loi
          du 4 juillet, opposition au Travel Ban) a -0,5 (les 12 senateurs Laken
          Riley, le gel californien). -1 est le centre de gravite. Un parti dont
          des executifs appliquent une restriction d'aide medicale aux etrangers
          pendant que son programme national la denonce n'est pas homogene, mais
          la restriction etatique est motivee budgetairement et non
          identitairement.
      S6:
        valeur: -1.5
        just: >
          La plateforme 2024 contient la formule la plus complete de rejet du
          financement du prive parmi les partis non communistes du corpus :
          « we oppose the use of private-school vouchers, tuition tax credits,
          opportunity scholarships, and other schemes that divert taxpayer-funded
          resources away from public education ». Le credit d'impot vise est
          exactement le mecanisme adopte six mois plus tard SANS UNE SEULE VOIX
          DEMOCRATE. La plateforme denonce nommement les retraits d'ouvrages et
          comporte une section LGBTQI+. Sept Etats a direction democrate imposent
          a l'inverse un curriculum inclusif.
        src: [dem_plateforme_2024, nbc_curriculum_inclusif, chalkbeat_plateformes]
        contest: >
          Indicateur ou la cohesion democrate est la plus forte et la note
          unique la plus solide. Le desaccord interne reel porte sur les ecoles
          a charte, que la plateforme n'exclut pas, mais ce sont des
          etablissements PUBLICS qui ne relevent pas du pole mesure. -1,5 aligne
          le parti sur LFI et QS, en deca du PCF qui va jusqu'a l'interdiction
          des ecoles hors contrat.
      S7:
        valeur: -0.5
        just: >
          La plateforme 2024 a opere un deplacement ENREGISTRE vers la fermete :
          elle affirme « we need to fund the police, not defund the police », se
          felicite d'investissements records en securite publique, ne mentionne
          PAS les violences policieres, et a SUPPRIME par rapport a 2020 le plank
          d'abolition de la peine de mort, le paragraphe sur l'abrogation des
          peines planchers, l'engagement de mettre fin a la guerre contre la
          drogue, la decriminalisation du cannabis et la suppression de
          l'immunite qualifiee. A l'inverse, Joe Biden a commue 37 des 40
          condamnations a mort federales en decembre 2024, et les procureurs
          generaux democrates de l'Illinois, de l'Oregon et de la Californie ont
          obtenu l'invalidation des deploiements de la Garde nationale.
        src: [dem_plateforme_2024, time_plateforme_penale, aclu_plateforme_2024]
        contest: >
          NOTE UNIQUE LA PLUS CONTESTABLE DU LOT DEMOCRATE. -0,5 aligne les
          democrates sur le PS francais, ce qui est coherent : abolitionnistes
          dans les faits au pouvoir, mais ayant renonce programmatiquement aux
          planks de reforme penale.
      E1:
        valeur: -1.5
        just: >
          Plateforme 2024 : impot minimum de 25 % sur le revenu des
          milliardaires, assiette incluant les plus-values latentes, chiffre a
          environ 500 Md$ sur dix ans ; remontee du taux de l'impot sur les
          societes de 21 % a 28 % ; fin du traitement preferentiel des
          plus-values pour les millionnaires ; suppression du stepped-up basis ;
          taxe sur les rachats d'actions portee a 4 %. Contrepartie :
          engagement absolu qu'« aucun Americain gagnant moins de 400 000 $ par
          an ne paiera un centime d'impot federal supplementaire ».
        src: [dem_plateforme_2024]
        contest: >
          Le plancher des 400 000 $ empeche de descendre a -2. Ecart interne
          borne : aile Warren-Sanders a -2 (impot sur la fortune de 2 a 3 %
          au-dela de 50 M$), aile centriste des elus de New York, du New Jersey
          et de Californie qui se sont battus pour RELEVER le plafond SALT,
          mesure regressive — contradiction interne documentee. La direction
          reste consensuelle, seule l'intensite varie.
      E2:
        valeur: -1
        just: >
          Plateforme 2024 : politique industrielle massive, refinancement de
          l'administration fiscale, extension des transferts, investissements
          publics dans le transport, le logement et l'ecole. Mais engagement
          explicite de REDUIRE LE DEFICIT DE 3 000 Md$ sur dix ans : le parti ne
          propose pas une hausse illimitee de la depense. En 2025-2026 :
          opposition frontale aux coupes d'effectifs, contentieux, et shutdown
          de 43 jours — le plus long de l'histoire — mene en partie sur le
          retablissement des financements. Aucune nationalisation au programme
          federal.
        src: [dem_plateforme_2024, npr_rif_shutdown]
        contest: >
          Ecart interne large. Aile gauche : Mamdani, maire de New York depuis
          janvier 2026, cree des EPICERIES MUNICIPALES, un promoteur public de
          logement et la gratuite des bus, ce qui vaudrait -2. Aile centriste
          « abundance » : une faction croissante veut REDUIRE les procedures et
          l'emprise administrative sur le logement et l'energie, ce qui vaudrait
          -0,5. Deuxieme plus grand ecart democrate apres E3.
      E3:
        valeur: -1.5
        just: >
          Plateforme 2024 : proteger et etendre l'Affordable Care Act, soutien a
          l'expansion Medicaid, extension d'une couverture de type Medicaid aux
          2,8 millions d'adultes a bas revenu du coverage gap, negociation des
          prix des medicaments par Medicare, extension au dentaire, a l'optique
          et a l'audition. Le texte met en avant les 150 millions d'Americains
          couverts par une assurance privee : LA COUVERTURE PRIVEE N'EST PAS
          EVINCEE. Opposition unanime des deux caucus a la loi du 4 juillet 2025,
          shutdown de 43 jours et vote unanime pour l'extension des subventions.
        src: [dem_plateforme_2024, thehill_subventions_aca, congress_medicare_for_all]
        contest: >
          ECART INTERNE QUANTIFIE, LE PLUS LARGE DES SIX INDICATEURS. Le Medicare
          for All Act rassemble 115 signatures sur environ 213 democrates de la
          Chambre, SOIT UNE MAJORITE DU CAUCUS, pour un texte qui evince
          l'assurance privee duplicative — critere explicite du -2. Au Senat, 18
          sur 47, soit 38 %. Le -2 n'a pas ete retenu parce que ce parrainage est
          un signal a faible cout, jamais soumis au vote, non soutenu par la
          direction, et qu'aucun candidat presidentiel depuis 2020 n'a fait
          campagne dessus ; la conduite legislative reelle de 2025-2026 a
          consiste a defendre un systeme fonde sur l'assurance privee
          subventionnee. Fourchette interne : -2 a -1.
      E4:
        valeur: -1.5
        just: >
          Plateforme 2024 : « we reject any effort to privatize Social Security
          or to cut any of the benefits that the American people have earned » ;
          « we'll strengthen the program and EXPAND BENEFITS by asking the
          wealthiest Americans to pay their fair share » — soit le deplafonnement
          de la cotisation. Extension de Medicare au dentaire, a l'optique et a
          l'audition. Le texte attaque explicitement les republicains pour
          vouloir relever l'age de la retraite.
        src: [dem_plateforme_2024]
        contest: >
          INDICATEUR OU LA COHESION DEMOCRATE EST LA PLUS FORTE : le refus de
          tout relevement de l'age et de toute privatisation est consensuel de
          Sanders a Schumer. Pas -2 : LFI propose un ABAISSEMENT de l'age a
          60 ans ; les democrates ne proposent pas d'abaisser l'age americain de
          67 ans, seulement de hausser les prestations.
      E5:
        valeur: -1.5
        just: >
          Plateforme 2024 : adoption du PRO Act, plus grande extension du droit
          du travail americain depuis 1935 ; « we oppose state right-to-work
          laws » en toutes lettres ; sanctions contre le union-busting ;
          interdiction de la plupart des clauses de non-concurrence ; salaire
          minimum federal « a au moins 15 $ ». Traduction legislative : le Raise
          the Wage Act de 2025 porte le salaire minimum federal a 17 $/h en 2030
          et supprime progressivement les sous-minima ; 142 cosignataires a la
          Chambre, soit environ 66 % du caucus, et 33 au Senat, soit 70 %.
        src: [dem_plateforme_2024, congress_raise_the_wage, epi_raise_the_wage]
        contest: >
          Cohesion elevee : des majorites des deux caucus parrainent le texte.
          Aile gauche a -2 : Mamdani pousse un salaire minimum new-yorkais de
          30 $/h d'ici 2030 et la negociation sectorielle. Pas -2 pour le parti :
          le plancher federal vise reste une trajectoire lente, et le PRO Act n'a
          jamais franchi le Senat meme sous majorite democrate.
      E6:
        valeur: -1.5
        just: >
          Plateforme 2024 : repression des prix abusifs ; NEGOCIATION DIRECTE
          DES PRIX DES MEDICAMENTS par Medicare, deja en vigueur, avec
          recuperation de rabais si l'industrie depasse l'inflation — un controle
          de prix effectif ; interdiction des frais caches ; antitrust offensive ;
          defense de l'endangerment finding et des normes d'emission. Harris
          avait propose en 2024 une interdiction federale des prix abusifs sur
          l'alimentation.
        src: [dem_plateforme_2024, pbs_endangerment]
        contest: >
          Ecart interne net et croissant. Aile gauche a -2 : Mamdani applique a
          New York un GEL DES LOYERS, des epiceries municipales et la gratuite
          des bus — controle des prix direct, rare en Amerique du Nord. Aile
          « abundance » a -0,5 : une faction montante veut DEREGLEMENTER
          l'urbanisme et le raccordement energetique. L'ecart porte toutefois sur
          des objets differents — prix de consommation contre procedures
          d'amenagement — et n'est donc pas strictement une contradiction.
  - name: Parti libéral du Canada
    sigle: PLC
    label_pos: bottom center
    chef: Mark Carney
    country: Canada
    color: "#D71920"
    as_of: "2026-09-17"
    souverainete: multilateraliste
    ecologie: reformiste
    estimation_initiale: {economie: 2, societe: -2}
    autorite: null
    resume: >
      Au gouvernement. Centrisme pragmatique : abolition de la taxe carbone
      pour les consommateurs, hausse des dépenses de défense, grands projets
      d'infrastructure, diversification commerciale face aux tarifs américains.
      Modérément progressiste sur les questions de société.
    indicateurs:

      S1:
        valeur: 0.5
        just: >
          Le Plan des niveaux d'immigration 2026-2028, premier du gouvernement
          Carney, publie le 4 novembre 2025, stabilise les admissions
          permanentes a environ 380 000 par an — nettement sous les cibles du
          debut de la decennie — et poursuit la reduction des residents
          temporaires (385 000 en 2026, 370 000 ensuite), avec l'objectif de
          ramener la population temporaire sous 5 % de la population totale d'ici
          fin 2027. A enveloppe constante, le plan augmente la part economique
          (environ 64 % du total) et REDUIT les volets familial et refugies.
          Contrepoids : engagement a porter l'immigration francophone hors
          Quebec a 12 % d'ici 2029, et niveaux absolus parmi les plus eleves de
          l'OCDE par habitant.
        src: [ircc_plan_niveaux_2026]
        contest: >
          Aligne sur la CAQ et Renaissance : baisse assumee et reduction du
          regroupement familial, mais sans expulsions accrues ni restriction de
          l'acces a la nationalite.
      S2:
        valeur: -1.5
        just: >
          La plateforme 2025 consacre une section « Protecting Your Sexual and
          Reproductive Health and Rights » : perennisation du Fonds pour la sante
          sexuelle et reproductive « to ensure that there will always be funding
          for abortion care in Canada », et programme de FIV couvrant jusqu'a
          20 000 $ par cycle. Carney : « I absolutely support a woman's right to
          choose ». Le gouvernement applique la Loi canadienne sur la sante pour
          sanctionner les provinces qui facturent l'avortement en clinique.
        src: [plc_plateforme_2025, cbc_plateforme_repro, arcc_bilans]
        contest: >
          Un cran au-dessus du PLQ parce que le PLC finance activement, un cran
          en dessous du -2 faute de garantie legislative : l'avortement au Canada
          repose sur l'ABSENCE DE LOI PENALE depuis 1988, et les liberaux n'ont
          jamais legifere un droit positif. Reserve signalee par les
          organisations de defense : le cabinet Carney de mai 2025 a supprime les
          postes de ministre des Femmes et de l'Egalite des genres et de ministre
          de la Diversite.
      S3:
        valeur: -1.5
        just: >
          Acquis legislatif : interdiction des therapies de conversion adoptee en
          2021 sous gouvernement liberal, et plan d'action federal 2SLGBTQI+
          finance. La plateforme 2025 justifie explicitement le programme de FIV
          a 20 000 $ par l'acces a la parentalite « especially 2SLGBTQI+
          Canadians who face a costly journey to parenthood » — mesure
          d'extension de la parentalite.
        src: [plc_plateforme_2025, bc_humanist_plateformes]
        contest: >
          Un cran au-dessus du PLQ et de Renaissance grace a l'interdiction
          effective des therapies de conversion et a l'extension de la
          parentalite. N'atteint pas -2 : pas de norme nationale opposable sur
          l'acces a la transition, la sante etant de competence provinciale, et
          suppression des ministeres de l'Egalite des genres et de la Diversite
          dans le cabinet de mai 2025.
      S4:
        valeur: -1.5
        just: >
          Le PLC est l'auteur des deux lois qui ont cree puis elargi l'aide
          medicale a mourir au Canada : C-14 en 2016 et C-7, adopte en mars 2021
          par 180-149, qui a ouvert le volet 2 aux personnes dont la mort n'est
          PAS raisonnablement previsible — regime plus large que la loi francaise
          de 2026, qui exige une phase avancee ou terminale. Le gouvernement a
          renonce a contester la loi quebecoise sur les demandes anticipees et a
          conduit une consultation nationale close en octobre 2025. Mais il n'a
          PAS legifere les demandes anticipees et a reporte deux fois
          l'admissibilite pour maladie mentale, jusqu'au 17 mars 2027.
        src: [justice_canada_amm, cbc_c7_vote, sante_canada_demandes_anticipees]
        contest: >
          Exactement au niveau de LFI et du PS, mais pour une raison INVERSE : la
          France plafonne a -1,5 faute de demandes anticipees alors que son
          eligibilite est plus etroite ; le PLC plafonne a -1,5 faute de demandes
          anticipees alors que son eligibilite est plus large. Les deux
          limitations se compensent. Seul le Quebec autorise les demandes
          anticipees, depuis le 30 octobre 2024 : c'est ce qui lui reserve le -2.
      S5:
        valeur: -1.5
        just: >
          Avec LFI et le NPD, l'une des trois seules forces du compas a AGIR
          pour lever une restriction religieuse en vigueur — et la seule a le
          faire par un acte de gouvernement. Carney a repris en janvier 2025
          l'engagement d'intervenir devant la Cour supreme contre la loi 21
          quebecoise ; le gouvernement federal est intervenu a l'audience du
          23 au 26 mars 2026, demandant en outre des limites a l'usage repete ou
          preventif de la clause derogatoire, au motif que « the prolonged
          impossibility of exercising a right or freedom would, in practice, be
          tantamount to denying its very existence ». Ottawa a refuse de retirer
          son memoire malgre la demande des provinces conservatrices. Le meme
          gouvernement a fait adopter la Loi sur la lutte contre la haine
          (C-9, sanctionnee le 18 juin 2026), protegeant l'acces aux lieux de
          culte.
        src: [globe_loi21_cour_supreme, ccla_audience_loi21, cbc_c9_haine]
        contest: >
          RESULTAT CONTRE-INTUITIF, signale comme tel : un parti de gouvernement
          centriste se retrouve plus multiculturaliste que le PLQ et le PS. Il
          ne va pas jusqu'a LFI : il agit par voie contentieuse en demandant un
          encadrement de la clause derogatoire, non par un engagement
          d'abrogation. Les baisses de seuils d'immigration de Carney relevent de
          S1 et ne sont pas comptees ici.
      S6:
        valeur: -0.5
        just: >
          L'education est une competence PROVINCIALE EXCLUSIVE au Canada et le
          financement des ecoles confessionnelles est verrouille
          constitutionnellement : le PLC n'a aucune prise sur les deux premieres
          sous-dimensions et n'en propose aucune. Les seuls elements verses au
          dossier sont du cote negatif : programme national d'alimentation
          scolaire (1 G$) et maintien du reseau de garde a 10 $/jour renforcent
          l'offre publique ; C-9 cree une infraction d'intimidation aux abords
          des ecoles. Des ministres federaux ont publiquement combattu les
          politiques provinciales de consentement parental aux changements de
          prenom et de pronom.
        src: [plc_canada_strong, presse_canadienne_genre_ecole]
        contest: >
          NOTE LA PLUS FRAGILE DU LOT CANADIEN. Les declarations sur le genre a
          l'ecole datent de 2023 et de l'ere Trudeau, PAS de Carney, et aucune
          prise de position equivalente du gouvernement actuel n'a ete trouvee.
          `absent` a ete ecarte — il y a des positions et des depenses reelles —
          mais -0,5 doit se lire « faiblement negatif ET faiblement documente »,
          non comme un equivalent des -0,5 francais.
      S7:
        valeur: 1
        just: >
          Le gouvernement Carney a LEGIFERE un durcissement substantiel, a
          contre-courant de sa propre loi de 2022 qui abrogeait de nombreuses
          peines minimales. Le projet C-14, sanctionne le 15 juin 2026 et en
          vigueur le 15 juillet, comporte plus de 80 clauses : extension de
          l'INVERSION DU FARDEAU DE LA PREUVE au cautionnement pour les
          infractions graves et liees au crime organise, precision que le
          principe de retenue n'emporte pas remise en liberte automatique,
          PEINES CONSECUTIVES OBLIGATOIRES en cas de condamnations multiples,
          interdiction des peines avec sursis pour certaines infractions
          sexuelles. Le gouvernement a impose la cloture du debat le 12 juin
          2026 : 166 liberaux pour, TOUS LES AUTRES PARTIS CONTRE.
        src: [justice_canada_c14, legisinfo_c14, ourcommons_vote_155, canada_reforme_cautionnement]
        contest: >
          Contrepoids reel : les liberaux ont rejete la motion conservatrice
          « Jail Not Bail » puis le projet C-242, et refusent le retablissement
          des peines planchers. +1 — au-dessus de la CAQ, au niveau de
          Renaissance — reflete un durcissement legislatif effectif sans bascule
          vers l'automaticite des peines. Reserve d'archive : aucune ventilation
          par parti du vote de troisieme lecture sur C-14 n'a pu etre retrouvee,
          seule la division sur la cloture est indexee.
      E1:
        valeur: 0.5
        just: >
          Deux mesures de sens oppose, a dominante baissiere. Baisse du taux
          marginal de la premiere tranche de 15 % a 14 %, pleine au 1er janvier
          2026, coutant 4 214 M$ en 2025-26 et montant a 6 077 M$ en 2028-29. Et
          surtout ANNULATION DE LA HAUSSE DU TAUX D'INCLUSION DES GAINS EN
          CAPITAL — retour de 66,7 % a 50 % —, coutant 4 456 M$ en 2028-29 :
          une reduction nette de la fiscalite du capital. Suppression de la taxe
          carbone consommateur le 14 mars 2025. Aucune baisse de l'impot sur les
          societes, aucun impot sur la fortune, taux marginal superieur
          inchange.
        src: [plc_plan_fiscal_2025, cbc_budget_2025]
        contest: >
          Arbitrage entre 0 (baisse ciblee sur le bas de bareme, geste
          progressif) et +1 (annulation de la hausse sur le capital, cout
          croissant, aucune contrepartie sur le haut). +0,5 place le PLC entre le
          PLQ et le RN, a droite de la CAQ : consequence directe du renoncement
          sur les gains en capital.
      E2:
        valeur: 1
        just: >
          Budget 2025, adopte de justesse 170-168 : revue exhaustive des
          depenses produisant 13 Md$ d'economies annuelles d'ici 2028-29 et
          60 Md$ sur cinq ans ; REDUCTION DE LA FONCTION PUBLIQUE DE 16 000 ETP
          SUR TROIS ANS, l'effectif passant de 368 000 a 330 000 d'ici 2028-29,
          soit environ 38 000 postes ou -10 %. Croissance des depenses de
          fonctionnement plafonnee sous 2 %/an. Contrepoids : deficit total de
          78 Md$, depense en capital de 53,1 Md$, creation de la societe d'Etat
          Build Canada Homes.
        src: [cbc_budget_effectifs, plc_plan_fiscal_2025, cbc_budget_adoption]
        contest: >
          RESULTAT CONTRE-INTUITIF : sur cet indicateur, le budget liberal
          PROMULGUE coupe davantage que la plateforme conservatrice ne le
          PROPOSAIT — 13 Md$/an et 38 000 agents, contre environ 5 Md$/an cote
          PCC. La CBC a elle-meme titre « Is Mark Carney's budget a Progressive
          Conservative budget ? ». Le PLC se retrouve a droite de la CAQ, au
          niveau du PLQ et du PQ. Le contrepoids capital interdit d'aller
          au-dela.
      E3:
        valeur: -1.5
        just: >
          Defense du socle universel de la Loi canadienne sur la sante et
          maintien, contre les coupes budgetaires, des programmes de soins
          dentaires, d'assurance-medicaments et de garderies, explicitement
          epargnes par la revue de depenses. Budget 2025 : 2 Md$ pour les
          infrastructures de sante, 500 M$ pour les places en medecine.
          Assurance-chomage : assouplissements lies au choc tarifaire, 3,6 Md$
          sur trois ans. CONTREPOIDS MAJEUR : l'assurance-medicaments est GELEE
          — quatre provinces signataires seulement, soit environ 17 % de la
          population, aucune entente depuis l'arrivee de Carney, et la ministre
          de la Sante indique n'etre en discussion active avec personne.
        src: [cbc_pharmacare_gel, cbc_pharmacare_expiration, sante_canada_pharmacare, plc_plan_fiscal_2025]
        contest: >
          Arbitrage entre -2 et -1. ATTENTION AU BIAIS DE SOCLE : le point de
          depart canadien — interdiction de la facturation privee pour les
          services assures — est structurellement plus public que le francais,
          si bien qu'un parti qui se contente de le defendre se situe deja a
          gauche des ancrages francais.
      E4:
        valeur: -0.5
        just: >
          Carney a declare qu'il n'y aurait aucune coupe dans les pensions ni la
          Securite de la vieillesse, explicitement exclues de la revue de
          depenses. Age de 65 ans maintenu, majoration de 10 % pour les 75 ans
          et plus maintenue. Plateforme chiffree : 600 M$ de « protection de
          l'epargne-retraite » par reduction de 25 % du retrait minimum
          obligatoire — mesure de capitalisation — et 1 137 M$ de majoration
          TEMPORAIRE du Supplement de revenu garanti. Aucun allongement de la
          duree de cotisation, aucun report de l'age.
        src: [plc_plan_fiscal_2025, cbc_carney_retraites]
        contest: >
          -1 defendable si l'on compte la majoration du supplement comme une
          hausse de pension, mais elle est explicitement temporaire et justifiee
          par le choc tarifaire, tandis que la mesure permanente releve de la
          capitalisation.
      E5:
        valeur: -0.5
        just: >
          Cadre en vigueur favorable aux salaries : la loi anti-briseurs de
          greve est en vigueur depuis le 20 juin 2025 — interdiction des
          travailleurs de remplacement dans les entreprises de competence
          federale, sous peine de 100 000 $ d'amende par jour — et le
          gouvernement Carney ne l'a pas remise en cause. Salaire minimum
          federal a 18,15 $/h au 1er avril 2026, INDEXE AUTOMATIQUEMENT a
          l'indice des prix. Contrepoids : 16 000 suppressions de postes,
          denoncees par les syndicats du secteur public.
        src: [edsc_briseurs_greve, edsc_salaire_minimum, cbc_syndicats_budget]
        contest: >
          -1 defendable si l'on credite le gouvernement du maintien de la loi
          anti-briseurs de greve. -0,5 retenu parce que cette loi est un heritage
          de l'entente avec le NPD sous Trudeau, VOTEE AUSSI PAR LES
          CONSERVATEURS, donc non discriminante entre partis canadiens ; ce que
          le PLC apporte en propre est de la formation d'un cote et 16 000
          suppressions de postes de l'autre.
      E6:
        valeur: 0.5
        just: >
          Repositionnement dereglementateur substantiel et documente. Suppression
          de la taxe carbone consommateur le 14 mars 2025, premier acte de Carney
          comme premier ministre. Loi C-5 sanctionnee le 26 juin 2025 :
          le Cabinet peut designer des « projets d'interet national » et
          COURT-CIRCUITER L'EXAMEN REGLEMENTAIRE FEDERAL. Protocole d'entente
          avec l'Alberta en novembre 2025 : prix carbone industriel ramene a
          130 $/t en 2040 au lieu de 170 $/t en 2030 — affaiblissement et report
          de dix ans. Le budget signale que le plafond d'emissions du secteur
          petrolier et gazier pourrait etre abandonne. Carney sur les politiques
          climatiques de Trudeau : « too much regulation, not enough action ».
        src: [canada_c5, legisinfo_c5, cbc_carney_climat, cbc_entente_alberta, cbc_plafond_petrolier]
        contest: >
          Le PLC PASSE DU COTE DEREGULATEUR, au niveau du RN et de Renaissance,
          a droite de la CAQ et du PLQ. Deplacement majeur par rapport au Parti
          liberal de 2021-2024, porte par des mesures effectivement prises. Si le
          compas note des partis et non des gouvernements, il faut choisir : la
          plateforme d'avril 2025 promettait de RESSERRER la tarification
          industrielle, l'action de gouvernement l'a AFFAIBLIE. C'est l'action
          qui a ete notee.
  - name: Parti conservateur du Canada
    sigle: PCC
    label_pos: bottom left
    chef: Pierre Poilievre
    country: Canada
    color: "#1A4782"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: 6, societe: 4}
    autorite: null
    resume: >
      Opposition officielle. Baisses d'impôts, réduction des dépenses
      fédérales, opposition à la taxe carbone, accélération des projets
      énergétiques. Discours de fermeté sur la criminalité. Populisme
      économique centré sur le coût de la vie et le logement.
    indicateurs:

      S1:
        valeur: 1.5
        just: >
          Le 14 juillet 2025, Poilievre a reclame des « very hard caps » sur
          l'immigration et declare : « WE NEED MORE PEOPLE LEAVING THAN COMING »
          pour les deux annees suivantes, au motif que « our country is divided
          and we're not able to integrate people at this pace ». La plateforme
          2025 ramene l'immigration permanente a « a sustainable rate similar to
          the levels under the Harper government », soit 240 000 a 285 000 par
          an, et vise a reduire de moitie le nombre de residents non permanents.
        src: [rci_poilievre_caps, cicnews_comparaison_2025]
        contest: >
          Arbitrage entre +1,5 et +2. « More people leaving than coming » est
          litteralement un objectif de solde migratoire negatif, que seule
          Reconquete formule en France. +1,5 retenu parce que l'objectif est
          explicitement TRANSITOIRE et non structurel comme la remigration,
          qu'il vise le flux global et non le retrait du statut de residents
          installes, que le niveau permanent cible reste proportionnellement
          superieur a ce que proposent LR ou le RN, et qu'aucune restriction de
          l'acces a la nationalite n'est annoncee.
      S2:
        valeur: 0
        just: >
          Le 11 avril 2025, en campagne, Poilievre a declare : « I can guarantee
          you there will be no laws restricting abortion passed when I'm prime
          minister ». C'est un statu quo EXPLICITE, qui releve donc d'une note
          chiffree et non d'`absent`. Il a toutefois refuse de dire si ses
          deputes disposeraient d'un vote libre sur des projets de loi emanant
          de deputes, et il defendait publiquement des positions anti-avortement
          avant sa prise de direction.
        src: [ctv_poilievre_avortement, greenpeace_bilan_pcc]
        contest: >
          Arbitrage entre 0 et +0,5. En faveur de +0,5 : le groupe parlementaire
          comporte une aile anti-avortement substantielle qui vote regulierement
          les projets de loi restrictifs d'initiative parlementaire, et le parti
          s'oppose au financement public du volet sante reproductive dans l'aide
          internationale. En faveur de 0, retenu : l'engagement du chef est
          explicite, date et public, et l'echelle note une position, pas un
          pronostic. A trancher par la ventilation d'un vote nominal recent sur
          ourcommons.ca, non verifiee.
      S3:
        valeur: 1
        just: >
          En septembre 2023, au congres de Quebec, les membres ont adopte a 69 %
          une resolution engageant un futur gouvernement conservateur a interdire
          « life-altering medicinal or surgical interventions » pour les moins de
          18 ans en demarche de transition. En fevrier 2024, Poilievre a rendu sa
          position explicite : oppose aux bloqueurs de puberte pour les moins de
          18 ans, et favorable a l'exclusion des « biological males » des sports,
          vestiaires et toilettes feminins — « female spaces should be
          exclusively for females » —, tout en relevant que ces espaces relevent
          largement des provinces.
        src: [cbc_congres_pcc_2023, cbc_poilievre_bloqueurs, cbc_poilievre_espaces]
        contest: >
          Arbitrage entre +1 et +1,5. Interdire les bloqueurs de puberte est un
          RETRAIT D'UN ACCES EXISTANT, pas une simple opposition a une extension.
          +1 retenu parce que le PCC ne touche ni au mariage entre personnes de
          meme sexe, ni aux protections anti-discrimination, ni a l'acces des
          adultes a la transition, et ne porte aucune interdiction
          d'enseignement au niveau federal. Reserve de datation : la resolution
          de 2023 n'a jamais ete reprise dans la plateforme 2025, le chef n'etant
          pas lie par les resolutions de congres.
      S4:
        valeur: 0.5
        just: >
          Les conservateurs ont vote CONTRE C-7 en mars 2021. Poilievre s'engage
          a abroger l'elargissement a la maladie mentale deja inscrit dans la
          loi : « we will revoke it entirely ». Mais il precise que « MAID will
          continue to be available for people who have irremediable health
          conditions, physical health conditions, as it is now ».
        src: [global_poilievre_amm, pcc_communique_amm, cbc_culture_of_death]
        contest: >
          ARBITRAGE TRANSTERRITORIAL DELICAT. Lecture absolue : le PCC
          maintiendrait un regime plus permissif que la loi francaise de 2026, ce
          qui le placerait sous LFI et le PS — resultat absurde. Lecture
          directionnelle : il a vote contre la loi en vigueur et veut abroger un
          elargissement deja vote, ce qui donnerait +1 a +1,5. +0,5 arbitre :
          « restriction des criteres existants » est litteralement satisfait,
          mais l'engagement de maintenir l'aide a mourir pour les affections
          physiques interdit de l'assimiler a l'opposition de principe de LR et
          du RN. Fourchette defendable : 0 a +1. Ce point meriterait une regle
          explicite du compas.
      S5:
        valeur: 0.5
        just: >
          Poilievre a formule en 2025 le marqueur assimilationniste le plus
          explicite du paysage federal canadien : « we want a nation with NO MORE
          HYPHENS, no more group labels » — rejet frontal du vocabulaire
          multiculturaliste canadien. Le chapitre 7 de la plateforme d'avril
          2025 s'intitule « protect our shared Canadian identity for a change » :
          retablissement des statues de John A. Macdonald, peines alourdies pour
          degradation de monuments, « stop the war on our history ».
        src: [ncm_poilievre_hyphens, pcc_plan_2025, globe_pcc_loi21]
        contest: >
          +0,5 et non +1 malgre une rhetorique identitaire nette, parce que la
          sous-dimension « restriction des signes religieux » est INVERSEE :
          Poilievre est oppose a la loi 21 depuis 2022 et son caucus a combattu
          C-9 en deposant vingt amendements visant a RESTAURER la defense
          religieuse. Le PCC se retrouve donc au niveau d'Horizons et du PCQ,
          mais pour des raisons differentes, et en dessous de la CAQ et du PQ qui
          portent une interdiction en vigueur. Lacune assumee : aucune mesure
          federale conservatrice d'acces differencie aux prestations selon la
          nationalite n'a ete trouvee — c'est un manque, pas un zero.
      S6:
        valeur: 1
        just: >
          Deux sous-dimensions sur trois cochees, la troisieme etant hors de
          portee federale. Contenus sur le genre et autorite parentale :
          Poilievre a declare que « parents should be the final authority on the
          values and the lessons that are taught to children » et a somme le
          premier ministre de ne pas s'ingerer dans les politiques provinciales
          de consentement parental. La declaration de principes de septembre 2023
          interdit les interventions de transition aux mineurs (69 %) et reserve
          les espaces non mixtes (87 %). Recit national : chapitre 7 de la
          plateforme d'avril 2025.
        src: [cbc_congres_pcc_2023, cbc_poilievre_parents, pcc_plan_2025]
        contest: >
          +1 et non +1,5 : la declaration de principes de 2023 justifierait le
          niveau du PCQ, mais elle NE LIE PAS LE CHEF et n'a pas ete reprise dans
          la plateforme de 2025. Aucun engagement federal de financement du prive
          ou du confessionnel : Poilievre renvoie systematiquement l'education
          aux provinces.
      S7:
        valeur: 1.5
        just: >
          La loi « three strikes and you're out » annoncee en avril 2025 prevoit
          qu'une troisieme condamnation pour infraction grave prive de
          cautionnement, de probation et de liberation conditionnelle, avec une
          PEINE MINIMALE OBLIGATOIRE DE DIX ANS pouvant aller jusqu'a la
          perpetuite. Poilievre s'est engage a devenir LE PREMIER PREMIER
          MINISTRE CANADIEN A INVOQUER LA CLAUSE DEROGATOIRE pour ecarter des
          droits garantis par la Charte, afin que les auteurs de meurtres
          multiples meurent en prison. En comite sur C-14, les conservateurs ont
          propose d'abroger entierement le principe de retenue et de retablir les
          peines minimales obligatoires.
        src: [pcc_three_strikes, cbc_poilievre_derogatoire, ourcommons_vote_40, legisinfo_c242]
        contest: >
          Arbitrage contre LR. Le paquet de LR est plus LARGE (suppression du
          juge d'application des peines, majorite penale a 15 ans, prisons
          privees) ; le PCC n'a aucun equivalent sur ces deux derniers points. Il
          a en revanche un element que LR n'a pas : le recours annonce a
          l'OVERRIDE CONSTITUTIONNEL pour soustraire la determination de la peine
          au controle judiciaire. Les deux paquets sont du meme ordre de
          grandeur, d'ou l'egalite a +1,5.
      E1:
        valeur: 1.5
        just: >
          Baisse du taux de la premiere tranche de 15 % a 12,75 %, coutant 14 Md$
          par an a terme, presentee comme « 900 $ par travailleur moyen ».
          Exoneration totale de gains en capital pour toute personne ou
          entreprise reinvestissant le produit de cession au Canada. TAXPAYER
          PROTECTION ACT : interdiction d'instaurer une nouvelle taxe ou d'en
          relever une SANS REFERENDUM PREALABLE. Suppression de la taxe de vente
          sur les logements neufs jusqu'a 1,3 M$. Abrogation de la TOTALITE de la
          loi sur la tarification carbone.
        src: [cbc_plateforme_pcc, pcc_reinvestment_tax_cut, pcc_carbon_tax]
        contest: >
          DEPASSEMENT PARTIEL SIGNALE. Le Taxpayer Protection Act est un verrou
          constitutionnel de fait qu'aucun parti francais ou quebecois du palier
          +1,5 ne propose ; c'est un dispositif de type PCQ ou Reconquete.
          Argument inverse retenu pour rester a +1,5 : la baisse ne porte que sur
          la tranche inferieure, le PCC ne propose ni baisse du taux superieur ni
          baisse de l'impot sur les societes, et la plateforme porte 106 Md$ de
          mesures nouvelles sur quatre ans. Si le compas ponderait les verrous
          institutionnels, +2 serait defendable.
      E2:
        valeur: 1.5
        just: >
          Engagement de reduire le deficit liberal de 70 % en coupant
          « bureaucratie, consultants, aide etrangere et groupes d'interet ».
          Coupes chiffrees sur quatre ans : aide etrangere -9,4 Md$,
          DEFINANCEMENT DE CBC en preservant Radio-Canada et d'autres societes
          d'Etat -4 Md$, rationalisation de la fonction publique -4,3 Md$.
          Doctrine affichee de privatisation partielle : cession de terrains
          federaux et de societes d'Etat.
        src: [cbc_plateforme_pcc]
        contest: >
          TENSION A ARBITRER. Le montant net est modeste — environ 20 Md$ de
          coupes contre 106 Md$ de mesures nouvelles sur quatre ans — et
          Poilievre a explicitement protege les soins dentaires,
          l'assurance-medicaments, les garderies, les transferts en sante et les
          pensions. C'est donc un +1,5 DOCTRINAL plus qu'arithmetique. Si l'on
          notait uniquement l'effet budgetaire net, le PCC descendrait a +1 et
          passerait SOUS le PLC.
      E3:
        valeur: -0.5
        just: >
          Position existante et explicite, non une absence : Poilievre s'est
          engage a MAINTENIR les couvertures federales existantes en soins
          dentaires, assurance-medicaments et garderies, mais a REFUSE DE
          S'ENGAGER SUR LEUR EXTENSION prevue. Aucune proposition de facturation
          privee, de ticket moderateur ou de modification de la Loi canadienne
          sur la sante ; aucun projet de resserrement de l'assurance-emploi.
        src: [cbc_poilievre_programmes_sociaux, cbc_plateforme_pcc]
        contest: >
          ARBITRAGE ASSUME ET CONTESTABLE. -1 serait defendable, au niveau de la
          CAQ et du PLQ, si l'on pondere l'absence totale de plancher
          privatisateur : le PCC est, sur le papier, MOINS privatisateur que la
          CAQ, qui a activement elargi la prestation privee au Quebec. -0,5
          retenu en ponderant le refus explicite d'extension, derive a droite a
          l'interieur d'un systeme universel. Ce choix deplace le PCC d'un
          demi-pas sur un indicateur de poids 1,0.
      E4:
        valeur: 0
        just: >
          Trois elements opposes qui se compensent. Cote negatif : engagement
          explicite de proteger les pensions « en maintenant l'age de la retraite
          a 65 ans », et autorisation pour les aines de gagner jusqu'a 34 000 $
          en franchise d'impot. Cote positif : REFUS DE S'ENGAGER sur la hausse
          de 10 % de la Securite de la vieillesse pour les 65-74 ans, alors que
          le caucus avait vote une motion en ce sens ; et extension de la
          capitalisation — croissance des regimes enregistres prolongee de deux
          ans et bonification du compte d'epargne libre d'impot.
        src: [pcc_aines, cbc_poilievre_pensions]
        contest: >
          ZERO MESURE, PAS ZERO PAR DEFAUT. Comme pour le Parti republicain, il
          faut souligner que la droite nord-americaine est TRES LOIN du cluster
          LR-Renaissance (+1,5) et d'Horizons (+2) : aucune des deux ne propose
          de report de l'age ni d'allongement de cotisation. C'est le trait
          structurel le plus net de cet indicateur en Amerique du Nord.
      E5:
        valeur: 0
        just: >
          LES CONSERVATEURS ONT VOTE POUR la loi interdisant les travailleurs de
          remplacement, et le bureau de Poilievre a indique qu'un gouvernement
          conservateur la MAINTIENDRAIT. Aucune proposition de right-to-work,
          aucune proposition de gel ou de suppression du salaire minimum federal,
          aucune desindexation. La plateforme 2025 est muette sur le droit du
          travail ; son contenu « travail » est la formation en apprentissage.
        src: [cbc_pcc_vote_briseurs, cbc_pcc_maintien_loi]
        contest: >
          RESULTAT TRANSTERRITORIAL IMPORTANT : le Parti conservateur du Canada
          se situe A GAUCHE du PLQ et du RN sur cet indicateur, et a un point et
          demi du cluster LR-PCQ-Horizons-Renaissance. Ce n'est pas une lacune de
          mesure : le PCC courtise activement les syndicats du secteur prive et a
          fait le choix strategique explicite de ne pas rouvrir le droit du
          travail. Zero mesure sur vote enregistre, non zero par defaut.
      E6:
        valeur: 1.5
        just: >
          Abrogation de la loi d'evaluation d'impact, dite « No-New-Pipelines
          Law », soit la SUPPRESSION DU REGIME FEDERAL D'EVALUATION D'IMPACT.
          Abrogation de l'interdiction de circulation des petroliers sur la cote
          ouest. Suppression du plafond d'emissions du secteur energetique.
          Abrogation de la TOTALITE de la loi sur la tarification carbone, Y
          COMPRIS LE FILET DE SECURITE FEDERAL qui oblige les provinces a imposer
          une tarification industrielle. Allegement reglementaire chiffre a
          6,4 Md$ de recettes projetees.
        src: [pcc_carbon_tax, cbc_poilievre_carbone_industriel, pcc_energie, pcc_canada_first]
        contest: >
          +2 EST DEFENDABLE : abroger integralement le prix du carbone, y compris
          industriel, et supprimer le regime federal d'evaluation d'impact va
          au-dela de ce que LR propose en France, et meme le RN ne propose pas la
          suppression pure et simple du marche carbone applicable a son
          industrie. +1,5 retenu parce que le PCC ne propose pas de
          demantelement reglementaire generalise hors energie et environnement et
          conserve les normes de securite, de concurrence et de consommation.
          Arbitrage serre, a un demi-pas.
  - name: Nouveau Parti démocratique
    sigle: NPD
    label_pos: bottom center
    chef: Avi Lewis
    country: Canada
    color: "#F37021"
    as_of: "2026-09-17"
    souverainete: multilateraliste
    ecologie: planificateur
    estimation_initiale: {economie: -5, societe: -5}
    autorite: null
    resume: >
      Avi Lewis dirige le parti depuis le 29 mars 2026, élu au premier tour
      avec 56 % des voix face à quatre autres candidats ; il succède à Jagmeet
      Singh. Social-démocrate : assurance médicaments et soins dentaires
      publics, logement abordable, droits des travailleurs, taxation des
      grandes fortunes. Sa ligne sur l'immigration et les droits des personnes
      trans est nettement plus à gauche que celle de son prédécesseur.
    indicateurs:

  # -------------------------------------------------------------------- Québec
  # Scrutin le 5 octobre 2026 : les chefs peuvent changer, les plateformes
  # restent valides comme positions datées.
      S1:
        valeur: -2
        just: >
          Le 31 mars 2026, deux jours apres son election, Avi Lewis declare :
          « we will reverse Prime Minister Mark Carney's cuts to immigration
          levels ». Il propose « a single-tier immigration system, based on
          permanent residency and STATUS ON ARRIVAL, that gives rights and
          stability » — soit la regularisation generalisee, marqueur le plus fort
          du pole. Il veut un systeme qui « reunites families, welcomes refugees
          fleeing wars around the world », mettre fin aux regles liant les
          travailleurs etrangers a un employeur unique et supprimer les limites
          « based on sector, hours, occupation, or category ».
        src: [walrus_lewis_immigration]
        contest: >
          Occupe la meme case que LFI, avec un argument d'egalite stricte :
          statut a l'arrivee, reversion des baisses, regroupement familial
          elargi et accueil des refugies, soit le paquet complet de l'echelle.
          Rupture nette avec la ligne plus prudente du NPD sous Jagmeet Singh ;
          la note est datee de mars 2026, donc posterieure au changement de
          direction.
      S2:
        valeur: -2
        just: >
          Le NPD s'engage a faire appliquer la Loi canadienne sur la sante pour
          empecher les provinces d'eriger des barrieres a l'avortement, a
          ameliorer l'acces en regions rurales et nordiques, et a couvrir la
          contraception et la pilule abortive dans l'assurance-medicaments, soit
          un remboursement public integral. Il s'engage a ne jamais soutenir ni
          adopter de loi restreignant l'avortement.
        src: [ndp_justice_reproductive]
        contest: >
          RESERVE DE DATATION : ces documents sont anterieurs a l'arrivee d'Avi
          Lewis en mars 2026, et aucune declaration de lui sur l'avortement n'a
          ete trouvee. Rien n'indique d'inflexion, la ligne pro-choix du NPD
          etant constante depuis sa fondation, mais la note est a revalider sur
          une source posterieure.
      S3:
        valeur: -2
        just: >
          Interroge le 19 fevrier 2026, Lewis s'engage a « establish a National
          Standard of Care for transgender and gender-diverse patients », avec
          financement federal accru conditionne au respect de cette norme par les
          provinces — extension active de l'acces a la transition. Il qualifie
          les interdictions visant les athletes trans de « shameful » : « trans
          women belong in women's sports just as much as any other female
          athlete ». Il juge la politique quebecoise sur les personnes trans
          incarcerees « deeply concerning ».
        src: [xtra_lewis_2026, ndp_justice_reproductive]
        contest: >
          Position la plus extensive du lot nord-americain, au niveau de LFI et
          du PS. Point notable : Lewis se situe EXPLICITEMENT A GAUCHE DES
          DEMOCRATES AMERICAINS sur la question des sports, celle-la meme ou ces
          derniers reculent. Reserve : le questionnaire date de la campagne
          interne, un mois avant sa victoire ; il engage le candidat mais n'est
          pas encore un document de plateforme.
      S4:
        valeur: -1
        just: >
          Le NPD soutient l'aide medicale a mourir dans son principe — il a
          appuye C-14 en 2016 — mais a vote contre la version finale de C-7 en
          mars 2021, pour un motif de procedure. Surtout, ses membres au comite
          mixte special ont reclame, avec les conservateurs, une PAUSE INDEFINIE
          de l'elargissement a la maladie mentale.
        src: [cbc_c7_vote, cbc_pause_maladie_mentale]
        contest: >
          NOTE LA MOINS SOLIDE DU LOT NORD-AMERICAIN : aucune position d'Avi
          Lewis sur l'aide medicale a mourir depuis mars 2026 n'a ete trouvee, ni
          sur les demandes anticipees, ni sur l'echeance du 17 mars 2027. La note
          repose entierement sur des votes anterieurs a son arrivee, et un
          changement de ligne est plausible compte tenu de son positionnement sur
          les autres indicateurs.
      S5:
        valeur: -2
        just: >
          Position la plus ouvertement multiculturaliste des dix-huit forces.
          Jagmeet Singh, sikh portant le turban, declarait que « the federal
          government should support the 3 million Quebecers who are opposed to
          this bill » et soutenait l'intervention federale contre la loi 21. Avi
          Lewis porte un programme d'immigration a PALIER UNIQUE : « permanent
          resident status for all and equal rights from day one », fin des
          restrictions liant les travailleurs a un employeur, et, dans son
          discours de victoire du 29 mars 2026 : « the Safe Third Country
          Agreement with the U.S. is a relic of a safer time. Today, the U.S. is
          a machinery of deportation. It must be cancelled immediately. »
          L'egalite des droits des le premier jour est le miroir inverse exact de
          la regle de priorite nationale notee ici.
        src: [cultmtl_singh_loi21, ncm_lewis_immigration, walrus_lewis_immigration]
        contest: >
          LA BORNE -2 EST DESORMAIS PARTAGEE entre LFI et le NPD. Aucune
          declaration d'Avi Lewis lui-meme sur la loi 21 n'a ete trouvee : la
          note repose sur la ligne etablie du parti sous Singh plus le programme
          d'immigration de Lewis. -1,5 serait l'alternative si l'unicite de la
          borne devait etre preservee, mais le « statut pour tous, droits egaux
          des le premier jour » va plus loin que tout ce que porte LFI.
      S6:
        valeur: -1.5
        just: >
          Le NPD defend le reseau public et s'oppose au detournement de fonds
          publics vers le prive, ligne tenue par ses sections provinciales. Ses
          deputes ont denonce la loi saskatchewanaise de consentement parental et
          le recours a la clause derogatoire pour la proteger. Avi Lewis a fait
          du refus de la stigmatisation des personnes trans un axe explicite,
          denoncant une droite qui pratique le « punching down and blaming
          immigrants and trans folks for society's problems ». Le NPD a ete le
          principal artisan parlementaire du programme d'alimentation scolaire.
        src: [democracynow_lewis, lewis_ideas, jsgs_bill137]
        contest: >
          BASE PROBANTE DECLARATOIRE, non legislative : le NPD federal n'a aucune
          competence en education, ne compte que cinq a six deputes et n'a pas le
          statut de parti reconnu. Aucun engagement federal chiffre sur le
          financement du prive n'a ete trouve. -1,5 est une extrapolation depuis
          la ligne du parti et ses sections provinciales ; -1 serait defendable
          si la note devait reposer exclusivement sur des actes federaux.
      S7:
        valeur: -1.5
        just: >
          Le NPD s'oppose aux peines minimales obligatoires, qu'il juge
          sur-incarcerantes pour les groupes marginalises, et a soutenu leur
          abrogation partielle en 2022. Il porte un projet de DECRIMINALISATION
          DE LA POSSESSION SIMPLE, d'effacement des casiers, d'acces a bas seuil
          a un approvisionnement sur et d'extension de la reduction des risques —
          plank dont aucun parti francais n'a l'equivalent. Sur le cautionnement,
          il propose des programmes communautaires de supervision plutot que la
          detention. Il a vote contre la motion « Jail Not Bail » et contre
          C-242.
        src: [ndp_justice_penale, ndp_decriminalisation, ourcommons_vote_155, ourcommons_vote_40]
        contest: >
          CONTRADICTION NON RESOLUE DANS LES SOURCES : une source secondaire
          affirme que le NPD soutient C-14, une autre le decrit comme critique du
          texte. Le vote de cloture montre les cinq deputes votant contre, mais
          une cloture est une question de procedure, et les conservateurs ont
          vote contre pour des raisons opposees. Le vote de fond sur C-14 en
          troisieme lecture n'a pas pu etre etabli. Le plank de decriminalisation
          pourrait justifier -2, mais le plancher n'a pas ete ouvert sur une base
          declaratoire de cinq deputes sans statut de parti reconnu.
      E1:
        valeur: -2
        just: >
          Plateforme 2025 : IMPOT SUR LA FORTUNE de 1 % entre 10 et 50 M$, 2 %
          entre 50 et 100 M$, 3 % au-dela de 100 M$, rendement chiffre a 94,5 Md$
          sur quatre ans ; surtaxe de 2 % sur les profits des societes depassant
          500 M$ ; impot minimum de 15 % sur les benefices comptables ; maintien
          de la hausse du taux d'inclusion des gains en capital, que le PLC et le
          PCC annulent. Contrepartie progressive par le bas : montant personnel
          de base porte a 19 500 $ et suppression de la taxe de vente sur
          l'epicerie, les couches et les factures de chauffage.
        src: [ndp_plateforme_2025, ndp_couts, cbc_ndp_impot_fortune]
        contest: >
          SATURATION A L'ANCRAGE LFI-PCF, sans le depasser. Un impot sur la
          fortune a 3 % au-dela de 100 M$ est d'un ordre comparable a l'ISF
          renforce de LFI, et la progressivite par le bas ramene legerement le
          NPD vers le centre par rapport a une pure hausse du niveau global.
      E2:
        valeur: -2
        just: >
          Avi Lewis propose la CREATION D'ENTREPRISES PUBLIQUES DANS TROIS
          SECTEURS — alimentation, telecommunications, Internet — et d'une
          societe publique de construction pour le logement hors marche. La
          plateforme 2025 prevoyait deja une strategie du logement permanente de
          16 Md$, 3 millions de logements d'ici 2030, 20 % de logement hors
          marche par quartier, des prets hypothecaires publics a taux reduit, et
          un budget d'immobilisations releve de 10 Md$/an.
        src: [ndp_plateforme_2025, radiocanada_lewis_elu]
        contest: >
          A L'ANCRAGE, PAS AU-DELA. LFI nationalise des actifs EXISTANTS — EDF,
          Engie, les autoroutes ; Lewis propose la CREATION d'entreprises
          publiques nouvelles. Les deux demarches sont d'ampleur comparable. A
          noter : le NPD de 2026 est nettement plus etatiste que sa plateforme de
          2025 — le plus grand ecart chef/plateforme des cinq forces
          nord-americaines.
      E3:
        valeur: -2
        just: >
          Assurance-medicaments universelle en quatre ans, chiffree a 29,2 Md$ ;
          extension du regime dentaire ; couverture nouvelle de la psychotherapie ;
          medecin de famille garanti pour tous d'ici 2030. EVICTION EXPLICITE DU
          PRIVE : interdiction faite aux societes americaines d'acquerir des
          etablissements de sante canadiens et renforcement de la Loi canadienne
          sur la sante contre les cliniques payantes. Assurance-emploi : seuil
          universel unique de 360 heures, duree portee a 50 semaines, PRESTATION
          PLANCHER DE 450 $/SEMAINE, suppression du delai de carence.
        src: [ndp_plateforme_2025, ndp_couts, cbc_comparatif_2025]
        contest: >
          Sur la sante, le NPD est a l'ancrage QS-LFI-PCF. SUR L'ASSURANCE
          CHOMAGE, IL LE DEPASSE PROBABLEMENT : le volet chomage de LFI consiste
          essentiellement a abroger les reformes Macron, alors que le NPD propose
          une refondation expansive. L'indicateur agregeant deux objets, cette
          asymetrie est masquee par la saturation — ce qui plaide a terme pour un
          dedoublement E3a sante / E3b chomage.
      E4:
        valeur: -1.5
        just: >
          Plateforme 2025 : relevement du Supplement de revenu garanti « jusqu'a
          sortir tous les aines de la pauvrete » — hausse de pension explicite et
          non plafonnee ; doublement de la Prestation canadienne pour les
          personnes handicapees. Le NPD a mene la bataille contre le passage a
          67 ans et defend l'age de 65 ans. Aucune proposition de capitalisation
          accrue ni d'allongement de cotisation.
        src: [ndp_plateforme_2025]
        contest: >
          Pas -2 : contrairement a LFI qui propose la retraite a 60 ans, le NPD
          ne propose PAS d'abaisser l'age sous 65 ans. RESERVE : aucune position
          retraites specifique d'Avi Lewis en 2026 n'a ete trouvee ; la note
          repose sur la plateforme de 2025 et la doctrine constante du parti.
      E5:
        valeur: -1.5
        just: >
          Plateforme 2025 : garantie de main-d'oeuvre syndiquee sur les projets
          d'infrastructure finances par le federal ; credit d'impot de 5 000 $
          pour plus de 780 000 infirmieres et preposes ; parite salariale et
          RATIOS DE DOTATION SECURITAIRES imposes dans la sante ; formation de
          plus de 100 000 travailleurs de la construction. Le NPD est le parti
          qui a arrache la loi anti-briseurs de greve au gouvernement Trudeau.
        src: [ndp_plateforme_2025, cbc_ndp_briseurs_greve]
        contest: >
          -2 DEFENDABLE MAIS NON DOCUMENTE. Le NPD reclamait un salaire minimum
          federal de 20 $ dans sa plateforme de 2021 ; la plateforme 2025 NE
          CONTIENT AUCUNE CIBLE CHIFFREE de salaire minimum federal — verifie, et
          c'est une absence dans un texte par ailleurs tres detaille, non un
          defaut de recherche. Le critere « hausse forte du salaire minimum » du
          -2 ne peut donc pas etre documente.
      E6:
        valeur: -2
        just: >
          ENCADREMENT DIRECT DES PRIX : plafonds d'urgence sur des produits
          nommes — pates, legumes surgeles, preparations pour nourrissons, huile
          de cuisson — et code de conduite des epiceries rendu obligatoire.
          CONTROLE DES LOYERS : interdiction des renovictions et demovictions,
          100 000 logements a loyer controle sur terres federales d'ici 2035,
          interdiction faite aux fonds d'investissement d'acquerir des logements
          locatifs existants. Regulation environnementale : plafond immediat sur
          les emissions petrolieres, suppression des subventions aux hydrocarbures
          d'ici fin 2026, electricite carboneutre en 2035. Lewis en 2026 : REFUS
          DE TOUTE NOUVELLE AUTORISATION FEDERALE d'oleoduc, de projet petrolier
          extracotier ou de terminal GNL.
        src: [ndp_plateforme_2025, radiocanada_lewis_elu]
        contest: >
          Le plafonnement de prix sur produits nommes est l'equivalent exact du
          blocage des prix de LFI. Le MORATOIRE TOTAL sur les nouvelles
          autorisations fossiles va AU-DELA de LFI, qui admet certaines
          infrastructures de transition. Saturation avec depassement probable sur
          la composante energie. A noter : cette position est deja contestee a
          l'interieur du parti, les chefs neo-democrates de l'Alberta et de la
          Saskatchewan ayant publiquement critique Lewis.
  - name: Coalition avenir Québec
    sigle: CAQ
    label_pos: bottom left
    chef: Christine Fréchette
    country: Québec
    color: "#00A8E0"
    as_of: "2026-09-17"
    souverainete: nationaliste
    ecologie: productiviste
    estimation_initiale: {economie: 2, societe: 4}
    autorite: null
    resume: >
      Au gouvernement. Christine Fréchette, ancienne ministre de l'Économie,
      est cheffe depuis le 12 avril 2026 après le départ de François Legault.
      Centre économique, nationalisme québécois : laïcité, protection du
      français, baisse des seuils d'immigration. Cadre financier présenté le
      30 août 2026, le premier de la campagne.
    indicateurs:
      E1:
        absent: true
        just: >
          Absence etablie sur le document primaire, non deduite : le cadre
          financier du 30 aout 2026 ne contient AUCUNE MESURE FISCALE. Les
          9 852 M$ d'« ameliorations » viennent des transferts federaux, du
          rendement des societes d'Etat et d'ajustements a la provision pour
          eventualites. Le parti au pouvoir est ainsi le seul des cinq partis
          quebecois sans position notable sur la fiscalite.
        src: [caq_cadre_2026]
      E2:
        valeur: 0
        just: >
          Cadre financier peu lisible sur le périmètre de l'État. Les
          9 852 M$ d'« améliorations » viennent des transferts fédéraux
          (4 357 M$), d'un rendement accru des sociétés d'État (+2 %, 495 M$) et
          d'ajustements à la provision pour éventualités (5 000 M$) — pas d'une
          réduction de l'État. Croissance des dépenses de portefeuilles de
          2,4 %/an. Retour à l'équilibre en 2029-2030.
        src: [caq_cadre_2026]
        contest: >
          Score peu significatif : sur 9 249 M$ d'engagements, 8 011 M$ (87 %)
          sont des « engagements à venir » non annoncés. Le document ne permet
          pas de situer la CAQ sur cet indicateur, et aucune mesure fiscale n'y
          figure — d'où E1 laissé vide.
      E3:
        valeur: -1
        just: >
          Soins à domicile : 1 000 M$ sur cinq ans. « Mieux loger nos aînés » :
          241 M$. Renouvellement des ententes fédérales en santé mentale, soins
          à domicile et soins de longue durée (2,4 G$), maintien de la
          croissance du TCS à 5 % à compter de 2028-2029.
        src: [caq_cadre_2026]
      E6:
        valeur: 0
        just: >
          Maintient le Fonds d'électrification et de changements climatiques
          (FECC), coeur de l'arsenal climatique québécois, ainsi que la
          participation du Québec au marché du carbone. Ni durcissement ni
          allègement du cadre réglementaire.
        src: [lapresse_promesses_environnement, ledevoir_enjeux_environnement]
        contest: >
          Note de statu quo, faiblement sourcee : elle repose sur le maintien du
          cadre existant par le parti au pouvoir plutot que sur un engagement
          explicite. A reconfirmer sur la plateforme environnementale.
      E4:
        valeur: 0.5
        just: >
          Exclusion du calcul de l'impot de 35 000 $ de revenu d'emploi pour les
          travailleurs de 65 ans et plus dans les professions en penurie
          (enseignants, educatrices en CPE, infirmieres, preposes aux
          beneficiaires), le travailleur retenant le plus avantageux entre cette
          mesure et le credit d'impot pour prolongation de carriere. Incitatif
          pouvant atteindre 6 650 $/an, cout de 80 M$/an. L'objectif annonce est
          de les inciter a demeurer en emploi au-dela de 65 ans : version
          purement incitative de l'allongement de la vie active. Au
          gouvernement, la CAQ n'a modifie ni l'age d'admissibilite au RRQ, ni
          la duree de cotisation, ni le mode de financement.
        src: [radiocanada_caq_aines, noovo_caq_aines]
        contest: >
          Note la plus fragile du lot. La bonification du credit de soutien aux
          aines releve sans ambiguite de la fiscalite (E1) et n'est pas comptee
          ici. L'exemption de 35 000 $ est differente parce qu'elle est
          conditionnelle au maintien en emploi et vise le calendrier de retrait
          du marche du travail. Un codeur qui la reclasserait en E1 ou E5
          devrait mettre la CAQ en `absent` sur E4 : lecture parfaitement
          defendable.
      E5:
        valeur: -0.5
        just: >
          Statu quo mesure sur une mesure prise, non sur une absence de
          position : le gouvernement a porte le salaire minimum a 16,60 $/h le
          1er mai 2026 (contre 16,10 $), soit +3,11 %, en indexant sur la
          croissance prevue des salaires horaires moyens plutot que sur
          l'inflation (2,3 % prevue). Indexation annuelle de routine,
          legerement au-dessus de l'inflation.
        src: [radiocanada_salaire_minimum_2026, lapresse_salaire_minimum_2026]
        contest: >
          -0,5 : l'indexation depasse l'inflation, ce qui penche legerement du
          cote du travail, mais les organisations syndicales et les groupes de
          lutte a la pauvrete jugent la hausse insuffisante et reclament 20 $/h.
      S1:
        valeur: 0.5
        just: >
          Maintien du seuil d'immigration permanente à 45 000 par année jusqu'en
          2029.
        src: [lapresse_promesses_immigration]
        contest: >
          +0,5 : le maintien est en soi un statu quo, mais il reconduit un
          niveau que la CAQ avait elle-même abaissé. L'immigration temporaire
          n'est pas encore sourcée et pourrait durcir la note.
      S2:
        valeur: -1.5
        just: >
          Pas d'engagement de plateforme, mais un bilan de mesures prises. Le
          18 novembre 2024, lancement du premier Plan d'action gouvernemental
          sur l'acces a l'avortement (2024-2027) : 7,5 M$, 28 mesures, dont
          l'elargissement de l'acces a la pilule abortive par telesante (17 %
          des avortements au Quebec contre 32 % en Ontario et 72 % en France),
          un nouveau point de service a Quebec d'ici 2027 et un financement
          accru de SOS Grossesse et de la FQPN. Le gouvernement avait aussi
          inscrit la protection dans l'article 29 du projet de loi 1 (« L'Etat
          protege la liberte des femmes de recourir a l'interruption volontaire
          de grossesse »), retire le 20 fevrier 2026 faute d'appui d'un seul
          groupe feministe, medical ou juridique.
        src: [leprogres_plan_avortement, radiocanada_article29_retrait, radiocanada_frechette_article29, csq_projet_loi1]
        contest: >
          -1,5 et non -2 : programme finance et tentative d'inscription
          constitutionnelle, mais l'inscription a ete abandonnee et aucun
          engagement de campagne 2026 ne reprend le dossier. BIAIS DE SORTANT a
          garder en tete : la CAQ se classe au-dessus du PLQ surtout parce
          qu'elle a pu agir, l'indicateur valorisant les mesures prises. Une
          affirmation non verifiee circule par ailleurs — Frechette aurait
          promis de « ramener » l'article apres les elections ; aucune source
          accessible ne la corrobore et elle n'est pas comptabilisee.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis representes a l'Assemblee
          nationale, du rapport renouvele sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblee a adopte la refonte de la Loi
          concernant les soins de fin de vie, legalisant les demandes anticipees
          d'aide medicale a mourir. Le Quebec est au premier rang mondial pour
          le recours a l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position legislative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Quebec : il ne separe pas les partis
          quebecois entre eux, mais il situe le Quebec par rapport aux autres
          territoires — ce qui est precisement son role sur une carte commune.
      S3:
        valeur: 0.5
        just: >
          Bilan gouvernemental bicephale. Extension : plan d'action de lutte
          contre l'homophobie et la transphobie 2023-2028 dote de 23,7 M$
          (contre environ 10 M$ pour 2017-2022), dont 11 M$ aux organismes
          communautaires ; appui des deputes caquistes a la motion du
          6 fevrier 2025. Restriction, par des actes executoires : appel du
          jugement Garin qui declarait contraire a la Charte la limitation de la
          filiation a deux parents (« au Quebec, c'est deux parents legaux [...]
          et ca doit demeurer ainsi ») ; directive de mai 2024 interdisant les
          nouvelles toilettes et vestiaires mixtes dans les ecoles publiques ;
          regle de septembre 2025 interdisant les appellations inclusives dans
          les communications gouvernementales, la sante et l'education. Le
          rapport du Comite de sages sur l'identite de genre (mai 2025, 215
          pages, aucune recommandation) n'a eu aucune suite.
        src: [radiocanada_pluriparentalite, radiocanada_toilettes_mixtes, lactualite_ecriture_inclusive, quebec_plan_homophobie, radiocanada_comite_sages, lequotidien_motion_homophobie]
        contest: >
          Arbitrage 0 contre +0,5. Un 0 est defendable : la CAQ a plus que
          double le financement communautaire et vote la motion de 2025. J'ai
          retenu +0,5 parce que les gestes de restriction sont executoires et
          repetes, tandis que le volet extension reconduit un plan de 2023 sans
          suite. Aucune mesure ne restreint l'acces aux soins de transition, ce
          qui exclut une note plus elevee. La plateforme 2026 et le cadre
          financier sont entierement muets sur l'enjeu, et aucune declaration de
          Christine Frechette sur le sujet n'a ete trouvee depuis avril 2026 :
          la note repose sur les actes du gouvernement, pas sur la parole de la
          cheffe.
      S5:
        valeur: 1
        just: >
          Verrouille la Loi 21 jusqu'en 2031. La laïcité renforcée est entrée en
          vigueur en 2026.
        src: [lapresse_laicite_engagements, jisr_laicite_renforcee]
        contest: >
          REECHELONNE apres notation de la France. La loi 21 interdit les signes
          religieux aux AGENTS de l'Etat en position d'autorite ; elle ne
          restreint ni les eleves, ni les usagers, ni quiconque dans la rue. Or
          LR interdirait le voile a l'universite — donc a des usageres ADULTES
          d'un service public — et inscrirait la « tradition judeo-chretienne »
          dans le bloc constitutionnel, ce que la loi 21 refuse au nom de la
          neutralite ; le RN l'interdirait a toute femme dans tout l'espace
          public sous peine d'amende ; Reconquete y ajoute la remigration. Le
          haut de l'echelle est donc rouvert pour la France.
      S6:
        valeur: 0.5
        just: >
          Investissements sans position sur le financement du prive ni sur les
          contenus : 200 M$ pour des gymnases, 150 M$ pour les cours d'ecole,
          900 M$ sur quatre ans de soutien aux depenses scolaires des familles
          (credit couvrant jusqu'a 75 % du service de garde scolaire, jusqu'a
          1 309 $ par enfant ; supplement pour fournitures porte de 127 $ a
          250 $), 1 000 $ en REEE par nouveau-ne (218,8 M$ sur quatre ans).
        src: [radiocanada_caq_education, noovo_caq_reee, lapresse_promesses_education]
        contest: >
          +0,5 : les mesures elles-memes sont neutres, mais Christine Frechette
          estime qu'il n'y a « pas vraiment » d'ecole a trois vitesses au
          Quebec, ce qui revient a defendre le statu quo, prive subventionne
          inclus.
      S7:
        valeur: 0.5
        just: >
          Promet de « combattre le crime » en ajoutant 300 policiers a la Surete
          du Quebec et 50 procureurs, avec un volet cybercriminalite.
        src: [radiocanada_caq_police, lesaffaires_caq_police]
        contest: >
          RAMENE DE +1 A +0,5 apres notation de la France. Un simple renfort
          d'effectifs ne peut pas valoir la meme note qu'une reforme du droit
          penal : Renaissance, notee +1, a fait adopter une loi durcissant la
          justice des mineurs et propose une loi d'urgence de construction de
          prisons ; LR, notee +2, propose la suppression du juge d'application
          des peines et de tous les amenagements, la majorite penale a 15 ans et
          des prisons privees.

  - name: Parti libéral du Québec
    sigle: PLQ
    label_pos: bottom center
    chef: Charles Milliard
    country: Québec
    color: "#ED1B2E"
    as_of: "2026-09-17"
    souverainete: federaliste
    ecologie: reformiste
    estimation_initiale: {economie: 3, societe: -2}
    autorite: null
    resume: >
      Charles Milliard, ancien président de la Fédération des chambres de
      commerce du Québec, est chef depuis le 13 février 2026, seul candidat en
      lice après la démission de Pablo Rodriguez. Fédéraliste. Son cadre
      financier du 13 septembre 2026 est moins libéral que son image : il annule
      des baisses de taxes de la CAQ et reprend des crédits d'impôt aux
      entreprises, tout en faisant croître le budget de la santé.
    indicateurs:
      E1:
        valeur: 0
        just: >
          N'est pas un parti de baisse d'impôts. Annule les mesures de
          détaxation de la CAQ (taxe de Bienvenue, congé de TVQ à l'épicerie) et
          recentre les crédits d'impôt aux sociétés (CRIC, C3i) pour +600 M$ en
          année 5. Seul allègement notable : TVQ sur les constructions neuves
          (−125 M$/an).
        src: [plq_cadre_2026]
      E2:
        valeur: 1
        just: >
          Engagements de 11,9 G$ financés par une « réforme de l'État »
          (gouvernance, efficacité, numérique) et la décroissance de
          l'interventionnisme économique. Aucun programme de privatisation.
          Retour à l'équilibre visé en 2029-2030.
        src: [plq_cadre_2026, lesaffaires_cadres_2026]
      E3:
        valeur: -1
        just: >
          Réinvestissement en santé et soins à domicile (jusqu'à −350 M$/an),
          croissance des dépenses de près de 5 %/an pour le portefeuille santé
          et 3 % pour l'éducation, parité salariale en Outaouais, plateforme de
          télésanté.
        src: [plq_cadre_2026]
      E4:
        valeur: -0.5
        just: >
          Seul parti a proposer une mesure portant directement sur les droits a
          rente : s'engage a « proteger la rente de retraite des personnes qui
          reduisent ou interrompent leur participation au marche du travail pour
          prendre soin d'un proche », sur le modele de l'exclusion existante
          pour les enfants en bas age. En sens inverse, propose un Regime
          d'accession a l'entrepreneuriat permettant d'utiliser son
          epargne-retraite comme mise de fonds pour demarrer une entreprise —
          logique de capitalisation. Aucune position sur le RRQ, l'age de depart
          ou le RREGOP ; le cadre financier n'en dit rien.
        src: [plq_communique_proches_aidants, plq_engagements, plq_cadre_2026]
        contest: >
          Les deux mesures pointent en sens opposes et sont de portee etroite.
          -0,5 retenu parce que seule la mesure proches aidants porte reellement
          sur le systeme de retraite, le RAE etant un dispositif
          d'entrepreneuriat qui emprunte le vehicule de l'epargne. Un codeur
          jugeant les deux equivalentes devrait mettre 0 — et non `absent`,
          puisque des positions existent.
      E5:
        valeur: 0.5
        just: >
          A vote pour le projet de loi 89 (devenu loi 14), qui permet au
          ministre du Travail de mettre fin a une greve et d'imposer
          l'arbitrage, adopte le 29 mai 2025 par 94 voix contre 17. N'a pris
          aucun engagement d'abroger les lois 4 et 14 malgre la demande publique
          de la FTQ. Aucune mesure sur le salaire minimum ni sur le Code du
          travail ; regle de reduction reglementaire « deux pour un » et
          reduction d'environ 12 000 ETC sur cinq ans, mais « par attrition,
          incitatifs au depart volontaire et redeploiement, jamais par coupes
          parametriques ». S'engage par ailleurs a un « nouveau partenariat avec
          les organisations syndicales » en tant qu'Etat-employeur.
        src: [assnat_pl89, ledevoir_pl89, plq_engagements, ftq_engagements]
        contest: >
          RESERVE IMPORTANTE : la fiche de l'Assemblee nationale donne le total
          (94 pour, 17 contre) mais NE VENTILE PAS le vote par parti. La
          ventilation « 94 CAQ+PLQ / 17 PQ+QS » provient d'une seule source de
          rang 5 inaccessible en lecture directe. Si elle etait infirmee, cette
          note tomberait a 0 ou `absent`. Arbitrage +0,5 contre +1 : le vote
          pour une loi autorisant a briser une greve justifierait +1, mais le
          PLQ 2026 n'a aucun programme de flexibilisation.
      E6:
        valeur: 0
        just: >
          Soutient le maintien du FECC et du marche du carbone, contrairement au
          PCQ qui veut les abolir. Propose de mettre fin a la regle du plus bas
          soumissionnaire dans les marches publics.
        src: [lapresse_promesses_environnement, noovo_premieres_promesses]
      S1:
        valeur: -1
        just: >
          Seuil permanent oscillant entre 45 000 et 70 000 par année. Allonge de
          six mois à deux ans le délai avant que l'État communique uniquement en
          français avec les nouveaux arrivants, et ramène à six semaines
          l'attente pour l'accès à la francisation.
        src: [lapresse_promesses_immigration]
      S2:
        valeur: -1
        just: >
          Aucun engagement programmatique : ni la page « Nos engagements »
          (4 539 mots) ni le cadre financier (4 209 mots) ne contiennent une
          occurrence d'avortement, contraception, procreation assistee ou sante
          des femmes. Mais une position de parti explicite et recente : le PLQ a
          mene le combat parlementaire contre l'article 29 du projet de loi 1
          par sa porte-parole en condition feminine Brigitte B. Garceau, qui
          pose le principe : « L'autonomie reproductive des femmes leur
          appartient exclusivement et nous ne devons jamais la remettre en
          question. »
        src: [radiocanada_article29_retrait, plq_engagements, plq_cadre_2026]
        contest: >
          Arbitrage -1 contre -0,5. Le PLQ ne propose aucune mesure d'acces ni
          financement ; un -0,5, au niveau du PCQ, serait defendable. -1 retenu
          parce que le PLQ est intervenu activement (travail en commission,
          porte-parole designee, principe formule), la ou le PCQ se borne a un
          statu quo et renvoie la question au federal. L'ecart PLQ/PCQ est le
          plus discutable de la serie.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis representes a l'Assemblee
          nationale, du rapport renouvele sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblee a adopte la refonte de la Loi
          concernant les soins de fin de vie, legalisant les demandes anticipees
          d'aide medicale a mourir. Le Quebec est au premier rang mondial pour
          le recours a l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position legislative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Quebec : il ne separe pas les partis
          quebecois entre eux, mais il situe le Quebec par rapport aux autres
          territoires — ce qui est precisement son role sur une carte commune.
      S3:
        valeur: -1
        just: >
          La plateforme « Nos engagements » ne contient aucune mesure LGBT+.
          Note etablie sur d'autres bases : les deputes liberaux presents ont
          appuye la motion du 6 fevrier 2025 ; aux credits 2026-2027, le PLQ a
          mis le gouvernement en difficulte sur l'ecart entre les 23,7 M$
          annonces et 51 253 $ de depenses documentees, et sur le fait que
          40 fonctionnaires sur 78 000 ont suivi la formation de
          sensibilisation, en demandant qu'elle devienne obligatoire. Charles
          Milliard, premier chef ouvertement homosexuel d'un grand parti
          quebecois, dit s'inquieter d'un « glissement » sur ces enjeux et veut
          rattacher le Bureau de lutte contre l'homophobie et la transphobie au
          ministere de la Justice.
        src: [plq_engagements, lequotidien_motion_homophobie, fugues_milliard, apdq_credits_lgbtq]
        contest: >
          Arbitrage -1 contre -0,5. Le PLQ defend les droits existants et
          reclame plus de moyens, mais ne propose aucune extension nouvelle :
          ni pluriparentalite, ni elargissement de la PMA, ni couverture des
          soins d'affirmation de genre. -0,5 serait justifie en s'en tenant
          strictement au silence de la plateforme.
      S5:
        valeur: -1
        just: >
          S'engage à ne pas renouveler la disposition dérogatoire qui protège la
          Loi 21.
        src: [lapresse_laicite_engagements, pq_communique_laicite]
        contest: >
          RAMENE A -1 apres notation de la France. Ne pas renouveler une
          disposition derogatoire est nettement moins « multiculturaliste » que
          de reautoriser un vetement religieux a l'ecole, ce que propose LFI —
          seule force du compas a vouloir revenir sur une restriction religieuse
          EN VIGUEUR. Le pole negatif est donc rouvert vers le bas.
      S6:
        valeur: -1
        just: >
          Etats generaux sur l'avenir de l'education dans les 100 premiers
          jours et embauche de 1 000 ressources specialisees dans les ecoles
          pour epauler les enseignants. Investissement dans le reseau public,
          sans engagement sur le financement du prive.
        src: [radiocanada_etats_generaux, lapresse_promesses_education]

  - name: Parti québécois
    sigle: PQ
    label_pos: top center
    chef: Paul St-Pierre Plamondon
    country: Québec
    color: "#004C9D"
    as_of: "2026-09-17"
    souverainete: independantiste
    ecologie: reformiste
    estimation_initiale: {economie: -2, societe: 4}
    autorite: null
    resume: >
      En tête des sondages (29 % chez Léger, 13-14 septembre 2026). S'est
      engagé en août 2026 à ne tenir aucun référendum tant que Donald Trump
      sera président, soit pas avant le 20 janvier 2029 — un report critiqué
      par les autres chefs. Social-démocrate d'origine, mais
      cadre financier axé sur le retour à l'équilibre en 2028-2029, avec gel du
      salaire des élus et des PDG de sociétés d'État. Positions fermes sur la
      laïcité, le français et l'immigration.
    resume_src: [lapresse_pq_referendum, ledevoir_pq_referendum, lapresse_pq_cadre]
    indicateurs:
      E1:
        valeur: 1
        just: >
          Baisse de l'impot des PME de 11,5 % a 9,5 % sur quatre ans, presentee
          comme une reduction de pres de 20 % : une PME declarant 1 M$ de revenu
          imposable economiserait 10 000 $. Financee par la fin des
          « subventions dans toutes les directions » aux multinationales
          etrangeres et l'abolition du Fonds de developpement economique.
        src: [ledevoir_pq_pme, pq_communique_pme, lactualite_pq_pme]
        contest: >
          Baisse d'impot ciblee sur les PME, financee par le retrait de
          subventions aux multinationales : le sens pro-marche est reel mais
          partiel, d'ou +1 et non +2. Aucune baisse d'impot des particuliers
          n'est annoncee.
      E2:
        valeur: 1
        just: >
          « Lutte à la bureaucratie » : 6,6 G$ de coupes sur cinq ans, dont une
          réduction de 2,5 % de la masse salariale de l'État. Abolition de
          l'agence Santé Québec (340 M$ récupérés sur cinq ans). Retour à
          l'équilibre en 2028-2029, un an plus tôt que ne l'exige la Loi sur
          l'équilibre budgétaire : d'un déficit de 6,5 G$ en 2026-2027 à un
          surplus de 49 M$ en 2028-2029.
        src: [lapresse_pq_cadre, noovo_pq_bureaucratie]
        contest: >
          Coupes dans la bureaucratie et discipline budgétaire tirent vers le
          marché, mais elles financent un réinvestissement en santé et en
          éducation : un parti social-démocrate qui coupe dans l'appareil, pas
          dans les programmes. Un 0 serait défendable.
      E3:
        valeur: -1
        just: >
          Réinvestissement en santé, en éducation et en soutien aux PME financé
          par les coupes bureaucratiques. L'abolition de Santé Québec est une
          recentralisation de la gouvernance publique, non une privatisation.
        src: [lapresse_pq_cadre, noovo_pq_bureaucratie]
      E4:
        absent: true
        just: >
          Aucune position applicable sous le cadre constitutionnel actuel. Le
          seul engagement chiffre du PQ sur les pensions — 8,1 G$ de prestations
          additionnelles aux aines sur cinq ans, versees a tous les
          beneficiaires d'une rente du RRQ — figure dans « Les finances d'un
          Quebec independant » et releve du budget de l'an 1 d'un Quebec
          souverain. Le PQ s'etant engage a ne tenir aucun referendum avant le
          20 janvier 2029, la mesure n'est pas operante dans le mandat soumis au
          scrutin. Rien sur le RRQ dans le cadre provincial, ni sur le RREGOP,
          ni sur l'age de depart.
        src: [pq_finances_independant, pq_livre_bleu, areq_rregop]
        contest: >
          Application de la regle sur les engagements post-independance (voir
          grille.md). Si le compas notait les mesures conditionnelles a la
          souverainete, le PQ serait a -1 sur cet indicateur : l'engagement est
          chiffre, substantiel et adosse au RRQ.
      E5:
        valeur: -0.5
        just: >
          A vote contre le projet de loi 89 (devenu loi 14) limitant le droit de
          greve, avec QS, parmi les 17 voix contre le 29 mai 2025. S'engage a
          remunerer les stages obligatoires de formation en sante et services
          sociaux, en enseignement et en education a l'enfance : 12 semaines a
          temps complet au taux du salaire minimum, soit pres de 7 000 $ pour
          420 heures, « entre 3 000 $ et 6 000 $ de plus que les bourses
          actuelles » — extension de la remuneration a du travail aujourd'hui
          non remunere. Aucun engagement sur le salaire minimum ni sur le Code
          du travail, et aucun engagement formel d'abroger les lois 4 et 14.
        src: [assnat_pl89, ledevoir_pl89, pq_stages_remuneres]
        contest: >
          Meme reserve que pour le PLQ : la ventilation partisane du vote de
          2025 repose sur une source de rang 5 inaccessible. Arbitrage -0,5
          contre -1 : le vote contre la loi antigreve tirerait vers -1, mais le
          PQ n'a rien annonce sur le salaire minimum ni sur le Code du travail
          pendant la campagne, et la remuneration des stages est de portee
          sectorielle etroite.
      E6:
        valeur: -1
        just: >
          Recentre le FECC sur les mesures a contribution environnementale
          demontree. Releve la cible de reduction des GES a 42,5 % d'ici 2034
          (« cible flexible ») et instaure des budgets carbone quinquennaux pour
          rendre la reduction mesurable. Plan presente explicitement sans
          « mesures moralisatrices ».
        src: [ledevoir_pq_plan_environnement, lapresse_promesses_environnement]
      S1:
        valeur: 1.5
        just: >
          Engagement à réduire de moitié l'immigration temporaire et à imposer
          un moratoire sur l'immigration économique permanente.
        src: [radiocanada_pq_seuils, lapresse_promesses_immigration]
        contest: >
          RAMENE DE +2 A +1,5 apres notation de la France. Le PQ opere une coupe
          quantitative reelle, mais le RN supprime le droit du sol, suspend
          TOUTES les regularisations prefectorales, renvoie le depot des
          demandes d'asile aux ambassades et vise historiquement une division
          par vingt de l'immigration legale ; Reconquete vise un solde
          migratoire negatif. Sur une echelle non plafonnee ils seraient a +2,5
          et +3. Le +2 leur est donc reserve.
      S2:
        absent: true
        just: >
          Absence etablie sur les documents primaires, non deduite. La
          proposition principale « Projet national » (21 993 mots, mai 2026) ne
          contient aucune occurrence d'avortement, IVG, contraception,
          procreation assistee ni planning familial. Sa section sur les droits
          des femmes est longue mais porte sur les violences, l'exploitation
          sexuelle, la laicite, les espaces non mixtes et la parite. Le Livre
          bleu mentionne l'avortement trois fois, toujours comme exemple
          historique ou constitutionnel.
        src: [pq_projet_national, pq_livre_bleu, cbc_comparatif_2026]
        contest: >
          Il est vraisemblable que le PQ soit pro-choix — c'est le consensus
          quebecois — mais une vraisemblance n'est pas une source. Une
          affirmation circulant en ce sens s'est revelee non etayee apres
          verification de l'article cite, qui ne contenait aucune position de
          parti ni citation du chef.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis representes a l'Assemblee
          nationale, du rapport renouvele sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblee a adopte la refonte de la Loi
          concernant les soins de fin de vie, legalisant les demandes anticipees
          d'aide medicale a mourir. Le Quebec est au premier rang mondial pour
          le recours a l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position legislative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Quebec : il ne separe pas les partis
          quebecois entre eux, mais il situe le Quebec par rapport aux autres
          territoires — ce qui est precisement son role sur une carte commune.
      S3:
        valeur: 1
        just: >
          Le 3e Congres d'orientation (Saint-Hyacinthe, 23-25 janvier 2026,
          environ 600 delegues) a adopte trois positions : distinguer sexe et
          identite de genre dans les donnees statistiques, les lois et les
          programmes gouvernementaux ; reaffirmer le droit des femmes a des
          espaces non mixtes fondes sur le sexe (toilettes, vestiaires,
          competitions sportives, maisons d'hebergement, prisons) ; reviser les
          outils d'education a la sexualite pour qu'ils soient fondes « sur la
          science et la biologie ». Dans leurs effets, les deux premieres
          retirent aux femmes trans un acces existant. Anterieurement :
          abstention des trois deputes pequistes sur la motion du 6 fevrier
          2025, et demande en 2023 d'une commission parlementaire sur les
          « ideologies de la gauche radicale » a l'ecole. A l'inverse, le PQ
          reclame une formation obligatoire et denonce la couverture
          territoriale deficiente des services LGBTQ+.
        src: [pq_projet_national, lequotidien_motion_homophobie, lautjournal_pq_trans, apdq_credits_lgbtq]
        contest: >
          Arbitrage +1 contre +1,5. Le PQ a inscrit ces positions dans son
          document programmatique et il est en tete des sondages, mais il ne
          propose aucune restriction des soins de transition, aucune
          interdiction d'enseignement ni retrait d'ouvrages, et reclame
          simultanement plus de formation et de services. Formulations exactes
          de la proposition principale : mettre sur pied « une commission
          parlementaire portant sur les contenus des programmes et outils
          d'education a la sexualite [...] pour s'assurer qu'ils reposent sur la
          science et la biologie » ; « reaffirmer le droit des filles et des
          femmes aux espaces et activites non mixtes [...] (toilettes,
          vestiaires, competitions sportives, [...] groupes de lesbiennes,
          [...] prisons pour femmes) ».
      S5:
        valeur: 1
        just: >
          Veut aller plus loin que la Loi 21 actuelle. Fait campagne contre
          l'engagement du PLQ de ne pas reconduire la disposition dérogatoire.
        src: [lapresse_laicite_engagements, pq_communique_laicite]
        contest: >
          REECHELONNE apres notation de la France. La loi 21 interdit les signes
          religieux aux AGENTS de l'Etat en position d'autorite ; elle ne
          restreint ni les eleves, ni les usagers, ni quiconque dans la rue. Or
          LR interdirait le voile a l'universite — donc a des usageres ADULTES
          d'un service public — et inscrirait la « tradition judeo-chretienne »
          dans le bloc constitutionnel, ce que la loi 21 refuse au nom de la
          neutralite ; le RN l'interdirait a toute femme dans tout l'espace
          public sous peine d'amende ; Reconquete y ajoute la remigration. Le
          haut de l'echelle est donc rouvert pour la France.
      S6:
        valeur: -1
        just: >
          Etats generaux en education dans les 100 premiers jours. Rendrait une
          partie du financement des ecoles privees conditionnelle a l'accueil
          d'eleves defavorises ayant des difficultes d'apprentissage, pour
          favoriser la mixite. Denonce « l'ecole a trois vitesses ».
        src: [ledevoir_pq_education, noovo_pq_etats_generaux, radiocanada_etats_generaux]

  - name: Québec solidaire
    sigle: QS
    label_pos: bottom right
    chef: Ruba Ghazal
    country: Québec
    color: "#FF5505"
    as_of: "2026-09-17"
    souverainete: independantiste
    ecologie: planificateur
    estimation_initiale: {economie: -7, societe: -7}
    autorite: null
    resume: >
      Gauche écologiste et souverainiste : transition énergétique, renforcement
      des services publics, logement social, impôt sur la fortune. Promesses
      chiffrées à près de 10,5 G$ sur quatre ans, financées en grande partie par
      cet impôt, avec équilibre visé en 2029-2030. À 10 % dans les sondages.
    indicateurs:
      E1:
        valeur: -1.5
        just: >
          Impôt sur la fortune de 1 % au-delà de 25 M$ et de 2 % au-delà de
          100 M$, rapportant 5 G$ et touchant 4 000 ménages. Réforme fiscale
          récupérant 2,4 G$ par la révision des paliers d'imposition des
          particuliers, présentée comme une hausse des impôts des « 10 % les
          plus riches ». Hausse de l'impôt sur les profits des entreprises et du
          taux d'inclusion des gains en capital pour les grandes entreprises.
        src: [radiocanada_qs_cadre, radiocanada_verif_qs, lactualite_qs_105]
        contest: >
          RAMENE DE -2 A -1,5 apres notation de la France, par application de la
          regle du plus radical observable. Le PCF ne se contente pas de
          retablir l'ISF : il en triple le rendement, supprime ses niches,
          abolit le prelevement forfaitaire unique et porte l'impot sur le
          revenu a 15 tranches. LFI propose un « heritage maximum », plafond
          absolu de transmission sans equivalent dans les trois autres
          territoires. Et la taxe Zucman du PS francais — 2 % au-dela de 100 M€
          — egale deja le taux superieur de QS alors que le PS n'est que le
          troisieme parti francais sur cet indicateur. Le -2 est donc libere
          pour le PCF et LFI.
      E2:
        valeur: -1.5
        just: >
          Promesses de près de 10,5 G$ sur quatre ans en expansion des services
          publics, dont plus de 250 nouveaux CLSC et un portefeuille de
          transition écologique de 4,2 G$ sur quatre ans. Équilibre repoussé à
          2029-2030.
        src: [lactualite_qs_105, radiocanada_qs_cadre]
        contest: >
          −1,5 justifie par la MAGNITUDE BUDGETAIRE, non par l'absence de
          nationalisation. La formulation precedente ne discriminait plus une
          fois la France notee : le Parti socialiste francais nationalise les
          autoroutes et les reseaux gaz-electricite tout en etant moins
          expansionniste que QS sur la depense, et se retrouve au meme −1,5 pour
          des raisons opposees. Le −2 revient au PCF, qui nomme les
          etablissements a nationaliser (BNP-Paribas, Societe generale, Axa,
          EDF, Engie, SNCF, La Poste, Sanofi) et chiffre 500 000 creations
          d'emplois publics ventilees poste par poste.
      E3:
        valeur: -2
        just: >
          Éviction du privé en santé : plus de 250 nouveaux CLSC et limitation
          de l'expansion des cliniques privées spécialisées, au motif de leurs
          effets sur l'organisation des soins et l'équité d'accès.
        src: [lapresse_promesses_sante, lequebecvote_comparer]
      E4:
        absent: true
        just: >
          Aucun engagement sur les retraites trouve. Le programme des 100
          premiers jours et les annonces de campagne portent sur le salaire
          minimum, les loyers et le teletravail des fonctionnaires, pas sur le
          RRQ ni sur les regimes de retraite. QS n'a pas repondu publiquement a
          l'appel de l'AREQ sur l'indexation des rentes du RREGOP.
        src: [qs_plateforme_2026, areq_rregop]
        contest: >
          A CONFIRMER : le site plateforme.quebecsolidaire.net n'a pas pu etre
          lu (echec de negociation TLS), et QS porte historiquement des
          positions sur la bonification du RRQ. Trois recherches ciblees n'ont
          rien donne, mais une planche « retraite » dans la plateforme integrale
          ne peut pas etre exclue.
      E5:
        valeur: -1.5
        just: >
          Salaire minimum porté à 20 $/h dès mai 2027, contre 16,60 $
          actuellement, avec une enveloppe de soutien aux employeurs de 330 M$
          la première année.
        src: [lapresse_qs_salaire_minimum]
        contest: >
          RAMENE DE -2 A -1,5 apres notation de la France. La position de QS
          repose sur UNE SEULE mesure. LFI porte le SMIC de 1 443 a 1 700 € net
          (+17,8 %, hausse relative comparable) ET y ajoute les 32 heures, une
          sixieme semaine de conges payes, l'indexation des salaires sur
          l'inflation, un quota maximal de contrats precaires et la
          requalification des travailleurs de plateformes. Le PCF ajoute la
          suspension de TOUS les plans sociaux et licenciements en cours. Le PS
          francais, note -1,5, vise 1 690 € net — a dix euros de LFI — avec en
          plus la codetermination a 50 % des droits de vote dans les conseils
          d'administration : QS doit descendre au moins a son niveau pour que
          l'echelle reste ordinale.
      E6:
        valeur: -1.5
        just: >
          Plafonnement des hausses de loyer au niveau de l'inflation — un
          encadrement direct des prix. Epiceries publiques pour soutenir
          l'agriculture locale. Transport collectif presente comme priorite
          principale. Soutien au FECC et au marche du carbone.
        src: [noovo_premieres_promesses, lapresse_promesses_environnement]
        contest: >
          RAMENE DE -2 A -1,5 apres notation de la France. LFI propose le
          BLOCAGE PAR DECRET des prix de l'alimentation, de l'energie et des
          carburants a l'echelle d'un marche de 68 millions d'habitants, avec
          renforcement de la DGCCRF pour en controler l'application ; le PCF
          nationalise EDF, la SNCF, Engie, La Poste, BNP-Paribas, la Societe
          generale et Axa, et vise un mix energetique 100 % public. Il ne
          s'agit plus d'encadrer un marche mais de le supprimer : aucun
          equivalent quebecois.
      S1:
        valeur: -1.5
        just: >
          Seuil d'immigration permanente porté à 70 000 par année (contre
          45 000). Rétablissement intégral du PEQ et régionalisation sous forme
          de PEQ régionaux.
        src: [lapresse_qs_seuils, lapresse_promesses_immigration]
        contest: >
          RAMENE DE -2 A -1,5 apres notation de la France. QS releve un seuil ;
          LFI y ajoute une regularisation massive, le droit du sol integral, la
          carte de dix ans comme titre de reference et le droit de vote des
          etrangers aux elections locales — quatre leviers que QS ne propose
          pas. Le -2 revient a LFI.
      S2:
        valeur: -2
        just: >
          Seul parti a prendre un engagement programmatique de garantie ET de
          remboursement. Plateforme 2026, MESURE 4 : « un gouvernement solidaire
          [...] garantira le droit et l'acces a l'avortement sur l'ensemble de
          son territoire » ; MESURE 3 : « rendra la contraception et les
          produits menstruels gratuits et eliminera la taxe rose ». Ruba Ghazal
          a depose le 7 mai 2025 le projet de loi 994 integrant les produits
          contraceptifs au panier de services de la RAMQ, apres une petition de
          pres de 100 000 signatures.
        src: [qs_plateforme_2026, radiocanada_qs_contraception, cbc_comparatif_2026]
        contest: >
          A ne pas mal lire : QS a porte une petition demandant le RETRAIT de
          l'article 29 du projet de loi 1, qui protegeait la liberte de recourir
          a l'IVG. Ce n'est pas une opposition au droit mais une position
          partagee par la FQPN, la CSQ, le Conseil du statut de la femme, le
          Barreau, le College des medecins et Amnistie internationale :
          inscrire l'avortement dans un texte de loi creerait une prise
          juridique pour les mouvements anti-choix et fragiliserait son statut
          actuel de soin non legifere.
      S3:
        valeur: -1.5
        just: >
          Seul des cinq partis dont la plateforme 2026 contient un engagement
          ecrit (p. 34) : « un gouvernement solidaire protegera les droits et
          assurera la securite des communautes LGBTQIA2S+. Il protegera les
          droits des personnes trans en favorisant l'equite entre les genres
          dans les lois quebecoises. Il encouragera l'acces aux soins, y compris
          ceux d'affirmation de genre ». Creation d'un ministere Femmes et
          Egalite des genres. C'est QS (Manon Masse) qui a depose la motion du
          6 fevrier 2025 denoncant la montee de l'intolerance envers les jeunes
          LGBTQ+.
        src: [qs_plateforme_2026, lequotidien_motion_homophobie, apdq_credits_lgbtq]
        contest: >
          -1,5 et non -2 : la plateforme reste au niveau du principe
          (« encouragera », « favorisant »), sans mesure chiffree, sans
          engagement sur la pluriparentalite pourtant reclamee par la Coalition
          des familles LGBT+, ni sur l'autodetermination du genre. QS est sans
          conteste le pole pro-extension du spectre quebecois, mais son texte
          plafonne sous le maximum observable dans les quatre territoires.
      S4:
        valeur: -2
        just: >
          Cosignataire, avec les trois autres partis representes a l'Assemblee
          nationale, du rapport renouvele sur les soins de fin de vie et de ses
          11 recommandations. L'Assemblee a adopte la refonte de la Loi
          concernant les soins de fin de vie, legalisant les demandes anticipees
          d'aide medicale a mourir. Le Quebec est au premier rang mondial pour
          le recours a l'AMM.
        src: [ledevoir_amm_elargie, quebec_gouv_amm, radiocanada_amm_premier_rang]
        contest: >
          Position legislative de 2023, non un engagement de la campagne 2026.
          Indicateur consensuel au Quebec : il ne separe pas les partis
          quebecois entre eux, mais il situe le Quebec par rapport aux autres
          territoires — ce qui est precisement son role sur une carte commune.
      S5:
        valeur: -0.5
        just: >
          Favorable au principe de laïcité des institutions, mais opposé à
          l'interdiction du port de signes religieux pour les employés de l'État
          en position d'autorité prévue par la Loi 21.
        src: [lapresse_laicite_engagements]
        contest: >
          RAMENE DE -1 A -0,5 pour la meme raison que le PLQ : QS s'oppose a une
          restriction existante sans proposer de la lever, la ou LFI propose de
          revenir sur l'interdiction de l'abaya a l'ecole.
      S6:
        valeur: -1.5
        just: >
          Creerait un Reseau scolaire commun integrant les ecoles privees qui
          acceptent de cesser la selection par les notes et les frais de
          scolarite, en echange d'un financement a 100 % par l'Etat. Plan de
          340 M$ en education, 2 000 nouveaux professionnels, protection du
          budget des etablissements, engagement a reduire de moitie le
          decrochage scolaire.
        src: [lapresse_promesses_education, lesaffaires_qs_decrochage, radiocanada_etats_generaux]
        contest: >
          RAMENE DE -2 A -1,5 apres notation de la France. Chez QS le prive
          subsiste, converti et integre. Le PCF porte la fin pure et simple du
          financement public des ecoles privees sous contrat ET « l'interdiction
          de toutes les ecoles privees hors contrat », pour aboutir a « une
          seule ecole commune » : c'est une suppression du secteur prive, pas
          son absorption negociee.

  - name: Parti conservateur du Québec
    sigle: PCQ
    label_pos: middle right
    chef: Éric Duhaime
    country: Québec
    color: "#1B3A6B"
    as_of: "2026-09-17"
    souverainete: nationaliste
    ecologie: productiviste
    estimation_initiale: {economie: 7, societe: 4}
    autorite: >
      Opposé aux mesures sanitaires pendant la pandémie ; discours centré sur
      les libertés individuelles.
    resume: >
      À 17 % dans les sondages, très au-dessus de son résultat de 2022.
      Libertarien sur l'économie : plus de privé en santé, révision du
      financement des garderies, exploitation des hydrocarbures, troisième lien
      à Québec. Cadre financier le plus radical de la campagne, présenté le
      9 septembre 2026.
    indicateurs:
      E1:
        valeur: 2
        just: >
          Baisses d'impôts majeures, financées par la réduction des dépenses.
          Le porte-parole aux finances publiques Adrien Pouliot chiffre le coût
          total des promesses à 52,57 G$ sur cinq ans, couvert par 60,3 G$ de
          revenus additionnels.
        src: [ledevoir_pcq_47g, radiocanada_verif_pcq, pcq_cadre_communique]
      E2:
        valeur: 1.5
        just: >
          « Dégraisser » les finances publiques de 47 G$ sur cinq ans, dont
          l'abolition de 20 000 postes dans la fonction publique. Retour à
          l'équilibre en quatre ans.
        src: [ledevoir_pcq_47g, lapresse_pcq_cadre, radiocanada_verif_pcq]
        contest: >
          Duhaime soutient que les services ne seraient pas touchés. Selon la
          Vérificatrice générale du Québec, c'est improbable : ralentir la
          dépense implique de réduire ou de cesser le financement d'activités et
          de programmes, avec des conséquences attendues sur les services,
          particulièrement en 2028-2029.
        contest: >
          RAMENE DE +2 A +1,5 apres notation des Etats-Unis. Le Parti republicain
          a EFFECTIVEMENT supprime environ 256 000 postes dans 22 grandes agences
          federales en treize mois — plus de 11 % —, aboli une agence de rang
          gouvernemental (USAID) et ampute de moitie le ministere de l'Education.
          Reconquete propose environ 150 000 suppressions sur 5,7 millions
          d'agents publics francais, soit 2,6 % : un ordre de grandeur quatre
          fois inferieur. REVISION VOLONTAIREMENT RESTREINTE : l'agent
          recommandait de cascader aussi Horizons, LR et Renaissance de +1,5 a
          +1, au motif que l'acte l'emporte sur la proposition. Cet argument n'a
          pas ete suivi : il amplifierait le biais du sortant deja documente
          dans grille.md.
      E3:
        valeur: 1.5
        just: >
          Veut mettre fin au monopole de la RAMQ et permettre aux Quebecois de
          souscrire une assurance privee « duplicative » pour des services deja
          couverts par le regime public, relancant le debat sur la pratique
          mixte public-prive. Abolition de Sante Quebec et reduction de 25 % de
          la bureaucratie, doublement des IPS, hausse des admissions en medecine
          de 300 a 500 par annee.
        src: [apdq_pcq_sante, noovo_pcq_sante_bureaucratie]
        contest: >
          +1,5 : le PCQ ouvre le regime public a la concurrence privee
          duplicative, ce qui est proche de la borne, mais conserve la RAMQ.
          Le +2 reste reserve a la contestation de la couverture universelle
          elle-meme, defendue par la droite americaine.
      E4:
        absent: true
        just: >
          Aucun engagement sur les retraites. Extraction et recherche par
          mots-cles sur la plateforme electorale et le manifeste economique :
          aucune occurrence utile de « RRQ », « regime de rentes », « RREGOP »
          ni « age de la retraite ». La seule mention de retraite est
          instrumentale — reduction de l'effectif de l'Etat « par tous les
          departs a la retraite ». La section « Nos aines » porte sur l'acces
          aux soins et le maintien a domicile, pas sur les pensions.
        src: [pcq_plateforme_2026, pcq_manifeste_economique]
      E5:
        valeur: 1.5
        just: >
          Plateforme thematique dediee, « Travail et democratie syndicale »,
          annoncant un projet de loi complet en quatre volets : reserver la
          cotisation obligatoire aux seules depenses de representation et de
          negociation, avec droit de retrait individuel permettant de
          « demissionner comme membre (malgre une clause d'atelier ferme) » ;
          scrutin secret obligatoire pour toute accreditation « peu importe le
          pourcentage de cartes signees », assorti d'un vote de maintien
          periodique de l'accreditation ; publication publique des etats
          financiers syndicaux ; mecanisme de plainte au Tribunal administratif
          du travail. S'y ajoute un chantier de dereglementation visant -30 % du
          fardeau reglementaire. Duhaime : « C'est fini les votes a main levee
          avec les goons du syndicat en arriere. »
        src: [pcq_plateforme_travail, noovo_pcq_syndicats, pcq_plateforme_2026]
        contest: >
          Arbitrage +1,5 contre +1. Le vote de maintien periodique de
          l'accreditation est une mesure structurelle lourde, au-dela de ce
          qu'a fait la CAQ. Mais le PCQ n'abolit pas la formule Rand — la
          cotisation obligatoire est maintenue pour la negociation —, ne touche
          pas aux normes du travail et n'a aucune position sur le salaire
          minimum. Le +2 correspondrait au right-to-work americain avec
          abolition de la formule Rand et salaire minimum laisse au marche.
      E6:
        valeur: 1.5
        just: >
          Abolition du Fonds d'electrification et de changements climatiques
          (FECC), principal vehicule de financement des politiques climatiques
          quebecoises, et retrait du Quebec du marche du carbone.
        src: [lapresse_promesses_environnement, radiocanada_verif_pcq, ledevoir_pcq_cadre_services]
        contest: >
          RAMENE DE +2 A +1,5 apres notation des Etats-Unis. Aucun parti francais
          ni quebecois ne propose l'ABOLITION DU FONDEMENT JURIDIQUE de la
          regulation climatique de sa juridiction. La regle americaine du
          18 fevrier 2026 supprime l'endangerment finding de 2009 ET toutes les
          normes d'emission de gaz a effet de serre des vehicules de 2012 a 2027,
          detruisant la base legale de toute regulation climatique au titre du
          Clean Air Act — doublee d'une regle generale d'abrogation a dix pour
          un.
      S1:
        valeur: 1.5
        just: >
          Réduction de 20 000 à 10 000 des admissions au titre du regroupement
          familial et des réfugiés. Refus de seuils fixes, jugés un « piège » :
          planification construite depuis des tables régionales. Critère de pays
          d'origine « démocratique » pesant autant que la maîtrise du français.
          Réduction de 25 % de l'aide sociale aux demandeurs d'asile, priorité
          aux Québécois pour certains logements et places en garderie
          subventionnée.
        src: [lactualite_pcq_democratiques, apdq_pcq_plan, lequotidien_duhaime]
        contest: >
          RAMENE DE +2 A +1,5 apres notation de la France, pour la meme raison
          que le PQ : le RN et Reconquete occupent desormais le +2 avec des
          mesures d'un autre ordre de grandeur (suppression du droit du sol,
          asile en ambassade, solde migratoire negatif).
      S5:
        valeur: 0.5
        just: >
          Soutient la Loi 21, présentée comme un compromis entre le droit des
          citoyens à un service neutre et celui des employés de l'État
          d'afficher leur religion — position plus modérée que CAQ et PQ. Mais
          assume le critère de « compatibilité culturelle » dans la sélection.
        src: [lapresse_laicite_engagements, quebecnouvelles_duhaime_compatibilite]
      S6:
        valeur: 1.5
        just: >
          Veut lever le moratoire sur les nouvelles ecoles privees
          subventionnees, en vigueur depuis 2008, et propose un systeme
          « a 1 000 vitesses » adapte a chaque eleve. Duhaime s'oppose a
          l'enseignement de « l'ideologie du genre » a l'ecole, estimant qu'il
          revient aux parents d'inculquer les valeurs morales (declarations de
          septembre 2023).
        src: [lapresse_promesses_education, noovo_pcq_1000_vitesses, lesoleil_duhaime_genre]
        contest: >
          +1,5 : deux des trois composantes de la borne +2 sont presentes
          (financement du prive, encadrement des contenus sur le genre). Le +2
          reste reserve a la droite americaine, qui y ajoute bons scolaires et
          retraits d'ouvrages. Les militants du PCQ ne sont par ailleurs pas
          alignes sur leur chef sur ces questions.
      S2:
        valeur: -0.5
        just: >
          Parti pro-choix qui defend l'acces existant sans proposer de le
          renforcer. Le 4 aout 2026, Duhaime : « On a toujours ete un parti qui
          est pro-choix et cette politique ne changera absolument pas [...] il
          n'y aura pas de debat a l'interieur de nos rangs sur cet enjeu »,
          renvoyant la question a la competence federale. Le candidat Eric
          Lanthier (Pontiac), militant antiavortement, s'est retire le
          9 septembre 2026 apres des revelations du Journal de Montreal ;
          Duhaime a reaffirme la ligne pro-choix. Aucun engagement de
          protection n'apparait toutefois dans les documents programmatiques :
          zero occurrence d'« avortement » ou de « reproduct- » dans la
          plateforme electorale 2026, la plateforme Sante 2026 et le programme
          adopte au congres de 2023.
        src: [radiocanada_pcq_prochoix, noovo_pcq_lanthier, pcq_plateforme_2026, pcq_plateforme_sante, pcq_congres_2023]
        contest: >
          Arbitrage -0,5 contre 0 : la position n'est pas une neutralite, le
          chef l'a reaffirmee deux fois en six semaines et fait appliquer par le
          retrait d'un candidat. Un 0 reste defendable si l'on ne retient que
          l'absence d'engagement programmatique. En 2022, Duhaime avait au
          contraire defendu son candidat antiavortement Roy Eappen au nom de la
          « liberte de conscience » : la ligne s'est durcie depuis.
      S3:
        valeur: 1
        just: >
          Seul parti quebecois a proposer une restriction legislative de l'acces
          aux soins de transition. Memoire depose au Comite de sages le 13 mars
          2024 : interdiction des mastectomies chez les mineurs, consentement
          parental obligatoire pour les bloqueurs de puberte avant 16 ans,
          inscription obligatoire des jeunes sous traitement hormonal dans un
          protocole de recherche. Duhaime veut aussi bannir « l'ideologie du
          genre » de l'ecole, exiger l'autorisation parentale pour tout
          changement de prenom ou de pronom, et s'oppose a l'acces des femmes
          trans aux espaces reserves aux femmes.
        src: [noovo_duhaime_mastectomies, pcq_plateforme_2026, pcq_plateforme_education, alexandredumas_partis_genre]
        contest: >
          Arbitrage +1 contre +1,5. Nuance forte et verifiee : les vingt
          documents de plateforme 2026 du PCQ ne contiennent aucune occurrence
          de « genre », « trans », « LGBT », « pronom », « mastectomie » ni
          « puberte », et aucune sortie publique sur le sujet n'a ete reperee
          entre le 27 aout et le 17 septembre 2026 — les propositions les plus
          fermes datent de 2024. Les militants ont par ailleurs rejete en
          congres une resolution sur l'education a la sexualite, contre la
          position de leur chef. +1,5 retenu car ce sont les seules propositions
          quebecoises de restriction d'un acces aux soins. RAMENE DE +1,5 A +1
          apres notation de la France : la proposition de loi LR adoptee par le
          Senat le 28 mai 2024 interdit pour les mineurs les bloqueurs de
          puberte, les hormones croisees ET la chirurgie, la ou le PCQ interdit
          les mastectomies et exige le consentement parental pour les bloqueurs.
          LR est strictement plus restrictif sur cet item et occupe le +1,5.
      S4:
        absent: true
        just: >
          Aucune position etablie. L'extraction du texte integral de six
          documents programmatiques du parti (plateforme electorale 2026,
          plateforme Sante 2026, plan familles, plateforme itinerance, congres
          2023, conseil general 2024, soit environ 50 000 mots) ne donne aucune
          occurrence d'« aide medicale a mourir », « fin de vie », « soins
          palliatifs », « euthanasie », « demande anticipee » ni « objection de
          conscience ». Silence d'autant plus net que la plateforme Sante traite
          du vieillissement, des CHSLD et des soins a domicile. Aucune
          declaration de campagne trouvee non plus. Le PCQ n'a jamais dit qu'il
          maintiendrait le regime actuel : il n'en parle pas.
        src: [pcq_plateforme_sante, pcq_plateforme_2026, pcq_congres_2023, pcq_documents_officiels, vivredignite_soins_palliatifs]
        contest: >
          A ne pas confondre : un candidat du PCQ, David Alarie, a evoque
          « l'euthanasie des gens favorables aux mesures sanitaires ». Saillie
          polemique sur la pandemie, sans rapport avec l'AMM comme politique de
          sante ; non comptabilisee. L'ecart avec le -2 des quatre partis
          parlementaires s'explique par leur cosignature du rapport sur les
          soins de fin de vie et leur vote sur la refonte, auxquels le PCQ ne
          pouvait pas participer faute de siege — aucune inference a en tirer.
      S7:
        absent: true
        just: >
          Recherche effectuee : Duhaime critique une deterioration de la
          securite publique sous la CAQ, mais aucun engagement concret sur la
          police, les peines ou les prisons n'a ete trouve dans la campagne
          2026. Position rhetorique sans mesure notable — laisse hors calcul
          plutot que note 0, une absence d'engagement n'etant pas un statu quo.
        src: [apdq_pcq_lancement]

  # -------------------------------------------------------------------- France
  # Présidentielle 2027. Macron ne pouvant se représenter, Renaissance est
  # portée par Attal ; le bilan du président sortant reste dans le résumé.
  - name: Renaissance
    sigle: Renaissance
    label_pos: bottom left
    chef: Gabriel Attal
    country: France
    color: "#FFC600"
    as_of: "2026-09-17"
    souverainete: europeen_reformiste
    ecologie: reformiste
    estimation_initiale: {economie: 4, societe: -2}
    autorite: >
      Bilan du président sortant : recours répété au 49.3 et durcissement de la
      loi immigration de 2024 en cours de débat.
    resume: >
      Attal, secrétaire général du parti, est candidat déclaré depuis mai 2026.
      Ligne libérale et pro-européenne dans la continuité du macronisme, avec un
      accent sur l'école, l'autorité et le travail. Bilan du quinquennat :
      politique de l'offre, baisses d'impôts sur les entreprises, réforme des
      retraites, flexibilisation du marché du travail.
    indicateurs:
      E1:
        valeur: 1.5
        just: >
          La convention Renaissance revendique le bilan du quinquennat comme
          acquis du parti : « nous avons rapproche notre environnement fiscal
          des moyennes europeennes en baissant l'impot sur les societes et les
          impots de production, en supprimant l'ISF et en instaurant la flat
          tax ». Pour l'avenir : « nous refuserons toute hausse d'impot sur les
          entreprises et baisserons encore les impots de production », via un
          « bouclier fiscal productif » ramenant les impots de production sous
          3 % de la valeur ajoutee contre 3,7 %.
        src: [renaissance_convention_economique, attal_president, franceinfo_attal_deficit]
        contest: >
          Le bilan du quinquennat est compte comme bilan du parti, Macron ne
          pouvant se representer. Si l'on ne notait que les engagements 2027
          d'Attal, qui portent sur les economies et non sur de nouvelles baisses
          d'impots, +1 serait plus juste.
      E2:
        valeur: 1.5
        just: >
          Cap annonce en juillet 2026 : « zero deficit en 2037 », reposant sur
          une « annee blanche » gelant les prestations sociales, un plan de
          departs volontaires supprimant 100 000 postes de fonctionnaires
          (Education, Armees, Justice et Interieur preserves), et des reformes
          des retraites et de l'assurance chomage pour 120 a 150 Md€
          d'economies. Le site de campagne ajoute qu'« aucune depense ne doit
          etre un tabou » et revendique « une baisse inedite de 10 milliards
          d'euros du budget des ministeres » en 2024.
        src: [franceinfo_attal_deficit, attal_president, renaissance_convention_economique]
        contest: >
          Aucun programme de privatisation, ce qui empeche le +2 malgre un
          objectif d'effectifs chiffre unique parmi les partis de gouvernement
          francais.
      E3:
        valeur: 1
        just: >
          Le site de campagne revendique la reforme de l'assurance chomage
          engagee par Attal, « permettant de creer 100 000 emplois et
          d'economiser plus de 4 milliards d'euros », empechee par la
          dissolution, et pose que « l'effort devra d'abord porter sur la
          depense sociale, qui represente plus de la moitie des depenses
          publiques ». Le programme 2027 ajoute une « annee blanche » gelant les
          prestations et une nouvelle reforme de l'assurance chomage. Aucune
          mesure de developpement de l'assurance sante privee.
        src: [attal_president, franceinfo_attal_deficit, renaissance_convention_economique, assnat_scrutins_chomage_2026]
        contest: >
          Renaissance n'a publie aucune convention thematique sante. Le
          doublement des franchises medicales de 2024 n'a pas pu etre source
          (ameli.fr en 403) ; s'il etait confirme, il justifierait +1,5.

      S1:
        valeur: 0.5
        just: >
          Bilan : la loi du 26 janvier 2024 « pour controler l'immigration »,
          portee par le gouvernement puis durcie en commission mixte paritaire,
          adoptee le 19 decembre 2023 par 349 voix contre 186 ; le Conseil
          constitutionnel en censure plus d'un tiers des articles. La convention
          « Une Republique ferme, une France apaisee » du 26 mai 2025 fixe la
          doctrine : passage « d'une immigration majoritairement familiale et
          subie a une immigration principalement economique et pilotee »,
          admission par points avec quotas votes par le Parlement, durcissement
          du regroupement familial (delai conjoint 18 a 24 mois), allongement de
          la retention. Mais le meme texte pose un intangible : « nous refusons
          la suppression du droit du sol ». 30 deputes ont vote CONTRE la
          denonciation des accords franco-algeriens.
        src: [renaissance_convention_regalien, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          Cellule tendue : la loi de 2024 tirerait vers +1, le refus de toucher
          au droit du sol et le vote contre la denonciation des accords de 1968
          vers 0. +0,5 place Renaissance au niveau de la CAQ — maintien d'un
          flux choisi, durcissement des conditions, pas de coupe quantitative.
      S2:
        valeur: -1.5
        just: >
          La constitutionnalisation de la liberte de recourir a l'IVG est un
          PROJET DE LOI DU GOUVERNEMENT, promulgue le 8 mars 2024 : c'est la
          garantie juridique la plus forte des quatre territoires. 164 deputes
          sur 170 pour le 30 janvier 2024, 166 au Congres, une seule abstention
          et aucun vote contre. La gratuite de la contraception pour les moins
          de 26 ans date de janvier 2022 sous la meme majorite.
        src: [assnat_congres_ivg, assnat_scrutin_3289, pe_ice_ma_voix]
        contest: >
          Arbitrage assume. Le critere « acces garanti et inscrit dans la loi »
          est rempli AU MAXIMUM POSSIBLE — inscription dans la Constitution —
          mais la convention de mai 2025 ne propose aucune extension
          supplementaire. Un correcteur privilegiant l'acte sur le programme
          mettrait -2, et il ne resterait alors aucun ecart entre Renaissance,
          le PS, LFI, le PCF et QS.
      S3:
        valeur: -1
        just: >
          Deux extensions effectives portees par la majorite presidentielle : la
          loi bioethique ouvrant la PMA a toutes, adoptee le 29 juin 2021 avec
          209 voix pour et 6 contre, et la loi du 31 janvier 2022 interdisant
          les therapies de conversion, adoptee a l'unanimite. Le 28 mai 2024,
          les senateurs Renaissance ont vote contre la proposition de loi LR sur
          les mineurs en questionnement de genre (18 contre, 0 pour). Aucune
          extension nouvelle n'est proposee dans les documents du parti.
        src: [assnat_scrutin_3855, assnat_scrutin_4346, senat_scrutin_204]
        contest: >
          Un acquis important mais pas d'agenda d'extension : -1, au niveau du
          PLQ, et non -1,5 comme QS qui porte des revendications trans
          actuelles.
      S4:
        valeur: -1
        just: >
          Le texte procede d'un projet de loi du gouvernement presente en 2024,
          et la loi a ete promulguee par Emmanuel Macron le 18 aout 2026. Le
          groupe a soutenu le texte a chaque lecture mais avec une liberte de
          vote assumee et une minorite constante d'opposants : 64 pour / 18
          contre / 9 abstentions en lecture definitive le 15 juillet 2026. Le
          groupe allie Les Democrates est quasiment coupe en deux.
        src: [assnat_scrutin_8280, assnat_scrutin_5729]
        contest: >
          Un quart du groupe vote contre : -1 plutot que -1,5 traduit un soutien
          majoritaire mais sans ligne de parti.
      E4:
        valeur: 1.5
        just: >
          Bilan du parti : la reforme du 14 avril 2023 portant l'age de 62 a
          64 ans et la duree d'assurance a 43 ans en 2027 est son oeuvre,
          adoptee par 49.3. Programme d'Attal : « pour augmenter le taux
          d'emploi des seniors, l'enjeu ne sera plus l'age de depart a la
          retraite, mais LA DUREE DE COTISATION » — abandon d'un nouveau
          relevement d'age au profit d'un allongement de la duree. S'y ajoute
          une « annee blanche » de gel des prestations, « en epargnant toutefois
          les petites retraites », et des reformes chiffrees a 120-150 Md€
          d'economies pour un objectif de zero deficit en 2037.
        src: [attal_president, franceinfo_attal_deficit, assnat_scrutin_2257]
        contest: >
          Renaissance a vote la LFSS 2026 qui SUSPEND sa propre reforme (91 pour
          sur 91). Traite comme un compromis de gouvernement et non comme une
          position, le programme presidentiel d'Attal etant posterieur et
          reaffirmant la ligne d'allongement. Si l'on ponderait davantage le
          vote que le programme, +1 serait soutenable.
      E5:
        valeur: 1.5
        just: >
          Refondation du Code du travail en une « constitution du travail »
          reduite a « quelques articles fondamentaux, le reste relevant des
          branches et des entreprises » — decentralisation de la norme sociale
          vers l'entreprise. Suppression du plafond legal d'heures
          supplementaires, aujourd'hui de 220 heures par an et par salarie a
          defaut d'accord collectif. Reforme de l'assurance chomage creant
          100 000 emplois et plus de 4 Md€ d'economies. Annee blanche sur les
          prestations. AUCUNE hausse du SMIC : la hausse du net passe par la
          baisse des charges salariales. Bilan : ordonnances travail de 2017,
          reformes successives de l'assurance chomage, loi plein emploi de 2023
          conditionnant le RSA a 15 h d'activite.
        src: [attal_president, assnat_scrutins_chomage_2026]
        contest: >
          Attal ouvre son chantier par « notre combat : faire monter les
          salaires », mais les trois leviers qu'il enonce excluent explicitement
          l'instrument legal. La note reflete les mesures nommees, non
          l'objectif affiche.
      E6:
        valeur: 0.5
        just: >
          Position partagee. Cote + : le projet de loi de simplification de la
          vie economique est un texte de gouvernement, et le groupe a
          majoritairement vote la loi Duplomb levant les contraintes a
          l'exercice du metier d'agriculteur (64 pour, 14 contre). Cote − : le
          groupe s'est DIVISE sur le texte final portant suppression des ZFE (25
          pour, 30 contre, 19 abstentions) et a vote massivement contre la
          proposition de loi energie-climat amendee par le RN (90 contre sur
          93). La page « Dette ecologique » maintient l'ambition climatique :
          tripler le rythme annuel de reduction des emissions d'ici 2030, de
          1,8 % a 5 % par an.
        src: [attal_president, assnat_scrutins_environnement]
        contest: >
          0 serait defendable : le groupe s'est oppose a deux des trois textes
          dereglementateurs majeurs et le programme reaffirme l'objectif
          climatique. +0,5 retenu parce que la loi de simplification est un
          projet de loi DU GOUVERNEMENT qu'il soutient et que la majorite du
          groupe a vote Duplomb.
      S5:
        valeur: 1.5
        just: >
          Trois strates. Bilan : loi du 24 aout 2021 « confortant le respect des
          principes de la Republique » et interdiction de l'abaya et du qamis a
          l'ecole, decidee par Attal ministre, en vigueur depuis septembre 2023.
          Programme : la convention de mai 2025 propose « d'interdire le port du
          voile pour les enfants dans l'espace public » en sanctionnant les
          parents, de creer un « delit de contrainte au port du voile » et une
          « loi contre l'entrisme islamiste ». Mais le meme texte pose : « nous
          refusons la suppression du droit du sol sur le territoire hexagonal.
          C'est un intangible dans notre parti. » Le 6 septembre 2026, Attal se
          declare « pas favorable » a l'interdiction generale proposee par le
          RN.
        src: [renaissance_convention_regalien, assnat_rapport_2338, bfmtv_attal_voile, cnews_abaya_2026]
        contest: >
          Deux lectures. A la baisse : refus de supprimer le droit du sol, refus
          de l'interdiction generale, defense de la liberte des femmes majeures.
          A la hausse : l'interdiction de l'abaya est EN VIGUEUR et s'applique a
          toutes les eleves, et l'interdiction proposee pour les moins de 15 ans
          porte sur l'ESPACE PUBLIC, ce que la loi 21 quebecoise ne fait pas.
          +1,5 retenu comme point d'equilibre.
      S6:
        valeur: 1
        just: >
          Bilan d'Attal ministre de l'Education : uniforme experimente, groupes
          de niveau au college, « choc des savoirs ». Le parti defend
          l'exigence, l'autorite et l'evaluation, sans porter de mesure de
          financement accru du prive ni de recit national explicite.
        src: [cnews_ecole_2026, renaissance_convention_regalien]
        contest: >
          Note construite sur le bilan et la doctrine generale : aucune source
          datee n'a ete trouvee sur la position de Renaissance a l'egard du
          programme d'education a la vie affective et sexuelle, marqueur pourtant
          central de cet indicateur.
      S7:
        valeur: 1
        just: >
          A fait adopter une loi durcissant la justice des mineurs — dont six
          articles ont ete censures par le Conseil constitutionnel le 19 juin
          2025 — et propose une loi d'urgence de construction de prisons. Le
          groupe a vote le projet de loi sur l'ordre public (84 pour) et la loi
          narcotrafic (73 pour), mais s'est DIVISE sur la presomption de
          legitime defense (55 pour, 12 contre).
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          Le perimetre exact des articles censures le 19 juin 2025 n'a pas pu
          etre verifie sur source primaire : Legifrance renvoie 403 et
          vie-publique.fr bloque les requetes sans JavaScript. La censure est
          attestee par des titres concordants.
  - name: Horizons
    sigle: Horizons
    label_pos: middle right
    chef: Édouard Philippe
    country: France
    color: "#1F9EC4"
    as_of: "2026-09-17"
    souverainete: europeen_reformiste
    ecologie: reformiste
    estimation_initiale: {economie: 5, societe: 1}
    autorite: null
    resume: >
      Candidat déclaré, ancien Premier ministre. Centre-droit : réduction de la
      dépense publique, recul de l'âge de départ à la retraite, fermeté sur la
      sécurité et l'immigration, pro-européen.
    indicateurs:
      E1:
        valeur: 1
        just: >
          Doctrine posee au meeting du 5 juillet 2026 : retablir les comptes
          « en baissant la depense plutot qu'en augmentant les impots », « je ne
          taxerai pas davantage les entreprises qui payent deja trop d'impots »,
          et, visant la taxe Zucman, « aux categories les plus aisees, on n'a pas
          besoin de reinventer des impots idiots ». Mesure chiffree : un « deal
          fiscal » de 50 Md€ de baisse d'impots de production contre 50 Md€ de
          baisse d'aides publiques.
        src: [horizons_meeting_adidas, horizons_conseil_reims]
        contest: >
          +1,5 serait defendable au vu de la ligne « pas de hausse d'impots ».
          Le +1 tient a ce que le deal fiscal est budgetairement NEUTRE — ce
          n'est pas une baisse nette — et que Philippe assume deux hausses
          ciblees : suppression de niches et « j'assume de dire aux retraites
          qu'il faudra contribuer davantage ».
      E2:
        valeur: 1.5
        just: >
          Le Manifeste pose comme principe fondateur « un Etat moins dispendieux
          et recentre sur ses missions essentielles » et range parmi ce que le
          parti combat « l'illusion de l'argent public magique ». Le discours du
          5 juillet 2026 precise : « il faut baisser les depenses sociales » ;
          « a l'Etat, a ses agences, aux collectivites [...] qu'ils se serrent la
          ceinture » ; transformer l'Etat par l'IA « pour avoir moins d'agents
          bloques derriere un bureau ». Objectif : deficit a 2 % du PIB en 2032,
          contre environ 5 % aujourd'hui.
        src: [horizons_manifeste, horizons_meeting_adidas, franceinfo_attal_deficit]
        contest: >
          Aucun objectif chiffre d'effectifs de la fonction publique ni aucun
          programme de privatisation publie, ce qui interdit d'aller au-dela.
      E3:
        valeur: 1
        just: >
          « Il faut baisser les depenses sociales, supprimer les niches
          fiscales, avant de songer a augmenter les impots de ceux qui
          travaillent » ; « nous nous mentons lorsque nous pensons qu'il serait
          juste de defendre l'actuel modele social ». Le pole Idees a publie une
          note « Vers une societe du travail : pour une assurance chomage qui
          favorise l'emploi ». Contrepoids sur la sante : « nous devrons investir
          massivement dans notre systeme de sante, pour garantir son acces a
          tous ».
        src: [horizons_meeting_adidas, horizons_notes, assnat_scrutins_chomage_2026]
        contest: >
          Position la moins documentee des partis de gouvernement : le texte des
          Notes d'Horizons est reserve aux adherents, seuls les titres sont
          publics. Le +1 est prudent et pourrait monter a +1,5 si la note
          chomage contient une degressivite chiffree.

      S1:
        valeur: 1
        just: >
          Horizons vote plus a droite que Renaissance sur le regalien
          migratoire : 32 des 33 deputes pour la restriction de l'acces a la
          nationalite a Mayotte, 17 POUR la denonciation des accords
          franco-algeriens de 1968 la ou Renaissance vote contre, et contre le
          renouvellement automatique des titres de sejour de longue duree.
          Philippe avait propose des 2023 de remettre en cause l'accord de 1968.
          Il refuse en revanche le moratoire general sur l'immigration legale :
          « nous allons continuer a delivrer des titres de sejour pour des
          etudiants etrangers et pour les etrangers qui ont des competences dont
          nous avons besoin ».
        src: [assnat_scrutin_3260, assnat_scrutin_1308, wikipedia_philippe]
        contest: >
          Aucun document programmatique d'Horizons sur l'immigration n'a ete
          trouve : la note repose sur des scrutins de groupe et des declarations
          du chef.
      S2:
        valeur: -1
        just: >
          26 deputes sur 28 pour la constitutionnalisation le 30 janvier 2024 et
          28 sur 29 au Congres, aucun vote contre ; deux parlementaires ne sont
          pas venus voter au Congres. Les eurodeputes Horizons ont vote pour la
          resolution du 17 decembre 2025. Aucune proposition d'extension ni de
          restriction n'a ete trouvee dans les publications du parti.
        src: [assnat_congres_ivg, pe_ice_ma_voix]
        contest: >
          Soutien au statu quo constitutionnalise, sans programme propre : -1
          traduit un alignement sans engagement, comme le PLQ.
      S3:
        valeur: -0.5
        just: >
          Trace la plus mince du tableau francais. Les 22 deputes votants ont
          approuve le 6 mars 2024 la proposition de loi portant reconnaissance
          et reparation des prejudices subis par les personnes condamnees pour
          homosexualite entre 1942 et 1982. Philippe etait Premier ministre
          quand son gouvernement a depose et fait adopter en premiere lecture le
          projet de loi bioethique ouvrant la PMA a toutes, et declare avoir
          « evolue sur cette question » apres une tribune contre en 2013.
        src: [assnat_scrutin_3436, assnat_scrutin_2146, wikipedia_philippe]
        contest: >
          Le scrutin du 6 mars 2024 a ete consensuel — tous les groupes pour, RN
          compris — donc il discrimine mal. Hesitation avec `absent` ; -0,5
          retenu parce qu'un vote enregistre et une action gouvernementale
          existent. A re-sourcer en priorite si Horizons publie son programme.
      S4:
        valeur: 0
        just: >
          Le seul groupe de l'Assemblee durablement partage, avec une majorite
          qui bascule CONTRE a partir de la deuxieme lecture : 14 pour / 13
          contre / 6 abstentions le 27 mai 2025, puis 14 pour / 18 contre le
          25 fevrier 2026, et 16 pour / 18 contre / 1 abstention en lecture
          definitive le 15 juillet 2026. Aucune consigne de vote ni position de
          parti publiee.
        src: [assnat_scrutin_8280, assnat_scrutin_2107]
        contest: >
          Le 0 n'est pas ici un defaut de source mais une division mesuree et
          stable : 16 contre 18 sur quatre scrutins. C'est une position, pas une
          absence.
      E4:
        valeur: 2
        just: >
          Position la plus a droite des huit, cochant les trois criteres du pole
          +2. Programme : « garantir l'equilibre de notre systeme de retraites
          [...] TRAVAILLER PLUS tout en prenant en compte la diversite des
          carrieres, CREER UN PILIER DE CAPITALISATION A 10-15 % DES PENSIONS
          d'ici quinze ans, confier la gestion du regime a l'equilibre aux
          partenaires sociaux. » Discours du 5 juillet 2026 : « j'assume de dire
          aux RETRAITES QU'IL FAUDRA CONTRIBUER DAVANTAGE au financement de
          notre systeme social. J'assume de dire aux cadres et aux employes [...]
          qu'il faudra TRAVAILLER PLUS LONGTEMPS. » Il y denonce la suspension
          comme un renoncement.
        src: [philippe_priorites, horizons_meeting_adidas, assnat_scrutin_2257]
        contest: >
          Horizons est le seul des huit a proposer explicitement un pilier de
          capitalisation chiffre, et le seul a demander une contribution accrue
          des retraites eux-memes. Le +2 est solidement etabli et definit la
          borne pour l'ensemble du compas, l'ancrage quebecois etant quasi nul
          sur cet indicateur.
      E5:
        valeur: 1.5
        just: >
          Bilan : les ordonnances travail de septembre 2017 (fusion des
          instances en CSE, plafonnement des indemnites prud'homales, primaute
          de l'accord d'entreprise) et la reforme de l'assurance chomage de 2019
          ont ete prises sous son gouvernement. Discours du 5 juillet 2026 :
          « il faut reprendre la politique de l'offre interrompue en 2020 » ;
          « plus de liberte pour les partenaires sociaux [...] pour les laisser
          discuter au sein de l'entreprise des regles et des facons de
          produire » — poursuite de l'inversion de la hierarchie des normes.
          Hausse du net par transfert de financement, pas par le SMIC.
        src: [horizons_meeting_adidas, philippe_priorites, assnat_scrutins_chomage_2026]
        contest: >
          Le programme d'Edouard Philippe est nettement plus developpe sur les
          retraites et la fiscalite que sur le marche du travail proprement
          dit : la note s'appuie largement sur le bilan et sur le discours
          plutot que sur des mesures programmatiques nommees.
      E6:
        valeur: 1.5
        just: >
          Engagement dereglementateur le plus general et le plus explicite du
          panel : « sceller un MORATOIRE NORMATIF ET FISCAL : pas de nouvelle
          norme et de nouvel impot sur le quinquennat ». S'y ajoutent la
          privatisation d'agences et d'operateurs de l'Etat, « zero
          surtransposition agricole » et l'inscription du developpement agricole
          dans la Charte de l'environnement — soit un contrepoids
          constitutionnel a la protection de l'environnement. Votes : 32 pour la
          loi de simplification portant suppression des ZFE, 26 pour la loi
          Duplomb.
        src: [philippe_priorites, assnat_scrutins_environnement]
        contest: >
          Le vote contre la proposition de loi energie-climat du RN (34 contre)
          montre qu'Horizons ne suit pas la dereglementation quand elle
          s'accompagne d'un moratoire sur les renouvelables : Philippe
          dereglemente la procedure, pas la trajectoire climatique. C'est ce qui
          le maintient a +1,5.
      S5:
        valeur: 0.5
        just: >
          Le 6 septembre 2026 a Ales, Philippe a juge la proposition de LFI sur
          l'abaya « une trahison de la laicite » et defend la loi de 2004 comme
          « une bonne loi, bien appliquee ». Mais en commission le 14 janvier
          2026, Agnes Firmin Le Bodo a rejete la proposition de loi sur le
          voilement des mineures comme « a la fois inconstitutionnelle et
          inapplicable », rappelant que la laicite « ne saurait imposer une
          restriction generale a l'expression des convictions religieuses dans
          l'espace public ».
        src: [cnews_abaya_2026, assnat_rapport_2338, assnat_scrutin_1308]
        contest: >
          Position en tension : defense intransigeante du perimetre scolaire,
          refus explicite d'etendre la neutralite a l'espace public. C'est la
          position « laicite de l'Etat, pas de l'espace public » — d'ou +0,5.
      S6:
        valeur: 0.5
        just: >
          Le 24 aout 2026, Philippe a annonce une hausse de 20 % de la
          remuneration moyenne des enseignants sur cinq ans. Son projet repose
          sur l'AUTONOMIE DES ETABLISSEMENTS : possibilite d'adapter methodes et
          horaires, d'imposer l'uniforme, de fixer les regles de discipline, de
          choisir et evaluer les enseignants, en contrepartie de la publication
          de leurs resultats. Il propose une « amende de responsabilisation
          scolaire, sur le modele de ce qui existe au Royaume-Uni » pour les
          parents d'enfants harceleurs ou absenteistes.
        src: [cnews_ecole_2026, horizons_manifeste]
        contest: >
          Agenda d'autonomie et de quasi-marche, sans volet financement du prive
          ni recit national : c'est le mecanisme du pole +, pas son contenu
          identitaire. Base doctrinale mince, les notes du pole Idees ne
          traitant l'ecole que par le metier d'enseignant et l'orientation.
      S7:
        valeur: 1.5
        just: >
          Le groupe a vote la presomption de legitime defense pour les forces de
          l'ordre (31 pour), le projet de loi « reponses immediates aux
          phenomenes troublant l'ordre public » (32 pour) et la loi narcotrafic
          (33 pour) — alignement complet sur les trois textes de durcissement
          penal de la legislature.
        src: [assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
  - name: Les Républicains
    sigle: LR
    label_pos: middle right
    chef: Bruno Retailleau
    country: France
    color: "#0066CC"
    as_of: "2026-09-17"
    souverainete: europeen_reformiste
    ecologie: productiviste
    estimation_initiale: {economie: 5, societe: 6}
    autorite: null
    resume: >
      Retailleau, ancien ministre de l'Intérieur, a été désigné par les
      adhérents. Réduction de la dépense publique et des impôts, forte baisse de
      l'immigration, fermeté pénale, défense des valeurs traditionnelles.
    indicateurs:
      E1:
        valeur: 1.5
        just: >
          La brochure « Le travail gagnant » (janvier 2026) engage a « redonner
          au moins 30 milliards d'euros aux salaries et aux entreprises », via un
          seuil « zero cotisation » exonerant les heures au-dela de 1 623 h/an.
          Sur le capital, Retailleau le 26 aout 2026 : « je ne serai pas le
          president qui augmentera les droits de succession mais celui qui les
          baissera » ; 150 000 € de donation par parent et par enfant de moins
          de 30 ans sans impot pendant trois ans ; exoneration totale de
          succession pour les entreprises familiales.
        src: [lr_travail_gagnant, lr_retailleau_successions, lr_nos_propositions]
        contest: >
          Un +2 est tres defendable : LR coche point par point la definition de
          la borne. Le +1,5 tient a ce que l'effort principal porte sur les
          COTISATIONS SOCIALES et non sur l'impot, et a ce que Reconquete assume
          une baisse plus large financee par des coupes d'un ordre de grandeur
          superieur.
      E2:
        valeur: 1.5
        just: >
          Retailleau denonce « l'Etat vorace qui devore plus de la moitie de la
          richesse produite » et pose que l'Etat « est pauvre parce qu'il depense
          trop ». Le programme annonce « reduire franchement les prelevements
          obligatoires », « reprendre la main sur l'Etat et ses agences »,
          supprimer « les 50 regles qui paralysent le plus nos entreprises » et
          refonder le code du travail sur 50 principes. La brochure chiffre
          13 Md€/an d'economies sur l'assurance chomage et 4 Md€ sur le compte
          social unique et la fraude.
        src: [lr_retailleau_successions, lr_nos_propositions, lr_travail_gagnant]
        contest: >
          LACUNE A COMBLER : aucun objectif chiffre de reduction des effectifs de
          la fonction publique ni de la depense publique globale n'a ete trouve
          dans les documents publies par LR, contrairement a Renaissance
          (100 000 postes), alors que LR en avait un en 2022. Le livret
          « Produire plus » de fevrier 2026 n'a pas pu etre telecharge et
          pourrait contenir ce chiffrage. Note a revalider.
      E3:
        valeur: 1.5
        just: >
          Chapitre le plus abouti du corpus LR. Sur le chomage : mise en oeuvre
          des regles de juin 2024, limitation a six mois et plafonnement de
          l'indemnisation des ruptures conventionnelles, allocation plafonnee et
          degressive pour les salaries alternant emploi et chomage, soit environ
          13 Md€ d'economies par an ; « l'allocation chomage doit etre un filet
          de securite, pas un choix de vie ». Sur les prestations : compte social
          unique plafonnant le cumul des aides non contributives a 70 % du SMIC
          net par adulte. LR veut en outre sortir le financement de la sante des
          cotisations.
        src: [lr_travail_gagnant, lr_retailleau_successions, assnat_scrutins_chomage_2026]
        contest: >
          LR ne propose aucune assurance sante privee duplicative — c'est ce qui
          l'empeche d'atteindre le +2 et le distingue du PCQ, note +1,5 pour la
          fin du monopole de l'assurance maladie publique. Sur la seule
          dimension « resserrement des conditions », LR est plus dur que le
          PCQ ; sur la dimension « place du prive », il ne l'est pas.

      S1:
        valeur: 1.5
        just: >
          Le 1er juillet 2026, Retailleau annonce que la SUPPRESSION DU DROIT DU
          SOL et la restriction du regroupement familial seront les mesures
          majeures de sa politique migratoire. Comme ministre de l'Interieur
          (septembre 2024 - septembre 2025) il a voulu retablir le delit de
          sejour irregulier, reformer l'AME, porter la retention administrative
          de 90 a 210 jours pour les etrangers « dangereux », et a mis fin a la
          circulaire Valls sur les regularisations. Au Senat, le groupe a vote a
          127 voix pour la version durcie du projet de loi immigration le
          14 novembre 2023. A l'Assemblee, 47 deputes sur 48 pour la loi Mayotte
          et 26 pour la denonciation des accords de 1968.
        src: [wikipedia_retailleau, senat_scrutin_43, assnat_scrutin_1308, assnat_scrutin_3260]
        contest: >
          LR ne propose pas de coupe quantitative globale du type PQ ; sa
          radicalite porte sur l'ACCES A LA NATIONALITE et le regroupement
          familial. +1,5 laisse la place au RN et a Reconquete.
      S2:
        valeur: 0.5
        just: >
          Groupe le plus divise du Parlement : 40 pour / 15 contre / 4
          abstentions a l'Assemblee le 30 janvier 2024 ; 72 pour / 41 contre /
          13 abstentions au Senat le 28 fevrier 2024. VERIFIE NOMINATIVEMENT :
          Bruno Retailleau figure dans la liste des « Contre » du scrutin
          senatorial et du Congres, jugeant la mesure « superfetatoire ». Il
          s'etait deja oppose en 2016 a la proposition de loi sur le delit
          d'entrave numerique a l'IVG. Aucune proposition LR de restriction de
          l'acces a l'IVG n'a ete trouvee.
        src: [senat_scrutin_136, assnat_congres_ivg, wikipedia_retailleau]
        contest: >
          Ecart parti/chef majeur et documente : la majorite des parlementaires
          LR a vote pour, leur president et candidat a vote contre. Le parti est
          note tel qu'il est porte en 2027, en signalant que le groupe penche de
          l'autre cote. C'est la note la plus haute des quatre territoires hors
          Etats-Unis.
      S3:
        valeur: 1.5
        just: >
          Le 28 mai 2024, le Senat adopte 180-136 la proposition de loi portee
          par la senatrice LR Jacqueline Eustache-Brinio sur les mineurs en
          questionnement de genre ; LE GROUPE LR LA VOTE A 131 VOIX POUR ET 0
          CONTRE, unanimite parfaite. Le rapport senatorial de mars 2024
          preconise pour les mineurs l'interdiction des bloqueurs de puberte,
          des hormones croisees ET de la chirurgie de reassignation ; la
          Defenseure des droits a rendu un avis d'inquietude le 6 mai 2024. En
          2021, 77 deputes LR sur 105 ont vote contre la PMA pour toutes.
        src: [senat_scrutin_204, wikipedia_mineur_transgenre, assnat_scrutin_3855]
        contest: >
          Depasse le PCQ sur l'item medical : le PCQ interdit les mastectomies
          et exige le consentement parental pour les bloqueurs, LR interdit
          purement et simplement bloqueurs, hormones croisees et chirurgie —
          d'ou le passage du PCQ a +1. LR n'a en revanche ni interdiction
          d'enseignement, ni retrait d'ouvrages, ni restriction visant les
          adultes : le +2 reste a la droite americaine. L'opposition au mariage
          pour tous est une position de Retailleau, LR n'ayant plus d'abrogation
          a son programme.
      S4:
        valeur: 1.5
        just: >
          Le groupe vote contre a chaque lecture : 5 pour / 41 contre / 2
          abstentions le 15 juillet 2026. Surtout, le 7 juillet 2026, 126 des
          131 senateurs LR ont vote la question prealable presentee au nom de la
          commission des affaires sociales, motion adoptee 169-164 qui a fait
          rejeter le texte en nouvelle lecture sans examen. C'est le president
          du Senat, Gerard Larcher (LR), qui a ensuite defere la loi au Conseil
          constitutionnel le 16 juillet 2026.
        src: [senat_scrutin_328, assnat_scrutin_8280]
        contest: >
          PIEGE DE LECTURE : le scrutin senatorial du 28 janvier 2026 affiche
          82 senateurs LR « pour », mais il porte sur le texte tel que reecrit
          par la commission, que la gauche a rejete en bloc. Ne pas le citer
          comme un soutien LR a l'aide a mourir. Pas de +2 : LR n'a pas propose
          d'abroger la loi promulguee.
      E4:
        valeur: 1.5
        just: >
          Position constante de retablissement des 64 ans, portee par le
          Senat : « le Senat retablira la reforme des retraites. Nous la votons
          depuis cinq ans. Son abandon, c'est 30 milliards de deficit en 2035 »
          (Gerard Larcher, 27 octobre 2025). Le parti qualifie la suspension de
          « retour du reve socialiste des annees Mitterrand ». Le livret Le
          travail gagnant ne propose aucun nouveau relevement d'age mais deux
          dispositifs d'allongement de la vie active : un seuil « zero
          cotisation senior anticipe » et un cumul emploi-retraite renove,
          justifies par le constat que « seuls 36 % des 60-64 ans sont en emploi
          contre 60 % en moyenne » ailleurs.
        src: [lr_larcher_retraites, lr_travail_gagnant, assnat_scrutin_2257]
        contest: >
          Aucune proposition de report au-dela de 64 ans ni de pilier de
          capitalisation pour 2027 n'a ete trouvee chez LR, ce qui les distingue
          nettement d'Horizons et interdit de les monter a +2. Le groupe s'est
          majoritairement abstenu sur la LFSS 2026.
      E5:
        valeur: 1.5
        just: >
          Le livret Le travail gagnant est le document le plus quantifie du
          panel. Assurance chomage : mise en oeuvre des regles de juin 2024
          jamais appliquees, puis trois leviers supplementaires — limiter a six
          mois et plafonner l'indemnisation des ruptures conventionnelles,
          aligner l'indemnisation des frontaliers sur des salaires francais,
          plafonner et rendre degressive l'allocation des salaries alternant
          emploi et chomage — pour environ 13 Md€ d'economies par an. Compte
          social unique : « hors situations de dependance ou de handicap, le
          total des aides ne devrait jamais depasser 70 % du SMIC net par
          adulte ». Aucune hausse du SMIC.
        src: [lr_travail_gagnant, lr_retailleau_successions, assnat_scrutins_chomage_2026]
        contest: >
          LR n'attaque ni le SMIC comme institution ni le financement syndical :
          il reste sous le +2 defini par le right-to-work americain. Egalite
          avec Renaissance par des leviers differents — LR sur l'indemnisation
          et les aides, Renaissance sur le Code du travail lui-meme.
      E6:
        valeur: 1.5
        just: >
          LR est co-auteur de la suppression des ZFE : le 26 mars 2025, la
          commission speciale de l'Assemblee a adopte deux amendements
          identiques des groupes LR et RN les supprimant, disposition maintenue
          jusqu'a l'adoption definitive du 14 avril 2026 avant censure par le
          Conseil constitutionnel pour cavalier legislatif. Votes : 43 pour la
          loi de simplification, 47 sur 48 pour la loi Duplomb. Doctrine : le
          decrochage industriel resulte de « choix politiques ayant privilegie
          la depense publique et LA NORME au detriment de la production » ;
          Retailleau impute la crise du logement aux freins a la construction,
          « a commencer par le ZAN ».
        src: [lr_nos_propositions, lr_retailleau_successions, assnat_scrutins_environnement]
        contest: >
          LR a un livret Electricite de mai 2026 qui n'a pas ete depouille et
          pourrait contenir des elements d'encadrement tarifaire susceptibles de
          faire baisser la note.
      S5:
        valeur: 1.5
        just: >
          Le 6 septembre 2026, Retailleau repond « absolument » a la question de
          savoir s'il interdirait le voile A L'UNIVERSITE, se dit favorable a
          l'interdiction lors des sorties scolaires, dans le sport et pour les
          mineures, et confirme vouloir inscrire la « TRADITION JUDEO-CHRETIENNE »
          de la France dans le bloc constitutionnel via une charte de l'ordre
          republicain. Le 8 septembre il annonce la suppression du droit du sol
          par referendum. Il pose le lien immigration-assimilation : « plus vous
          accueillez, moins vous assimilez, moins vous integrez ». Il rejette en
          revanche l'interdiction generale dans l'espace public comme
          « demagogique » et « inapplicable » (« il faudrait aussi interdire la
          kippa »).
        src: [aa_retailleau_voile, cnews_retailleau_interview, lr_programme_ecole, assnat_scrutin_1308]
        contest: >
          Depasse tout parti quebecois sur deux points : interdire le voile a
          l'universite restreint des USAGERES ADULTES d'un service public, ce
          que la loi 21 ne fait pas, et inscrire une « tradition
          judeo-chretienne » dans le bloc constitutionnel installe une culture
          de reference confessionnelle, ce que la loi 21 refuse explicitement au
          nom de la laicite. C'est ce depassement qui a impose de ramener la CAQ
          et le PQ de +2 a +1.
      S6:
        valeur: 1.5
        just: >
          Le livret Ecole de septembre 2026 supprime un PLAFOND NATIONAL bornant
          a 20 % les moyens publics alloues a l'enseignement prive, cree 1 000
          etablissements publics disposant d'une « totale liberte dans le
          recrutement des professeurs et des eleves », instaure un examen
          d'entree en sixieme, recentre le primaire sur « l'histoire et la
          geographie de la France » et etend « la neutralite de la loi de 2004
          aux accompagnateurs des sorties scolaires ».
        src: [lr_programme_ecole, cnews_ecole_2026]
        contest: >
          RAMENE DE +2 A +1,5 apres notation des Etats-Unis. LR agit sur un
          financement du prive EXISTANT ; le Parti republicain a CREE le premier
          credit d'impot federal pour bourses scolaires de l'histoire
          americaine, sans plafond global de dons. LR inscrit une tradition dans
          la Constitution ; les republicains ont retabli par decret une
          commission d'Etat du recit national et quatre legislatures imposent
          l'affichage du Decalogue dans CHAQUE salle de classe publique, valide
          en appel federal. LR n'a enfin aucun equivalent des 6 870 retraits
          d'ouvrages scolaires recenses en 2024-2025.
      S7:
        valeur: 1.5
        just: >
          Programme de demantelement du regime d'execution des peines annonce en
          septembre 2026 : suppression du juge d'application des peines, de la
          loi Taubira et de tous les amenagements de peine, majorite penale
          abaissee a 15 ans, peines minimales, prisons privees. Le groupe a vote
          l'ensemble des textes de durcissement : presomption de legitime defense
          (48 pour), projet de loi sur l'ordre public (46 pour), loi narcotrafic
          (38 pour).
        src: [cnews_retailleau_interview, assnat_scrutin_7987, assnat_scrutin_8433, assnat_scrutin_1473]
        contest: >
          RAMENE DE +2 A +1,5 apres notation des Etats-Unis. L'hypothese posee
          a l'epoque — que le socle americain serait « du meme ordre de
          grandeur » — est INFIRMEE sur pieces : decret du 20 janvier 2025
          rendant la poursuite capitale OBLIGATOIRE dans deux categories de cas
          et ordonnant de faire renverser les precedents constitutionnels qui la
          limitent ; Garde nationale deployee a Washington, Los Angeles,
          Portland et Chicago ; eloignements sans audience constates par la Cour
          supreme. Le programme de Retailleau, si severe soit-il, reste A
          L'INTERIEUR DE LA PROCEDURE PENALE ORDINAIRE : il durcit les peines et
          supprime les amenagements, il ne retablit pas la peine de mort, ne
          mobilise pas l'armee et ne supprime pas le proces. Ecart estime : un
          point. Reserve : la reforme penale de Retailleau n'existe a ce jour
          que sous forme de declarations televisees, LR n'ayant publie aucun
          livret justice.
  - name: Rassemblement national
    sigle: RN
    label_pos: middle left
    chef: Marine Le Pen
    country: France
    color: "#0D2A5C"
    as_of: "2026-09-17"
    souverainete: souverainiste
    ecologie: productiviste
    estimation_initiale: {economie: -1, societe: 6}
    autorite: null
    resume: >
      Le Pen est candidate déclarée depuis juillet 2026 malgré sa condamnation
      en appel dans l'affaire des assistants parlementaires ; pourvoi en
      cassation en cours. Économie protectionniste et sociale : opposition au
      report de l'âge de la retraite, baisse de la TVA sur l'énergie. Priorité
      nationale, référendum sur l'immigration, fermeté pénale. Le
      protectionnisme relève de l'attribut souveraineté, non de l'axe
      économique.
    indicateurs:
      E1:
        valeur: 0.5
        just: >
          Le contre-budget 2026 affiche -45 Md€ de baisses d'impots contre
          +31 Md€ de recettes nouvelles, soit un solde de -20 Md€. Cote baisses :
          TVA sur les energies (10,96 Md€), suppression de la TVA sur 100
          produits de premiere necessite (3,5), impots de production (16,2),
          taxe sur les mutuelles (1,02). Mais le RN cree simultanement une
          fiscalite du capital : impot sur la fortune financiere (+4 Md€), taxe
          sur les rachats d'actions (+8,4), sur les transactions financieres
          intra-journalieres (+3), sur les superdividendes (+1,3).
        src: [rn_contre_budget_2026, rn_programme_2024]
        contest: >
          Note la plus arbitree. Sur le niveau global le RN est du cote « + » ;
          sur la fiscalite du capital il est du cote « − », etant le seul parti
          de droite francais a proposer un impot sur la fortune. Les deux bornes
          de l'indicateur etant construites sur ces deux dimensions, +0,5 est le
          solde. Les droits de douane n'entrent pas ici, conformement a la
          regle sur le protectionnisme.
      E2:
        valeur: 1
        just: >
          Le contre-budget 2026 affiche -57 Md€ de baisses de depenses contre
          +7 Md€ de depenses nouvelles : contribution a l'UE (8,7), agences et
          operateurs (7,7), tarifs de rachat des energies intermittentes (7,2),
          DGF des regions et EPCI (5). Le programme de 2024 ajoute la
          privatisation de l'audiovisuel public et la suppression des ARS.
          Contrepoids reels : renationalisation des autoroutes pour baisser les
          peages de 15 %, et 0,496 Md€ pour une golden share dans ATOS, Arcelor
          et Opella. Aucune suppression de postes de fonctionnaires n'est
          annoncee.
        src: [rn_contre_budget_2026, rn_programme_2024, rn_mlafrance_2022]
        contest: >
          Solde d'economies reel mais modeste — environ 3 % de la depense
          publique francaise — et absence de tout objectif d'effectifs, corrige
          a la baisse par une renationalisation et des prises de participation.
      E3:
        valeur: -0.5
        just: >
          Annulation de la reforme de l'assurance chomage de juillet 2024, degel
          des prestations (+3,61 Md€), suppression de la taxe sur les mutuelles,
          extension de la protection sociale complementaire aux agents
          hospitaliers (+0,46 Md€), plan d'urgence sante de 20 Md€ au programme
          de 2022. Le RN ne propose aucune assurance privee duplicative ni
          aucune privatisation de l'assurance maladie.
        src: [rn_contre_budget_2026, rn_programme_2024, rn_mlafrance_2022]
        contest: >
          ARBITRAGE STRUCTURANT. Les mesures de resserrement du RN — AME
          remplacee par une aide medicale d'urgence, suppression du visa pour
          soins, prestations de solidarite reservees aux etrangers ayant cinq
          ans de travail en France, priorite nationale — sont fondees sur la
          NATIONALITE et non sur le niveau de couverture ou le comportement du
          beneficiaire. Elles sont donc portees par S5 (modele d'integration) et
          non par E3, au meme titre que le protectionnisme est porte par
          l'attribut souverainete. Sans cette regle, le RN monterait a +1 sur
          E3 et se deplacerait d'un point et demi sur l'axe economique pour une
          raison qui n'est pas economique. Voir grille.md.

      S1:
        valeur: 2
        just: >
          Le programme des legislatives de juin 2024 prevoit pour les premieres
          semaines : SUPPRESSION DU DROIT DU SOL, SUSPENSION DE TOUTES LES
          REGULARISATIONS de clandestins par les prefets, retour du delit de
          sejour irregulier, remplacement de l'AME par une aide d'urgence
          vitale, restriction du regroupement familial ; puis obligation de
          deposer les demandes d'asile dans les ambassades et consulats, libre
          circulation Schengen reservee aux seuls ressortissants europeens, et
          priorite nationale constitutionnalisee par referendum. Le RN a vote la
          loi immigration de decembre 2023 (« victoire ideologique », Le Pen),
          puis 122 voix pour la loi Mayotte et 122 pour la denonciation des
          accords de 1968.
        src: [rn_programme_2024, assnat_scrutin_1308, assnat_scrutin_3260, wikipedia_lepen]
        contest: >
          Le RN DEPASSE le +2 quebecois : sur une echelle non plafonnee il
          serait a environ +2,5. C'est ce depassement qui a impose de ramener le
          PQ et le PCQ de +2 a +1,5. La note reste comprimee a +2 par le
          plafond, ce qui ecrase la distance reelle avec LR.
      S2:
        valeur: 0.5
        just: >
          Evolution nette et datee. En novembre 2022, le groupe vote le plus
          massivement contre la proposition de loi constitutionnelle. Le
          30 janvier 2024 il se fracture : 46 pour, 12 contre, 14 abstentions ;
          au Congres du 4 mars 2024, 46 pour, 11 contre, 20 abstentions, et
          MARINE LE PEN FIGURE NOMINATIVEMENT DANS LA LISTE DES « POUR ». Mais
          la ligne de fond reste restrictive : opposition en janvier 2022 a
          l'allongement du delai de 12 a 14 semaines (« derive purement
          ideologique »). Le 17 decembre 2025, les 28 eurodeputes RN presents se
          sont abstenus en bloc, sans une seule voix pour.
        src: [assnat_congres_ivg, assnat_scrutin_629, pe_ice_ma_voix]
        contest: >
          Ne pas confondre le vote personnel de Le Pen (pour) avec la position
          du parti : l'abstention unanime de la delegation europeenne en
          decembre 2025 est le signal de ligne le plus recent et le plus
          homogene. C'est lui qui fonde le +0,5.
      S3:
        valeur: 1
        just: >
          Les deputes se sont opposes a l'unanimite, en deuxieme lecture en
          2021, au projet de loi bioethique ouvrant la PMA a toutes. En 2024 le
          groupe a depose une proposition de loi « visant a proteger les mineurs
          contre certaines pratiques medicales et chirurgicales en matiere de
          transition de genre ». Le RN s'est oppose au PACS puis au mariage pour
          tous ; Le Pen promettait en 2017 d'abroger la loi Taubira mais y a
          renonce pour 2022.
        src: [wikipedia_rn_lgbt, wikipedia_lepen, assnat_scrutin_3436]
        contest: >
          Contrepoids reel : le RN a vote la loi de reparation des condamnations
          pour homosexualite de mars 2024 et pratique depuis dix ans une
          strategie d'ouverture aux electeurs homosexuels. Sa proposition de loi
