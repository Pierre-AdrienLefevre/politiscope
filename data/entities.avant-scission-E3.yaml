# Compas politique comparé : données
#
# Les entités sont des PARTIS (ou des forces politiques), pas des personnes :
# les sources de rang 1 — plateformes, cadres financiers, votes — sont toujours
# des documents de parti. Le champ `chef` porte la figure qui les incarne.
# `sigle` est l'étiquette courte affichée sur la carte, où les noms complets
# se chevaucheraient ; le nom complet reste dans l'infobulle et la fiche.
#
# Deux axes, de -10 à +10 :
#   economie : -10 État          ->  +10 Marché
#   societe  : -10 Progressiste  ->  +10 Conservateur
#
# Les positions ne sont pas posées à la main : elles sont calculées par
# `scoring.py` à partir des indicateurs notés de -2 à +2 par pas de 0,5 (barème
# complet dans `data/grille.md`). Tant qu'une entité porte moins de
# `min_indicateurs` notes sur un axe, elle reste à son `estimation_initiale`.
#
# Dimensions hors axes, en attributs : `souverainete`, `ecologie`, `autorite`.
# `resume_src` source les faits affirmes dans le resume (dates, sondages).
#
# Version précédente, avec des positions entièrement estimées à la main :
# `data/entities.legacy.yaml`.

meta:
  updated: "17 septembre 2026"
  grille: data/grille.md

axes:
  economie:
    libelle: Économie
    pole_negatif: État
    pole_positif: Marché
    min_indicateurs: 4
    indicateurs:
      E1: {libelle: Fiscalité, poids: 1.0}
      E2: {libelle: Périmètre de l'État, poids: 1.0}
      E3: {libelle: Santé et assurance chômage, poids: 1.0}
      E4: {libelle: Retraites, poids: 1.0}
      E5: {libelle: Marché du travail, poids: 0.8}
      E6: {libelle: Régulation, poids: 0.8}
  societe:
    libelle: Société
    pole_negatif: Progressiste
    pole_positif: Conservateur
    min_indicateurs: 4
    indicateurs:
      S1: {libelle: Niveaux d'immigration, poids: 1.0}
      S2: {libelle: Droits reproductifs, poids: 1.0}
      S3: {libelle: Droits LGBT+, poids: 1.0}
      S4: {libelle: Fin de vie, poids: 1.0}
      S5: {libelle: Modèle d'intégration, poids: 0.6}
      S6: {libelle: Éducation et transmission, poids: 0.6}
      S7: {libelle: Justice pénale, poids: 0.8}

entities:

  # ---------------------------------------------------------------- États-Unis
  - name: Parti républicain
    sigle: Républicains US
    label_pos: top right
    chef: Donald Trump
    country: États-Unis
    color: "#C0392B"
    as_of: "2026-09-17"
    souverainete: unilateraliste
    ecologie: productiviste
    estimation_initiale: {economie: 3, societe: 6}
    autorite: >
      Recours intensif aux décrets, déploiement de la Garde nationale dans
      plusieurs villes, conflits avec les tribunaux et les agences
      indépendantes ; ses partisans y voient l'application de son mandat.
    resume: >
      Économie mixte : prolongation des baisses d'impôts, réduction de la
      fonction publique fédérale et dérégulation, mais droits de douane élevés
      et interventions directes dans l'industrie (prise de participation dans
      Intel). Positions conservatrices sur l'immigration et les questions de
      société. Le protectionnisme est porté par l'attribut souveraineté, non par
      l'axe économique.
    indicateurs:

      S1:
        valeur: 2
        just: >
          La plateforme 2024 promet de « begin largest deportation program in
          American history » et de « end chain migration ». Au gouvernement : le
          plafond de refugies pour 2026 a ete fixe a 7 500, le plus bas de
          l'histoire des Etats-Unis, et la determination presidentielle precise
          que ces places « shall primarily be allocated among Afrikaners from
          South Africa ». Le 25 novembre 2025, reexamen ordonne du statut de
          tous les refugies admis sous Biden, soit environ 233 000 personnes.
          Le 27 novembre 2025, annonce d'une « permanent pause » de
          l'immigration « from all Third World Countries ». Resultat mesure :
          les Etats-Unis ont enregistre en 2025 un SOLDE MIGRATOIRE NEGATIF pour
          la premiere fois depuis cinquante ans.
        src: [gop_plateforme_2024, refugee_cap_2026, brookings_solde_negatif, aljazeera_pause_2025]
        contest: >
          PLAFOND ATTEINT ET DEBORDE — valeur reelle estimee +3 a +3,5, soit
          environ un demi-point au-dessus de Reconquete. Reconquete VISE un
          solde migratoire negatif par la remigration ; le Parti republicain
          l'a OBTENU. Il definit desormais le sommet de cet indicateur pour
          l'ensemble du compas. Publie a +2 par contrainte d'echelle, avec le
          RN (≈ +2,5) et Reconquete (≈ +3) comprimes au meme niveau : trois
          positions distinctes affichees identiques.
      S2:
        valeur: 2
        just: >
          Niveau des Etats, fondement principal : 13 Etats appliquent une
          interdiction totale de l'avortement et 4 autres une interdiction a
          environ six semaines, toutes adoptees par des legislatures a majorite
          republicaine. Niveau federal : decret du 24 janvier 2025 reaffirmant
          l'amendement Hyde ; retablissement elargi de la politique de Mexico ;
          gel de 22 subventions Title X puis reorientation du programme vers la
          « natural family planning » ; moratoire d'un an sur le financement
          Medicaid de Planned Parenthood inscrit dans la loi du 4 juillet 2025 ;
          reexamen par la FDA de la mifepristone lance en juin 2026, visant la
          telemedecine et l'envoi postal.
        src: [gop_plateforme_2024, guttmacher_2026, eo_14182_hyde, federal_register_mexico_2026, nhelp_obbba_medicaid, thehill_mifepristone]
        contest: >
          BORNE RESERVEE CONFIRMEE, SANS DEPASSEMENT. Point decisif du compas :
          le +2 avait ete reserve aux Etats americains post-Dobbs sans jamais
          avoir ete mesure, et il est occupe. La plateforme federale de 2024 a
          en revanche DELIBEREMENT ABANDONNE l'appel a une interdiction
          nationale, renvoie aux Etats et soutient explicitement l'acces a la
          contraception et a la FIV : prise isolement elle vaudrait +1,5. Ce qui
          porte a +2, c'est l'addition des interdictions d'Etats et de l'action
          federale sur le financement. Aucune remontee de LR, du RN ni de
          Reconquete n'est donc requise. Point de vigilance : le Life at
          Conception Act compte 112 cosignataires republicains, minorite du
          groupe sans appui de la direction — s'il devenait la ligne du parti,
          le +2 serait franchi.
      S3:
        valeur: 2
        just: >
          Plateforme 2024 : « stop taxpayer-funded schools from promoting gender
          transition », coupe des fonds des ecoles diffusant la « radical gender
          ideology », « keep men out of women's sports », interdiction du
          financement public des chirurgies. Au gouvernement : decret du
          20 janvier 2025 imposant le « sex at conception » sur tous les
          documents federaux ; decret 14187 du 28 janvier 2025 interdisant le
          financement federal des transitions des mineurs ; exclusion des
          personnes trans de l'armee effective le 8 mai 2025 ; regle excluant la
          couverture Medicaid des traitements pour les mineurs, applicable au
          12 octobre 2026 ; exclusion des soins de transition DES ADULTES des
          regimes de sante des agents federaux. En 2026, l'administration impose
          a des hopitaux d'ouvrir des CLINIQUES DE DETRANSITION. Au niveau des
          Etats, 835 projets de loi hostiles aux personnes trans en discussion
          dans 43 Etats.
        src: [gop_plateforme_2024, eo_14187_mineurs, hrw_soins_adultes, aclu_legislatures_2026, nbc_trans_adultes]
        contest: >
          BORNE RESERVEE CONFIRMEE, AVEC MARGE. La definition posee a l'epoque
          — « interdictions d'enseignement sur le genre, retraits d'ouvrages,
          restrictions visant aussi les adultes » — decrit terme a terme la
          politique constatee. Le parti depasse meme cette definition d'environ
          un demi-point avec un element non anticipe : l'obligation faite a des
          hopitaux d'ouvrir des cliniques de detransition releve de la REVERSION
          CONTRAINTE, non de la seule restriction. Valeur reelle ≈ +2,5. La
          compression etant faible et le sommet solidement tenu, LR, Reconquete
          et le RN restent ou ils sont.
      S4:
        valeur: 1.5
        just: >
          Deux representants ont depose H.R. 7196, qui abroge le Death with
          Dignity Act du District de Columbia — soit la suppression d'un regime
          d'aide a mourir EN VIGUEUR, cas plus avance que la simple opposition a
          une loi nouvelle. Aucune des treize juridictions americaines
          autorisant l'aide medicale a mourir ne l'a adoptee sous controle
          republicain, et les legislatures republicaines bloquent
          systematiquement ces textes. La plateforme 2024 ne mentionne pas le
          sujet.
        src: [hr_7196_dc, compassion_choices_etats]
        contest: >
          Base documentaire plus faible que pour S1, S2 et S3 : ni plank de
          plateforme, ni vote nominal, ni decret — seulement un texte depose par
          deux elus et un comportement legislatif constant au niveau des Etats.
          `absent` a ete ecarte parce que l'abrogation d'un regime existant est
          une position formalisee dans un projet de loi. Fourchette defendable :
          +1 a +1,5.
      S5:
        valeur: 2
        just: >
          La plateforme 2024 fixe une identite culturelle de reference et un
          filtre ideologico-religieux a l'entree : « we will use existing
          Federal Law to keep foreign Christian-hating Communists, Marxists, and
          Socialists out of America », « extreme vetting to ensure that jihadists
          [...] are not admitted », retour du Travel Ban. Sur l'acces differencie
          aux prestations selon la nationalite — regle particuliere du compas —
          le dossier est le plus lourd du corpus et il est EN VIGUEUR : decret
          14218 du 19 fevrier 2025 ordonnant d'identifier tout programme federal
          benficiant a des etrangers en situation irreguliere ; avis de juillet
          2025 excluant les non-« qualified aliens » de Head Start et du Health
          Center Program ; et surtout la loi du 4 juillet 2025, qui supprime
          l'aide alimentaire pour les REFUGIES, DEMANDEURS D'ASILE RECONNUS ET
          VICTIMES DE TRAITE — donc des personnes en sejour REGULIER — et leur
          admissibilite a Medicaid au 1er octobre 2026. Decret 14224 faisant de
          l'anglais la langue officielle et abrogeant l'acces linguistique.
        src: [gop_plateforme_2024, eo_14218_prestations, kff_prestations_immigrants, nilc_obbba, eo_14224_anglais]
        contest: >
          NE DEPASSE PAS LA BORNE, et pour une raison instructive. Valeur reelle
          ≈ +2,5 : il EGALE le RN et reste SOUS Reconquete. Il depasse le RN sur
          la priorite nationale — mesure votee et appliquee, etendue a des
          etrangers en sejour regulier, la ou le RN ne fait que la programmer —
          mais reste sous Reconquete, qui porte la remigration de personnes
          etablies. Surtout, IL NE COCHE PAS la sous-dimension « restriction des
          signes religieux » : il va a l'inverse (priere et Bible a l'ecole,
          task force contre le biais anti-chretien). Son pole +2 est
          MAJORITAIRE-CHRETIEN, non laique-assimilationniste — meme position sur
          l'axe pour des raisons opposees a celles des partis francais.
      S6:
        valeur: 2
        just: >
          Les trois sous-dimensions sont cochees simultanement, deux par des
          actes en vigueur. Financement du prive : la plateforme porte « we
          support universal school choice in every State » et la loi du
          4 juillet 2025 cree le PREMIER CREDIT D'IMPOT FEDERAL POUR BOURSES
          SCOLAIRES DE L'HISTOIRE AMERICAINE — 1 700 $ par contribuable, sans
          plafond global de dons, vers l'enseignement prive y compris
          confessionnel. Recit national : decret 14190 du 29 janvier 2025
          retablissant la Commission 1776 et imposant une presentation
          « unifying » de la fondation des Etats-Unis. Contenus sur le genre :
          le meme decret ordonne de SUPPRIMER LES FINANCEMENTS des ecoles
          promouvant la « gender ideology ». Au niveau des Etats : affichage
          obligatoire du Decalogue dans chaque salle de classe en Louisiane,
          Arkansas, Alabama et Texas, valide par la cinquieme cour d'appel
          federale ; 6 870 interdictions d'ouvrages scolaires recensees en
          2024-2025 dans 23 Etats.
        src: [gop_plateforme_2024, eo_14190_ecole, eo_14242_education, edchoice_ecca, texastribune_decalogue, pen_america_ouvrages]
        contest: >
          DEPASSE LR, qui occupait seul le +2 — d'ou sa redescente a +1,5. LR
          agit sur un financement du prive EXISTANT ; les republicains en ont
          CREE un nouveau, federal et sans plafond. Valeur reelle ≈ +2,5 a +3.
          Fedéral contre Etats : le financement du confessionnel et
          l'encadrement du genre sont FEDERAUX et suffisent a eux seuls a
          atteindre le niveau de LR ; le Decalogue obligatoire et les retraits
          d'ouvrages sont etatiques et constituent le depassement.
      S7:
        valeur: 2
        just: >
          Peine capitale : decret du 20 janvier 2025 — « the Attorney General
          shall pursue the death penalty for all crimes of a severity demanding
          its use », poursuite OBLIGATOIRE quand la victime est un agent de la
          force publique ou l'auteur en sejour irregulier, obligation de fournir
          a chaque Etat les produits d'injection letale, et directive de FAIRE
          RENVERSER LES PRECEDENTS DE LA COUR SUPREME qui la limitent. Moratoire
          federal leve en fevrier 2025. Deploiement militaire interieur : Garde
          nationale a Washington, Los Angeles, Portland et Chicago en 2025 ; un
          juge federal a juge l'usage militaire contraire au Posse Comitatus Act
          de 1878. Detention sans proces : invocation de l'Alien Enemies Act le
          15 mars 2025, plus de 200 Venezueliens transferes au CECOT
          salvadorien, la Cour supreme constatant qu'un preavis de 24 heures
          « surely does not pass muster ». Demande presidentielle de juger les
          mineurs comme des adultes a Washington « starting at age 14 ».
        src: [eo_peine_capitale, crs_peine_capitale, eo_14333_caution, scotus_garde_nationale, scotus_jgg, cnn_mineurs_dc, gop_plateforme_2024]
        contest: >
          DEPASSE NETTEMENT LR. Les trois conditions posees comme declencheurs
          sont verifiees sur pieces, non par approximation. Le programme de
          Retailleau, si severe soit-il, reste A L'INTERIEUR DE LA PROCEDURE
          PENALE ORDINAIRE. Valeur reelle ≈ +3, contre ≈ +2 pour LR : un point
          d'ecart. Nuance a consigner : les deploiements militaires et l'usage
          de l'Alien Enemies Act ont ete INVALIDES PAR LES TRIBUNAUX ET
          ABANDONNES, les troupes retirees le 31 decembre 2025. Ils restent des
          positions portees et executees par l'executif du parti, donc notables,
          mais ne sont plus en vigueur. A noter aussi que les peines planchers
          invoquees dans le calibrage initial sont largement ETATIQUES : aucun
          projet federal republicain de peines planchers generales n'a ete
          trouve dans la 119e legislature.
      E1:
        valeur: 2
        just: >
          Plateforme 2024 : « large tax cuts for workers, and no tax on tips »,
          « make Trump tax cuts permanent [...] and pursue additional tax cuts ».
          Mise en oeuvre integrale par la loi du 4 juillet 2025 : perennisation
          des dispositions de 2017, exoneration des pourboires et des heures
          supplementaires, deduction de 6 000 $ pour les 65 ans et plus,
          relevement du plafond SALT, amortissement accelere a 100 %. Aucun
          impot sur la fortune, aucune hausse de la fiscalite du capital ; les
          analyses distributionnelles du CBO montrent un gain concentre en haut
          de distribution.
        src: [gop_plateforme_2024, cbo_obbba, cbo_distributif, irs_obbba]
        contest: >
          ARBITRAGE MAJEUR LIE A LA REGLE SUR LE PROTECTIONNISME. Les droits de
          douane sont exclus de l'axe economique. Or ils constituent en 2025-2026
          une hausse massive et REGRESSIVE du prelevement obligatoire americain.
          En les excluant, on lit le Parti republicain comme un pur baissier
          d'impots ; en les incluant, la note descendrait vers +1 a +1,5. C'est
          le seul indicateur du compas ou cette exclusion deplace une note d'un
          point entier. Le parti est A l'ancrage, pas au-dela : la doctrine de
          Reconquete est d'une radicalite comparable ; ce qui distingue les
          republicains est d'avoir PROMULGUE leur baisse.
      E2:
        valeur: 2
        just: >
          Mesures effectivement prises, non de simples promesses. Le GAO chiffre
          la baisse des effectifs de 22 grandes agences federales a pres de
          256 000 postes, SOIT PLUS DE 11 %, entre decembre 2024 et janvier
          2026 ; l'OPM estime qu'environ un agent civil sur huit aura disparu.
          L'USAID a ete purement et simplement SUPPRIMEE ; le ministere de
          l'Education a perdu pres de 50 % de ses effectifs dans une demarche de
          demantelement. DOGE revendique environ 215 Md$ d'economies.
        src: [gao_effectifs_federaux, gao_doge, opm_effectifs, pbs_doge_bilan]
        contest: >
          CONTRADICTION INTERNE A DOCUMENTER : l'Etat ne retrecit pas
          uniformement, il est REDEPLOYE. La loi du 4 juillet 2025 a alloue des
          sommes massives a l'application des lois migratoires et a la defense.
          L'indicateur capte la contraction de l'administration civile, qui est
          incontestable, mais manque la re-expansion de l'Etat regalien. Des
          agences ont par ailleurs reembauche apres la vague de coupes.
      E3:
        valeur: 2
        just: >
          La loi du 4 juillet 2025 est chiffree par le CBO a -1 100 Md$ de
          depenses federales de sante sur 2025-2034, dont -989,7 Md$ sur le seul
          Medicaid, et a +10 MILLIONS DE PERSONNES SANS ASSURANCE en 2034 :
          conditions d'activite de 80 h/mois imposees aux adultes de l'expansion
          Medicaid, redeterminations d'eligibilite semestrielles. Les credits
          d'impot renforces de l'assurance maladie ont expire le 31 decembre
          2025, le Senat ayant bloque leur extension par 51 voix contre 48 ;
          primes de marche en hausse de 114 % en moyenne.
        src: [crs_obbba_sante, kff_obbba_sante, thehill_subventions_aca, gop_plateforme_2024]
        contest: >
          REPONSE DIRECTE A LA QUESTION POSEE : la borne +2 etait definie comme
          « contestation de la couverture universelle elle-meme ». Reponse : OUI
          EN EFFET, NON EN DOCTRINE. En effet, la plus grande reduction nette de
          couverture publique de l'histoire americaine. En doctrine, la
          plateforme 2024 NE DEMANDE PAS l'abrogation de l'Affordable Care Act —
          rupture verifiee avec 2012 et 2016 — et promet de proteger Medicare
          sans coupe. La borne est donc confirmee en substance mais MAL FORMULEE :
          elle devrait etre un critere d'EFFET (« reduction legislative nette de
          la couverture publique chiffree en millions de desassures ») et non un
          critere doctrinal. LR et le PCQ ne sont pas remontes pour autant.
      E4:
        valeur: -0.5
        just: >
          Plateforme 2024, point 14 des 20, en majuscules d'origine : « FIGHT
          FOR AND PROTECT SOCIAL SECURITY AND MEDICARE WITH NO CUTS, INCLUDING
          NO CHANGES TO THE RETIREMENT AGE ». Aucune mention de capitalisation ni
          d'allongement de la duree de cotisation dans tout le document. Mesure
          prise : la loi du 4 juillet 2025 cree une deduction de 6 000 $ pour les
          65 ans et plus, qui porte de 64 % a 88 % la part de retraites ne payant
          aucun impot federal sur leurs prestations, soit environ 14 millions de
          beneficiaires supplementaires — une HAUSSE NETTE DES PENSIONS APRES
          IMPOT.
        src: [gop_plateforme_2024, npr_social_security, thehill_deduction_aines, irs_obbba]
        contest: >
          PLACEMENT LE PLUS CONTRE-INTUITIF DU COMPAS, et il est solide : sur les
          retraites, le Parti republicain se situe A GAUCHE de LR et de
          Renaissance (+1,5) et tres loin d'Horizons (+2). Ce n'est pas une
          erreur de mesure : la Social Security est le troisieme rail de la
          politique americaine, et la plateforme 2024 a explicitement ecrase le
          courant interne favorable au relevement de l'age. Tempere par le
          caractere TEMPORAIRE de la deduction (jusqu'en 2028) et par la creation
          de comptes d'investissement fiscalement avantages, qui relevent de la
          capitalisation. C'EST L'INDICATEUR QUI PROUVE QUE E4 MESURE AUTRE CHOSE
          QU'UN PROXY GAUCHE-DROITE.
      E5:
        valeur: 2
        just: >
          Salaire minimum federal a 7,25 $/h DEPUIS JUILLET 2009, soit dix-sept
          ans sans revision, et aucun projet republicain de relevement ; le
          decret du 14 mars 2025 a revoque le plancher salarial des contractants
          federaux, que le ministere du Travail n'applique plus. Surtout, le
          decret 14251 du 27 mars 2025 SUPPRIME LE DROIT DE NEGOCIATION
          COLLECTIVE POUR PLUS D'UN MILLION D'AGENTS FEDERAUX dans une vingtaine
          d'agences, etendu avant la fete du Travail 2025 a la NASA et au service
          meteorologique ; conventions collectives resiliees en aout 2025, ordre
          laisse en vigueur par une cour d'appel.
        src: [eo_14251_negociation, npr_negociation_collective, dol_eo14026, congress_right_to_work]
        contest: >
          LA BORNE TIENT MAIS SA TROISIEME CLAUSE EST MAL CHOISIE. Le
          right-to-work avec abolition de la cotisation obligatoire N'EST PAS UNE
          POSITION DE PARTI : la proposition de loi existe et rassemble environ
          56 % du caucus republicain de la Chambre, mais n'a jamais ete mise aux
          voix et n'apparait nulle part dans la plateforme 2024. Exiger ce
          critere obligerait a remonter LR et le PCQ, ce qui serait une erreur :
          l'ampleur EFFECTIVE du recul americain depasse de tres loin ce que ces
          partis PROPOSENT. La clause devrait etre reecrite en « suppression par
          voie executive des droits de negociation collective pour plus d'un
          million d'agents publics ».
      E6:
        valeur: 2
        just: >
          Decret 14192 de janvier 2025 : obligation pour chaque agence d'ABROGER
          AU MOINS DIX REGLEMENTS POUR CHAQUE REGLEMENT NOUVEAU, et exigence que
          le cout incremental de la reglementation nouvelle soit « significativement
          inferieur a zero ». Surtout, la regle finale du 18 fevrier 2026 abroge
          l'endangerment finding de 2009 ET toutes les normes federales
          d'emission de gaz a effet de serre des vehicules de 2012 a 2027 et
          au-dela — presentee par l'agence environnementale comme « la plus
          importante action de deregulation de l'histoire des Etats-Unis », avec
          une economie revendiquee de plus de 1 300 Md$. La suppression de
          l'endangerment finding DETRUIT LE FONDEMENT JURIDIQUE DE TOUTE
          REGULATION CLIMATIQUE au titre du Clean Air Act.
        src: [federal_register_endangerment, epa_eo_14192, npr_endangerment, gop_plateforme_2024]
        contest: >
          LIMITE METHODOLOGIQUE LA PLUS SERIEUSE DE L'EXERCICE. Les droits de
          douane sont la plus grande intervention sur les prix de marche de
          l'histoire americaine recente ; les exclure produit une lecture du
          Parti republicain comme pur deregulateur. Il est en realite
          SIMULTANEMENT le deregulateur le plus radical ET l'interventionniste
          sur les prix le plus radical des dix-huit forces, et l'axe economique
          tel que construit ne peut pas le montrer.
