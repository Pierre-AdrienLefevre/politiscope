          promulguee, que le RN n'a pas formulee a ce jour.
      E4:
        valeur: -1.5
        just: >
          Programme des legislatives de juin 2024 : « abroger la reforme des
          retraites de Macron et mettre en place un systeme de retraites
          progressif ». Le manifeste presidentiel de 2022 le chiffre : depart a
